<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FertiGo v1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f5f7f4; --white:#ffffff; --ink:#183126; --muted:#74837a; --line:#e0e8e0; --field:#d7e1d8;
  --green:#146646; --green2:#e6f4ec; --amber:#936207; --amber2:#fff3dc; --red:#a13a39; --red2:#fcece9; --blue:#3d6385; --blue2:#eaf2f9;
  --soft:#f7faf7; --onGreen:#ffffff; --shadow:0 12px 30px rgba(22,55,34,.055);
  --font:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101512; --white:#18201b; --ink:#e3ece5; --muted:#93a398; --line:#2a352d; --field:#33413a;
  --green:#5cc195; --green2:#1b3227; --amber:#e3ae4f; --amber2:#33290f; --red:#f08a80; --red2:#3a1e1c; --blue:#8db6dc; --blue2:#1a2a38;
  --soft:#141b16; --onGreen:#0d1a12; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --white:#18201b; --ink:#e3ece5; --muted:#93a398; --line:#2a352d; --field:#33413a;
  --green:#5cc195; --green2:#1b3227; --amber:#e3ae4f; --amber2:#33290f; --red:#f08a80; --red2:#3a1e1c; --blue:#8db6dc; --blue2:#1a2a38;
  --soft:#141b16; --onGreen:#0d1a12; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.shell{max-width:1000px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
.mast{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.mast .shell{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap}
.homebtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--white);display:grid;place-items:center;text-decoration:none;color:var(--ink);font-size:18px}
.logo{width:40px;height:40px;background:var(--blue);color:#fff;border-radius:12px;display:grid;place-items:center;font-size:20px}
.brand{font-size:19px;font-weight:800;line-height:1.1}.brand small{display:block;font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:700}
nav{display:flex;gap:6px;margin-left:auto}
.navbtn{border:0;background:transparent;border-radius:12px;padding:9px 14px;font-weight:750;color:var(--muted);display:flex;gap:6px;align-items:center;min-height:44px}
.navbtn.active{background:var(--blue2);color:var(--blue)}
.pill{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--green2);color:var(--green)}.pill.amber{background:var(--amber2);color:var(--amber)}
.view{padding-top:20px;padding-bottom:120px}
.hero{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--blue)}h1{margin:2px 0 4px;font-size:28px;letter-spacing:-.5px}.sub{margin:0;color:var(--muted)}
.panel{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 10px;font-size:17px}.panel h3{margin:0 0 8px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:10px;border:1px solid var(--field);background:var(--white);padding:9px 15px;font-weight:750;color:var(--muted);min-height:44px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{border-radius:10px;border:1px solid var(--field);background:var(--white);padding:10px 16px;font-weight:750;min-height:44px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.dark{background:var(--blue);border-color:var(--blue);color:#fff}.btn.soft{background:var(--blue2);border-color:transparent;color:var(--blue)}.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.inp{border:1px solid var(--field);border-radius:10px;padding:9px 11px;background:var(--white);min-height:42px;width:100%}
.inp.sm{width:86px;min-height:38px;padding:6px 8px}
.daterow{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}.daterow .inp{width:auto}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}.linkbtn{border:0;background:none;color:var(--blue);font-weight:750;text-decoration:underline;padding:0}
.slots{display:grid;gap:8px;margin-bottom:12px}
.slot{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.slot.has{border-color:var(--blue)}
.slothead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.slothead b{width:52px;font-size:17px}
.slothead label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:700}
.zones{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.z{width:38px;height:36px;border-radius:9px;border:1px solid var(--field);background:var(--white);font-weight:800;color:var(--muted)}.z.on{background:var(--ink);border-color:var(--ink);color:var(--white)}
.zones .btn{margin-left:auto}
.doses{display:grid;gap:6px;margin-top:8px}
.dose{display:flex;gap:6px;align-items:center}.dose select{flex:1;min-width:0;border:1px solid var(--field);border-radius:10px;min-height:38px;padding:4px 8px;background:var(--white)}
.dose .u{font-size:13px;color:var(--muted);width:24px}.dose .x{border:0;background:var(--red2);color:var(--red);border-radius:8px;width:34px;height:34px;font-weight:800}
.grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}.field.wide{margin-top:10px}.big{font-size:22px;color:var(--ink)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end;align-items:center;gap:12px;z-index:9}
.savebar span{color:var(--muted);font-size:14px}
.histrow{width:100%;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 2px}
.spark{width:100%;height:70px;color:var(--blue)}
.empty,.loading{padding:30px;text-align:center;color:var(--muted)}
.gate{max-width:420px;margin:60px auto;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center}
.gate a{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:10px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:var(--ink);color:var(--white);padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}
@media (max-width:620px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}h1{font-size:23px}nav{margin-left:0;width:100%}.navbtn{flex:1;justify-content:center}.mast .shell{padding-top:8px;padding-bottom:6px}}
</style>
</head>
<body>
<header class="mast"><div class="shell">
  <a class="homebtn" href="../index.html" title="回主页" aria-label="回主页">←</a>
  <span class="logo" aria-hidden="true">💧</span><div class="brand">FertiGo<small>AZURA DELTA</small></div>
  <nav id="nav" aria-label="Main"></nav>
  <span class="pill" id="conn">● 在线</span>
</div></header>
<main class="shell view" id="root"><div class="loading">载入中…</div></main>
<div class="toast" id="toast" hidden></div>
<script>
/* FertiGo platform shell: sign-in gate + ferti_doc store; products shared with SprayGo (spray_doc). */
const APP_VERSION = 1;
(()=>{'use strict';
const SB_URL='https://dittqalvrjiamzdzrskd.supabase.co';
const SB_KEY='sb_publishable_OPS4DgPqKrwuv11bzy7ceA_VtzJ9x8t';
const MSG={no_login:'还没登入。请回主页登入后再打开 FertiGo。',no_access:'你的账号没有 FertiGo 权限。',offline:'连不上资料库，请检查网络后重新整理。'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function gate(kind,extra){document.getElementById('root').innerHTML=`<div class="gate"><strong>FertiGo</strong><p>${MSG[kind]||esc(kind)}</p>${extra?`<p class="note">${esc(extra)}</p>`:''}<a href="../index.html">← 回主页</a></div>`;const n=document.getElementById('navDesktop');if(n)n.innerHTML='';const c=document.getElementById('conn');if(c){c.className='pill amber';c.textContent='● 未登入'}}
let sb=null;const subs={};
const TB=col=>col==='ferti'?['ferti_doc','days']:['spray_doc',col];
const fix=d=>d&&typeof d.photo==='string'&&d.photo.startsWith('/_blob/')?{...d,photo:'spray_img/'+d.photo.slice(7)+'.jpg'}:d;
const clean=o=>JSON.parse(JSON.stringify(o));
const fail=e=>{const x=new Error(e&&e.message||String(e));x.code=e&&(e.code||e.message)||'error';return x};
async function refresh(col){
  const L=subs[col];if(!L||!L.length)return;
  const [t,c]=TB(col);const {data,error}=await sb.from(t).select('id,doc').eq('col',c);
  if(error){for(const s of L)s.err&&s.err(fail(error));return}
  const snap={docs:data.map(r=>({id:r.id,data:()=>fix(r.doc)}))};
  for(const s of L)try{s.fn(snap)}catch(e){console.error(e)}
}
const refreshAll=()=>Object.keys(subs).forEach(refresh);
const db={collection(col){return{
  onSnapshot(fn,err){(subs[col]=subs[col]||[]).push({fn,err});refresh(col);return()=>{subs[col]=subs[col].filter(s=>s.fn!==fn)}},
  doc(id){return{
    async set(o){const doc=clean(o);const [t,c]=TB(col);let {error}=await sb.from(t).insert({col:c,id,doc});
      if(error&&error.code==='23505'){({error}=await sb.from(t).update({doc,updated_at:new Date().toISOString()}).eq('col',c).eq('id',id).select('id').single())}
      if(error)throw fail(error);await refresh(col)},
    async update(p){const [t,c]=TB(col);const {data,error:e1}=await sb.from(t).select('doc').eq('col',c).eq('id',id).single();if(e1)throw fail(e1);
      const doc=clean({...data.doc,...p});const {error}=await sb.from(t).update({doc,updated_at:new Date().toISOString()}).eq('col',c).eq('id',id).select('id').single();
      if(error)throw fail(error);await refresh(col)},
    async delete(){const [t,c]=TB(col);const {error}=await sb.from(t).delete().eq('col',c).eq('id',id);if(error)throw fail(error);await refresh(col)}
  }}}}};
window.claude={use:async n=>n==='db'?db:null};
async function boot(){
  if(!window.supabase){gate('offline');return}
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  let ss=null;try{ss=(await sb.auth.getSession()).data.session}catch(e){gate('offline',e.message);return}
  if(!ss){gate('no_login');return}
  const {data:me,error:e1}=await sb.from('hub_app_user').select('display_name,role,status').eq('id',ss.user.id).maybeSingle();
  if(e1){gate('offline',e1.message);return}
  if(!me||me.status!=='ACTIVE'){gate('no_access');return}
  const [{data:see,error:e2},{data:edit}]=await Promise.all([sb.rpc('hub_can',{p_system:'FERTI',p_action:'see'}),sb.rpc('hub_can',{p_system:'FERTI',p_action:'edit'})]);
  if(e2){gate('offline',e2.message);return}
  if(!see){gate('no_access');return}
  window.SG={role:me.role,name:me.display_name,edit:!!edit,cost:me.role==='OWNER'};
  document.body.classList.toggle('noedit',!edit);document.body.classList.toggle('nocost',me.role!=='OWNER');
  if(document.readyState==='loading')await new Promise(r=>document.addEventListener('DOMContentLoaded',r));
  const m=document.getElementById('main-js');const s=document.createElement('script');s.textContent=m.textContent;document.body.appendChild(s);
  setInterval(()=>{if(!document.hidden)refreshAll()},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshAll()});
}
boot();
})();

</script>
<script type="text/plain" id="main-js">
(()=>{'use strict';
const $=id=>document.getElementById(id);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FARMS=[{id:'ad1',name:'AD 1'},{id:'ad2',name:'AD 2'},{id:'ad3',name:'AD 3'}];
const fname=id=>(FARMS.find(f=>f.id===id)||{}).name||id;
const SLOTS=['7:00','9:00','11:00','12:00','1:00','2:00','3:00','4:30','6:30'];
const ZONES=['A','B','C','D','E'];
const DRIP_IDS=['amino','h2gro','hydrogen-peroxide-50','seaweed','promocide','cp-bio'];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const addDays=(ds,n)=>{const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const dm=ds=>ds?ds.slice(8).replace(/^0/,'')+'/'+ds.slice(5,7).replace(/^0/,''):'';
const num=v=>{if(v===''||v==null)return null;const n=Number(v);return Number.isNaN(n)?NaN:n};
let db=null,products=[],days=[],loaded=false,tab='day',farm=(()=>{try{const f=localStorage.getItem('ferti_farm');return FARMS.some(x=>x.id===f)?f:'ad1'}catch(x){return 'ad1'}})(),date=today(),sheet=null,dirty=false,histFarm='all';
const byId=id=>products.find(p=>p._id===id);
const U=p=>p&&p.rateUnit?p.rateUnit:'ml';
const dripProducts=()=>products.filter(p=>p.drip||DRIP_IDS.includes(p._id)).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
const dayId=(f,d)=>f+'_'+d;
const findDay=(f,d)=>days.find(x=>x._id===dayId(f,d));
function blank(f,d){return {farm:f,date:d,slots:SLOTS.map(t=>({t,min:null,ec:null,zones:'ABCDE',doses:[]})),ph:null,meterAM:null,meterPM:null,stockA:null,stockB:null,note:''}}
function loadSheet(){const x=findDay(farm,date);sheet=x?JSON.parse(JSON.stringify(x)):blank(farm,date);delete sheet._id;
  const have=new Set((sheet.slots||[]).map(s=>s.t));for(const t of SLOTS)if(!have.has(t))sheet.slots.push({t,min:null,ec:null,zones:'ABCDE',doses:[]});
  sheet.slots.sort((a,b)=>SLOTS.indexOf(a.t)-SLOTS.indexOf(b.t));dirty=false}
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{el.hidden=true},2400)}
const TABS=[['day','📝','今天的表'],['hist','📋','记录']];
function renderNav(){$('nav').innerHTML=TABS.map(([t,i,l])=>`<button class="navbtn ${tab===t?'active':''}" data-nav="${t}"><span aria-hidden="true">${i}</span>${l}</button>`).join('')}
function head(ey,t,sub,cta=''){return `<div class="hero"><div><div class="eyebrow">${ey}</div><h1>${t}</h1><p class="sub">${sub}</p></div>${cta}</div>`}
function render(){renderNav();if(!loaded){$('root').innerHTML='<div class="loading">载入中…</div>';return}
  const y=window.scrollY;$('root').innerHTML=tab==='day'?vDay():vHist();wire();window.scrollTo(0,y)}
function doseLine(si,di,x){const L=dripProducts();
  return `<div class="dose"><select data-dose-id="${si}:${di}" aria-label="加了什么">${['<option value="">选料…</option>',...L.map(p=>`<option value="${e(p._id)}" ${x.id===p._id?'selected':''}>${e(p.name)}</option>`)].join('')}</select>
  <input class="inp sm" inputmode="decimal" data-dose-amt="${si}:${di}" value="${e(x.amt??'')}" placeholder="多少" aria-label="用量"><span class="u">${e(U(byId(x.id)))}</span>
  <button class="x" data-act="deldose" data-id="${si}:${di}" aria-label="删掉">×</button></div>`}
function vDay(){const s=sheet;const saved=findDay(farm,date);
  const rows=s.slots.map((sl,si)=>`<div class="slot ${sl.min||sl.ec||sl.doses.length?'has':''}">
    <div class="slothead"><b>${e(sl.t)}</b>
      <label>放水<input class="inp sm" inputmode="decimal" data-f="min" data-i="${si}" value="${e(sl.min??'')}" placeholder="分钟"></label>
      <label>浓度 EC<input class="inp sm" inputmode="decimal" data-f="ec" data-i="${si}" value="${e(sl.ec??'')}" placeholder="例 231"></label></div>
    <div class="zones">${ZONES.map(z=>`<button class="z ${String(sl.zones||'').includes(z)?'on':''}" data-act="zone" data-id="${si}:${z}" aria-pressed="${String(sl.zones||'').includes(z)}">${z}</button>`).join('')}
      <button class="btn small soft" data-act="adddose" data-id="${si}">＋ 加料</button></div>
    ${sl.doses.length?`<div class="doses">${sl.doses.map((x,di)=>doseLine(si,di,x)).join('')}</div>`:''}</div>`).join('');
  const day=`<div class="panel"><h2>整天</h2><div class="grid2">
    <label class="field">pH<input class="inp" inputmode="decimal" data-d="ph" value="${e(s.ph??'')}" placeholder="例 6.2"></label>
    <label class="field">A 肥母液用了 (L)<input class="inp" inputmode="decimal" data-d="stockA" value="${e(s.stockA??'')}"></label>
    <label class="field">B 肥母液用了 (L)<input class="inp" inputmode="decimal" data-d="stockB" value="${e(s.stockB??'')}"></label>
    <label class="field">水表 早上<input class="inp" inputmode="decimal" data-d="meterAM" value="${e(s.meterAM??'')}"></label>
    <label class="field">水表 晚上<input class="inp" inputmode="decimal" data-d="meterPM" value="${e(s.meterPM??'')}"></label>
    <div class="field"><span>今天用水</span><b class="big">${s.meterAM!=null&&s.meterPM!=null&&s.meterPM>=s.meterAM?Math.round((s.meterPM-s.meterAM)*100)/100:'—'}</b></div></div>
    <label class="field wide">问题备注<textarea class="inp" data-d="note" rows="2" placeholder="例：B 区水管堵，洗过滤器">${e(s.note||'')}</textarea></label></div>`;
  return `${head('FERTIGO','滴灌 · 水肥记录','一个园一天一张表。可以分几次填，每次按保存。')}
  <div class="panel"><div class="chips">${FARMS.map(f=>`<button class="chip ${farm===f.id?'on':''}" data-act="farm" data-id="${f.id}">${f.name}</button>`).join('')}</div>
    <div class="daterow"><button class="btn small" data-act="prev" aria-label="前一天">‹</button><input type="date" id="date" class="inp" value="${e(date)}"><button class="btn small" data-act="next" aria-label="后一天">›</button>
    ${date!==today()?'<button class="btn small soft" data-act="today">回今天</button>':''}</div>
    <p class="note">${saved?`已存 · ${e(saved.updatedByName||'')} ${saved.updatedAt?e(saved.updatedAt.slice(11,16)):''}`:'这天还没有记录。'}${!saved?' <button class="linkbtn" data-act="copyprev">照前一天的放水时间和区</button>':''}</p></div>
  <div class="slots">${rows}</div>${day}
  <div class="savebar"><span>${dirty?'有改动还没存':'已是最新'}</span><button class="btn dark" data-act="save" ${dirty?'':'disabled'}>保存</button></div>`}
function sumDoses(d){const m=new Map();for(const sl of d.slots||[])for(const x of sl.doses||[]){const n=Number(x.amt);if(x.id&&n>0)m.set(x.id,(m.get(x.id)||0)+n)}return m}
function ecOf(d){const v=(d.slots||[]).map(s=>Number(s.ec)).filter(n=>n>0);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null}
function spark(f){const L=days.filter(d=>d.farm===f&&d.date>=addDays(today(),-45)).sort((a,b)=>a.date.localeCompare(b.date)).map(d=>[d.date,ecOf(d)]).filter(x=>x[1]!=null);
  if(L.length<2)return '<p class="note">浓度要有 2 天以上的记录才画得出线。</p>';
  const W=320,H=70,mn=Math.min(...L.map(x=>x[1])),mx=Math.max(...L.map(x=>x[1])),r=mx-mn||1;
  const pts=L.map((x,i)=>[(i/(L.length-1))*(W-10)+5,H-8-((x[1]-mn)/r)*(H-20)]);
  return `<svg viewBox="0 0 ${W} ${H}" class="spark" role="img" aria-label="${fname(f)} 浓度走势"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="currentColor" stroke-width="2"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="currentColor"><title>${dm(L[i][0])} · ${L[i][1]}</title></circle>`).join('')}</svg>
  <div class="note">${dm(L[0][0])}：${L[0][1]} → ${dm(L[L.length-1][0])}：${L[L.length-1][1]}</div>`}
function vHist(){const rows=days.filter(d=>histFarm==='all'||d.farm===histFarm).sort((a,b)=>b.date.localeCompare(a.date)||a.farm.localeCompare(b.farm));
  const trend=(histFarm==='all'?FARMS:FARMS.filter(f=>f.id===histFarm)).map(f=>`<div class="panel"><h3>${f.name} 浓度（平均 EC）</h3>${spark(f.id)}</div>`).join('');
  return `${head('FERTIGO','记录','每天放水、浓度、加料。点一行可以打开那天的表。')}
  <div class="chips" style="margin-bottom:12px">${[['all','全部园'],...FARMS.map(f=>[f.id,f.name])].map(([id,n])=>`<button class="chip ${histFarm===id?'on':''}" data-act="hfarm" data-id="${id}">${n}</button>`).join('')}</div>
  <div class="grid3">${trend}</div>
  <div class="panel">${rows.length?rows.map(d=>{const m=sumDoses(d);const mins=(d.slots||[]).reduce((a,s)=>a+(Number(s.min)||0),0);const ecs=(d.slots||[]).filter(s=>Number(s.ec)>0).map(s=>`${s.t} ${s.ec}`);
    return `<button class="histrow" data-act="open" data-id="${e(d.farm)}|${e(d.date)}"><div><b>${e(dm(d.date))} · ${e(fname(d.farm))}</b>${d.note?` <span class="pill amber">有备注</span>`:''}
      <div class="note">${ecs.length?'EC '+e(ecs.join(' / ')):'没填浓度'} · 放水共 ${mins} 分钟${d.ph!=null?` · pH ${e(d.ph)}`:''}${d.stockA!=null||d.stockB!=null?` · 母液 A ${e(d.stockA??'—')} L / B ${e(d.stockB??'—')} L`:''}</div>
      ${m.size?`<div class="note">加料：${e([...m].map(([id,a])=>`${(byId(id)||{}).name||id} ${a} ${U(byId(id))}`).join('、'))}</div>`:''}${d.note?`<div class="note">备注：${e(d.note)}</div>`:''}</div><span aria-hidden="true">›</span></button>`}).join(''):'<div class="empty">还没有记录。</div>'}</div>`}
function wire(){
  document.querySelectorAll('[data-f]').forEach(i=>i.oninput=()=>{sheet.slots[+i.dataset.i][i.dataset.f]=i.value;mark()});
  document.querySelectorAll('[data-d]').forEach(i=>i.oninput=()=>{sheet[i.dataset.d]=i.value;mark()});
  document.querySelectorAll('[data-dose-id]').forEach(i=>i.onchange=()=>{const [a,b]=i.dataset.doseId.split(':').map(Number);sheet.slots[a].doses[b].id=i.value;dirty=true;render()});
  document.querySelectorAll('[data-dose-amt]').forEach(i=>i.oninput=()=>{const [a,b]=i.dataset.doseAmt.split(':').map(Number);sheet.slots[a].doses[b].amt=i.value;mark()});
  const di=$('date');if(di)di.onchange=()=>{if(!di.value)return;if(dirty&&!confirm('有改动还没存，要放弃吗？')){di.value=date;return}date=di.value;loadSheet();render()}}
function mark(){if(!dirty){dirty=true;const sb=document.querySelector('.savebar');if(sb){sb.querySelector('span').textContent='有改动还没存';sb.querySelector('button').disabled=false}}}
function leave(){return !dirty||confirm('有改动还没存，要放弃吗？')}
function clean(s){const bad=[];const n=(v,l)=>{const x=num(v);if(Number.isNaN(x)){bad.push(l);return null}return x};
  const out={farm:s.farm,date:s.date,slots:s.slots.map(sl=>({t:sl.t,min:n(sl.min,sl.t+' 放水'),ec:n(sl.ec,sl.t+' 浓度'),zones:sl.zones||'',doses:sl.doses.filter(x=>x.id&&String(x.amt??'').trim()!=='').map(x=>({id:x.id,amt:n(x.amt,sl.t+' 加料')}))})),
    ph:n(s.ph,'pH'),meterAM:n(s.meterAM,'水表早上'),meterPM:n(s.meterPM,'水表晚上'),stockA:n(s.stockA,'A 母液'),stockB:n(s.stockB,'B 母液'),note:String(s.note||'').trim()};
  for(const sl of s.slots)for(const x of sl.doses)if(x.id&&String(x.amt??'').trim()==='')bad.push(sl.t+' 加料没填多少');
  return {out,bad}}
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-nav],[data-act]');if(!b)return;
  if(b.dataset.nav){if(b.dataset.nav!==tab&&tab==='day'&&!leave())return;tab=b.dataset.nav;if(tab==='day')loadSheet();render();window.scrollTo(0,0);return}
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
  case 'farm':if(id===farm||!leave())break;farm=id;try{localStorage.setItem('ferti_farm',id)}catch(x){}loadSheet();render();break;
  case 'prev':case 'next':if(!leave())break;date=addDays(date,a==='prev'?-1:1);loadSheet();render();break;
  case 'today':if(!leave())break;date=today();loadSheet();render();break;
  case 'zone':{const [si,z]=id.split(':');const sl=sheet.slots[+si];const set=new Set(String(sl.zones||''));set.has(z)?set.delete(z):set.add(z);sl.zones=ZONES.filter(x=>set.has(x)).join('');dirty=true;render();break}
  case 'adddose':sheet.slots[+id].doses.push({id:'',amt:''});dirty=true;render();break;
  case 'deldose':{const [si,di]=id.split(':').map(Number);sheet.slots[si].doses.splice(di,1);dirty=true;render();break}
  case 'copyprev':{let p=null;for(let i=1;i<=14&&!p;i++)p=findDay(farm,addDays(date,-i));if(!p){toast('前 14 天没有记录');break}
    for(const sl of sheet.slots){const q=(p.slots||[]).find(x=>x.t===sl.t);if(q){sl.min=q.min;sl.zones=q.zones}}dirty=true;render();toast('已照 '+dm(p.date)+' 填好放水时间和区，浓度和加料自己填');break}
  case 'save':{const {out,bad}=clean(sheet);if(bad.length){toast('请检查：'+bad.slice(0,3).join('、'));break}
    out.updatedAt=new Date().toISOString();out.updatedByName=(window.SG&&window.SG.name)||'';b.disabled=true;
    try{await db.collection('ferti').doc(dayId(farm,date)).set(out);dirty=false;toast('已保存');loadSheet();render()}catch(err){b.disabled=false;toast('保存不了：'+(err.code||err.message))}break}
  case 'hfarm':histFarm=id;render();break;
  case 'open':{const [f,d]=id.split('|');farm=f;date=d;tab='day';loadSheet();render();window.scrollTo(0,0);break}
  }});
window.addEventListener('beforeunload',ev=>{if(dirty){ev.preventDefault();ev.returnValue=''}});
renderNav();
(async()=>{db=await window.claude.use('db');if(!db){$('root').innerHTML='<div class="empty"><strong>连不上资料库</strong>请检查网络后重新整理。</div>';return}
  db.collection('products').onSnapshot(s=>{products=s.docs.map(d=>({...d.data(),_id:d.id}));if(!loaded&&days._ok){loaded=true;loadSheet()}if(!dirty||tab!=='day')render()},err=>toast('载入失败：'+err.code));
  db.collection('ferti').onSnapshot(s=>{days=s.docs.map(d=>({...d.data(),_id:d.id}));days._ok=true;if(!loaded&&products.length){loaded=true;loadSheet()}if(!dirty){if(tab==='day')loadSheet();render()}},err=>toast('载入失败：'+err.code));
})();
})();

</script>
