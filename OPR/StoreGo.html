<script>/* StoreGo v16 engine: stock / usage / days-left / purchase plan. Pure functions over S (loaded docs). */
const FARMS=['AD1','AD2','AD3'];const MIXES=['A','B','C'];
const D=s=>new Date(s+'T00:00:00Z');const ymd=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((D(b)-D(a))/86400000);
const todayStr=()=>{if(globalThis.__TODAY)return globalThis.__TODAY;const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const mult=u=>({L:1000,l:1000,kg:1000,KG:1000,ml:1,g:1})[u]||null;
function packBase(p){if(!p)return null;const s=Number(p.packSize),m=mult(p.packUnit);return s>0&&m?s*m:null}
function unitOf(p){return p&&p.unit==='g'?'g':'ml'}
function packLabel(p){if(!p||!(Number(p.packSize)>0))return '包装待补';return `${p.packSize} ${p.packUnit||''}`.trim()}
function packWord(p){return p&&p.packWord||(unitOf(p)==='g'?'包':'瓶')}

/* plan for farm on a date: farmplan hist sorted by from; returns {ver, mix} or null */
/* spray / skip records per farm-day (latest wins) */
function recIdx(S){const k=S.ledger.length+':'+(S.ledger.at(-1)?.id||'');if(S._ri&&S._ri.k===k)return S._ri.m;const m={};
  for(const x of S.ledger)if((x.t==='spray'||x.t==='skip')&&!x.void){const key=x.farm+'|'+x.date;if(!m[key]||(x.at||'')>(m[key].at||''))m[key]=x}S._ri={k,m};return m}
function recOn(S,f,day){return recIdx(S)[f+'|'+day]||null}
function skipsBetween(S,f,from,day){let n=0;const m=recIdx(S);for(const key in m){const x=m[key];if(x.t==='skip'&&x.farm===f&&x.date>=from&&x.date<day)n++}return n}
function planOn(S,f,day){const fp=S.farmplan.find(x=>x.id===f);if(!fp||!Array.isArray(fp.hist))return null;
  const h=fp.hist.filter(x=>x.from<=day).sort((a,b)=>a.from<b.from?-1:1).at(-1);if(!h)return null;
  const ms=mixSetOf(S,f,h.from,day);const base=ms?ms.date:h.from,m0=ms?ms.mix:h.mix0;
  const n=diffDays(base,day)-skipsBetween(S,f,base,day);const i=(MIXES.indexOf(m0)+((n%3)+3)%3)%3;return {ver:h.ver,mix:MIXES[i],from:h.from,set:!!ms&&ms.date===day,auto:ms&&ms.date===day?ms.auto:null}}
/* manual Mix change (ledger t:'mixset'): latest per farm-day wins; rotation continues from it */
function mixSetOf(S,f,from,day){let best=null;for(const x of S.ledger){if(x.t!=='mixset'||x.void||x.farm!==f||x.date<from||x.date>day||!MIXES.includes(x.mix))continue;if(!best||x.date>best.date||(x.date===best.date&&(x.at||'')>(best.at||'')))best=x}return best}
/* what to actually put in each tank today, given stock before spraying (st) */
function resolveDay(S,f,day,st,opts={}){const pl=planOn(S,f,day);if(!pl)return null;const r=recipeOf(S,pl.ver);const t=opts.tanks??tanksOf(S,f);const lines=[];
  for(const it of (r&&r.mixes[pl.mix])||[]){const P0=S.products.find(x=>x.id===it.pid);const tracked=P0&&P0.track!=='No'&&packBase(P0);
    if(it.cond&&!(opts.extras||[]).includes(it.pid)){lines.push({slot:it.pid,use:it.pid,dose:Number(it.dose),cond:it.cond,off:true});continue}
    const chain=[{pid:it.pid,dose:Number(it.dose)},...(it.alts||[]).map(a=>({pid:a.pid,dose:Number(a.dose)||Number(it.dose)}))];
    let pick=null,nocount=false;if(!tracked)pick=chain[0];else{for(const c of chain){const need=c.dose*t;if((st[c.pid]||0)>=need-1e-6){pick=c;break}}
      if(!pick)pick=chain.find(c=>(st[c.pid]||0)>0)||null;
      if(!pick&&st[chain[0].pid]===undefined){pick=chain[0];nocount=true}}
    lines.push({slot:it.pid,use:pick?pick.pid:it.pid,dose:pick?pick.dose:Number(it.dose),cond:it.cond||'',sub:!!pick&&pick.pid!==it.pid,none:!pick,nocount,left:pick?st[pick.pid]:st[it.pid],partial:!!pick&&!nocount&&tracked&&(st[pick.pid]||0)<pick.dose*t-1e-6,untracked:!tracked})}
  return {...pl,tanks:t,lines}}
function recipeOf(S,ver){return S.recipe.find(r=>r.id===ver)||null}
function itemsOn(S,f,day){const p=planOn(S,f,day);if(!p)return [];const r=recipeOf(S,p.ver);return (r&&r.mixes&&r.mixes[p.mix]||[])}
function tanksOf(S,f){const c=cfg(S);return Number(c.tanks&&c.tanks[f])||0}
function cfg(S){return S.cfg.find(x=>x.id==='main')||{tanks:{},safety:7,cycle:14,start:'2026-11-21'}}

/* all pids a farm's current+future recipe could touch (primary + alts) */
function pidsUsed(S,f,ver){const r=recipeOf(S,ver);const set=new Set();if(!r)return set;
  for(const m of MIXES)for(const it of (r.mixes[m]||[])){set.add(it.pid);for(const a of it.alts||[])set.add(a.pid)}return set}

/* one farm-day of spraying: mutates st (pid->base qty|undefined). returns shortages [{pid,amt(base of primary),slot}] */
function sprayDay(S,f,day,st){const rec=recOn(S,f,day);
  if(rec&&rec.t==='skip')return {short:[],used:{},skip:true};
  if(rec&&rec.t==='spray'){const used={};for(const it of rec.items||[]){const q=Number(it.qty);if(!(q>0))continue;if(st[it.pid]!=null||q){st[it.pid]=(st[it.pid]||0)-q;used[it.pid]=(used[it.pid]||0)+q}}return {short:[],used,rec:true}}
  const items=itemsOn(S,f,day);const t=tanksOf(S,f);const short=[];const used={};
  for(const it of items){if(it.cond)continue;const P0=S.products.find(x=>x.id===it.pid);if(!P0||P0.track==='No'||!packBase(P0))continue;const dose=Number(it.dose)||0;if(!dose||!t)continue;let need=dose*t;
    const chain=[{pid:it.pid,dose},...(it.alts||[]).map(a=>({pid:a.pid,dose:Number(a.dose)||dose}))];
    for(const c of chain){if(need<=1e-9)break;const have=st[c.pid];if(!(have>0))continue;const want=need*c.dose/dose;const take=Math.min(have,want);st[c.pid]=have-take;used[c.pid]=(used[c.pid]||0)+take;need-=take*dose/c.dose}
    if(need>1e-6)short.push({pid:it.pid,amt:need,slot:it.pid})}
  return {short,used}}

/* ledger entries (from cfg.start) sorted */
function ledger(S){const st=cfg(S).start||'2026-11-21';return S.ledger.filter(x=>x.date>=st).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.at||'')<(b.at||'')?-1:1)}

/* stock of every farm at END of `upto` day. Order per day: spraying first, then that day's records (counts = end-of-day). */
function stockAt(S,upto,opts={}){const c=cfg(S);const start=c.start||'2026-11-21';const L=ledger(S).filter(x=>x.date<=upto);
  const st={AD1:{},AD2:{},AD3:{}};const counted={AD1:{},AD2:{},AD3:{}};let li=0;
  for(let d=start;d<=upto;d=addDays(d,1)){
    const doSpray=()=>{for(const f of FARMS){if(d===start&&!recOn(S,f,d))continue;if(d===upto&&opts.last){if(opts.last==='none')continue;if(opts.last==='recorded'&&!recOn(S,f,d))continue}sprayDay(S,f,d,st[f])}};
    /* start day: counts were taken before spraying, so records first, then that day's recorded spray */
    if(d>start)doSpray();
    while(li<L.length&&L[li].date===d){const x=L[li++];let qv=x.qty;if(qv==null&&x.packs!=null){const pb=packBase(S.products.find(p=>p.id===x.pid));if(pb)qv=Number(x.packs)*pb}if(qv==null)continue;const q=Number(qv);if(!Number.isFinite(q))continue;
      if(x.t==='count'){st[x.farm][x.pid]=q;counted[x.farm][x.pid]=x.date}
      else if(x.t==='dist'){st[x.farm][x.pid]=(st[x.farm][x.pid]||0)+q}
      else if(x.t==='move'){st[x.from][x.pid]=(st[x.from][x.pid]||0)-q;st[x.to][x.pid]=(st[x.to][x.pid]||0)+q}}
    if(d===start)doSpray()}
  return {st,counted}}

/* pool (received, not yet distributed) per pid */
function pool(S){const p={};for(const x of ledger(S)){if(x.t==='recv')p[x.pid]=(p[x.pid]||0)+Number(x.qty||0);if(x.t==='dist')p[x.pid]=(p[x.pid]||0)-Number(x.qty||0)}
  for(const k in p)if(Math.abs(p[k])<1e-6)delete p[k];return p}

/* forward projection from today: per farm, per pid, days until runs out; per slot, first short day */
function project(S,days=60){const t=todayStr();const {st}=stockAt(S,t,{last:'recorded'});const out={};
  for(const f of FARMS){const s={...st[f]};const runOut={};const slotShort={};
    for(let i=0;i<=days;i++){const d=addDays(t,i);if(i===0&&recOn(S,f,d))continue;const before={...s};const r=sprayDay(S,f,d,s);
      for(const k in r.used)if(!(s[k]>1e-9)&&before[k]>1e-9&&runOut[k]==null)runOut[k]=i;
      for(const sh of r.short)if(slotShort[sh.pid]==null)slotShort[sh.pid]=i}
    out[f]={stock:st[f],runOut,slotShort}}
  return out}

function supplierOf(S,p){const id=p&&Array.isArray(p.shops)?p.shops[0]:null;return S.suppliers.find(s=>s.id===id)||null}
function leadOf(S,p){const s=supplierOf(S,p);const n=Number(s&&s.leadDays);return Number.isFinite(n)&&n>0?n:3}

/* purchase plan: H = cycle + safety days. returns {moves, buys:[{pid,packs,alloc,shortBase}], perFarm} */
function buyPlan(S){const c=cfg(S);const H=(Number(c.cycle)||14)+(Number(c.safety)||7);const t=todayStr();const {st}=stockAt(S,t,{last:'recorded'});
  const P=pool(S);const res={};const end={};
  for(const f of FARMS){const s={...st[f]};const sh={};for(let i=0;i<H;i++){const d0=addDays(t,i);if(i===0&&recOn(S,f,d0))continue;const r=sprayDay(S,f,d0,s);for(const x of r.short)sh[x.pid]=(sh[x.pid]||0)+x.amt}res[f]=sh;end[f]=s}
  /* moves: cover a farm's short from another farm's leftover (same pid or an alt of the slot) */
  const moves=[];const slotAlts={};for(const r of S.recipe)for(const m of MIXES)for(const it of (r.mixes&&r.mixes[m])||[])slotAlts[it.pid]=[{pid:it.pid,dose:Number(it.dose)},...(it.alts||[]).map(a=>({pid:a.pid,dose:Number(a.dose)}))];
  for(const f of FARMS)for(const pid in res[f]){let need=res[f][pid];const chain=slotAlts[pid]||[{pid,dose:1}];const pd=chain[0].dose||1;
    for(const g of FARMS){if(g===f||need<=1e-6)continue;for(const c of chain){const left=end[g][c.pid];const gUses=res[g][c.pid]>0;if(!(left>1e-6)||gUses)continue;
      const p=S.products.find(x=>x.id===c.pid);const pb=packBase(p);const want=need*(c.dose||pd)/pd;let give=Math.min(left,want);const loose=p&&p.unit==='g';if(pb&&!loose){give=Math.floor(give/pb+1e-9)*pb;if(give<=0&&left>=pb)give=pb}else if(pb){give=Math.round(give/50)*50}if(give<=0)continue;give=Math.min(give,left);
      end[g][c.pid]-=give;need-=give*pd/(c.dose||pd);moves.push({pid:c.pid,from:g,to:f,qty:give,forPid:pid})}}
    res[f][pid]=Math.max(0,need)}
  /* pool counts against shortage first */
  const buys=[];const pids=new Set();for(const f of FARMS)for(const k in res[f])if(res[f][k]>1e-6)pids.add(k);
  for(const pid of pids){const p=S.products.find(x=>x.id===pid);const pb=packBase(p);let tot=FARMS.reduce((a,f)=>a+(res[f][pid]||0),0);const fromPool=Math.min(tot,Math.max(0,P[pid]||0));tot-=fromPool;
    const packs=pb?Math.ceil(tot/pb-1e-9):null;const alloc={};
    if(packs){const base=FARMS.reduce((a,f)=>a+(res[f][pid]||0),0)||1;const q={};let sum=0;for(const f of FARMS){q[f]=packs*(res[f][pid]||0)/base;alloc[f]=Math.floor(q[f]);sum+=alloc[f]}
      FARMS.slice().sort((a,b)=>(q[b]-alloc[b])-(q[a]-alloc[a])).slice(0,packs-sum).forEach(f=>alloc[f]++)}
    buys.push({pid,packs,alloc,shortBase:tot,fromPool,noPack:!pb})}
  buys.sort((a,b)=>{const pa=S.products.find(x=>x.id===a.pid),pb2=S.products.find(x=>x.id===b.pid);return (pa?.name||'').localeCompare(pb2?.name||'')});
  return {H,moves,buys,short:res}}
if(typeof module!=='undefined')module.exports={resolveDay,recOn,FARMS,MIXES,addDays,diffDays,todayStr,packBase,planOn,itemsOn,stockAt,pool,project,buyPlan,cfg,pidsUsed,leadOf,supplierOf,sprayDay,ledger};
</script><script>/* StoreGo v16 UI. Needs engine.js loaded first. */
(()=>{'use strict';
const APP_VERSION=16;
const SB_URL='https://dittqalvrjiamzdzrskd.supabase.co',SB_KEY='sb_publishable_OPS4DgPqKrwuv11bzy7ceA_VtzJ9x8t';
const T='store_doc',PRE='sg16_',BUCKET='storego-receipts';
const COLS=['products','suppliers','ledger','po','cfg','recipe','farmplan','audit'];
const LEGACY=['counts','purchases'];
const OWNER_COLS=['recipe','farmplan'];

/* ---------------- data ---------------- */
async function load(){
  if(MOCK){for(const c of COLS)S[c]=(MOCK[PRE+c]||[]).map(x=>({...x}));for(const c of LEGACY)S['old_'+c]=(MOCK[c]||[]).slice();return}
  const cols=[...COLS.map(c=>PRE+c),...LEGACY];const {data,error}=await sb.from(T).select('col,id,doc').in('col',cols);
  if(error)throw error;COLS.forEach(c=>S[c]=[]);LEGACY.forEach(c=>S['old_'+c]=[]);
  for(const r of data){const doc={...r.doc,id:r.id};if(r.col.startsWith(PRE))S[r.col.slice(PRE.length)].push(doc);else S['old_'+r.col].push(doc)}
}
async function put(c,doc){doc=JSON.parse(JSON.stringify(doc));const id=doc.id;
  if(MOCK){const L=S[c];const i=L.findIndex(x=>x.id===id);if(i>=0)L[i]=doc;else L.push(doc);return doc}
  const col=PRE+c;let {error}=await sb.from(T).insert({col,id,doc});
  if(error&&error.code==='23505')({error}=await sb.from(T).update({doc,updated_at:nowIso()}).eq('col',col).eq('id',id).select('id').single());
  if(error){toast('⚠ 没存到：'+(error.message||error.code));throw error}
  const L=S[c];const i=L.findIndex(x=>x.id===id);if(i>=0)L[i]=doc;else L.push(doc);return doc}
async function audit(what,c,id){try{await put('audit',{id:uid('A'),at:nowIso(),by:ME.name,col:c,ref:id,what})}catch(x){}}

const KINDS=['杀虫剂','杀菌剂','营养 / 叶面肥','展着剂','生物制剂','还不知道'];
const kindBadge=k=>{const c={'杀虫剂':'red','杀菌剂':'blue','营养 / 叶面肥':'green','展着剂':'grey'}[k]||'amber';return `<span class="badge ${c}">${h(k||'还不知道')}</span>`};
const pic=p=>`<div class="pic" data-act="zoom" data-id="${h(p?.id)}"><img src="storego_img/${h(p?.id)}.jpg" alt="" onerror="this.parentNode.removeAttribute('data-act');this.replaceWith(document.createTextNode('🧴'))"></div>`;

function packs(p,base){const pb=packBase(p);return pb?base/pb:null}
function qtyText(p,base){if(base==null)return '—';const n=packs(p,base);if(unitOf(p)==='g'&&packBase(p)>=1000&&n!=null&&n<1)return `${fmt(base/1000)} kg`;return n==null?`${fmt(base)} ${unitOf(p)}`:`${fmt(n)} ${packWord(p)}`}
function plan(){return {pr:project(S,60),t:today()}}
function farmDays(pr,f,pid){const x=pr[f];const st=x.stock[pid];if(st==null)return {cls:'',txt:'没点'};const r=x.runOut[pid];
  const p=P(pid);const lead=leadOf(S,p),safe=Number(cfg(S).safety)||7;
  if(!(st>1e-9))return {cls:'red',txt:'没有'};if(r==null)return {cls:'',txt:'没在用'};return {cls:r<=lead?'red':r<=safe?'amber':'green',txt:`撑 ${r} 天`}}
function sheet(html){const had=!!$('#modal').innerHTML;if(!had){sheet.y=scrollY;document.body.style.top=`-${sheet.y}px`;document.body.classList.add('lock')}$('#modal').innerHTML=`<div class="modal" data-act="close-bg"><div class="sheet">${html}</div></div>`}
function closeSheet(){if(!$('#modal').innerHTML)return;$('#modal').innerHTML='';document.body.classList.remove('lock');document.body.style.top='';scrollTo(0,sheet.y||0)}
function supName(id){const s=SUP(id);return s?s.name:'未指定供应商'}
function waLink(phone,text){let d=String(phone||'').split(/[,/]/)[0].replace(/\D/g,'');if(!d)return null;if(d.startsWith('0'))d='6'+d;if(!d.startsWith('6'))d='60'+d;return `https://wa.me/${d}?text=${encodeURIComponent(text)}`}

/* ---------------- TODAY ---------------- */
function vToday(){const {pr,t}=plan();const c=cfg(S);let red=[],amber=[];
  for(const f of FARMS)for(const pid in pr[f].slotShort){const d=pr[f].slotShort[pid];const p=P(pid);const lead=leadOf(S,p);
    const row={f,p,d,lead,sup:supName(p?.shops?.[0])};if(d<=lead)red.push(row);else if(d<=(Number(c.safety)||7))amber.push(row)}
  const mixOf=(f,pid)=>{const pl=planOn(S,f,t);const r=pl&&S.recipe.find(x=>x.id===pl.ver);if(!r)return [];return MIXES.filter(m=>(r.mixes[m]||[]).some(it=>it.pid===pid||(it.alts||[]).some(x=>x.pid===pid)))};
  const grp=L=>{const m={};for(const r of L){const k=r.p?.id||r.f;(m[k]=m[k]||{...r,fs:[],mx:new Set()}).fs.push([r.f,r.d]);mixOf(r.f,k).forEach(x=>m[k].mx.add(x));m[k].d=Math.min(m[k].d,r.d)}return Object.values(m).sort((a,b)=>a.d-b.d)};
  red=grp(red);amber=grp(amber);
  const BP=buyPlan(S);BP.moves=[...poolMoves(BP,pr),...BP.moves];const mvHint=r=>{const L=BP.moves.filter(m=>m.forPid===r.p?.id&&r.fs.some(([f])=>f===m.to));return L.length?`<div class="tiny" style="color:var(--green);font-weight:750">${L.map(m=>`可从 ${m.from} 调 ${qtyText(P(m.pid),m.qty)}${m.pid!==m.forPid?' '+h(P(m.pid)?.name):''} 给 ${m.to}`).join(' · ')}</div>`:''};
  const alert=(L,cls)=>L.map(r=>`<div><div class="grow"><b>${h(r.p?.name||r.pid)}</b> ${[...r.mx].sort().map(x=>`<span class="mixtag" style="font-size:11px">Mix ${x}</span>`).join(' ')}<div class="tiny">${r.fs.map(([f,d])=>`${f} ${d===0?'今天就':d===1?'明天':d+' 天后'}不够`).join(' · ')}</div><div class="tiny">${h(r.sup)} 要 ${r.lead} 天到</div>${mvHint(r)}</div><span class="badge ${cls}">${r.d===0?'今天':r.d+' 天'}</span></div>`).join('');
  /* today's mix */
  const {st}=stockAt(S,t,{last:'none'});
  const mix=FARMS.map(f=>{const pl=planOn(S,f,t);if(!pl)return `<div><b>${f}</b><span class="tiny">还没设定配方</span></div>`;const s={...st[f]};const r=sprayDay(S,f,t,s);
    const ver=S.recipe.find(x=>x.id===pl.ver);const miss=r.short.map(x=>P(x.pid)?.name||x.pid);
    return `<div><span class="mixtag">${pl.mix}</span><div class="grow"><b>${f}</b> · ${h(ver?.name||pl.ver)} · ${fmt(tanksOf(S,f))} 桶<div class="tiny">${miss.length?'<span style="color:var(--red);font-weight:700">缺：'+h(miss.join('、'))+'</span>':'配方里的药都够今天用'}</div></div></div>`}).join('');
  const ordered=S.po.filter(x=>x.status==='ordered'),recv=S.po.filter(x=>x.status==='received'),unpaid=S.po.filter(x=>(x.status==='received'||x.status==='done')&&!x.paid);
  const owe=unpaid.reduce((a,x)=>a+poTotal(x),0);
  return `<div class="eyebrow">TODAY · ${dd(t)}</div><h1>今天</h1>
  ${red.length?`<div class="card red"><h2>撑不过到货日（${red.length}）</h2><div class="list">${alert(red,'red')}</div><button class="btn w sm full" data-go="buy" style="margin-top:8px">去采购 →</button></div>`:`<div class="card green"><b>没有药会撑不过到货日</b></div>`}
  ${movesCard(BP,pr,true)}
  ${amber.length?`<div class="card amber"><h2>撑不过安全天数（${amber.length}）</h2><div class="list">${alert(amber,'amber')}</div></div>`:''}
  <div class="card"><h2>今天各园喷什么</h2><div class="list" style="margin-top:6px">${mix}</div></div>
  <div class="card"><h2>等着做的</h2><div class="list" style="margin-top:6px">
   <div><div class="grow">等收货</div><b>${ordered.length} 张单</b></div>
   <div><div class="grow">等分货</div><b>${recv.length} 张单</b></div>
   <div><div class="grow">还没付款</div><b>${unpaid.length} 张 · ${money(owe)}</b></div>

function vShelf(){const {pr}=plan();const t=today();const q=(sub.q||'').toLowerCase();const k=sub.kind||'all';const onlyUsed=sub.used!==false;
  const F=sub.sf=sub.sf||{farm:'all',mix:'all',st:'all',sup:'all',alt:'all'};const WH=F.farm==='仓库';const FF=F.farm==='all'||WH?FARMS:[F.farm];const PL=pool(S);
  const used=new Set();for(const f of FF){const pl=planOn(S,f,t);if(pl)pidsUsed(S,f,pl.ver).forEach(x=>used.add(x))}
  const inMix=(pid)=>FF.some(f=>{const pl=planOn(S,f,t);const r=pl&&S.recipe.find(x=>x.id===pl.ver);return r&&(r.mixes[F.mix]||[]).some(it=>it.pid===pid||(it.alts||[]).some(x=>x.pid===pid))});
  const stOK=p=>{if(F.st==='all')return true;const ds=FF.map(f=>({st:pr[f].stock[p.id],d:farmDays(pr,f,p.id)}));
    if(F.st==='none')return ds.some(x=>x.st!=null&&!(x.st>1e-9));if(F.st==='low')return ds.some(x=>x.d.cls==='red'||x.d.cls==='amber');if(F.st==='nocount')return ds.some(x=>x.st==null);if(F.st==='ok')return ds.every(x=>x.st>1e-9);return true};
  const nAct=['farm','mix','st','sup','alt'].filter(x=>F[x]!=='all').length;
  const L=S.products.filter(p=>p.active!==false&&(k==='all'||p.kind===k)&&(!q||p.name.toLowerCase().includes(q))
    &&(!onlyUsed||WH||used.has(p.id)||FF.some(f=>pr[f].stock[p.id]>0))
    &&(!WH||PL[p.id]>0)&&(F.mix==='all'||inMix(p.id))&&stOK(p)&&(F.sup==='all'||(p.shops?.[0]||'_')===F.sup)&&(F.alt==='all'||subsFor(p.id).length>0)).sort((a,b)=>a.name.localeCompare(b.name));
  const cards=L.map(p=>`<div data-act="drug" data-id="${h(p.id)}">${pic(p)}<div class="grow"><div class="row"><b class="grow">${h(p.name)}</b>${kindBadge(p.kind)}</div>
    <div class="tiny">${h(packLabel(p))}${p.track==='No'?' · 不追踪':''}</div><div class="farms">${PL[p.id]>0&&(F.farm==='all'||WH)?`<span class="f" style="background:var(--sky);color:var(--blue)">仓库 ${qtyText(p,PL[p.id])} · 待分货</span>`:''}${WH?'':FF.map(f=>{const st=pr[f].stock[p.id];const d=farmDays(pr,f,p.id);return `<span class="f ${d.cls}">${f} ${st==null?'—':qtyText(p,st)} · ${d.txt}</span>`}).join('')}</div></div></div>`).join('');
  const segK=['all',...KINDS].map(x=>`<button class="${k===x?'on':''}" data-sub="kind" data-v="${h(x)}">${x==='all'?'全部':h(x.replace(' / 叶面肥',''))}</button>`).join('');
  const sg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${F[key]===v?'on':''}" data-sf="${key}" data-v="${h(v)}">${h(l)}</button>`).join('')}</div>`;
  const sups=[['all','全部'],...S.suppliers.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(s=>[s.id,s.name.replace(/\s*\(.*\)/,'')]),['_','未指定']];
  const panel=sub.sfo?`<div class="card" style="padding:10px 12px"><label class="l" style="margin-top:0">园区</label>${sg('farm',[['all','全部'],...FARMS.map(f=>[f,f]),['仓库','仓库']])}
    <label class="l">Mix（各园现在的配方）</label>${sg('mix',[['all','全部'],['A','Mix A'],['B','Mix B'],['C','Mix C']])}
    <label class="l">库存</label>${sg('st',[['all','全部'],['none','没有'],['low','快没'],['nocount','没点'],['ok','有货']])}
    <label class="l">供应商</label><select data-sfsel="sup">${sups.map(([v,l])=>`<option value="${h(v)}" ${F.sup===v?'selected':''}>${h(l)}</option>`).join('')}</select>

    <div class="row" style="margin-top:10px"><button class="btn sm" data-act="sf-clear">清除筛选</button><span class="grow"></span><button class="btn p sm" data-act="sf-toggle">好（${L.length} 种）</button></div></div>`:'';
  return `<div class="eyebrow">SHELF</div><h1>货架</h1><div class="row"><input class="txt grow" placeholder="搜药名" value="${h(sub.q||'')}" data-input="q"><button class="btn ${nAct?'p':''}" data-act="sf-toggle" style="white-space:nowrap">筛选${nAct?' '+nAct:''}</button></div>
  ${panel}<div class="seg">${segK}</div><div class="seg"><button class="${onlyUsed?'on':''}" data-sub="used" data-v="1">配方用得到的</button><button class="${!onlyUsed?'on':''}" data-sub="used" data-v="0">全部 ${S.products.filter(p=>p.active!==false).length} 种</button></div>
  <p class="tiny">${L.length} 种</p><div class="card"><div class="list">${cards||'<div class="empty">没有符合的药</div>'}</div></div>`}
function sheetDrug(id){const p=P(id);const {pr}=plan();const sup=SUP(p.shops?.[0]);
  const last=f=>{const L=S.ledger.filter(x=>x.t==='count'&&x.farm===f&&x.pid===id).sort((a,b)=>a.date<b.date?1:-1);return L[0]};
  sheet(`<div class="row top">${pic(p)}<div class="grow"><h2>${h(p.name)}</h2><div class="tiny">${h(p.target||'')}</div><div style="margin-top:4px">${kindBadge(p.kind)} <span class="badge grey">${h(packLabel(p))}</span></div></div></div>
  ${p.ai?`<p class="tiny">有效成分：${h(p.ai)} ${p.group?'· '+h(p.group):''}</p>`:''}<p class="tiny">供应商：${h(sup?.name||'未指定')} · ${leadOf(S,p)} 天到</p>
  <table class="t" style="margin-top:8px"><tr><th>园</th><th class="n">现在</th><th>还能撑</th><th>上次点算</th></tr>${(pool(S)[id]||0)>0?`<tr><td>仓库</td><td class="n">${qtyText(p,pool(S)[id])}</td><td><span class="f" style="background:var(--sky);color:var(--blue)">待分货</span></td><td>—</td></tr>`:''}${FARMS.map(f=>{const st=pr[f].stock[id];const d=farmDays(pr,f,id);const lc=last(f);return `<tr><td>${f}</td><td class="n">${st==null?'—':qtyText(p,st)}</td><td><span class="f ${d.cls}">${d.txt}</span></td><td>${lc?dd(lc.date)+' · '+fmt(lc.packs)+' '+packWord(p):'—'}</td></tr>`}).join('')}</table>
  ${subsBlock(id,pr)}
  <div class="row wrapf" style="margin-top:12px"><button class="btn s neededit" data-act="move" data-id="${h(id)}">调货</button><button class="btn neededit" data-act="edit-drug" data-id="${h(id)}">编辑药品</button><button class="btn" data-act="close">关闭</button></div>`)}
function subsFor(id){const m={};for(const r of S.recipe.slice().sort((x,y)=>x.id.localeCompare(y.id,undefined,{numeric:true})))for(const mx of MIXES)for(const it of (r.mixes&&r.mixes[mx])||[]){
    const chain=[{pid:it.pid,dose:it.dose},...(it.alts||[])];if(!chain.some(c=>c.pid===id))continue;
    for(const c of chain){if(c.pid===id)continue;(m[c.pid]=m[c.pid]||{pid:c.pid,where:[]}).where.push(`${r.name} Mix ${mx} 每桶 ${fmt(c.dose)} ${unitOf(P(c.pid))}`)}}
  return Object.values(m)}
function subsBlock(id,pr){const L=subsFor(id);if(!L.length)return '';
  return `<h3 style="margin-top:14px">替换</h3><p class="tiny">配方里写好可以互相顶替的药。点一下看那种药。</p><div class="list">${L.map(x=>{const p=P(x.pid);if(!p)return '';const tot=FARMS.reduce((a,f)=>a+(pr[f].stock[x.pid]>0?pr[f].stock[x.pid]:0),0);
    return `<div data-act="drug" data-id="${h(x.pid)}" style="cursor:pointer"><div class="pic"><img src="storego_img/${h(x.pid)}.jpg" alt="" onerror="this.replaceWith(document.createTextNode('🧴'))"></div><div class="grow"><b>${h(p.name)}</b> ${kindBadge(p.kind)}<div class="tiny">${x.where.map(h).join('<br>')}</div><div class="tiny">三园共有 ${qtyText(p,tot)}</div></div><b style="color:var(--green)">›</b></div>`}).join('')}</div>`}
function sheetMove(id,pre){const p=P(id);const m=pre||{from:'AD2',to:'AD1',packs:1};
  const srcs=[...((pool(S)[id]||0)>0?['仓库']:[]),...FARMS];
  sheet(`<h2>调货 · ${h(p.name)}</h2>${(pool(S)[id]||0)>0?`<p class="tiny">仓库待分货还有 ${qtyText(p,pool(S)[id])}</p>`:''}<label class="l">从</label><div class="seg">${srcs.map(f=>`<button class="${m.from===f?'on':''}" data-mv="from" data-v="${f}">${f}</button>`).join('')}</div>

  sheetMove.state={...m,id}}
async function saveMove(){const m=sheetMove.state;const p=P(m.id);const n=Number($('#mvq').value);if(!(n>0)||m.from===m.to){toast('⚠ 数量或园不对');return}
  const qty=n*(packBase(p)||0);if(!qty){toast('⚠ 这种药包装大小还没设定');return}
  if(m.from==='仓库'){if(qty>(pool(S)[m.id]||0)+1e-6){toast('⚠ 仓库没那么多');return}await put('ledger',{id:uid('L'),t:'dist',date:today(),at:nowIso(),by:ME.name,pid:m.id,farm:m.to,qty,packs:n,note:'从仓库待分货调'})}
  else await put('ledger',{id:uid('L'),t:'move',date:today(),at:nowIso(),by:ME.name,pid:m.id,from:m.from,to:m.to,qty,packs:n,forPid:m.forPid||null});closeSheet();toast(`已记：${m.from} → ${m.to} ${fmt(n)} ${packWord(p)}`);render()}

/* ---------------- BUY ---------------- */
function poTotal(po){return (po.items||[]).reduce((a,it)=>a+(Number(it.price)||0)*(Number(it.recvPacks??it.packs)||0),0)}
function orderText(sup,lines){return `老板你好，Azura Delta 要订：\n${lines.map((l,i)=>`${i+1}. ${l.name}（${l.pack}）× ${l.packs} ${l.word}`).join('\n')}\n请回覆几时可以送到，谢谢。`}
function poolMoves(r,pr){const P0=pool(S);const out=[];for(const pid in P0){let left=P0[pid];if(!(left>0))continue;const p=P(pid);const pb=packBase(p)||1;
    const fs=FARMS.map(f=>({f,need:(r.short[f]||{})[pid]||0,d:pr[f].slotShort[pid]??999})).filter(x=>x.need>0).sort((x,y)=>x.d-y.d);
    for(const x of fs){if(!(left>0))break;let give=Math.min(left,Math.ceil(x.need/pb)*pb);if(give<=0)continue;left-=give;out.push({pid,from:'仓库',to:x.f,qty:give,forPid:pid,pool:true})}}return out}
function movesCard(r,pr,today){r.moves=[...poolMoves(r,pr),...r.moves.filter(m=>!m.pool)];if(!r.moves.length)return '';const urg=m=>{const d=pr[m.to]?.slotShort?.[m.forPid];return d!=null&&d<=leadOf(S,P(m.forPid))};
  const L=r.moves.map((m,i)=>({m,i,u:urg(m)})).sort((x,y)=>y.u-x.u);
  return `<div class="card amber"><h2>先调货：别园或仓库</h2><p class="tiny">${today?'不用等买，今天就能补。':'别的园有多，先调过去就不用买。'}叫工人调好之后，按「调好了，记下来」，两园的库存才会跟着变。</p><div class="list" style="margin-top:6px">${L.map(({m,i,u})=>{const p=P(m.pid);return `<div><div class="grow"><b>${h(p.name)}</b> ${u?'<span class="badge red">急</span>':''}<div class="tiny">${m.from} → ${m.to} · ${qtyText(p,m.qty)}${m.forPid!==m.pid?' · 顶 '+h(P(m.forPid)?.name||''):''}</div></div><button class="btn s sm neededit" data-act="move-done" data-i="${i}">调好了，记下来</button></div>`}).join('')}</div></div>`}
function vBuy(){const s=sub.buy||'plan';const seg=[['plan','采购单'],['ordered','等收货'],['recv','等分货'],['pay','付款']].map(([k,l])=>`<button class="${s===k?'on':''}" data-sub="buy" data-v="${k}">${l}${k==='ordered'?' '+S.po.filter(x=>x.status==='ordered').length:k==='recv'?' '+S.po.filter(x=>x.status==='received').length:''}</button>`).join('');
  return `<div class="eyebrow">BUY</div><h1>采购</h1><div class="seg">${seg}</div>${s==='plan'?buyPlanView():s==='ordered'?poList('ordered'):s==='recv'?poList('received'):payView()}`}
let draft=null;
function buyPlanView(){const r=buyPlan(S);const {pr}=plan();const c=cfg(S);
  if(!draft||draft.key!==JSON.stringify(r.buys.map(b=>[b.pid,b.packs]))){draft={key:JSON.stringify(r.buys.map(b=>[b.pid,b.packs])),lines:{}};for(const b of r.buys)draft.lines[b.pid]={packs:b.packs||0,alloc:{...b.alloc}}}
  const urgent=pid=>FARMS.some(f=>{const d=pr[f].slotShort[pid];return d!=null&&d<=leadOf(S,P(pid))});

  const groups={};for(const b of r.buys){const p=P(b.pid);const sid=p?.shops?.[0]||'_';(groups[sid]=groups[sid]||[]).push(b)}
  const gh=Object.entries(groups).map(([sid,L])=>{const sup=SUP(sid);return `<div class="card"><div class="row"><h2 class="grow">${h(sup?.name||'未指定供应商')}</h2><span class="tiny">${sup?(Number(sup.leadDays)||3)+' 天到':''}</span></div><div class="list" style="margin-top:6px">${L.map(b=>{const p=P(b.pid);const d=draft.lines[b.pid];
    return `<div><div class="grow"><b>${h(p.name)}</b> ${urgent(b.pid)?'<span class="badge red">急</span>':''}<div class="tiny">${h(packLabel(p))}${b.fromPool>0?' · 先用待分货 '+qtyText(p,b.fromPool):''}${b.noPack?' · 包装待补，算不出瓶数':''}</div>
    <div class="tiny">分园：${FARMS.map(f=>`${f} <b>${d.alloc[f]||0}</b>`).join(' · ')}</div></div><div class="stepper neededit"><button data-act="qty" data-id="${h(b.pid)}" data-d="-1">−</button><b style="min-width:26px;text-align:center">${d.packs}</b><button data-act="qty" data-id="${h(b.pid)}" data-d="1">＋</button></div></div>`}).join('')}</div>
    <button class="btn p full neededit" style="margin-top:8px" data-act="make-po" data-sup="${h(sid)}">下单给 ${h(sup?.name||'这家')} →</button></div>`}).join('');

  if(!items.length){toast('⚠ 没有要买的');return}const sup=SUP(sid);
  const lines=items.map(x=>{const p=P(x.pid);return {name:p.name,pack:packLabel(p),packs:x.packs,word:packWord(p)}});
  sheet(`<h2>订单 · ${h(sup?.name||'未指定供应商')}</h2><p class="tiny">先改好再复制。复制或打开 WhatsApp 不等于已下单，按「已下单」才记。</p><textarea id="otext">${h(orderText(sup,lines))}</textarea>

async function poOrdered(sid){const no=S.po.length+1;const po={id:uid('PO'),no,sup:sid==='_'?null:sid,status:'ordered',created:nowIso(),orderedAt:nowIso(),by:ME.name,items:makePO.items,text:$('#otext').value};

function poCard(po){const sup=SUP(po.sup);return `<div class="card"><div class="row"><h3 class="grow">#${po.no} · ${h(sup?.name||'未指定供应商')}</h3><span class="tiny">${dd(po.orderedAt?.slice(0,10))}</span></div>

function poList(st){const L=S.po.filter(x=>x.status===st).sort((a,b)=>b.no-a.no);return L.length?L.map(poCard).join(''):`<div class="empty">没有${st==='ordered'?'等收货':'等分货'}的单</div>`}
function sheetRecv(id){const po=S.po.find(x=>x.id===id);
  sheet(`<h2>收货 · #${po.no} ${h(SUP(po.sup)?.name||'')}</h2><p class="tiny">填实际到了几${'瓶 / 包'}和单价。一定要拍单据。</p>
  <table class="t"><tr><th>药</th><th class="n">到了</th><th class="n">单价 RM</th></tr>${po.items.map((it,i)=>{const p=P(it.pid);const last=lastPrice(it.pid);return `<tr><td>${h(p?.name)}<div class="tiny">订 ${fmt(it.packs)} · ${h(packLabel(p))}${last?' · 上次 '+money(last):''}</div></td><td class="n"><input class="num" inputmode="decimal" id="rq${i}" value="${fmt(it.packs)}"></td><td class="n"><input class="num" inputmode="decimal" id="rp${i}" value="${it.price??''}"></td></tr>`}).join('')}</table>

function lastPrice(pid){const L=S.po.flatMap(po=>(po.items||[]).filter(it=>it.pid===pid&&Number(it.price)>0).map(it=>({p:Number(it.price),at:po.recvAt||''}))).sort((a,b)=>a.at<b.at?1:-1);return L[0]?.p||null}
async function shrink(file){const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)});const k=Math.min(1,1600/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82))}
async function recvSave(id){const po=S.po.find(x=>x.id===id);const f=$('#rphoto').files[0];if(!f){toast('⚠ 请先拍单据');return}
  const items=po.items.map((it,i)=>({...it,recvPacks:Number($('#rq'+i).value)||0,price:$('#rp'+i).value===''?null:Number($('#rp'+i).value)}));
  const warn=items.filter(it=>{const l=lastPrice(it.pid);return l&&it.price&&it.price>l*1.2}).map(it=>P(it.pid)?.name);
  let path=null;try{const blob=await shrink(f);path=`po/${po.id}/${Date.now()}.jpg`;if(!MOCK){const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg'});if(error)throw error}}
  catch(x){toast('⚠ 单据照片存不进去：'+(x.message||x));return}
  const recvAt=nowIso(),date=today();
  for(const it of items){const p=P(it.pid);const pb=packBase(p);if(!(it.recvPacks>0))continue;await put('ledger',{id:uid('L'),t:'recv',date,at:recvAt,by:ME.name,pid:it.pid,qty:pb?it.recvPacks*pb:null,packs:it.recvPacks,po:po.id})}
  await put('po',{...po,items,status:'received',recvAt,recvBy:ME.name,photos:[...(po.photos||[]),path],paid:false});closeSheet();
  toast(warn.length?'⚠ 比上次贵很多：'+warn.join('、'):'已收货，进待分货');sub.buy='recv';render()}
function sheetDist(id){const po=S.po.find(x=>x.id===id);
  sheet(`<h2>分货 · #${po.no}</h2><p class="tiny">系统先填好采购单的分园数，可以改。</p><table class="t"><tr><th>药</th>${FARMS.map(f=>`<th class="n">${f}</th>`).join('')}</tr>${po.items.filter(it=>it.recvPacks>0).map((it,i)=>{const p=P(it.pid);
    const a=it.alloc||{};const sum=FARMS.reduce((x,f)=>x+(a[f]||0),0)||1;const sc=it.recvPacks/sum;const v=FARMS.map(f=>Math.round((a[f]||0)*sc*100)/100);
    return `<tr><td>${h(p?.name)}<div class="tiny">到了 ${fmt(it.recvPacks)}</div></td>${FARMS.map((f,j)=>`<td class="n"><input class="num" style="width:62px" inputmode="decimal" data-dist="${h(it.pid)}" data-f="${f}" value="${fmt(v[j])}"></td>`).join('')}</tr>`}).join('')}</table>

async function distSave(id){const po=S.po.find(x=>x.id===id);const ins=[...document.querySelectorAll('[data-dist]')];const at=nowIso(),date=today();
  for(const it of po.items.filter(x=>x.recvPacks>0)){const tot=ins.filter(x=>x.dataset.dist===it.pid).reduce((a,x)=>a+(Number(x.value)||0),0);if(Math.abs(tot-it.recvPacks)>0.001){toast(`⚠ ${P(it.pid)?.name}：分出去 ${fmt(tot)}，到了 ${fmt(it.recvPacks)}，要一样`);return}}

function payView(){const L=S.po.filter(x=>x.status!=='ordered').sort((a,b)=>b.no-a.no);const by={};for(const po of L)if(!po.paid){by[po.sup||'_']=(by[po.sup||'_']||0)+poTotal(po)}

function vCount(){const f=sub.farm||'AD1';const all=!!sub.allc;const pl=planOn(S,f,today());const used=pl?pidsUsed(S,f,pl.ver):new Set();
  const had=new Set(S.ledger.filter(x=>(x.t==='count'||x.t==='dist')&&x.farm===f).map(x=>x.pid));
  const L=S.products.filter(p=>p.active!==false&&(all||used.has(p.id)||had.has(p.id))).sort((a,b)=>a.name.localeCompare(b.name));
  const v=sub.cv=sub.cv&&sub.cv.f===f?sub.cv:{f,vals:{}};
  return `<div class="eyebrow">COUNT</div><h1>点算</h1><p class="tiny">每种药剩几瓶 / 包。零也要填，半瓶填 0.5。存了才看到跟系统差多少。</p>
  <div class="seg">${FARMS.map(x=>`<button class="${x===f?'on':''}" data-sub="farm" data-v="${x}">${x}</button>`).join('')}</div>
  <div class="card"><div class="list">${L.map(p=>`<div>${pic(p)}<div class="grow"><b>${h(p.name)}</b><div class="tiny">${h(packLabel(p))}${packBase(p)?'':' · 只记数量'}</div></div><button class="btn sm" data-act="zero" data-id="${h(p.id)}">0</button><input class="num" inputmode="decimal" data-cnt="${h(p.id)}" value="${v.vals[p.id]??''}"></div>`).join('')}</div>
  <button class="btn sm" style="margin-top:8px" data-act="allc">${all?'只看这园用的药':'显示全部药'}</button></div>
  <button class="btn p full neededit" data-act="count-save">存 ${f} 点算</button>`}
async function countSave(){const f=sub.farm||'AD1';const ins=[...document.querySelectorAll('[data-cnt]')];const miss=ins.filter(x=>x.value.trim()==='');
  ins.forEach(x=>x.classList.toggle('miss',x.value.trim()===''));
  if(miss.length&&!confirm(`还有 ${miss.length} 种没填。没填的不会记，确定先存？`))return;
  const date=today(),at=nowIso();const before=stockAt(S,date).st[f];const rows=[];
  for(const x of ins){if(x.value.trim()==='')continue;const n=Number(x.value);if(!Number.isFinite(n)||n<0){toast('⚠ 数字不对：'+P(x.dataset.cnt)?.name);return}
    const p=P(x.dataset.cnt);const pb=packBase(p)&&p.track!=='No'?packBase(p):null;rows.push({p,n,qty:pb?n*pb:null,sys:before[p.id]})}
  for(const r of rows)await put('ledger',{id:uid('L'),t:'count',date,at,by:ME.name,farm:f,pid:r.p.id,qty:r.qty,packs:r.n});
  sub.cv=null;const diff=rows.filter(r=>r.qty!=null&&r.sys!=null).map(r=>{const d=r.qty-r.sys;const pb=packBase(r.p);return {...r,d,big:Math.abs(d)>=Math.max(pb*0.5,Math.abs(r.sys)*0.2)}}).sort((a,b)=>b.big-a.big);
  sheet(`<h2>${f} 点算存好了</h2><p class="tiny">差额＝实际 − 系统算的。红色＝差很多，要查。</p><table class="t"><tr><th>药</th><th class="n">系统算</th><th class="n">实际</th><th class="n">差</th></tr>${diff.map(r=>`<tr style="${r.big?'background:var(--rose)':''}"><td>${h(r.p.name)}</td><td class="n">${fmt(packs(r.p,r.sys))}</td><td class="n">${fmt(r.n)}</td><td class="n" style="${r.big?'color:var(--red);font-weight:800':''}">${r.d>0?'+':''}${fmt(packs(r.p,r.d))}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">没有可以比较的</td></tr>'}</table><button class="btn p full" style="margin-top:12px" data-act="close">好</button>`);
  render()}

  if(!S.cfg.length){$('#view').innerHTML='<div class="card amber"><b>资料还没搬上来。</b><p class="tiny">请等 Claude 把 21/11 盘点、药品、配方搬上资料库。</p></div>';return}

  setInterval(async()=>{if(!document.hidden&&!$('#modal').innerHTML){try{await load();render()}catch(x){}}},90000)}
boot();
})();
