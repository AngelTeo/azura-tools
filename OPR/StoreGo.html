<body><div id="root"><div class="top"><div class="in"><div class="logo">📦</div><div class="brand">StoreGo<small>AZURA DELTA · v16</small></div><div class="who" id="who"></div></div></div>
<div class="wrap" id="view"><div class="empty">载入中…</div></div><nav class="bar" id="bar"></nav></div><div id="modal"></div><div class="toast" id="toast" hidden></div><div id="zoom" hidden></div>
<script>/* StoreGo v16 engine: stock / usage / days-left / purchase plan. Pure functions over S (loaded docs). */
const FARMS=['AD1','AD2','AD3'];const MIXES=['A','B','C'];
const D=s=>new Date(s+'T00:00:00Z');const ymd=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((D(b)-D(a))/86400000);
const todayStr=()=>{if(globalThis.__TODAY)return globalThis.__TODAY;const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const mult=u=>({L:1000,l:1000,kg:1000,KG:1000,ml:1,g:1})[u]||null;
function packBase(p){if(!p)return null;const s=Number(p.packSize),m=mult(p.packUnit);return s>0&&m?s*m:null}
function unitOf(p){return p&&p.unit==='g'?'g':'ml'}
function packLabel(p){if(!p||!(Number(p.packSize)>0))return '包装待补';return `${p.packSize} ${p.packUnit||''}`.trim()}
function packWord(p){return p&&p.packWord||(unitOf(p)==='g'?'包':'瓶')}
/* refill source: product.home='AD2' (big container); other farms keep small containers product.sub={size,unit,word} filled from home */
function homeOf(S,pid){const p=S.products.find(x=>x.id===pid);return p&&p.home&&FARMS.includes(p.home)?p.home:null}
function subBase(p){if(!p||!p.sub)return null;const s=Number(p.sub.size),m=mult(p.sub.unit);return s>0&&m?s*m:null}
function packAt(p,f){return p&&p.home&&f&&f!==p.home&&subBase(p)?subBase(p):packBase(p)}
function imgId(p,f,id){const x=id||p?.id;return p&&p.home&&p.sub&&f&&f!==p.home&&p.sub.img?x+'-sub':x}
function packWordAt(p,f){return p&&p.home&&f&&f!==p.home&&p.sub?(p.sub.word||'小桶'):packWord(p)}

/* plan for farm on a date: farmplan hist sorted by from; returns {ver, mix} or null */
/* spray / skip records per farm-day (latest wins) */
function recIdx(S){const k=S.ledger.length+':'+(S.ledger.at(-1)?.id||'');if(S._ri&&S._ri.k===k)return S._ri.m;const m={};
  for(const x of S.ledger)if((x.t==='spray'||x.t==='skip')&&!x.void){const key=x.farm+'|'+x.date;if(!m[key]||(x.at||'')>(m[key].at||''))m[key]=x}S._ri={k,m};return m}
function recOn(S,f,day){return recIdx(S)[f+'|'+day]||null}
function skipsBetween(S,f,from,day){let n=0;const m=recIdx(S);for(const key in m){const x=m[key];if(x.t==='skip'&&!x.makeup&&x.farm===f&&x.date>=from&&x.date<day)n++}return n}
function planOn(S,f,day){const fp=S.farmplan.find(x=>x.id===f);if(!fp||!Array.isArray(fp.hist))return null;
  const h=fp.hist.filter(x=>x.from<=day).sort((a,b)=>a.from<b.from?-1:1).at(-1);if(!h)return null;
  const ms=mixSetOf(S,f,h.from,day);const base=ms?ms.date:h.from,m0=ms?ms.mix:h.mix0;
  const n=diffDays(base,day)-skipsBetween(S,f,base,day);const i=(MIXES.indexOf(m0)+((n%3)+3)%3)%3;return {ver:h.ver,mix:MIXES[i],from:h.from,set:!!ms&&ms.date===day,auto:ms&&ms.date===day?ms.auto:null}}
/* manual Mix change (ledger t:'mixset'): latest per farm-day wins; rotation continues from it */
function mixSetOf(S,f,from,day){let best=null;for(const x of S.ledger){if(x.t!=='mixset'||x.void||x.farm!==f||x.date<from||x.date>day||!MIXES.includes(x.mix))continue;if(!best||x.date>best.date||(x.date===best.date&&(x.at||'')>(best.at||'')))best=x}return best}
/* what to actually put in each tank today, given stock before spraying (st) */
function resolveDay(S,f,day,st,opts={}){const pl=planOn(S,f,day);if(!pl)return null;const r=recipeOf(S,pl.ver);const t=opts.tanks??tanksOf(S,f);const lines=[];
  for(const it of (r&&r.mixes[pl.mix])||[]){const P0=S.products.find(x=>x.id===it.pid);const tracked=P0&&P0.track!=='No'&&packBase(P0);
    if(it.cond&&!(opts.extras||[]).includes(it.pid)){lines.push({slot:it.pid,use:it.pid,dose:Number(it.dose),cond:it.cond,off:true});continue}
    const chain=[{pid:it.pid,dose:Number(it.dose)},...(it.alts||[]).map(a=>({pid:a.pid,dose:Number(a.dose)||Number(it.dose)}))];
    let pick=null,nocount=false;if(!tracked)pick=chain[0];else{for(const c of chain){const need=c.dose*t;if((st[c.pid]||0)>=need-1e-6){pick=c;break}}
      if(!pick)pick=chain.find(c=>(st[c.pid]||0)>0)||null;
      if(!pick&&st[chain[0].pid]===undefined){pick=chain[0];nocount=true}}
    lines.push({slot:it.pid,use:pick?pick.pid:it.pid,dose:pick?pick.dose:Number(it.dose),cond:it.cond||'',sub:!!pick&&pick.pid!==it.pid,none:!pick,nocount,left:pick?st[pick.pid]:st[it.pid],partial:!!pick&&!nocount&&tracked&&(st[pick.pid]||0)<pick.dose*t-1e-6,untracked:!tracked})}
  return {...pl,tanks:t,lines}}
function recipeOf(S,ver){return S.recipe.find(r=>r.id===ver)||null}
function itemsOn(S,f,day){const p=planOn(S,f,day);if(!p)return [];const r=recipeOf(S,p.ver);return (r&&r.mixes&&r.mixes[p.mix]||[])}
function tanksOf(S,f){const c=cfg(S);return Number(c.tanks&&c.tanks[f])||0}
function cfg(S){return S.cfg.find(x=>x.id==='main')||{tanks:{},safety:7,cycle:14,start:'2026-11-21'}}

/* all pids a farm's current+future recipe could touch (primary + alts) */
function pidsUsed(S,f,ver){const r=recipeOf(S,ver);const set=new Set();if(!r)return set;
  for(const m of MIXES)for(const it of (r.mixes[m]||[])){set.add(it.pid);for(const a of it.alts||[])set.add(a.pid)}return set}

/* one farm-day of spraying: mutates st (pid->base qty|undefined). returns shortages [{pid,amt(base of primary),slot}] */
function sprayDay(S,f,day,st){const rec=recOn(S,f,day);
  if(rec&&rec.t==='skip'&&!rec.makeup)return {short:[],used:{},skip:true};
  if(rec&&rec.t==='spray'){const used={};for(const it of rec.items||[]){const q=Number(it.qty);if(!(q>0))continue;if(st[it.pid]!=null||q){st[it.pid]=(st[it.pid]||0)-q;used[it.pid]=(used[it.pid]||0)+q}}return {short:[],used,rec:true}}
  const items=itemsOn(S,f,day);const t=tanksOf(S,f);const short=[];const used={};
  for(const it of items){if(it.cond)continue;const P0=S.products.find(x=>x.id===it.pid);if(!P0||P0.track==='No'||!packBase(P0))continue;const dose=Number(it.dose)||0;if(!dose||!t)continue;let need=dose*t;
    const chain=[{pid:it.pid,dose},...(it.alts||[]).map(a=>({pid:a.pid,dose:Number(a.dose)||dose}))];
    for(const c of chain){if(need<=1e-9)break;const have=st[c.pid];if(!(have>0))continue;const want=need*c.dose/dose;const take=Math.min(have,want);st[c.pid]=have-take;used[c.pid]=(used[c.pid]||0)+take;need-=take*dose/c.dose}
    if(need>1e-6)short.push({pid:it.pid,amt:need,slot:it.pid})}
  return {short,used}}


/* ---- drip additives (DripGo): cfg doc 'drip' = {start, items:{pid:{AD1,AD2,AD3}}, week:{0..6:[[slot1 pids],[slot2 pids]]}, slots:[..]}; ledger 'dripskip' {farm,date,pid} = not dripped */
function dripCfg(S){return S.cfg.find(x=>x.id==='drip')||null}
function dripOn(S,f,day){const c=dripCfg(S);if(!c||day<(c.start||'9999'))return [];const wd=new Date(day+'T00:00:00Z').getUTCDay();const slots=(c.week&&c.week[wd])||[];const out=[];
  slots.forEach((L,si)=>{for(const pid of L||[]){const q=Number(c.items?.[pid]?.[f]);if(q>0)out.push({slot:si,pid,qty:q})}});return out}
function dripSkipped(S,f,day,pid){return S.ledger.some(x=>x.t==='dripskip'&&!x.void&&x.farm===f&&x.date===day&&x.pid===pid)}
function dripDay(S,f,day,st){const used={},short=[];for(const it of dripOn(S,f,day)){if(dripSkipped(S,f,day,it.pid))continue;const p=S.products.find(x=>x.id===it.pid);if(!p||p.track==='No'||!packBase(p))continue;
    const have=st[it.pid];if(!(have>0)){short.push({pid:it.pid,amt:it.qty,slot:it.pid});continue}const take=Math.min(have,it.qty);st[it.pid]=have-take;used[it.pid]=take;if(it.qty-take>1e-6)short.push({pid:it.pid,amt:it.qty-take,slot:it.pid})}
  return {used,short}}
/* spray + drip for one farm-day */
function dayUse(S,f,day,st){const a=sprayDay(S,f,day,st);const b=dripDay(S,f,day,st);const used={...(a.used||{})};for(const k in b.used)used[k]=(used[k]||0)+b.used[k];return {...a,used,short:[...(a.short||[]),...b.short]}}
/* ledger entries (from cfg.start) sorted */
function ledger(S){const st=cfg(S).start||'2026-11-21';return S.ledger.filter(x=>!x.void&&x.date>=st).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.at||'')<(b.at||'')?-1:1)}

/* stock of every farm at END of `upto` day. Order per day: spraying first, then that day's records (counts = end-of-day). */
function stockAt(S,upto,opts={}){const c=cfg(S);const start=c.start||'2026-11-21';const L=ledger(S).filter(x=>x.date<=upto);
  const st={AD1:{},AD2:{},AD3:{}};const counted={AD1:{},AD2:{},AD3:{}};let li=0;
  for(let d=start;d<=upto;d=addDays(d,1)){
    const doSpray=()=>{for(const f of FARMS){if(d===start&&!recOn(S,f,d))continue;if(d===upto&&opts.last){if(opts.last==='none')continue;if(opts.last==='recorded'&&!recOn(S,f,d))continue}if(d===start)sprayDay(S,f,d,st[f]);else dayUse(S,f,d,st[f])}};
    /* start day: counts were taken before spraying, so records first, then that day's recorded spray */
    if(d>start)doSpray();
    while(li<L.length&&L[li].date===d){const x=L[li++];let qv=x.qty;if(qv==null&&x.packs!=null){const pb=packAt(S.products.find(p=>p.id===x.pid),x.farm);if(pb)qv=Number(x.packs)*pb}if(qv==null)continue;const q=Number(qv);if(!Number.isFinite(q))continue;
      if(x.t==='count'){st[x.farm][x.pid]=q;counted[x.farm][x.pid]=x.date}
      else if(x.t==='dist'){st[x.farm][x.pid]=(st[x.farm][x.pid]||0)+q}
      else if(x.t==='move'){st[x.from][x.pid]=(st[x.from][x.pid]||0)-q;st[x.to][x.pid]=(st[x.to][x.pid]||0)+q}}
    if(d===start)doSpray()}
  return {st,counted}}

/* pool (received, not yet distributed) per pid */
function pool(S){const p={};for(const x of ledger(S)){if(x.t==='recv')p[x.pid]=(p[x.pid]||0)+Number(x.qty||0);if(x.t==='dist')p[x.pid]=(p[x.pid]||0)-Number(x.qty||0)}
  for(const k in p)if(Math.abs(p[k])<1e-6)delete p[k];return p}

/* forward projection from today: per farm, per pid, days until runs out; per slot, first short day */
function project(S,days=60){const t=todayStr();const {st}=stockAt(S,t,{last:'recorded'});const out={};
  for(const f of FARMS){const s={...st[f]};const runOut={};const slotShort={};
    for(let i=0;i<=days;i++){const d=addDays(t,i);if(i===0&&recOn(S,f,d))continue;const before={...s};const r=dayUse(S,f,d,s);
      for(const k in r.used)if(!(s[k]>1e-9)&&before[k]>1e-9&&runOut[k]==null)runOut[k]=i;
      for(const sh of r.short)if(slotShort[sh.pid]==null)slotShort[sh.pid]=i}
    out[f]={stock:st[f],runOut,slotShort}}
  return out}

function supplierOf(S,p){const id=p&&Array.isArray(p.shops)?p.shops[0]:null;return S.suppliers.find(s=>s.id===id)||null}
function leadOf(S,p){const s=supplierOf(S,p);const n=Number(s&&s.leadDays);return Number.isFinite(n)&&n>0?n:3}

/* purchase plan: H = cycle + safety days. returns {moves, buys:[{pid,packs,alloc,shortBase}], perFarm} */
/* ordered-not-received POs, in base units of the slot they were bought for (it.for = original pid when a substitute was ordered) */

function poolMoves(r,pr){const P0=pool(S);const out=[];for(const pid in P0){let left=P0[pid];if(!(left>0))continue;const p=P(pid);const pb=packBase(p)||1;
    const fs=FARMS.map(f=>({f,need:(r.short[f]||{})[pid]||0,d:pr[f].slotShort[pid]??999})).filter(x=>x.need>0).sort((x,y)=>x.d-y.d);
    for(const x of fs){if(!(left>0))break;let give=Math.min(left,Math.ceil(x.need/pb)*pb);if(give<=0)continue;left-=give;out.push({pid,from:'仓库',to:x.f,qty:give,forPid:pid,pool:true})}}return out}

  const now=[],later=[];for(const m of all){const d=mvDays(m,pr);if(m.pool||(d!=null&&d<=SAFE))now.push(m);else later.push({...m,d})}return {now,later,SAFE}}

const amtTxt=(q,u)=>u==='g'?(q>=1000?fmt(Math.round(q/10)/100)+' kg':Math.round(q)+' g'):(q>=1000?fmt(Math.round(q/100)/10)+' L':Math.round(q)+' ml');
const CK=f=>'sg_cnt2_'+f;
function cntGet(f){if(sub.cv&&sub.cv.f===f)return sub.cv;let v={};try{v=JSON.parse(localStorage.getItem(CK(f))||'{}')}catch(e){}sub.cv={f,vals:v.vals||{},notes:v.notes||{}};return sub.cv}
function cntPut(){const v=sub.cv;if(!v)return;try{localStorage.setItem(CK(v.f),JSON.stringify({vals:v.vals,notes:v.notes}))}catch(e){}}
function cntRows(f){const {pr}=plan();const pl=planOn(S,f,today());const used=pl?pidsUsed(S,f,pl.ver):new Set();
  const had=new Set(S.ledger.filter(x=>!x.void&&((x.t==='count'||x.t==='dist')&&x.farm===f||x.t==='move'&&(x.to===f||x.from===f))).map(x=>x.pid));
  return S.products.filter(p=>p.active!==false).map(p=>{const pb=p.track!=='No'?packAt(p,f):null;const q=pr[f].stock[p.id];return {p,pb,q,sp:pb&&q!=null?q/pb:null,w:packWordAt(p,f)||packWord(p),tracked:used.has(p.id)||had.has(p.id)}}).sort((a,b)=>a.p.name.localeCompare(b.p.name))}
function cntState(r,v){const x=v.vals[r.p.id];if(x==null||x==='')return 'todo';if(r.sp==null)return Number(x)>0?'bad':'ok';return Math.abs(Number(x)-r.sp)<=Math.max(0.1,r.sp*0.1)?'ok':'bad'}
function vCount(){const f=sub.farm||'AD1';const v=cntGet(f);const R=cntRows(f);const flt=sub.cf||'all';
  const main=R.filter(r=>r.tracked),more=R.filter(r=>!r.tracked);const st=r=>cntState(r,v);
  const done=main.filter(r=>st(r)!=='todo').length,bad=R.filter(r=>st(r)==='bad').length,filled=R.filter(r=>st(r)!=='todo').length;
  const F=r=>flt==='all'||st(r)===flt;const has=main.filter(r=>r.q>1e-9).filter(F),zero=main.filter(r=>!(r.q>1e-9)).filter(F);
  const row=r=>{const p=r.p,s=st(r),x=v.vals[p.id];const sys=r.pb?(r.q==null?'系统：没记':`系统：<b>${fmt(Math.round((r.sp||0)*10)/10)} ${h(r.w)}</b>${r.q>0?' · '+amtTxt(r.q,unitOf(p)):''}`):`系统：${r.q>0?fmt(r.q)+' '+unitOf(p):'0'}（包装没设定，填几${h(r.w)}）`;
    const dif=s==='ok'?'<div class="ckd g">✓ 对</div>':s==='bad'?`<div class="ckd r">✗ 实际 ${fmt(x)} ${h(r.w)}${r.sp!=null?`，系统 ${fmt(Math.round(r.sp*10)/10)} → 差 ${x-r.sp>0?'+':''}${fmt(Math.round((x-r.sp)*10)/10)}`:''}</div>`:'';
    return `<div class="ckr ${s}" id="ck-${h(p.id)}">${pic(p,f)}<div class="grow"><b>${h(p.name)}</b><div class="tiny">${r.pb?'一'+h(r.w)+' '+(p.home&&p.sub&&f!==p.home?h(p.sub.size+' '+p.sub.unit):h(packLabel(p))):'包装待补'}</div><div class="tiny" style="font-size:13px;color:var(--ink)">${sys}</div></div>
      <div class="ckc"><button class="btn s" data-act="ck-yes" data-id="${h(p.id)}">✓ 对</button><button class="btn" data-act="ck-step" data-id="${h(p.id)}" data-d="-0.5">−</button><input class="num" inputmode="decimal" placeholder="实际几${h(r.w)}" data-cnt="${h(p.id)}" value="${x??''}"><button class="btn" data-act="ck-step" data-id="${h(p.id)}" data-d="0.5">＋</button></div>${dif}${s==='bad'?`<input class="txt ckn" placeholder="备注（例如：开了一瓶剩一半 / 放在别园）" data-cnote="${h(p.id)}" value="${h(v.notes[p.id]||'')}">`:''}</div>`};
  return `<div class="eyebrow">COUNT</div><h1>点算</h1><p class="tiny">跟系统一样按「✓ 对」；不一样填实际几瓶 / 几桶 / 几包，开了的填小数（半瓶 0.5）。差超过 10% 会变红。填的会先留在这支手机，按最下面「存」才进系统。</p>
  <div class="seg">${FARMS.map(x=>{const vv=x===f?v:cntGet0(x);const n=cntRows(x).filter(r=>r.tracked&&cntState(r,vv)!=='todo').length;return `<button class="${x===f?'on':''}" data-sub="farm" data-v="${x}">${x}<div style="font-size:11px;font-weight:600">${n}/${cntRows(x).filter(r=>r.tracked).length}</div></button>`}).join('')}</div>
  <div class="seg">${[['all','全部'],['todo','还没点'],['bad','不对'],['ok','对了']].map(([k,l])=>`<button class="${flt===k?'on':''}" data-sub="cf" data-v="${k}">${l}</button>`).join('')}</div>
  <div style="height:6px;background:#e3ebe7;border-radius:6px;margin-top:8px;overflow:hidden"><i style="display:block;height:100%;width:${main.length?done/main.length*100:0}%;background:var(--green)"></i></div><div class="row tiny" style="margin-top:4px"><span class="grow">${f} 已点 ${done} / ${main.length}</span>${bad?`<span style="color:var(--red);font-weight:800">不对 ${bad} 样</span>`:''}</div>
  ${has.length?`<h3>系统说有（${has.length}）</h3><div class="ckl">${has.map(row).join('')}</div>`:''}${zero.length?`<h3>系统说没有 / 0（${zero.length}）· 有的话也填</h3><div class="ckl">${zero.map(row).join('')}</div>`:''}${!has.length&&!zero.length?'<div class="empty">这个筛选没有药</div>':''}
  ${flt==='all'?`<button class="btn full" style="margin-top:10px;border-style:dashed" data-act="allc">${sub.allc?'收起':'＋ 园里还有别的药？（系统没记的 '+more.length+' 样）'}</button>${sub.allc?`<div class="ckl">${more.map(row).join('')}</div>`:''}`:''}
  <div class="row" style="margin-top:14px;gap:8px"><button class="btn grow" data-act="ck-clear">清空 ${f} 填的</button><button class="btn p grow neededit" data-act="count-save">存 ${f} 点算（${filled} 样）</button></div>`}
function cntGet0(f){let v={};try{v=JSON.parse(localStorage.getItem(CK(f))||'{}')}catch(e){}return {f,vals:v.vals||{},notes:v.notes||{}}}
function ckSet(id,val){const f=sub.farm||'AD1';const v=cntGet(f);if(val===''||val==null)delete v.vals[id];else v.vals[id]=Math.max(0,Math.round(Number(val)*100)/100);cntPut();const y=scrollY;render(true);scrollTo(0,y)}
async function countSave(){const f=sub.farm||'AD1';const v=cntGet(f);const R=cntRows(f);const main=R.filter(r=>r.tracked);const miss=main.filter(r=>cntState(r,v)==='todo');
  const rowsIn=R.filter(r=>v.vals[r.p.id]!=null&&v.vals[r.p.id]!=='');if(!rowsIn.length){toast('⚠ 还没填');return}
  if(miss.length&&!confirm(`还有 ${miss.length} 样没点（${miss.slice(0,5).map(r=>r.p.name).join('、')}${miss.length>5?'…':''}）。没点的不会记，确定先存？`))return;
  const date=today(),at=nowIso();const rows=[];
  for(const r of rowsIn){const n=Number(v.vals[r.p.id]);if(!Number.isFinite(n)||n<0){toast('⚠ 数字不对：'+r.p.name);return}rows.push({...r,n,qty:r.pb?n*r.pb:null})}
  for(const r of rows)await put('ledger',{id:uid('L'),t:'count',date,at,by:ME.name,farm:f,pid:r.p.id,qty:r.qty,packs:r.n,sys:r.q==null?null:Math.round(r.q),...(v.notes[r.p.id]?{note:v.notes[r.p.id]}:{})});
  try{localStorage.removeItem(CK(f))}catch(e){}sub.cv=null;
  const diff=rows.filter(r=>r.qty!=null&&r.q!=null).map(r=>{const d=r.qty-r.q;return {...r,d,big:Math.abs(d)>Math.max(r.pb*0.1,Math.abs(r.q)*0.1)}}).sort((a,b)=>b.big-a.big);
  sheet(`<h2>${f} 点算存好了（${rows.length} 样）</h2><p class="tiny">差＝实际 − 系统算的。红色＝差超过 10%，要查。库存已经改成实际数。</p><table class="t"><tr><th>药</th><th class="n">系统</th><th class="n">实际</th><th class="n">差</th></tr>${diff.map(r=>`<tr style="${r.big?'background:var(--rose)':''}"><td>${h(r.p.name)}${v.notes[r.p.id]?`<div class="tiny">${h(v.notes[r.p.id])}</div>`:''}</td><td class="n">${fmt(Math.round(r.q/r.pb*100)/100)}</td><td class="n">${fmt(r.n)}</td><td class="n" style="${r.big?'color:var(--red);font-weight:800':''}">${r.d>0?'+':''}${fmt(Math.round(r.d/r.pb*100)/100)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">没有可以比较的</td></tr>'}</table><button class="btn p full" style="margin-top:12px" data-act="close">好</button>`);
  render()}

      const it=r.mixes[slots[k].m][slots[k].i];it.alts=[...(it.alts||[]),{pid:id,dose}];await put('recipe',r);await audit(`${r.name} Mix ${slots[k].m} ${P(it.pid)?.name} 加顶替：${P(id)?.name} ${dose}`,'recipe',r.id);drawVer();break}
    case 'ver-save':{if(!ME.owner){toast('⚠ 只有 Owner 能换版本');return}const s=sheetVer.st;s.from=$('#vs-from').value;if(!s.ver||!s.from)return;const fp=JSON.parse(JSON.stringify(S.farmplan.find(x=>x.id===s.f)||{id:s.f,hist:[]}));
      fp.hist=fp.hist.filter(x=>x.from<s.from);fp.hist.push({from:s.from,ver:s.ver,mix0:s.mix0});await put('farmplan',fp);await audit(`${s.f} ${dd(s.from)} 起换 ${S.recipe.find(r=>r.id===s.ver)?.name}（那天 Mix ${s.mix0}）`,'farmplan',s.f);closeSheet();render();break}
  }}catch(x){console.error(x);if(!String(x.message||'').startsWith('⚠'))toast('⚠ '+(x.message||x))}});

/* ---------------- boot ---------------- */
function gate(msg){$('#root').innerHTML=`<div class="gate"><h2>StoreGo</h2><p class="muted">${h(msg)}</p><a class="btn" href="../index.html">← 回主页登入</a></div>`}
async function boot(){
  if(MOCK){ME={name:MOCK.me||'Teo',role:MOCK.role||'OWNER',edit:true,owner:(MOCK.role||'OWNER')==='OWNER'}}
  else{if(!window.supabase){gate('连不上资料库，请检查网络后重新整理。');return}sb=window.supabase.createClient(SB_URL,SB_KEY);
    let ss=null;try{ss=(await sb.auth.getSession()).data.session}catch(x){gate('连不上资料库：'+x.message);return}if(!ss){gate('还没登入。请回主页登入后再打开 StoreGo。');return}
    const {data:me}=await sb.from('hub_app_user').select('display_name,role,status').eq('id',ss.user.id).maybeSingle();if(!me||me.status!=='ACTIVE'){gate('你的账号没有 StoreGo 权限。');return}
    const [{data:see},{data:edit}]=await Promise.all([sb.rpc('hub_can',{p_system:'STORE',p_action:'see'}),sb.rpc('hub_can',{p_system:'STORE',p_action:'edit'})]);if(!see){gate('你的账号没有 StoreGo 权限。');return}
    ME={name:me.display_name,role:me.role,edit:!!edit,owner:me.role==='OWNER'}}
  document.body.classList.toggle('noedit',!ME.edit);document.body.classList.toggle('notowner',!ME.owner);
  $('#who').innerHTML=`${h(ME.name)}<br><a href="SprayGo.html" style="color:var(--green);font-weight:750;text-decoration:none;margin-right:10px">🧴 SprayGo</a><a href="DripGo.html" style="color:var(--green);font-weight:750;text-decoration:none;margin-right:10px">💧 DripGo</a><a href="#" data-go="set" style="color:var(--green);font-weight:750;text-decoration:none">⚙ 设定</a>`;
  try{await load()}catch(x){gate('读不到资料：'+(x.message||x));return}
  if(!S.cfg.length){$('#view').innerHTML='<div class="card amber"><b>资料还没搬上来。</b><p class="tiny">请等 Claude 把 21/11 盘点、药品、配方搬上资料库。</p></div>';return}
  render();
  setInterval(async()=>{if(!document.hidden&&!$('#modal').innerHTML){try{await load();render()}catch(x){}}},90000)}
boot();
})();
</script></body></html>
