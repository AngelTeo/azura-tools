<script>/* StoreGo v16 engine: stock / usage / days-left / purchase plan. Pure functions over S (loaded docs). */
const FARMS=['AD1','AD2','AD3'];const MIXES=['A','B','C'];
const D=s=>new Date(s+'T00:00:00Z');const ymd=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((D(b)-D(a))/86400000);
const todayStr=()=>{if(globalThis.__TODAY)return globalThis.__TODAY;const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const mult=u=>({L:1000,l:1000,kg:1000,KG:1000,ml:1,g:1})[u]||null;
function packBase(p){if(!p)return null;const s=Number(p.packSize),m=mult(p.packUnit);return s>0&&m?s*m:null}
function unitOf(p){return p&&p.unit==='g'?'g':'ml'}
function packLabel(p){if(!p||!(Number(p.packSize)>0))return '包装待补';return `${p.packSize} ${p.packUnit||''}`.trim()}
function packWord(p){return p&&p.packWord||(unitOf(p)==='g'?'包':'瓶')}
/* refill source: product.home='AD2' (big container); other farms keep small containers product.sub={size,unit,word} filled from home */
function homeOf(S,pid){const p=S.products.find(x=>x.id===pid);return p&&p.home&&FARMS.includes(p.home)?p.home:null}
function subBase(p){if(!p||!p.sub)return null;const s=Number(p.sub.size),m=mult(p.sub.unit);return s>0&&m?s*m:null}
function packAt(p,f){return p&&p.home&&f&&f!==p.home&&subBase(p)?subBase(p):packBase(p)}
function packWordAt(p,f){return p&&p.home&&f&&f!==p.home&&p.sub?(p.sub.word||'小桶'):packWord(p)}

/* plan for farm on a date: farmplan hist sorted by from; returns {ver, mix} or null */
/* spray / skip records per farm-day (latest wins) */
function recIdx(S){const k=S.ledger.length+':'+(S.ledger.at(-1)?.id||'');if(S._ri&&S._ri.k===k)return S._ri.m;const m={};
  for(const x of S.ledger)if((x.t==='spray'||x.t==='skip')&&!x.void){const key=x.farm+'|'+x.date;if(!m[key]||(x.at||'')>(m[key].at||''))m[key]=x}S._ri={k,m};return m}
function recOn(S,f,day){return recIdx(S)[f+'|'+day]||null}
function skipsBetween(S,f,from,day){let n=0;const m=recIdx(S);for(const key in m){const x=m[key];if(x.t==='skip'&&x.farm===f&&x.date>=from&&x.date<day)n++}return n}
function planOn(S,f,day){const fp=S.farmplan.find(x=>x.id===f);if(!fp||!Array.isArray(fp.hist))return null;
  const h=fp.hist.filter(x=>x.from<=day).sort((a,b)=>a.from<b.from?-1:1).at(-1);if(!h)return null;
  const ms=mixSetOf(S,f,h.from,day);const base=ms?ms.date:h.from,m0=ms?ms.mix:h.mix0;
  const n=diffDays(base,day)-skipsBetween(S,f,base,day);const i=(MIXES.indexOf(m0)+((n%3)+3)%3)%3;return {ver:h.ver,mix:MIXES[i],from:h.from,set:!!ms&&ms.date===day,auto:ms&&ms.date===day?ms.auto:null}}
/* manual Mix change (ledger t:'mixset'): latest per farm-day wins; rotation continues from it */
function mixSetOf(S,f,from,day){let best=null;for(const x of S.ledger){if(x.t!=='mixset'||x.void||x.farm!==f||x.date<from||x.date>day||!MIXES.includes(x.mix))continue;if(!best||x.date>best.date||(x.date===best.date&&(x.at||'')>(best.at||'')))best=x}return best}
/* what to actually put in each tank today, given stock before spraying (st) */
function resolveDay(S,f,day,st,opts={}){const pl=planOn(S,f,day);if(!pl)return null;const r=recipeOf(S,pl.ver);const t=opts.tanks??tanksOf(S,f);const lines=[];
  for(const it of (r&&r.mixes[pl.mix])||[]){const P0=S.products.find(x=>x.id===it.pid);const tracked=P0&&P0.track!=='No'&&packBase(P0);
    if(it.cond&&!(opts.extras||[]).includes(it.pid)){lines.push({slot:it.pid,use:it.pid,dose:Number(it.dose),cond:it.cond,off:true});continue}
    const chain=[{pid:it.pid,dose:Number(it.dose)},...(it.alts||[]).map(a=>({pid:a.pid,dose:Number(a.dose)||Number(it.dose)}))];
    let pick=null,nocount=false;if(!tracked)pick=chain[0];else{for(const c of chain){const need=c.dose*t;if((st[c.pid]||0)>=need-1e-6){pick=c;break}}
      if(!pick)pick=chain.find(c=>(st[c.pid]||0)>0)||null;
      if(!pick&&st[chain[0].pid]===undefined){pick=chain[0];nocount=true}}
    lines.push({slot:it.pid,use:pick?pick.pid:it.pid,dose:pick?pick.dose:Number(it.dose),cond:it.cond||'',sub:!!pick&&pick.pid!==it.pid,none:!pick,nocount,left:pick?st[pick.pid]:st[it.pid],partial:!!pick&&!nocount&&tracked&&(st[pick.pid]||0)<pick.dose*t-1e-6,untracked:!tracked})}
  return {...pl,tanks:t,lines}}
function recipeOf(S,ver){return S.recipe.find(r=>r.id===ver)||null}
function itemsOn(S,f,day){const p=planOn(S,f,day);if(!p)return [];const r=recipeOf(S,p.ver);return (r&&r.mixes&&r.mixes[p.mix]||[])}
function tanksOf(S,f){const c=cfg(S);return Number(c.tanks&&c.tanks[f])||0}
function cfg(S){return S.cfg.find(x=>x.id==='main')||{tanks:{},safety:7,cycle:14,start:'2026-11-21'}}

/* all pids a farm's current+future recipe could touch (primary + alts) */
function pidsUsed(S,f,ver){const r=recipeOf(S,ver);const set=new Set();if(!r)return set;
  for(const m of MIXES)for(const it of (r.mixes[m]||[])){set.add(it.pid);for(const a of it.alts||[])set.add(a.pid)}return set}

/* one farm-day of spraying: mutates st (pid->base qty|undefined). returns shortages [{pid,amt(base of primary),slot}] */
function sprayDay(S,f,day,st){const rec=recOn(S,f,day);
  if(rec&&rec.t==='skip')return {short:[],used:{},skip:true};
  if(rec&&rec.t==='spray'){const used={};for(const it of rec.items||[]){const q=Number(it.qty);if(!(q>0))continue;if(st[it.pid]!=null||q){st[it.pid]=(st[it.pid]||0)-q;used[it.pid]=(used[it.pid]||0)+q}}return {short:[],used,rec:true}}
  const items=itemsOn(S,f,day);const t=tanksOf(S,f);const short=[];const used={};
  for(const it of items){if(it.cond)continue;const P0=S.products.find(x=>x.id===it.pid);if(!P0||P0.track==='No'||!packBase(P0))continue;const dose=Number(it.dose)||0;if(!dose||!t)continue;let need=dose*t;
    const chain=[{pid:it.pid,dose},...(it.alts||[]).map(a=>({pid:a.pid,dose:Number(a.dose)||dose}))];
    for(const c of chain){if(need<=1e-9)break;const have=st[c.pid];if(!(have>0))continue;const want=need*c.dose/dose;const take=Math.min(have,want);st[c.pid]=have-take;used[c.pid]=(used[c.pid]||0)+take;need-=take*dose/c.dose}
    if(need>1e-6)short.push({pid:it.pid,amt:need,slot:it.pid})}
  return {short,used}}


/* ---- drip additives (DripGo): cfg doc 'drip' = {start, items:{pid:{AD1,AD2,AD3}}, week:{0..6:[[slot1 pids],[slot2 pids]]}, slots:[..]}; ledger 'dripskip' {farm,date,pid} = not dripped */
function dripCfg(S){return S.cfg.find(x=>x.id==='drip')||null}
function dripOn(S,f,day){const c=dripCfg(S);if(!c||day<(c.start||'9999'))return [];const wd=new Date(day+'T00:00:00Z').getUTCDay();const slots=(c.week&&c.week[wd])||[];const out=[];
  slots.forEach((L,si)=>{for(const pid of L||[]){const q=Number(c.items?.[pid]?.[f]);if(q>0)out.push({slot:si,pid,qty:q})}});return out}
function dripSkipped(S,f,day,pid){return S.ledger.some(x=>x.t==='dripskip'&&!x.void&&x.farm===f&&x.date===day&&x.pid===pid)}
function dripDay(S,f,day,st){const used={},short=[];for(const it of dripOn(S,f,day)){if(dripSkipped(S,f,day,it.pid))continue;const p=S.products.find(x=>x.id===it.pid);if(!p||p.track==='No'||!packBase(p))continue;
    const have=st[it.pid];if(!(have>0)){short.push({pid:it.pid,amt:it.qty,slot:it.pid});continue}const take=Math.min(have,it.qty);st[it.pid]=have-take;used[it.pid]=take;if(it.qty-take>1e-6)short.push({pid:it.pid,amt:it.qty-take,slot:it.pid})}
  return {used,short}}
/* spray + drip for one farm-day */
function dayUse(S,f,day,st){const a=sprayDay(S,f,day,st);const b=dripDay(S,f,day,st);const used={...(a.used||{})};for(const k in b.used)used[k]=(used[k]||0)+b.used[k];return {...a,used,short:[...(a.short||[]),...b.short]}}
/* ledger entries (from cfg.start) sorted */
function ledger(S){const st=cfg(S).start||'2026-11-21';return S.ledger.filter(x=>x.date>=st).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.at||'')<(b.at||'')?-1:1)}

/* stock of every farm at END of `upto` day. Order per day: spraying first, then that day's records (counts = end-of-day). */
function stockAt(S,upto,opts={}){const c=cfg(S);const start=c.start||'2026-11-21';const L=ledger(S).filter(x=>x.date<=upto);
  const st={AD1:{},AD2:{},AD3:{}};const counted={AD1:{},AD2:{},AD3:{}};let li=0;
  for(let d=start;d<=upto;d=addDays(d,1)){
    const doSpray=()=>{for(const f of FARMS){if(d===start&&!recOn(S,f,d))continue;if(d===upto&&opts.last){if(opts.last==='none')continue;if(opts.last==='recorded'&&!recOn(S,f,d))continue}if(d===start)sprayDay(S,f,d,st[f]);else dayUse(S,f,d,st[f])}};
    /* start day: counts were taken before spraying, so records first, then that day's recorded spray */
    if(d>start)doSpray();
    while(li<L.length&&L[li].date===d){const x=L[li++];let qv=x.qty;if(qv==null&&x.packs!=null){const pb=packAt(S.products.find(p=>p.id===x.pid),x.farm);if(pb)qv=Number(x.packs)*pb}if(qv==null)continue;const q=Number(qv);if(!Number.isFinite(q))continue;
      if(x.t==='count'){st[x.farm][x.pid]=q;counted[x.farm][x.pid]=x.date}
      else if(x.t==='dist'){st[x.farm][x.pid]=(st[x.farm][x.pid]||0)+q}
      else if(x.t==='move'){st[x.from][x.pid]=(st[x.from][x.pid]||0)-q;st[x.to][x.pid]=(st[x.to][x.pid]||0)+q}}
    if(d===start)doSpray()}
  return {st,counted}}

/* pool (received, not yet distributed) per pid */
function pool(S){const p={};for(const x of ledger(S)){if(x.t==='recv')p[x.pid]=(p[x.pid]||0)+Number(x.qty||0);if(x.t==='dist')p[x.pid]=(p[x.pid]||0)-Number(x.qty||0)}
  for(const k in p)if(Math.abs(p[k])<1e-6)delete p[k];return p}

/* forward projection from today: per farm, per pid, days until runs out; per slot, first short day */
function project(S,days=60){const t=todayStr();const {st}=stockAt(S,t,{last:'recorded'});const out={};
  for(const f of FARMS){const s={...st[f]};const runOut={};const slotShort={};
    for(let i=0;i<=days;i++){const d=addDays(t,i);if(i===0&&recOn(S,f,d))continue;const before={...s};const r=dayUse(S,f,d,s);
      for(const k in r.used)if(!(s[k]>1e-9)&&before[k]>1e-9&&runOut[k]==null)runOut[k]=i;
      for(const sh of r.short)if(slotShort[sh.pid]==null)slotShort[sh.pid]=i}
    out[f]={stock:st[f],runOut,slotShort}}
  return out}

function supplierOf(S,p){const id=p&&Array.isArray(p.shops)?p.shops[0]:null;return S.suppliers.find(s=>s.id===id)||null}
function leadOf(S,p){const s=supplierOf(S,p);const n=Number(s&&s.leadDays);return Number.isFinite(n)&&n>0?n:3}

/* purchase plan: H = cycle + safety days. returns {moves, buys:[{pid,packs,alloc,shortBase}], perFarm} */
function buyPlan(S){const c=cfg(S);const H=(Number(c.cycle)||14)+(Number(c.safety)||7);const t=todayStr();const {st}=stockAt(S,t,{last:'recorded'});
  const P=pool(S);const res={};const end={};
  for(const f of FARMS){const s={...st[f]};const sh={};for(let i=0;i<H;i++){const d0=addDays(t,i);if(i===0&&recOn(S,f,d0))continue;const r=dayUse(S,f,d0,s);for(const x of r.short)sh[x.pid]=(sh[x.pid]||0)+x.amt}res[f]=sh;end[f]=s}
  /* moves: cover a farm's short from another farm's leftover (same pid or an alt of the slot) */
  const moves=[];const slotAlts={};for(const r of S.recipe)for(const m of MIXES)for(const it of (r.mixes&&r.mixes[m])||[])slotAlts[it.pid]=[{pid:it.pid,dose:Number(it.dose)},...(it.alts||[]).map(a=>({pid:a.pid,dose:Number(a.dose)}))];
  for(const f of FARMS)for(const pid in res[f]){let need=res[f][pid];const chain=slotAlts[pid]||[{pid,dose:1}];const pd=chain[0].dose||1;
    for(const g of FARMS){if(g===f||need<=1e-6)continue;for(const c of chain){const left=end[g][c.pid];const gUses=res[g][c.pid]>0;if(!(left>1e-6)||gUses)continue;

      const [bg,fg,zh,my]=no?['#fee2e2','#b91c1c','✗ 没有','မရှိ']:r.cls==='ask'?['#fef3c7','#92400e','? 要确认','စစ်ပါ']:['#dcfce7','#166534','✓ 有','ရှိ'];
      g.fillStyle=bg;rr(846,y+(ROWH-88)/2,150,88,12);g.fill();g.fillStyle=fg;g.textAlign='center';g.font=F(900,24);g.fillText(zh,921,y+ROWH/2-6);g.font=F(700,17);g.fillText(my,921,y+ROWH/2+26);g.textAlign='left';y+=ROWH}}
  g.fillStyle='#374151';g.font=F(400,21);y+=24;for(const t of['မိုးရွာရွာ နေပူပူ ရက်အတိုင်း ထည့်ပါ · 不管下雨出太阳，照日子放','CP နဲ့ Bromocide တစ်နေ့တည်း မထည့်ရ · CP 不跟 Bromocide 同一天放','Bromocide အရေပြားလောင်တယ်၊ လက်အိတ်ဝတ်ပါ · Bromocide 会烧皮肤，要戴手套','ထည့်ပြီးရင် ဓာတ်ပုံ group ထဲ ပို့ပါ · 放完拍照发群']){g.fillText(t,24,y);y+=34}
  return cv}
let lastCard=null;
async function showCard(){const d=day();const cv=await drawCard(farmSel,d);const url=cv.toDataURL('image/png');lastCard={url,name:`滴灌卡_${farmSel}_${d}.png`};
  sheet(`<img src="${url}" style="width:100%;border-radius:10px"><div class="row" style="margin-top:10px"><button class="btn p grow" data-act="share">存图 / 发 WhatsApp</button><button class="btn" data-act="close">关闭</button></div>`)}
async function shareCard(){if(!lastCard)return;const b=await (await fetch(lastCard.url)).blob();const file=new File([b],lastCard.name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(x){if(x.name==='AbortError')return}}
  const a=document.createElement('a');a.href=lastCard.url;a.download=lastCard.name;a.click()}

/* ---------------- skip ---------------- */
function sheetSkip(pid){const p=P(pid);sheetSkip.st={pid,reason:''};
  sheet(`<h2>${farmSel} · ${h(short(p))} 没放</h2><p class="tiny">${dd(day())}。按了这一样就不扣库存。</p><div class="row wrapf" style="gap:6px">${['没货','工头忘了','水管坏','其他'].map(x=>`<button class="btn sm" data-reason="${x}">${x}</button>`).join('')}</div>
  <div class="row" style="margin-top:12px"><button class="btn p grow neededit" data-act="skip-save">记下没放</button><button class="btn" data-act="close">取消</button></div>`)}

const NAV=[['today','💧','滴灌'],['week','📅','排表'],['hist','🗂️','纪录']];
function render(){const v=tab==='week'?vWeek:tab==='hist'?vHist:vToday;try{$('#view').innerHTML=v()}catch(x){console.error(x);$('#view').innerHTML=`<div class="card red">画面出错：${h(x.message)}</div>`}
  $('#bar').innerHTML=NAV.map(([k,i,l])=>`<button class="${tab===k?'on':''}" data-go="${k}"><b>${i}</b>${l}</button>`).join('')}
async function audit(what,c,id){try{S.audit=S.audit||[];await put('audit',{id:uid('A'),at:nowIso(),by:ME.name,col:c,ref:id,what})}catch(x){}}
document.addEventListener('click',async e=>{const g=e.target.closest('[data-go]');if(g){tab=g.dataset.go;closeSheet();render();scrollTo(0,0);return}
  const dy=e.target.closest('[data-day]');if(dy){dayOff=Number(dy.dataset.day);render();return}
  const fm=e.target.closest('[data-farm]');if(fm){farmSel=fm.dataset.farm;try{localStorage.setItem('dg_farm',farmSel)}catch(_){}render();return}
  const rs=e.target.closest('[data-reason]');if(rs){sheetSkip.st.reason=rs.dataset.reason;rs.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===rs));return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,id=a.dataset.id;if(act==='close-bg'&&e.target!==a)return;
  try{switch(act){case 'close':case 'close-bg':closeSheet();break;
    case 'card':a.disabled=true;await showCard();a.disabled=false;break;case 'share':await shareCard();break;
    case 'skip':sheetSkip(id);break;
    case 'skip-save':{if(!ME.edit){toast('⚠ 你没有修改权限');return}a.disabled=true;const s=sheetSkip.st;await put('ledger',{id:uid('L'),t:'dripskip',date:day(),at:nowIso(),by:ME.name,farm:farmSel,pid:s.pid,reason:s.reason});closeSheet();toast(`${farmSel} ${short(P(s.pid))} 记了没放，不扣库存`);render();break}
    case 'unskip':{const r=skipRec(farmSel,day(),id);if(r){await put('ledger',{...r,void:true,voidAt:nowIso(),voidBy:ME.name});toast('已撤回，照放了算')}render();break}
    case 'wk-edit':sheetWk(Number(a.dataset.v));break;
    case 'wk-save':{if(!ME.owner){toast('⚠ 只有 Owner 能改排表');return}const w=Number(a.dataset.v);const c=JSON.parse(JSON.stringify(dcfg()));c.week=c.week||{};c.week[w]=(c.slots||[]).map((_,si)=>[...document.querySelectorAll(`[data-wk="${si}"]:checked`)].map(x=>x.value));
      await put('cfg',c);await audit(`滴灌排表 ${WD[w]} 改成：${c.week[w].map((L,si)=>(c.slots[si]+' '+(L.map(p=>short(P(p))).join('、')||'—'))).join(' / ')}`,'cfg','drip');closeSheet();toast('已存');render();break}
    case 'am-edit':sheetAm(id);break;
    case 'am-save':{if(!ME.owner){toast('⚠ 只有 Owner 能改分量');return}const c=JSON.parse(JSON.stringify(dcfg()));for(const f of FARMS){const v=Number($('#am-'+f).value);if(!(v>=0)){toast('⚠ 数字不对');return}c.items[id][f]=v}
      await put('cfg',c);await audit(`滴灌 ${short(P(id))} 每次：${FARMS.map(f=>f+' '+c.items[id][f]).join(' / ')}`,'cfg','drip');closeSheet();toast('已存');render();break}
  }}catch(x){console.error(x);toast('⚠ '+(x.message||x))}});
function gate(msg){$('#root').innerHTML=`<div class="gate"><h2>DripGo</h2><p class="muted">${h(msg)}</p><a class="btn" href="../index.html">← 回主页登入</a></div>`}
async function boot(){
  if(MOCK)ME={name:MOCK.me||'Teo',role:MOCK.role||'OWNER',edit:true,owner:(MOCK.role||'OWNER')==='OWNER'};
  else{if(!window.supabase){gate('连不上资料库，请检查网络后重新整理。');return}sb=window.supabase.createClient(SB_URL,SB_KEY);
    let ss=null;try{ss=(await sb.auth.getSession()).data.session}catch(x){gate('连不上资料库：'+x.message);return}if(!ss){gate('还没登入。请回主页登入后再打开 DripGo。');return}
    const {data:me}=await sb.from('hub_app_user').select('display_name,role,status').eq('id',ss.user.id).maybeSingle();if(!me||me.status!=='ACTIVE'){gate('你的账号没有 DripGo 权限。');return}
    const [{data:see1},{data:see2},{data:edit}]=await Promise.all([sb.rpc('hub_can',{p_system:'SPRAY',p_action:'see'}),sb.rpc('hub_can',{p_system:'STORE',p_action:'see'}),sb.rpc('hub_can',{p_system:'STORE',p_action:'edit'})]);
    if(!see1&&!see2){gate('你的账号没有 DripGo 权限。');return}ME={name:me.display_name,role:me.role,edit:!!edit,owner:me.role==='OWNER'}}
  document.body.classList.toggle('noedit',!ME.edit);document.body.classList.toggle('notowner',!ME.owner);
  $('#who').innerHTML=`${h(ME.name)}<br><a href="SprayGo.html" style="color:var(--green);font-weight:750;text-decoration:none;margin-right:10px">🧴 SprayGo</a><a href="StoreGo.html" style="color:var(--green);font-weight:750;text-decoration:none">📦 StoreGo</a>`;
  try{await load()}catch(x){gate('读不到资料：'+(x.message||x));return}render();
  setInterval(async()=>{if(!document.hidden&&!$('#modal').innerHTML){try{await load();render()}catch(x){}}},90000)}
boot();
})();
