<!DOCTYPE html>
<html lang="zh">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<title>Azura Delta</title>
<!--
=====================================================================
 Azura Delta 农场可视化管理 App — v11（AD1 理想布局、种植排起点可跟斜边；v10 AD2 理想布局、每排株数可不一、不规则地块网格跟地形；v9 AD3 理想布局、地形网格、植株框架；v8 品牌开场动画；v7 精准坐标导航、全界面四语言、放置面板仅管理员；v6 Azura Delta 标志、轮播无缝循环、管理员权限；v5 新首页 Home/Task/Map/Me、四语言；AD1/AD2/AD3 全部按地契实际边界；功能分区规划；农场按地契图实际边界裁切；地图改为左面板+右地图、连线吸附、多选删除、逐株植株、平面图）
 单文件 · 纯前端 · IndexedDB 本地存储 · Three.js 3D 地图
---------------------------------------------------------------------
 代码结构（按顺序）：
  §1 工具函数          §2 本地数据库(IndexedDB)    §3 默认数据 & 技能树
  §4 数据查询/计算      §5 通用表单/弹窗           §6 3D 地图(模块1)
  §7 批次与记录(模块3)  §8 人员(模块2)             §9 计划+时间轴(模块4)
  §10 技能树(模块5)     §11 更多/设置/导出/回收站   §12 启动
 数据关系：农场 → 区域 → 批次 → 记录(含照片) → 周期总结
 原则：删除一律进回收站可恢复；批次独立、永不覆盖旧批次
=====================================================================
-->
<style>
:root{--g:#2e7d32;--g2:#e8f5e9;--bg:#f4f6f3;--card:#fff;--tx:#1d2a1f;--mu:#6b7a6d;--bd:#dfe6df;--red:#e53935;--yel:#fbc02d;--grn:#43a047;--hh:52px;--nh:60px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{position:fixed;top:0;left:0;right:0;height:var(--hh);background:var(--g);color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;z-index:20}
header .logo{font-weight:700;white-space:nowrap}
header select{flex:1;max-width:220px;font-size:15px;padding:6px 8px;border-radius:8px;border:0;background:#fff;color:var(--tx)}
header .ver{font-size:11px;opacity:.8}
main{position:fixed;top:var(--hh);bottom:var(--nh);left:0;right:0;overflow:hidden}
#pgOther{position:absolute;inset:0;overflow:auto;padding:12px 12px 90px}
#pgMap{position:absolute;inset:0}
#cv{position:absolute;inset:0}
#cv canvas{display:block;touch-action:none}
nav{position:fixed;bottom:0;left:0;right:0;height:var(--nh);background:#fff;border-top:1px solid var(--bd);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button b{font-size:20px;font-weight:400}
nav button.on{color:var(--g);font-weight:700}
button{font:inherit;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--tx)}
button.pri{background:var(--g);color:#fff;border-color:var(--g)}
button.danger{color:var(--red);border-color:#f3c0bf}
button.big{width:100%;padding:12px;font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bar h2{margin:0;font-size:19px;flex:1}
h3{margin:0 0 10px;font-size:17px}h4{margin:12px 0 6px}
.muted{color:var(--mu)}.small{font-size:12px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.chip{display:inline-block;color:#fff;background:#888;border-radius:20px;padding:1px 8px;font-size:12px;white-space:nowrap}
.chip.dark{background:#333}.chip.lite{background:var(--g2);color:var(--g)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.prog{height:8px;background:#e6ebe6;border-radius:6px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--g)}
.th{width:64px;height:64px;object-fit:cover;border-radius:8px;background:#e6ebe6;flex:none}
.th.sm{width:52px;height:52px}
.ph-empty{display:flex;align-items:center;justify-content:center;font-size:28px}
.bc-top{display:flex;gap:10px}.bt{font-weight:700;font-size:16px}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:8px}
.sc{background:#f7faf7;border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
.sct{font-size:12px;font-weight:700;color:var(--g);margin-bottom:2px}
.kv{display:flex;justify-content:space-between;font-size:12px}.kv b{font-weight:600}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;font-size:13px}
.info div span{color:var(--mu);margin-right:4px}
.tabs{display:flex;gap:4px;margin:12px 0 8px;overflow:auto}
.tabs button{flex:none}.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.tl-date{font-weight:700;margin:12px 0 4px;color:var(--g)}
.rec{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:6px;font-size:13px}
.rh{display:flex;align-items:center;gap:4px;margin-bottom:4px}.rh button{padding:2px 7px;font-size:12px}
.phs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.pgrid .pc{position:relative}.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.pgrid .pc.sel img{outline:3px solid var(--g)}
.pgrid .cap{font-size:11px;color:var(--mu)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet.hidden{display:none}
.sheet-body{background:#fff;width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){#sheet{align-items:center}.sheet-body{border-radius:16px}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mu);min-width:0}
.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{font:inherit;font-size:15px;color:var(--tx);padding:7px 8px;border:1px solid var(--bd);border-radius:8px;background:#fff;width:100%}
.multi{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--tx);font-size:14px}
.btns{display:flex;gap:6px;margin-top:14px;align-items:center}.btns.wrap{flex-wrap:wrap}
.typechips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tc{padding:6px 10px}.tc.on{background:var(--g);color:#fff;border-color:var(--g)}
.maptools{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
.maptools button{background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(0,0,0,.15);padding:6px 9px;font-size:13px}
.maptools button.on{background:var(--g);color:#fff}
.hint{position:absolute;bottom:40px;left:8px;right:8px;background:#1d2a1f;color:#fff;border-radius:10px;padding:8px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;z-index:5;font-size:13px}
.hint.hidden{display:none}.hint span:first-child{flex:1}.hint button{padding:4px 10px;font-size:13px}
.legend{position:absolute;bottom:8px;left:8px;background:rgba(255,255,255,.9);border-radius:8px;padding:3px 8px;font-size:12px;z-index:4}
.pal h4{margin:10px 0 4px;font-size:13px;color:var(--mu)}
.pal .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.pal button{display:flex;align-items:center;gap:6px;font-size:13px;text-align:left}
.pal i{width:12px;height:12px;border-radius:3px;flex:none}
.trow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.trow:last-child{border:0}.trow .tt{flex:1;min-width:0}
.stbtn{min-width:62px;font-size:12px;padding:4px 6px}
.mtl{display:flex;gap:0;overflow-x:auto;padding:10px 0 4px}
.mn{flex:none;width:110px;text-align:center;position:relative;cursor:pointer;font-size:12px}
.mn:before{content:"";position:absolute;top:22px;left:0;right:0;height:2px;background:var(--bd)}
.mn .d{width:14px;height:14px;border-radius:50%;background:var(--g);margin:15px auto 4px;position:relative}
.mn.auto .d{background:#9fb3a2}.mn.past{opacity:.55}.mn.today .d{background:var(--red)}
.skill{border-top:1px solid var(--bd);padding:8px 0}
.skh{display:flex;align-items:center;gap:6px;font-size:14px}.skh button{padding:1px 7px;font-size:12px}
.skh code{background:var(--g2);color:var(--g);border-radius:4px;padding:0 5px;font-size:12px}
.skill textarea{width:100%;margin-top:6px;font:inherit;font-size:14px;border:1px solid var(--bd);border-radius:8px;padding:6px;min-height:52px}
details>summary{cursor:pointer;list-style:none;font-size:15px}
details>summary::-webkit-details-marker{display:none}
.row-btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.le-row{display:flex;gap:4px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.le-row input:not([type=color]):not([type=checkbox]){flex:1;min-width:90px;padding:5px 7px;border:1px solid var(--bd);border-radius:6px;font:inherit}
.le-row input[type=color]{width:36px;height:30px;padding:0;border:0}
.le-row button{padding:3px 8px}
.search{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;margin-bottom:6px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters select{padding:6px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1d2a1f;color:#fff;padding:8px 16px;border-radius:20px;z-index:99;opacity:0;transition:.25s;pointer-events:none;font-size:14px}
#toast.on{opacity:1}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cmp img{width:100%;border-radius:8px}
table.sum{width:100%;border-collapse:collapse;font-size:14px}table.sum td{padding:5px 4px;border-bottom:1px solid var(--bd)}table.sum td:last-child{text-align:right;font-weight:600}
.nomap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--mu)}

/* ---- v2 地图布局：左面板 + 右地图 ---- */
#pgMap{display:flex}
#mpanel{width:330px;flex:none;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.ptabs{display:flex;border-bottom:1px solid var(--bd);flex:none}
.ptabs button{flex:1;border:0;border-radius:0;padding:10px 2px;font-size:13px;background:#fff;border-bottom:2px solid transparent}
.ptabs button.on{color:var(--g);font-weight:700;border-bottom-color:var(--g)}
#pbody{flex:1;overflow:auto;padding:10px 12px 40px}
#mapArea{position:relative;flex:1;min-width:0;min-height:0}
.phelp{font-size:12px;color:var(--mu);background:var(--g2);border-radius:8px;padding:6px 8px;margin-bottom:8px}
.popts{display:flex;gap:12px;align-items:center;font-size:13px;margin-bottom:6px;flex-wrap:wrap}
.popts select{padding:3px;border:1px solid var(--bd);border-radius:6px}
.pal button.on{background:var(--g);color:#fff;border-color:var(--g)}
.pal button small{font-size:10px;opacity:.7}
#pbody .form{grid-template-columns:1fr 1fr}
#hintMeas{color:#ffcc80;margin-right:4px}
.brush{display:flex;gap:4px;flex-wrap:wrap}.brush button{display:flex;align-items:center;gap:4px;font-size:12px;padding:4px 8px}.brush i{width:10px;height:10px;border-radius:50%}.brush button.on{outline:2px solid var(--tx)}
.seatwrap{overflow:auto;max-height:280px;margin:8px 0 4px;border-radius:10px;padding:8px;background:#1d2a1f}
.srow{white-space:nowrap;line-height:0;margin-bottom:4px}
.srow .rl{display:inline-block;width:22px;color:#cfd8cf;font-size:10px;line-height:13px;vertical-align:middle}
.seats i{display:inline-block;width:13px;height:13px;border-radius:50%;background:#43a047;margin-right:3px;cursor:pointer;vertical-align:middle}
.seats i.sick{background:#fbc02d}.seats i.dead{background:#e53935}.seats i.replant{background:#1e88e5}
.seats i:hover{outline:2px solid #fff}
@media(max-width:760px){#pgMap{flex-direction:column-reverse}#mpanel{width:auto;height:46%;border-right:0;border-top:1px solid var(--bd)}.maptools button{padding:5px 7px;font-size:12px}}
.zp{border-top:1px solid var(--bd);padding:7px 0}.zph{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.zph input{width:56px;padding:3px 5px;border:1px solid var(--bd);border-radius:6px;font:inherit}

/* ================= v5 视觉：简洁干净（白底、深蓝主色、暖棕线条图标） ================= */
:root{--g:#1c2a56;--g2:#eef0f7;--bg:#f5f5f7;--tx:#1b1d23;--mu:#8b909a;--bd:#ececf0;--navy:#1c2a56;--tan:#a8835a;--hh:52px;--nh:62px}
body{background:var(--bg)}
.ico{width:24px;height:24px;display:block;flex:none}.ico.sm{width:14px;height:14px;display:inline-block;vertical-align:-2px}
header#topbar{background:#fff;color:var(--tx);border-bottom:1px solid var(--bd);gap:10px;padding:0 14px}
#topbar #tbLogo{width:30px;height:30px;cursor:pointer;flex:none}#topbar .logo-img{width:30px;height:30px;border-radius:50%;object-fit:cover;display:block}
#topbar #tbTitle{font-size:17px;font-weight:700}
#topbar select{flex:none;max-width:150px;border:1px solid var(--bd);border-radius:20px;padding:6px 12px;font-size:14px;background:#fff}
.tbicon{border:0;background:none;padding:4px;margin-left:-6px;color:var(--tx)}
body.tab-home header#topbar{display:none}body.tab-home main{top:0}
nav#nav{height:var(--nh);border-top:1px solid var(--bd)}
nav#nav button{gap:3px;font-size:11px;color:#a3a7b0;font-weight:500}
nav#nav button .ico{width:25px;height:25px}
nav#nav button.on{color:var(--tx);font-weight:600}nav#nav button.on .ico{stroke-width:1.9}
#pgOther.v5{padding:0;background:var(--bg)}
.narrow{max-width:560px;margin:0 auto;padding:14px 14px 90px}
/* --- 首页 --- */
.home{max-width:560px;margin:0 auto;background:var(--bg);min-height:100%;padding-bottom:30px}
.hero{position:relative;height:min(86vw,470px);background:#1c2a56;overflow:hidden}
.car{position:absolute;inset:0;touch-action:pan-y;cursor:grab;user-select:none}
.car .track{display:flex;height:100%;will-change:transform}
.slide{flex:0 0 100%;height:100%;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#2c3e78 0,#1c2a56 55%,#141f42 100%)}
.slide img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.slide .plan{position:absolute;left:7%;right:7%;top:20%;bottom:43%;display:flex}
.slide .plan svg{width:100%;height:100%;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
.scap{position:absolute;left:22px;bottom:82px;color:#fff;display:flex;flex-direction:column;gap:1px;text-shadow:0 1px 6px rgba(0,0,0,.35);max-width:60%}
.scap b{font-size:28px;line-height:1.1;letter-spacing:1px;font-family:Georgia,"Times New Roman",serif}
.scap span{font-size:12.5px;opacity:.85}
.stap{position:absolute;right:16px;top:56px;font-style:normal;font-size:12px;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:4px 11px;max-width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{position:absolute;top:28px;right:20px;display:flex;gap:6px}.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.45);transition:.3s}.dots i.on{width:18px;background:#fff}
.htop{position:absolute;top:14px;left:14px;display:flex;gap:10px;align-items:center;z-index:2}
.hpill{display:flex;align-items:center;gap:4px;background:rgba(10,18,40,.45);color:#fff;border:0;border-radius:22px;padding:7px 12px;font-size:15px;font-weight:600;backdrop-filter:blur(4px)}
.hcirc{width:36px;height:36px;border-radius:50%;border:0;background:rgba(10,18,40,.45);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;backdrop-filter:blur(4px)}
.hcirc .ico{width:21px;height:21px}
.hcard{position:relative;margin:-70px 12px 0;background:linear-gradient(#f3f4f8,#fff 60%);border-radius:14px;padding:16px 18px 14px;box-shadow:0 2px 12px rgba(20,30,60,.08);z-index:3}
.havatar{position:absolute;right:14px;top:-34px;width:78px;height:78px;border-radius:50%;border:3px solid #fff;padding:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);overflow:hidden}
.havatar .logo-img{width:100%;height:100%;object-fit:cover;display:block}
.hello{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-right:80px}
.hello .hi{font-size:25px;font-weight:800;color:var(--navy);cursor:pointer}
.badge{border:0;background:#dbe8c8;color:#3d5a1e;border-radius:20px;padding:4px 11px;font-size:14px;font-weight:600}.badge b{font-weight:800;margin-right:2px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:14px;text-align:center}
.st{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:46px}.st.res{cursor:default}
.st b{font-size:22px;font-weight:600;color:var(--navy);position:relative}.st b .rd{position:absolute;top:2px;right:-8px;width:6px;height:6px;border-radius:50%;background:#e53935}
.st span{font-size:12.5px;color:#7b808a;letter-spacing:.5px}
.hpanel{margin:0 12px;background:#fff;border-radius:0 0 14px 14px;padding:22px 18px 18px;box-shadow:0 2px 12px rgba(20,30,60,.05)}
.circles{display:flex;align-items:center;justify-content:space-around}
.circ{width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#f4f5f9 0,#eceef4 70%);display:flex;align-items:center;justify-content:center}
.circ span{width:58%;height:58%;border-radius:50%;border:1.5px dashed #d4d7e0}
.vsep{width:1px;height:90px;background:var(--bd)}
.hsep{height:1px;background:var(--bd);margin:20px 0 16px}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.shortcuts button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--tan);padding:4px 0}
.shortcuts .ico{width:38px;height:38px;stroke-width:1.3}
.shortcuts span{color:#4a4e57;font-size:13px;line-height:1.25;text-align:center}
/* --- 通用列表行 / 弹窗 --- */
.mrow{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--bd);background:#fff;padding:14px 4px;text-align:left;border-radius:0;font-size:15px}
.mrow:last-child{border-bottom:0}.mrow .mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mrow .mic{color:var(--tan)}.mrow .mv{color:var(--mu);font-size:13px}.mrow .chev,.tcard .chev,.mecard .chev{width:18px;height:18px;color:#c3c6cd}
.mrow .ok{color:var(--navy)}
.pillbtn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:18px;padding:5px 12px;font-size:13px;text-decoration:none;white-space:nowrap}
.pillbtn.ghost{background:#fff;color:var(--navy)}

<script>
'use strict';

/* ============================== §1 工具函数 ============================== */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const num = v => Number(v) || 0;
const r1 = v => Math.round(v * 10) / 10;
const fmt = v => (v === '' || v == null || (typeof v === 'number' && isNaN(v))) ? '—' : v;

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); }
function download(name, data, type) {
  const b = data instanceof Blob ? data : new Blob([data], { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
/* 照片压缩：最长边 1280px，JPEG 0.72，控制存储体积 */
function compress(file, max = 1280, q = .72) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej; img.src = url;
  });
}

/* ============================== §2 本地数据库 ==============================
   kv 存整份状态 S；photos 存照片本体(dataURL)，S.photos 只存照片元数据 */
const DB = {
  db: null, mem: { kv: {}, photos: {} },
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('azura_farm', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('photos'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = null; setTimeout(() => toast('本地存储不可用：数据只在本次打开有效'), 500); }
  },
  req(store, mode, fn) {
    if (!this.db) return Promise.resolve(fn(null));
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode), os = tx.objectStore(store), r = fn(os);
      tx.oncomplete = () => res(r && 'result' in r ? r.result : undefined); tx.onerror = () => rej(tx.error);
    });
  },
  get(s, k) { return this.db ? this.req(s, 'readonly', os => os.get(k)) : Promise.resolve(this.mem[s][k]); },
  put(s, k, v) { if (!this.db) { this.mem[s][k] = v; return Promise.resolve(); } return this.req(s, 'readwrite', os => { os.put(v, k); }); },
  del(s, k) { if (!this.db) { delete this.mem[s][k]; return Promise.resolve(); } return this.req(s, 'readwrite', os => { os.delete(k); }); }
};
let S = null;
let saveT;
function save() { clearTimeout(saveT); saveT = setTimeout(() => DB.put('kv', 'state', S).catch(e => toast('保存失败：' + e.message)), 250); }
/* 任何数据改动后调用：存档 + 标记地图需重建 */
function commit() { save(); M.dirty = true; if (UI.tab === 'map') buildScene(); }
const photoCache = new Map();
async function getPhoto(id) { if (photoCache.has(id)) return photoCache.get(id); const d = await DB.get('photos', id); if (d) photoCache.set(id, d); return d; }
function hydrate(root = document) { root.querySelectorAll('img[data-pid]').forEach(async img => { const d = await getPhoto(img.dataset.pid); if (d) img.src = d; }); }

/* ============================== §3 默认数据 ============================== */
const SKILL_SEED = [

];
function defaultSkills() { return SKILL_SEED.map(([icon, name, sub, items]) => ({ id: uid(), icon, name, sub, items: items.map(([code, title]) => ({ id: uid(), code, title, notes: '', updated: '' })) })); }

/* 旧数据补齐新字段（以后升级版本都靠这里，不清旧数据） */
function migrate() {
  const d = defaults();
  for (const k in d) if (S[k] === undefined) S[k] = d[k];
  for (const k in d.settings) if (S.settings[k] === undefined) S.settings[k] = d.settings[k];

}

function autoSeedAD3() {

  if (!S.seedTitles) {
    S.seedTitles = true;
    const T = { AD1: ['2599（Lot 1221）+ 3672（Lot 1251）', '1221 + 1251', 'Jalan Bakri', 1.3026], AD2: ['9703 + 9704', '13240 + 13241', 'Serom', 2.074], AD3: ['4534', '4083', 'Bandar', .865] };

  // v3：AD1 改成地契实际边界（Lot 1221 + Lot 1251）
  if (!S.seedAD1B) {
    S.seedAD1B = true;
    const f = S.farms.find(x => x.name === 'AD1');
    if (f && !hasBoundary(f)) { seedAD1(f); S.curFarm = f.id; const n = outsideItems(f).length; setTimeout(() => toast(`AD1 已改为地契实际边界${n ? `；有 ${n} 个旧物件在边界外，到「档案」可一键选中` : ''}`), 900); }

  if (!S.seedAD23B) {

    const f2 = S.farms.find(x => x.name === 'AD2');
    if (f2 && !hasBoundary(f2)) { seedAD2(f2); msg.push('AD2'); }
    const f3 = S.farms.find(x => x.name === 'AD3');
    if (f3 && !hasBoundary(f3)) {
      const L0 = num(f3.length), W0 = num(f3.width), keys = farmItemKeys(f3);

      if (keys.length && L0 && W0) fitSketchToBoundary(f3, L0, W0, keys);

    if (msg.length) { if (S.seedAD3) S.curFarm = (f3 || f2).id; setTimeout(() => toast(`${msg.join('、')} 已改为地契实际边界`), 1100); }
  }

const csvOf = rows => '\ufeff' + rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
function exportRecords() {
  const rows = [['日期', '农场', '区域', '批次', 'Day', '类型', '内容', '操作人', '备注', '照片数']];
  S.records.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(r => { const b = byId(S.batches, r.batchId); if (!b) return;
    rows.push([r.date, byId(S.farms, b.farmId)?.name, byId(S.zones, b.zoneId)?.name, b.code, dayAt(b, r.date), recType(r.type).name, recSummary(r, true), r.by ? staffName(r.by) : '', r.note, r.photoIds.length]); });
  download(`农场记录_${today()}.csv`, csvOf(rows), 'text/csv');
}
function exportBatches() {
  const rows = [['农场', '区域', '批次', '作物', '品种', '状态', '阶段', 'Day', '播种', '定植', '实际首收', '实际结束', '初始株数', '存活', '总产量kg', 'A kg', 'B kg', 'C kg', '负责人', '备注']];
  S.batches.forEach(b => { const s = stats(b);
    rows.push([byId(S.farms, b.farmId)?.name, byId(S.zones, b.zoneId)?.name, b.code, b.crop, b.variety, statusOf(b).name, batchStage(b).name, batchDay(b), b.sowDate, b.plantDate, b.actFirst, b.actEnd, b.initPlants, b.alive, r1(s.hvTotal), r1(s.A), r1(s.B), r1(s.C), staffName(b.ownerId), b.note]); });
  download(`种植批次_${today()}.csv`, csvOf(rows), 'text/csv');
}
async function backup() {
  toast('打包中…'); const photos = {};
  for (const p of S.photos) photos[p.id] = await getPhoto(p.id);
  download(`AzuraFarm_备份_${today()}.json`, JSON.stringify({ app: 'azura-farm', ver: APP_VER, at: new Date().toISOString(), state: S, photos }), 'application/json');
}
async function restore(file) {
  try {
    const j = JSON.parse(await file.text());
    if (j.app !== 'azura-farm') return toast('这不是本系统的备份档');
    if (!confirm('用这份备份覆盖目前全部数据？（建议先备份目前的）')) return;
    S = j.state; migrate();
    for (const [k, v] of Object.entries(j.photos || {})) if (v) { await DB.put('photos', k, v); photoCache.set(k, v); }
    await DB.put('kv', 'state', S); renderHeader(); M.dirty = true; fitView('iso'); render(); toast('已还原');
  } catch (e) { toast('还原失败：' + e.message); }
}

function logoHTML(cls = '') {
  const b = brand();
  if (b.logoId) return `<img class="logo-img ${cls}" data-pid="${b.logoId}" alt="Azura Delta">`;

const me = () => S.me || (S.me = { name: '', staffId: '', phone: '' });
/* 权限：人员名单里勾了「管理员」的人可以编辑 App；其他人只用一般功能 */
function isAdmin() { if (window.HUB) return !!window.HUB.edit; const p = byId(S.staff, me().staffId); return !!(p && p.admin); }

/* 农场平面图（SVG，给首页轮播用；不需要 3D） */
function farmPlanSVG(f) {
  const P = farmPoly(f), xs = P.map(p => p[0]), zs = P.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), z0 = Math.min(...zs), z1 = Math.max(...zs), pad = Math.max(x1 - x0, z1 - z0) * .08;
  const vb = [x0 - pad, z0 - pad, x1 - x0 + pad * 2, z1 - z0 + pad * 2], pts = a => a.map(p => p.join(',')).join(' ');
  let h = `<polygon points="${pts(P)}" fill="#efe3c8" stroke="#ffffff" stroke-width="${vb[2] / 220}" stroke-linejoin="round"/>`;
  zonesOf(f.id).forEach(z => h += `<polygon points="${pts(boxCorners(z))}" fill="${z.color || '#66bb6a'}" opacity=".85"/>`);
  S.objects.filter(o => o.farmId === f.id).forEach(o => {
    const d = OBJ_DEF[o.type] || {};
    if (isQuad(o)) h += `<polygon points="${pts(o.quad)}" fill="${o.color || d.color}" opacity=".9"/>`;
    else if (LINEAR.has(o.type) || o.type === 'gate') { const [a, b] = linEnds(o); h += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${o.type === 'gate' ? '#c9a46a' : '#6d5a43'}" stroke-width="${vb[2] / (o.type === 'gate' ? 150 : 300)}"/>`; }
    else if (d.shape === 'box' || d.shape === 'flat') h += `<polygon points="${pts(boxCorners(o))}" fill="${o.color || d.color}" opacity=".9"/>`;
    else h += `<circle cx="${o.x}" cy="${o.z}" r="${Math.max(num(o.w) / 2, vb[2] / 260)}" fill="${o.color || d.color}"/>`;
  });
  (f.lotLines || []).forEach(([a, b]) => { if (P[a] && P[b]) h += `<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" stroke="#b39b72" stroke-width="${vb[2] / 400}" stroke-dasharray="${vb[2] / 80} ${vb[2] / 120}"/>`; });
  return `<svg viewBox="${vb.join(' ')}" preserveAspectRatio="xMidYMid meet">${h}</svg>`;
}

/* 轮播：3 秒自动换下一张，AD1→AD2→AD3→AD1 无缝循环（头尾各放一张复制图，到头时瞬间接回）；可拖动；点一下进地图 */
function carousel(box, n) {
  CAR.n = n; if (CAR.i >= n) CAR.i = 0;
  const tr = box.querySelector('.track'), loop = n > 1;
  if (loop) { const sl = tr.querySelectorAll('.slide'); tr.insertBefore(sl[n - 1].cloneNode(true), sl[0]); tr.appendChild(sl[0].cloneNode(true)); }
  let pos = CAR.i + (loop ? 1 : 0);
  const setX = (anim, px = 0) => { tr.style.transition = anim ? 'transform .5s cubic-bezier(.25,.8,.25,1)' : 'none'; tr.style.transform = `translateX(calc(${-pos * 100}% + ${px}px))`; };
  const dots = () => box.querySelectorAll('.dots i').forEach((d, i) => d.classList.toggle('on', i === CAR.i));
  const norm = () => { if (!loop) return; if (pos >= n + 1) pos = 1; else if (pos <= 0) pos = n; setX(false); void tr.offsetWidth; };
  const moveTo = p => { pos = p; CAR.i = loop ? ((p - 1) % n + n) % n : p; setX(true); dots(); };
  tr.addEventListener('transitionend', () => { if (loop && (pos >= n + 1 || pos <= 0)) norm(); });
  const restart = () => { clearInterval(CAR.timer); if (!loop) return; CAR.timer = setInterval(() => {
    if (UI.tab !== 'home' || !document.body.contains(box)) return clearInterval(CAR.timer);
    if (CAR.drag || document.hidden) return; norm(); moveTo(pos + 1); }, 3000); };
  setX(false); dots(); restart();
  box.onpointerdown = e => { norm(); CAR.drag = { x: e.clientX, dx: 0, w: box.clientWidth }; box.setPointerCapture(e.pointerId); };
  box.onpointermove = e => { if (!CAR.drag) return; CAR.drag.dx = e.clientX - CAR.drag.x; setX(false, CAR.drag.dx); };
  box.onpointerup = box.onpointercancel = e => {
    const d = CAR.drag; CAR.drag = null; if (!d) return;
    if (Math.abs(d.dx) < 6 && e.type === 'pointerup') { const s = tr.children[pos]; if (s) return openFarmMap(s.dataset.fid); }
    if (loop && Math.abs(d.dx) > d.w * .18) moveTo(pos + (d.dx < 0 ? 1 : -1)); else setX(true);
    restart();
  };
}

const okLat = v => isFinite(v) && Math.abs(v) <= 90, okLng = v => isFinite(v) && Math.abs(v) <= 180;

/* 从任意文字里找坐标：Google Maps 链接（@ / q= / query= / ll= / !3d!4d / place/）、WhatsApp 位置、十进制、度分秒 */

function renderTask(el) {
  UI.tfarm = UI.tfarm || 'all'; UI.tfilter = UI.tfilter || 'open';
  const td = today(), m = me();
  let ts = S.tasks.filter(x => UI.tfarm === 'all' || x.farmId === UI.tfarm);
  if (UI.tfilter === 'mine') ts = ts.filter(x => x.status !== '完成' && (!m.staffId || x.ownerId === m.staffId) && (!x.due || x.due <= td));
  else if (UI.tfilter === 'open') ts = ts.filter(x => x.status !== '完成'); else ts = ts.filter(x => x.status === '完成');
  ts.sort((a, b) => (a.due || '9').localeCompare(b.due || '9'));
  const farmName = id => byId(S.farms, id)?.name || '';
  const fcount = id => S.tasks.filter(x => x.status !== '完成' && (id === 'all' || x.farmId === id)).length;
  const F = [['open', t('open')], ['mine', t('myToday')], ['done', t('done')]];
  el.innerHTML = `<div class="tasklay"><aside class="tfarms">${[['all', t('allFarms')], ...S.farms.map(f => [f.id, f.name])].map(([id, nm]) => `<button data-f="${id}" class="${UI.tfarm === id ? 'on' : ''}">${esc(nm)}${fcount(id) ? `<i>${fcount(id)}</i>` : ''}</button>`).join('')}</aside>
    <div class="tmain"><div class="seg">${F.map(([k, n]) => `<button data-tf="${k}" class="${UI.tfilter === k ? 'on' : ''}">${n}</button>`).join('')}</div>
      <button class="pubbtn" data-a="new">${ic('plus')} ${t('publish')}${UI.tfarm !== 'all' ? ' · ' + esc(farmName(UI.tfarm)) : ''}</button>
      ${ts.map(x => { const late = x.status !== '完成' && x.due && x.due < td, z = byId(S.zones, x.zoneId);
        return `<div class="tcard ${x.status === '完成' ? 'isdone' : ''}" data-id="${x.id}"><button class="tchk" data-chk="${x.id}">${x.status === '完成' ? ic('check') : ''}</button>
          <div class="tbody"><div class="tt2">${esc(x.title)}</div><div class="tmeta">${UI.tfarm === 'all' ? `<span>${esc(farmName(x.farmId))}</span>` : ''}${z ? `<span data-loc="${z.id}">${esc(z.name)}</span>` : ''}<span>${esc(staffName(x.ownerId))}</span>${x.due ? `<span class="${late ? 'late' : ''}">${x.due === td ? t('today') : esc(x.due.slice(5))}${late ? ' · ' + t('overdue') : ''}</span>` : ''}${x.status === '进行中' ? '<span class="prog2">进行中</span>' : ''}</div></div>
          ${ic('chev', 'chev')}</div>`; }).join('') || `<div class="tempty">${ic('taskok')}<div>${t('noTask')}</div></div>`}
      <details class="tline"><summary>${t('timeline')}</summary><div id="tlbox"></div></details></div></div>`;
  // 时间轴沿用原有节点 + 批次自动节点
  const fsel = UI.tfarm === 'all' ? null : UI.tfarm;
  const ms = [...S.milestones.filter(x => !fsel || x.farmId === fsel).map(x => ({ ...x, kind: 'm' })),
    ...S.batches.filter(b => (!fsel || b.farmId === fsel) && !isClosed(b)).flatMap(b => [['定植', b.plantDate], ['预计首收', b.expFirst], ['预计结束', b.expEnd]].filter(x => x[1]).map(([l, d]) => ({ date: d, title: `${b.code} ${l}`, kind: 'b', bid: b.id })))].sort((a, b) => a.date.localeCompare(b.date));
  $('#tlbox', el).innerHTML = `<div class="mtl">${ms.map(x => `<div class="mn ${x.kind === 'b' ? 'auto' : ''} ${x.date < td ? 'past' : ''} ${x.date === td ? 'today' : ''}" ${x.kind === 'm' ? `data-m="${x.id}"` : `data-b="${x.bid}"`}><div class="small muted">${x.date.slice(5)}</div><div class="d"></div><div>${esc(x.title)}</div></div>`).join('') || '<div class="muted small">—</div>'}</div><button class="pillbtn ghost" data-a="newM">＋ 节点</button>`;
  el.onclick = e => { const tg = e.target.closest('[data-f],[data-tf],[data-chk],[data-loc],[data-a],[data-m],[data-b],[data-id]'); if (!tg) return; const d = tg.dataset;
    if (d.f) { UI.tfarm = d.f; if (d.f !== 'all') { S.curFarm = d.f; renderHeader(); } render(); return; }
    if (d.tf) { UI.tfilter = d.tf; render(); return; }
    if (d.chk) { const k = byId(S.tasks, d.chk); k.status = k.status === '完成' ? '待办' : '完成'; commit(); render(); return; }
    if (d.loc) { e.stopPropagation(); return focusZone(d.loc); }
    if (d.a === 'new') { if (UI.tfarm === 'all') return toast(t('pickFarm')); S.curFarm = UI.tfarm; return taskEdit(null); }
    if (d.a === 'newM') return msEdit(null);
    if (d.m) return msEdit(d.m); if (d.b) return openBatch(d.b);
    if (d.id) return taskEdit(d.id); };
  el.oninput = el.onchange = null;
}

function splashRoots() {

  const out = [];
  const grow = (x, y, ang, len, w, depth, delay) => {
    const a = ang + (rnd() - .5) * .5, x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
    const cx = (x + x2) / 2 + (rnd() - .5) * len * .35, cy = (y + y2) / 2 + (rnd() - .5) * len * .2;
    out.push({ d: `M${x.toFixed(1)} ${y.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`, w, delay });
    if (depth <= 0 || y2 > 474) return;
    const n = depth > 2 ? 2 : 1 + (rnd() > .45 ? 1 : 0);
    for (let i = 0; i < n; i++) grow(x2, y2, ang + (i ? 1 : -1) * (.35 + rnd() * .55), len * (.62 + rnd() * .2), w * .7, depth - 1, delay + 200 + rnd() * 140);
    if (rnd() > .35) grow(x2, y2, Math.PI / 2 + (rnd() - .5) * .4, len * .8, w * .8, depth - 1, delay + 200);
  };

  grow(233, 390, Math.PI / 2 + .8, 24, 1.7, 4, 220); grow(245, 390, Math.PI / 2 - .8, 24, 1.7, 4, 260);

  sel.innerHTML = S.farms.map(f => `<option value="${f.id}" ${f.id === S.curFarm ? 'selected' : ''}>${esc(f.name)}</option>`).join('');
}
$('#farmSel').onchange = e => { S.curFarm = e.target.value; UI.batchId = null; UI.bf.zone = ''; M.hl = null; save(); M.dirty = true; if (UI.tab === 'map') { buildScene(); fitView('iso'); updateHint(); } else render(); };
function go(tab) { UI.tab = tab; render(); }
$('#nav').onclick = e => { const b = e.target.closest('[data-tab]'); if (!b) return; if (b.dataset.tab === 'batch' && UI.tab === 'batch') UI.batchId = null; go(b.dataset.tab); };
function render() {
  document.body.className = 'tab-' + UI.tab + (isAdmin() ? '' : ' noadmin');
  renderNav(); renderTopbar();
  const isMap = UI.tab === 'map';
  $('#pgMap').style.display = isMap ? '' : 'none';
  const el = $('#pgOther'); el.style.display = isMap ? 'none' : '';
  if (isMap) { mapShown(); return; }
  if (M.mode !== 'view' && M.inited) setMode('view');
  el.className = ['home', 'plan', 'me'].includes(UI.tab) ? 'v5' : '';
  const sc = el.scrollTop;
  if (UI.tab === 'home') renderHome(el);
  if (UI.tab === 'plan') renderTask(el);
  if (UI.tab === 'me') renderMe(el);
  if (UI.tab === 'batch') { const b = UI.batchId && byId(S.batches, UI.batchId); b ? renderBatchDetail(el, b) : renderBatchList(el); }
  if (UI.tab === 'staff') renderStaff(el);
  if (UI.tab === 'skill') renderSkills(el);
  if (UI.tab === 'more') { if (isAdmin()) renderMore(el); else el.innerHTML = `<div class="phelp" style="margin:20px">${t('noEdit')}</div>`; }
  el.scrollTop = UI.tab === 'home' ? 0 : sc; hydrate(el);
}
async function bootApp() {
  await DB.open();
  try { S = await DB.get('kv', 'state'); } catch (e) { S = null; }

  if (S.settings.splash !== false) playSplash(); $('#splashCover')?.remove();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();   // 请求浏览器不要自动清掉本地数据
}
