  onSnapshot(fn,err){(subs[col]=subs[col]||[]).push({fn,err});refresh(col);return()=>{subs[col]=subs[col].filter(s=>s.fn!==fn)}},
  doc(id){return{
    async set(o){const doc=clean(o);const [t,c]=TB(col);let {error}=await sb.from(t).insert({col:c,id,doc});
      if(error&&error.code==='23505'){({error}=await sb.from(t).update({doc,updated_at:new Date().toISOString()}).eq('col',c).eq('id',id).select('id').single())}
      if(error)throw fail(error);await refresh(col)},
    async update(p){const [t,c]=TB(col);const {data,error:e1}=await sb.from(t).select('doc').eq('col',c).eq('id',id).single();if(e1)throw fail(e1);
      const doc=clean({...data.doc,...p});const {error}=await sb.from(t).update({doc,updated_at:new Date().toISOString()}).eq('col',c).eq('id',id).select('id').single();
      if(error)throw fail(error);await refresh(col)},
    async delete(){const [t,c]=TB(col);const {error}=await sb.from(t).delete().eq('col',c).eq('id',id);if(error)throw fail(error);await refresh(col)}
  }}}}};
window.claude={use:async n=>n==='db'?db:null};
async function boot(){
  if(!window.supabase){gate('offline');return}
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  let ss=null;try{ss=(await sb.auth.getSession()).data.session}catch(e){gate('offline',e.message);return}
  if(!ss){gate('no_login');return}
  const {data:me,error:e1}=await sb.from('hub_app_user').select('display_name,role,status').eq('id',ss.user.id).maybeSingle();
  if(e1){gate('offline',e1.message);return}

  const [{data:see,error:e2},{data:edit}]=await Promise.all([sb.rpc('hub_can',{p_system:'SPRAY',p_action:'see'}),sb.rpc('hub_can',{p_system:'SPRAY',p_action:'edit'})]);
  if(e2){gate('offline',e2.message);return}
  if(!see){gate('no_access');return}
  window.SG={mode:'spray',role:me.role,name:me.display_name,edit:!!edit,cost:me.role==='OWNER'};
  document.body.classList.toggle('noedit',!edit);document.body.classList.add('mode-spray');document.body.classList.toggle('nocost',me.role!=='OWNER');
  if(document.readyState==='loading')await new Promise(r=>document.addEventListener('DOMContentLoaded',r));
  const m=document.getElementById('main-js');const s=document.createElement('script');s.textContent=m.textContent;document.body.appendChild(s);
  setInterval(()=>{if(!document.hidden)refreshAll()},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshAll()});
}
boot();
})();

<script type="text/plain" id="main-js">
(()=>{'use strict';
/* ---------- constants ---------- */
const KINDS=[['Insecticide','杀虫剂'],['Fungicide','杀菌剂'],['Fertilizer','肥料'],['Wetting agent','展着剂'],['Bio','生物'],['Unknown','未知']];
const KL=Object.fromEntries(KINDS);const kl=k=>KL[k]||k;
const FARMS=[{id:'ad1',name:'AD 1'},{id:'ad2',name:'AD 2'},{id:'ad3',name:'AD 3'}];
const TABS=[['today','☀️','今天'],['spray','🧴','喷药'],['stock','📦','库存'],['records','📋','记录'],['products','🧪','药品']].filter(t=>{const S=window.SG||{};if(S.mode==='store')return t[0]==='stock'||t[0]==='products';if(S.mode==='spray')return t[0]!=='stock'&&(t[0]!=='spray'||S.edit);return true});
const MAIN=[
  {k:'name',l:'药名',type:'text',wide:1},
  {k:'use',l:'用途（小字显示在药名下面）',type:'text',wide:1},

  {k:'price',l:'每瓶/包价钱 (RM)',type:'num'},
  {k:'bookAmt',l:'平时每次用量',type:'num'}];
const MORE=[
  {k:'notebook',l:'本子上的名字',type:'text'},
  {k:'maker',l:'品牌 / 公司',type:'text'},
  {k:'ai',l:'有效成分 (%)',type:'text',wide:1},
  {k:'group',l:'组别 (IRAC / FRAC)',type:'text'},
  {k:'lrmp',l:'LRMP 号码',type:'text'},
  {k:'cls',l:'毒性等级 (Kelas)',type:'chips',opts:['I','II','III','IV'],wide:1},
  {k:'interval',l:'间隔几天喷一次',type:'num'},
  {k:'maxSprays',l:'每季最多喷几次',type:'num'},
  {k:'track',l:'要追踪库存吗',type:'chips',opts:[['Yes','要'],['No','不要（自制）']],wide:1},
  {k:'note',l:'备注',type:'area',wide:1}];
const ALLF=[...MAIN,...MORE];
const PEST=['Insecticide','Fungicide'];
function needed(p){const r=[];if(!p.kind||p.kind==='Unknown')r.push('kind');
  const keys=PEST.includes(p.kind)?['ai','group','cls','rate','eggplant','phi']:['ai','rate'];
  if(p.track!=='No')keys.push('packSize','price');
  for(const k of keys){const v=p[k];if(v===undefined||v===null||v===''||v==='Not sure')r.push(k)}return r}

/* ---------- state ---------- */
let sprayDocs=[],fdays=[],products=[],farms={},mixes=[],sprays=[],purchases=[],counts=[],loaded=false,db=null,assets=null;
let tab=(window.SG&&window.SG.mode==='store')?'stock':'today',farm=(()=>{try{const f=localStorage.getItem('farm');return FARMS.some(x=>x.id===f)?f:'ad1'}catch(e){return 'ad1'}})();
let focus=null,guideOpen=false,stockFarm='all',smFarm=null,recFarm='all',recStatus='all',pFilter='All',needOnly=false,showOther=false,activeMix=null,draft=null,editing=null,modalKind=null,modalArg=null;
const sel=new Map();

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const x=$('toast');x.textContent=t;x.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>x.hidden=true,2600)}
const fname=id=>(FARMS.find(f=>f.id===id)||{}).name||id;
const byId=id=>products.find(p=>p._id===id);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const dmy=s=>{if(!s)return '';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`};
const dm=d=>`${d.getDate()}/${d.getMonth()+1}`;
function addDays(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return d}
function water(fid){const f=farms[fid]||{};return (Number(f.tanks)||0)*(Number(f.litres)||0)}
function labelAmt(p,fid){const r=parseFloat(p.rate),w=water(fid||farm);return (!isNaN(r)&&w)?Math.round(r*w/10*10)/10:null}
const U=p=>p.rateUnit||'ml';
function photo(p){return p&&p.photo?`<img src="${e(p.photo)}" alt="" loading="lazy">`:`<span class="placeholder">${e((p&&p.name||'?').slice(0,2).toUpperCase())}</span>`}
const isDone=s=>!s.status||s.status==='done';
const isSpray=s=>s.kind!=='drip';
const DRIP_IDS=['amino','h2gro','hydrogen-peroxide-50','seaweed','promocide','cp-bio'];
const dripProducts=()=>products.filter(p=>p.drip||DRIP_IDS.includes(p._id)).sort(sortN);
const LET=['A','B','C'];
const mixLetter=m=>{const x=String(m&&m.name||'').match(/Mix\s*([ABC])\b/i);return x?x[1].toUpperCase():null};
function sprayLetter(s){if(s.mix){const l=String(s.mix).match(/([ABC])\s*$/i);if(l)return l[1].toUpperCase()}
  const ids=new Set((s.items||[]).map(i=>i.id).filter(id=>id!=='jwa'));let best=null,bs=0,tie=false;
  for(const m of mixes){if(m.farm!==s.farm)continue;const l=mixLetter(m);if(!l)continue;let n=0;for(const it of m.items||[])if(it.id!=='jwa'&&ids.has(it.id))n++;
    if(n>bs){bs=n;best=l;tie=false}else if(n===bs&&n>0&&l!==best)tie=true}
  return bs>0&&!tie?best:null}
function farmAnchor(fid){const L=sprays.filter(s=>s.farm===fid&&isDone(s)&&isSpray(s)).sort((a,b)=>String(b.doneDate||b.date).localeCompare(String(a.doneDate||a.date))||String(b.createdAt||'').localeCompare(String(a.createdAt||''))||String(b._id).localeCompare(String(a._id)));
  for(const s of L){const l=sprayLetter(s);if(l)return {fid,date:s.doneDate||s.date,l}}return null}
function rotation(fid){let a=farmAnchor(fid),borrowed=false;if(!a){const all=FARMS.map(f=>farmAnchor(f.id)).filter(Boolean).sort((x,y)=>y.date.localeCompare(x.date));if(all.length){a=all[0];borrowed=true}}
  if(!a)return null;const dd=(x,y)=>Math.round((Date.parse(x+'T00:00:00Z')-Date.parse(y+'T00:00:00Z'))/864e5);
  const at=ds=>LET[(((LET.indexOf(a.l)+dd(ds,a.date))%3)+3)%3];const t=today(),y=ymd(addDays(t,-1)),tm=ymd(addDays(t,1));
  const tags={};[[y,'昨天','y'],[t,'今天','t'],[tm,'明天','m']].forEach(([ds,w,c])=>{tags[at(ds)]={w,c,d:ds.slice(8).replace(/^0/,'')+'/'+ds.slice(5,7).replace(/^0/,'')}});
  return {a,borrowed,tags}}
const sortN=(a,b)=>(a.name||'').localeCompare(b.name||'');
function holdFor(fid){let best=null;const now=new Date();now.setHours(0,0,0,0);
  for(const s of sprays)if(s.farm===fid&&isDone(s))for(const i of s.items||[]){const ph=Number(i.phi||(byId(i.id)||{}).phi)||0;if(!ph)continue;const until=addDays(s.doneDate||s.date,ph);if(until>now&&(!best||until>best.until))best={until,name:i.name}}
  return best}

/* ---------- stock math ---------- */
const packBase=p=>{const n=Number(p.packSize);if(!n)return null;return (p.packUnit==='L'||p.packUnit==='kg')?n*1000:n};
function fmtAmt(v,p){const u=U(p);const n=Math.round(v);if(Math.abs(n)>=1000)return (Math.round(n/100)/10)+(u==='g'?' kg':' L');return n+' '+u}
const RM=v=>window.SG&&!window.SG.cost?'':'RM '+(Math.round(v*100)/100).toFixed(2);
function lastCount(fid,pid){return counts.filter(c=>c.farm===fid&&c.pid===pid).sort((a,b)=>((a.date||'')+(a.createdAt||'')).localeCompare((b.date||'')+(b.createdAt||''))).pop()||null}
function usedSince(fid,pid,after){let t=0;for(const s of sprays)if(s.farm===fid&&isDone(s)){const d=s.doneDate||s.date;if(after&&d<=after)continue;for(const i of s.items||[])if(i.id===pid)t+=Number(i.amt)||0}return t}
function boughtSince(fid,pid,c){let t=0;for(const b of purchases)if(b.farm===fid&&b.pid===pid&&(!c||(b.createdAt||'')>(c.createdAt||'')))t+=Number(b.amt)||0;return t}
function dailyUse(fid,pid){const ms=mixes.filter(m=>m.farm===fid);
  if(ms.length){let t=0;for(const m of ms)for(const i of m.items||[])if(i.id===pid)t+=Number(i.amt)||0;return t/ms.length}
  const since=ymd(addDays(today(),-30));let t=0;for(const s of sprays)if(s.farm===fid&&isDone(s)&&(s.doneDate||s.date)>since)for(const i of s.items||[])if(i.id===pid)t+=Number(i.amt)||0;return t/30}
function unitCost(p){let a=0,m=0;for(const b of purchases)if(b.pid===p._id&&Number(b.price)>0&&Number(b.amt)>0){a+=Number(b.price);m+=Number(b.amt)}
  if(m)return a/m;const pb=packBase(p);return pb&&Number(p.price)>0?Number(p.price)/pb:null}
function stockProducts(fid){const inMix=new Set();for(const m of mixes)if(m.farm===fid)for(const i of m.items||[])inMix.add(i.id);
  const had=new Set();for(const x of counts)if(x.farm===fid)had.add(x.pid);for(const x of purchases)if(x.farm===fid)had.add(x.pid);
  return products.filter(p=>p.track!=='No'&&(inMix.has(p._id)||(p.farms||[]).includes(fid)||had.has(p._id))).sort(sortN)}
function stockRow(fid,p){const c=lastCount(fid,p._id);const left=(c?Number(c.amt)||0:0)+boughtSince(fid,p._id,c)-usedSince(fid,p._id,c&&c.date);
  const d=dailyUse(fid,p._id),pb=packBase(p);const days=d>0?Math.floor(Math.max(left,0)/d):null;
  let need=0,packs=0;if(d>0){need=d*30-Math.max(left,0);if(need>0&&pb)packs=Math.ceil(need/pb)}
  const status=(!c&&!boughtSince(fid,p._id,null))?'nc':left<=0?'out':days!=null&&days<7?'low':days!=null&&days<30?'soon':'ok';
  return {p,c,left,d,days,pb,need,packs,status}}
const r5=v=>Math.max(5,Math.round(v/5)*5);
function subOpts(fid,p,amt){const base=Number(p.bookAmt)||0,n=Number(amt)||0;
  return (p.subs||[]).map(x=>{const q=byId(x.id);if(!q)return null;const a=x.amt==null?null:(base&&n?r5(Number(x.amt)*n/base):Number(x.amt));
    const sr=q.track!=='No'?stockRow(fid,q):null;const unknown=!!(sr&&sr.status==='nc');const ok=!sr||(!unknown&&a!=null&&sr.left>=a);
    return {q,a,ok,unknown}}).filter(Boolean)}
const ST={nc:['amber','未点算'],out:['red','没货'],low:['red','马上买'],soon:['amber','不够 30 天'],ok:['green','够用']};
function buyList(fid){return stockProducts(fid).map(p=>stockRow(fid,p)).filter(r=>r.need>0&&r.status!=='nc')}
function lowCount(fid){return stockProducts(fid).map(p=>stockRow(fid,p)).filter(r=>r.status==='out'||r.status==='low').length}
function monthUse(fid){const mo=today().slice(0,7);const used={};
  for(const s of sprays)if(s.farm===fid&&isDone(s)&&(s.doneDate||s.date).startsWith(mo))for(const i of s.items||[])used[i.id]=(used[i.id]||0)+(Number(i.amt)||0);
  let total=0;const lines=[],miss=[];
  for(const [id,amt] of Object.entries(used)){const p=byId(id);if(!p||p.track==='No')continue;const uc=unitCost(p);if(uc==null){miss.push(p.name);continue}const c=amt*uc;total+=c;lines.push([c,p,amt])}
  lines.sort((a,b)=>b[0]-a[0]);return {total,lines,miss,any:Object.keys(used).length>0}}

/* ---------- shell ---------- */
function head(ey,title,sub,cta=''){return `<div class="hero"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${cta}</div>`}
function renderNav(){
  $('navDesktop').innerHTML=TABS.map(([t,i,l])=>`<button class="navbtn ${tab===t?'active':''}" data-nav="${t}"><span aria-hidden="true">${i}</span>${l}</button>`).join('')}

  renderNav();
  const y=window.scrollY;

  if(!loaded){$('root').innerHTML='<div class="loading">载入药品中…</div>';return}
  $('root').innerHTML=({today:vToday,spray:vSpray,stock:vStock,records:vRecords,products:vProducts})[tab]();
  wire();updateSendbar();window.scrollTo({top:y});

/* ---------- Today ---------- */
function pendCard(s){
  return `<div class="panel job"><div class="details"><div class="rid">${e(fname(s.farm))} <span class="pill blue">等工人</span></div>
  <h3 style="margin:5px 0">${e((s.items||[]).map(i=>i.name).join(' + '))}</h3><div class="meta">${e(dmy(s.date))} 发出</div></div>
  <div class="acts" id="acts-${e(s._id)}"><button class="btn small dark" data-act="doneask" data-id="${e(s._id)}">喷好了</button></div></div>`}
function doneCard(s){
  return `<div class="panel job"><div class="details"><div class="rid">${e(fname(s.farm))} <span class="pill green">已喷</span></div>
  <h3 style="margin:5px 0">${e((s.items||[]).map(i=>i.name).join(' + '))}</h3><div class="meta">${e(dmy(s.doneDate||s.date))} 喷好</div></div></div>`}
function vToday(){
  const planned=sprays.filter(s=>s.status==='planned').sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
  const mo=today().slice(0,7);const doneMo=sprays.filter(s=>isDone(s)&&isSpray(s)&&(s.doneDate||s.date||'').startsWith(mo)).length;
  let buyNow=0;for(const f of FARMS)buyNow+=lowCount(f.id);

    const last=sprays.filter(s=>s.farm===f.id&&isDone(s)&&isSpray(s)).sort((a,b)=>(b.doneDate||b.date).localeCompare(a.doneDate||a.date))[0];

    <p class="note">${hd?e(hd.name):'只计算这里按了「喷好了」的记录。'}</p>
    ${low?`<button class="btn small warn" data-act="stockfarm" data-farm="${f.id}">库存：${low} 样要马上买 →</button>`:''}
    <p class="note">${pend} 个等工人 · ${last?`上次喷药 ${e(dmy(last.doneDate||last.date))}`:'还没有喷药记录'}</p>
    <button class="btn small soft" data-act="sprayfarm" data-farm="${f.id}">＋ ${f.name} 喷药</button></div>`}).join('');
  const done=sprays.filter(s=>isDone(s)&&isSpray(s)).sort((a,b)=>(b.doneDate||b.date).localeCompare(a.doneDate||a.date)).slice(0,3);
  return `${head('FARM CONTROL','今天，三个园','采收限制、等工人的喷药、要买的药。',`<button class="btn dark" data-act="sprayfarm" data-farm="${farm}">＋ 发喷药指令</button>`)}
  <div class="stats"><div class="stat"><div class="val">${planned.length}</div><div class="lab">等工人喷</div></div>
  <div class="stat"><div class="val">${doneMo}</div><div class="lab">本月已喷次数</div></div>
  <div class="stat"><div class="val ${buyNow?'bad':''}">${buyNow}</div><div class="lab">马上要买的药</div></div></div>
  <div class="grid3">${cards}</div>
  <div class="section-head"><h2>⏳ 等工人喷</h2><span class="pill blue">${planned.length} 个</span></div>
  ${planned.length?`<div class="stack">${planned.map(pendCard).join('')}</div>`:'<div class="empty"><strong>没有等待中的喷药</strong>在「喷药」发出指令后，会出现在这里，直到你按「喷好了」。</div>'}
  <div class="section-head"><h2>📋 最近喷好</h2><button class="btn small" data-nav="records">全部记录 →</button></div>
  ${done.length?`<div class="stack">${done.map(doneCard).join('')}</div>`:'<div class="empty">还没有喷好的记录。</div>'}`;
}

/* ---------- Spray ---------- */
const GUIDE=[
 ['叶子背面很多小白虫，一碰就飞（白粉虱）','Pollux、Amigo、Taci、Linodor。Amigo、Taci、Linodor 同是 4A 组，不要连着用。'],
 ['叶子有银白色刮痕，花和嫩叶卷（蓟马）','Amigo、Taci、Simodis。Simodis 是不同组，适合换着用。'],
 ['嫩芽枯萎，果实有小洞或虫粪（钻心虫 / 钻果虫）','Emamix（每季最多 2 次，隔 15 天）、Cyper H2O。'],
 ['叶子有褐斑、发霉、烂（真菌病）','先用 Mancozeb 预防；已经发病用 Kulatox 或 Revon（两个同组，不要连着用）。'],
 ['连续下雨、湿气重','加 Mancozeb 预防病害。'],
 ['开花结果期','加 K-Rich（钾，果实饱满）、Triple Ten（磷多，帮开花结果）。'],
 ['长势弱、叶子发黄','加 Amino（氨基酸，帮恢复）。'],
 ['根烂、整棵突然枯萎','Trichoderma 淋根（有益菌）。不要和杀菌剂一起混。']];

function step(v){return v>=1000?100:v>=100?10:v>=20?5:1}
function pick(p){const on=sel.has(p._id);const la=labelAmt(p);
  return `<button class="productpick ${on?'on':''}" data-act="pick" data-id="${e(p._id)}" aria-pressed="${on}">${photo(p)}<div style="min-width:0">

function mStock(pid){const sf=smFarm||stockFarm;const p=byId(pid);if(!p)return '';const r=stockRow(sf,p),pb=r.pb,u=U(p);

  if(f.type==='chips')return `<div class="${cls}"><span class="lb">${f.l}</span><div class="chips">${f.opts.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<button type="button" class="chip ${draft[f.k]===v?'on':''}" data-act="dchip" data-k="${f.k}" data-v="${e(v)}">${e(t)}</button>`}).join('')}</div></div>`;
  const inp=f.type==='area'?`<textarea id="${id}" data-k="${f.k}">${e(draft[f.k]??'')}</textarea>`:`<input id="${id}" data-k="${f.k}" ${f.type==='num'?'inputmode="decimal"':''} value="${e(draft[f.k]??'')}">`;

  return `<div class="${cls}"><label for="${id}">${f.l}</label>${inp}</div>`}
function doseLines(){const out=[];const rate=parseFloat(draft.rate),book=parseFloat(draft.bookAmt);const u=draft.rateUnit||'ml';

    if(!isNaN(book)){const pct=Math.round(book/lab*100);t+=` · 平时 ${book} ${u}（${pct}%）`;if(pct>130)c='bad'}out.push([c,t])}return out}
function mEdit(){const need=new Set(needed(draft));const dl=doseLines();

  <div class="chips">${products.filter(x=>x._id!==editing).sort(sortN).map(x=>`<button type="button" class="chip ${(draft.subs||[]).some(y=>y.id===x._id)?'on':''}" data-act="dsub" data-v="${e(x._id)}">${e(x.name)}</button>`).join('')}</div></div></div></details>
  <div class="footactions">${editing?`<button class="btn warn" data-act="del">${draft._del?'再按一次删除':'删除'}</button>`:''}<button class="btn" data-act="close">取消</button><button class="btn dark" data-act="saveprod" id="savebtn">保存</button></div>`}

async function markDone(id,ds){if(!db)return;try{await db.collection('sprays').doc(id).update({status:'done',doneDate:ds});toast('已记录喷好')}catch(err){toast('保存不了：'+(err.code||err.message))}}

    for(const i of list){const f=i.p.farms||[];if(i.p._id&&!f.includes(farm)){try{await db.collection('products').doc(i.p._id).update({farms:[...f,farm]})}catch(x){}}}

document.addEventListener('click',async ev=>{

  if(b.dataset.nav){go(b.dataset.nav);return}
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
  case 'sprayfarm':if(farm!==b.dataset.farm){farm=b.dataset.farm;sel.clear();activeMix=null}try{localStorage.setItem('farm',farm)}catch(x){}go('spray');break;
  case 'stockfarm':if(window.SG&&window.SG.mode==='spray'){location.href='StoreGo.html';break}stockFarm=b.dataset.farm;go('stock');break;

    box.innerHTML=`<button class="btn small dark" data-act="done" data-id="${e(id)}" data-d="${today()}">今天喷好</button><button class="btn small" data-act="done" data-id="${e(id)}" data-d="${ymd(y)}">昨天喷好</button><button class="btn small warn" data-act="nospray" data-id="${e(id)}">没喷</button>`;break}
  case 'done':markDone(id,b.dataset.d);break;

  case 'farm':if(farm!==b.dataset.farm){farm=b.dataset.farm;sel.clear();activeMix=null;showOther=false}try{localStorage.setItem('farm',farm)}catch(x){}render();break;
  case 'mix':{const m=mixes.find(x=>x._id===id);if(!m)break;sel.clear();for(const it of m.items||[])if(byId(it.id))sel.set(it.id,it.amt??'');activeMix=id;showOther=false;render();break}
  case 'pick':{const p=byId(id);if(sel.has(id))sel.delete(id);else sel.set(id,p&&p.bookAmt!=null?p.bookAmt:'');activeMix=null;render();break}
  case 'minus':case 'plus':{const i=$('amt-'+id);const v=Number(i.value)||0;const n=a==='minus'?Math.max(0,v-step(v)):v+step(v||1);sel.set(id,n);render();break}
  case 'swap':{const to=b.dataset.to,amt=b.dataset.amt===''?'':Number(b.dataset.amt);const n=new Map();for(const [k,v] of sel){if(k===id)n.set(to,amt);else n.set(k,v)}sel.clear();for(const [k,v] of n)sel.set(k,v);activeMix=null;render();toast('已换药');break}
  case 'other':showOther=!showOther;render();break;
  case 'clear':sel.clear();activeMix=null;render();break;
  case 'tosend':$('sendpanel')?.scrollIntoView({behavior:'smooth',block:'start'});break;
  case 'send':b.disabled=true;await sendNow();if(document.body.contains(b))b.disabled=false;break;
  case 'savemix':{const n=($('mixname').value||'').trim();if(!n){toast('请填配方名');break}if(!db)break;
    try{await db.collection('mixes').doc(farm+'-'+n.toLowerCase().replace(/[^a-z0-9]+/g,'-')).set({name:n,farm,items:items().map(i=>({id:i.id,amt:i.amt===''?null:i.amt}))});toast('配方已保存')}catch(err){toast('保存不了：'+(err.code||err.message))}break}
  case 'sfarm':stockFarm=b.dataset.farm;render();break;
  case 'dripopen':draft={farm:recFarm!=='all'?recFarm:farm,date:today(),amts:{}};openModal('drip');break;
  case 'dfarm':draft.farm=id;drawModal();break;
  case 'savedrip':{const ds=($('drip-date').value||today());const items=[];for(const p of dripProducts()){const v=draft.amts[p._id];if(v===undefined||String(v).trim()==='')continue;const n=Number(v);if(Number.isNaN(n)||n<0){toast('只能填数字');return}if(n>0)items.push({id:p._id,name:p.name,amt:n,unit:U(p),phi:0})}
    if(!items.length){toast('至少填一样的用量');break}
    const rec={kind:'drip',status:'done',date:ds,doneDate:ds,farm:draft.farm,farmName:fname(draft.farm),items,createdAt:new Date().toISOString()};
    try{await db.collection('sprays').doc(ds+'_'+draft.farm+'_drip_'+Date.now().toString(36)).set(rec);closeModal();toast('已记录滴灌加料')}catch(err){toast('保存不了：'+(err.code||err.message))}break}
  case 'focus':focus=focus&&focus.m===id?null:{m:id};render();break;
  case 'stockopen':smFarm=b.dataset.farm||stockFarm;openModal('stock',id);break;
  case 'copybuy':{const sf=stockFarm||'all';if(sf==='all'){const L=[`三个园 · 购买清单 ${dmy(today())}`];allBuy().forEach((x,ix)=>L.push(`${ix+1}. ${x.p.name} — ${x.pb?`${x.packs} × ${x.p.packSize} ${x.p.packUnit}`:fmtAmt(x.need,x.p)}（${x.by.join('，')}）`));try{await navigator.clipboard.writeText(L.join('\n'));toast('已复制')}catch(err){toast('这里不能复制')}break}const L=[`${fname(sf)} · 购买清单 ${dmy(today())}`];buyList(sf).forEach((r,ix)=>L.push(`${ix+1}. ${r.p.name} — ${r.pb?`${r.packs} × ${r.p.packSize} ${r.p.packUnit}`:fmtAmt(r.need,r.p)}`));
    try{await navigator.clipboard.writeText(L.join('\n'));toast('已复制')}catch(err){toast('这里不能复制')}break}
  case 'savecount':{const p=byId(id),pb=packBase(p),v=$('cnt-in').value,n=Number(v);if(v===''||Number.isNaN(n)||n<0){toast('请填数字');break}
    saveDoc('counts',{farm:smFarm||stockFarm,pid:id,amt:pb?n*pb:n,date:today(),createdAt:new Date().toISOString()});break}
  case 'savebuy':{const p=byId(id),pb=packBase(p),n=Number($('buy-n').value),rv=$('buy-rm').value,rm=rv===''?null:Number(rv);if(!(n>0)){toast('请填数量');break}if(rm!=null&&(Number.isNaN(rm)||rm<0)){toast('RM 只能填数字');break}
    saveDoc('purchases',{farm:smFarm||stockFarm,pid:id,packs:pb?n:null,amt:pb?n*pb:n,price:rm,date:today(),createdAt:new Date().toISOString()});break}
  case 'rfarm':recFarm=id;render();break;
  case 'rstatus':recStatus=id;render();break;
  case 'pfilter':pFilter=id;render();break;
  case 'needonly':needOnly=!needOnly;render();break;
  case 'savewater':{const f=b.dataset.farm;const t=$(`w-${f}-tanks`).value,l=$(`w-${f}-litres`).value;const o={name:fname(f),tanks:t===''?null:Number(t),litres:l===''?null:Number(l),acres:(farms[f]||{}).acres??null};
    if([o.tanks,o.litres].some(x=>Number.isNaN(x))){toast('只能填数字');break}try{await db.collection('farms').doc(f).set(o);toast(fname(f)+' 已保存')}catch(err){toast('保存不了：'+(err.code||err.message))}break}
  case 'edit':{const p=id?byId(id):null;editing=p?p._id:null;draft=p?{...p}:{kind:'',rateUnit:'ml',packUnit:'ml',farms:[farm]};delete draft._del;openModal('edit');break}
  case 'dchip':{const k=b.dataset.k,v=b.dataset.v;draft[k]=(draft[k]===v&&!['rateUnit','packUnit'].includes(k))?'':v;drawModal();break}
  case 'dmulti':{const cur=Array.isArray(draft.farms)?draft.farms:[];const v=b.dataset.v;draft.farms=cur.includes(v)?cur.filter(x=>x!==v):[...cur,v];drawModal();break}
  case 'dsub':{const v=b.dataset.v,cur=Array.isArray(draft.subs)?draft.subs:[];const q=byId(v);draft.subs=cur.some(y=>y.id===v)?cur.filter(y=>y.id!==v):[...cur,{id:v,amt:q&&q.bookAmt!=null?q.bookAmt:null}];draft._more=true;drawModal();break}
  case 'photo':$('photo-in').click();break;
  case 'del':if(!draft._del){draft._del=true;drawModal();break}try{await db.collection('products').doc(editing).delete();closeModal();toast('已删除')}catch(err){toast('删除不了：'+(err.code||err.message))}break;
  case 'saveprod':saveProduct();break;
  case 'close':closeModal();break;
  }
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&modalKind)closeModal()});

/* ---------- data ---------- */
function rerender(){const ae=document.activeElement;if(ae&&ae.closest&&ae.closest('#root')&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;render();if(modalKind==='stock')drawModal()}
renderNav();
(async()=>{
  try{db=window.claude?.use?await window.claude.use('db'):null}catch(err){db=null}
  try{assets=window.claude?.use?await window.claude.use('assets'):null}catch(err){assets=null}
  if(!db){$('conn').className='pill amber';$('conn').textContent='● 离线';render();return}
  const timer=setTimeout(()=>{if(!loaded){$('root').innerHTML='<div class="empty"><strong>还在载入…</strong>请检查手机讯号。</div>'}},10000);
  const on=(col,fn)=>db.collection(col).onSnapshot(s=>{fn(s.docs.map(d=>({...d.data(),_id:d.id})));rerender()},err=>{if(col==='products'){clearTimeout(timer);toast('载入失败（'+err.code+'）')}});
  on('products',a=>{products=a;loaded=true;clearTimeout(timer);try{mergeS()}catch(x){}});
  on('farms',a=>{farms={};for(const d of a)farms[d._id]=d});
  on('mixes',a=>{mixes=a});
  const mergeS=()=>{const dr=[];for(const d of fdays){const m=new Map();for(const sl of d.slots||[])for(const x of sl.doses||[]){const n=Number(x.amt);if(x.id&&n>0)m.set(x.id,(m.get(x.id)||0)+n)}
    if(m.size)dr.push({_id:'ferti_'+d._id,kind:'drip',status:'done',date:d.date,doneDate:d.date,farm:d.farm,farmName:fname(d.farm),createdAt:d.updatedAt||d.date,items:[...m].map(([id,amt])=>{const q=byId(id);return {id,name:q?q.name:id,amt,unit:q?U(q):'ml',phi:0}})})}
    sprays=[...sprayDocs.filter(isSpray),...dr]};
  on('sprays',a=>{sprayDocs=a;mergeS()});
  on('ferti',a=>{fdays=a;mergeS()});
  on('purchases',a=>{purchases=a});
  on('counts',a=>{counts=a});
})();
})();
</script>
