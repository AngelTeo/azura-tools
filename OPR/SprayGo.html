<body><div id="root"><div class="top"><div class="in"><div class="logo">🧴</div><div class="brand">SprayGo<small>AZURA DELTA · v15</small></div><div class="who" id="who"></div></div></div>

<script>/* StoreGo v16 engine: stock / usage / days-left / purchase plan. Pure functions over S (loaded docs). */
const FARMS=['AD1','AD2','AD3'];const MIXES=['A','B','C'];
const D=s=>new Date(s+'T00:00:00Z');const ymd=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((D(b)-D(a))/86400000);
const todayStr=()=>{if(globalThis.__TODAY)return globalThis.__TODAY;const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const mult=u=>({L:1000,l:1000,kg:1000,KG:1000,ml:1,g:1})[u]||null;
function packBase(p){if(!p)return null;const s=Number(p.packSize),m=mult(p.packUnit);return s>0&&m?s*m:null}
function unitOf(p){return p&&p.unit==='g'?'g':'ml'}
function packLabel(p){if(!p||!(Number(p.packSize)>0))return '包装待补';return `${p.packSize} ${p.packUnit||''}`.trim()}
function packWord(p){return p&&p.packWord||(unitOf(p)==='g'?'包':'瓶')}
/* refill source: product.home='AD2' (big container); other farms keep small containers product.sub={size,unit,word} filled from home */
function homeOf(S,pid){const p=S.products.find(x=>x.id===pid);return p&&p.home&&FARMS.includes(p.home)?p.home:null}
function subBase(p){if(!p||!p.sub)return null;const s=Number(p.sub.size),m=mult(p.sub.unit);return s>0&&m?s*m:null}
function packAt(p,f){return p&&p.home&&f&&f!==p.home&&subBase(p)?subBase(p):packBase(p)}
function packWordAt(p,f){return p&&p.home&&f&&f!==p.home&&p.sub?(p.sub.word||'小桶'):packWord(p)}

/* plan for farm on a date: farmplan hist sorted by from; returns {ver, mix} or null */
/* spray / skip records per farm-day (latest wins) */
function recIdx(S){const k=S.ledger.length+':'+(S.ledger.at(-1)?.id||'');if(S._ri&&S._ri.k===k)return S._ri.m;const m={};
  for(const x of S.ledger)if((x.t==='spray'||x.t==='skip')&&!x.void){const key=x.farm+'|'+x.date;if(!m[key]||(x.at||'')>(m[key].at||''))m[key]=x}S._ri={k,m};return m}
function recOn(S,f,day){return recIdx(S)[f+'|'+day]||null}
function skipsBetween(S,f,from,day){let n=0;const m=recIdx(S);for(const key in m){const x=m[key];if(x.t==='skip'&&!x.makeup&&x.farm===f&&x.date>=from&&x.date<day)n++}return n}
function planOn(S,f,day){const fp=S.farmplan.find(x=>x.id===f);if(!fp||!Array.isArray(fp.hist))return null;
  const h=fp.hist.filter(x=>x.from<=day).sort((a,b)=>a.from<b.from?-1:1).at(-1);if(!h)return null;
  const ms=mixSetOf(S,f,h.from,day);const base=ms?ms.date:h.from,m0=ms?ms.mix:h.mix0;
  const n=diffDays(base,day)-skipsBetween(S,f,base,day);const i=(MIXES.indexOf(m0)+((n%3)+3)%3)%3;return {ver:h.ver,mix:MIXES[i],from:h.from,set:!!ms&&ms.date===day,auto:ms&&ms.date===day?ms.auto:null}}
/* manual Mix change (ledger t:'mixset'): latest per farm-day wins; rotation continues from it */
function mixSetOf(S,f,from,day){let best=null;for(const x of S.ledger){if(x.t!=='mixset'||x.void||x.farm!==f||x.date<from||x.date>day||!MIXES.includes(x.mix))continue;if(!best||x.date>best.date||(x.date===best.date&&(x.at||'')>(best.at||'')))best=x}return best}
/* what to actually put in each tank today, given stock before spraying (st) */
function resolveDay(S,f,day,st,opts={}){const pl=planOn(S,f,day);if(!pl)return null;const r=recipeOf(S,pl.ver);const t=opts.tanks??tanksOf(S,f);const lines=[];
  for(const it of (r&&r.mixes[pl.mix])||[]){const P0=S.products.find(x=>x.id===it.pid);const tracked=P0&&P0.track!=='No'&&packBase(P0);
    if(it.cond&&!(opts.extras||[]).includes(it.pid)){lines.push({slot:it.pid,use:it.pid,dose:Number(it.dose),cond:it.cond,off:true});continue}
    const chain=[{pid:it.pid,dose:Number(it.dose)},...(it.alts||[]).map(a=>({pid:a.pid,dose:Number(a.dose)||Number(it.dose)}))];
    let pick=null,nocount=false;if(!tracked)pick=chain[0];else{for(const c of chain){const need=c.dose*t;if((st[c.pid]||0)>=need-1e-6){pick=c;break}}
      if(!pick)pick=chain.find(c=>(st[c.pid]||0)>0)||null;
      if(!pick&&st[chain[0].pid]===undefined){pick=chain[0];nocount=true}}
    lines.push({slot:it.pid,use:pick?pick.pid:it.pid,dose:pick?pick.dose:Number(it.dose),cond:it.cond||'',sub:!!pick&&pick.pid!==it.pid,none:!pick,nocount,left:pick?st[pick.pid]:st[it.pid],partial:!!pick&&!nocount&&tracked&&(st[pick.pid]||0)<pick.dose*t-1e-6,untracked:!tracked})}
  return {...pl,tanks:t,lines}}
function recipeOf(S,ver){return S.recipe.find(r=>r.id===ver)||null}
function itemsOn(S,f,day){const p=planOn(S,f,day);if(!p)return [];const r=recipeOf(S,p.ver);return (r&&r.mixes&&r.mixes[p.mix]||[])}
function tanksOf(S,f){const c=cfg(S);return Number(c.tanks&&c.tanks[f])||0}
function cfg(S){return S.cfg.find(x=>x.id==='main')||{tanks:{},safety:7,cycle:14,start:'2026-11-21'}}

/* all pids a farm's current+future recipe could touch (primary + alts) */
function pidsUsed(S,f,ver){const r=recipeOf(S,ver);const set=new Set();if(!r)return set;
  for(const m of MIXES)for(const it of (r.mixes[m]||[])){set.add(it.pid);for(const a of it.alts||[])set.add(a.pid)}return set}

/* one farm-day of spraying: mutates st (pid->base qty|undefined). returns shortages [{pid,amt(base of primary),slot}] */
function sprayDay(S,f,day,st){const rec=recOn(S,f,day);
  if(rec&&rec.t==='skip'&&!rec.makeup)return {short:[],used:{},skip:true};
  if(rec&&rec.t==='spray'){const used={};for(const it of rec.items||[]){const q=Number(it.qty);if(!(q>0))continue;if(st[it.pid]!=null||q){st[it.pid]=(st[it.pid]||0)-q;used[it.pid]=(used[it.pid]||0)+q}}return {short:[],used,rec:true}}
  const items=itemsOn(S,f,day);const t=tanksOf(S,f);const short=[];const used={};
  for(const it of items){if(it.cond)continue;const P0=S.products.find(x=>x.id===it.pid);if(!P0||P0.track==='No'||!packBase(P0))continue;const dose=Number(it.dose)||0;if(!dose||!t)continue;let need=dose*t;
    const chain=[{pid:it.pid,dose},...(it.alts||[]).map(a=>({pid:a.pid,dose:Number(a.dose)||dose}))];
    for(const c of chain){if(need<=1e-9)break;const have=st[c.pid];if(!(have>0))continue;const want=need*c.dose/dose;const take=Math.min(have,want);st[c.pid]=have-take;used[c.pid]=(used[c.pid]||0)+take;need-=take*dose/c.dose}
    if(need>1e-6)short.push({pid:it.pid,amt:need,slot:it.pid})}
  return {short,used}}


/* ---- drip additives (DripGo): cfg doc 'drip' = {start, items:{pid:{AD1,AD2,AD3}}, week:{0..6:[[slot1 pids],[slot2 pids]]}, slots:[..]}; ledger 'dripskip' {farm,date,pid} = not dripped */
function dripCfg(S){return S.cfg.find(x=>x.id==='drip')||null}
function dripOn(S,f,day){const c=dripCfg(S);if(!c||day<(c.start||'9999'))return [];const wd=new Date(day+'T00:00:00Z').getUTCDay();const slots=(c.week&&c.week[wd])||[];const out=[];
  slots.forEach((L,si)=>{for(const pid of L||[]){const q=Number(c.items?.[pid]?.[f]);if(q>0)out.push({slot:si,pid,qty:q})}});return out}
function dripSkipped(S,f,day,pid){return S.ledger.some(x=>x.t==='dripskip'&&!x.void&&x.farm===f&&x.date===day&&x.pid===pid)}
function dripDay(S,f,day,st){const used={},short=[];for(const it of dripOn(S,f,day)){if(dripSkipped(S,f,day,it.pid))continue;const p=S.products.find(x=>x.id===it.pid);if(!p||p.track==='No'||!packBase(p))continue;
    const have=st[it.pid];if(!(have>0)){short.push({pid:it.pid,amt:it.qty,slot:it.pid});continue}const take=Math.min(have,it.qty);st[it.pid]=have-take;used[it.pid]=take;if(it.qty-take>1e-6)short.push({pid:it.pid,amt:it.qty-take,slot:it.pid})}
  return {used,short}}
/* spray + drip for one farm-day */
function dayUse(S,f,day,st){const a=sprayDay(S,f,day,st);const b=dripDay(S,f,day,st);const used={...(a.used||{})};for(const k in b.used)used[k]=(used[k]||0)+b.used[k];return {...a,used,short:[...(a.short||[]),...b.short]}}
/* ledger entries (from cfg.start) sorted */
function ledger(S){const st=cfg(S).start||'2026-11-21';return S.ledger.filter(x=>x.date>=st).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.at||'')<(b.at||'')?-1:1)}

/* stock of every farm at END of `upto` day. Order per day: spraying first, then that day's records (counts = end-of-day). */
function stockAt(S,upto,opts={}){const c=cfg(S);const start=c.start||'2026-11-21';const L=ledger(S).filter(x=>x.date<=upto);
  const st={AD1:{},AD2:{},AD3:{}};const counted={AD1:{},AD2:{},AD3:{}};let li=0;
  for(let d=start;d<=upto;d=addDays(d,1)){
    const doSpray=()=>{for(const f of FARMS){if(d===start&&!recOn(S,f,d))continue;if(d===upto&&opts.last){if(opts.last==='none')continue;if(opts.last==='recorded'&&!recOn(S,f,d))continue}if(d===start)sprayDay(S,f,d,st[f]);else dayUse(S,f,d,st[f])}};
    /* start day: counts were taken before spraying, so records first, then that day's recorded spray */
    if(d>start)doSpray();
    while(li<L.length&&L[li].date===d){const x=L[li++];let qv=x.qty;if(qv==null&&x.packs!=null){const pb=packAt(S.products.find(p=>p.id===x.pid),x.farm);if(pb)qv=Number(x.packs)*pb}if(qv==null)continue;const q=Number(qv);if(!Number.isFinite(q))continue;
      if(x.t==='count'){st[x.farm][x.pid]=q;counted[x.farm][x.pid]=x.date}
      else if(x.t==='dist'){st[x.farm][x.pid]=(st[x.farm][x.pid]||0)+q}
      else if(x.t==='move'){st[x.from][x.pid]=(st[x.from][x.pid]||0)-q;st[x.to][x.pid]=(st[x.to][x.pid]||0)+q}}
    if(d===start)doSpray()}
  return {st,counted}}

/* pool (received, not yet distributed) per pid */
function pool(S){const p={};for(const x of ledger(S)){if(x.t==='recv')p[x.pid]=(p[x.pid]||0)+Number(x.qty||0);if(x.t==='dist')p[x.pid]=(p[x.pid]||0)-Number(x.qty||0)}
  for(const k in p)if(Math.abs(p[k])<1e-6)delete p[k];return p}

/* forward projection from today: per farm, per pid, days until runs out; per slot, first short day */
function project(S,days=60){const t=todayStr();const {st}=stockAt(S,t,{last:'recorded'});const out={};
  for(const f of FARMS){const s={...st[f]};const runOut={};const slotShort={};
    for(let i=0;i<=days;i++){const d=addDays(t,i);if(i===0&&recOn(S,f,d))continue;const before={...s};const r=dayUse(S,f,d,s);
      for(const k in r.used)if(!(s[k]>1e-9)&&before[k]>1e-9&&runOut[k]==null)runOut[k]=i;
      for(const sh of r.short)if(slotShort[sh.pid]==null)slotShort[sh.pid]=i}
    out[f]={stock:st[f],runOut,slotShort}}
  return out}

function supplierOf(S,p){const id=p&&Array.isArray(p.shops)?p.shops[0]:null;return S.suppliers.find(s=>s.id===id)||null}
function leadOf(S,p){const s=supplierOf(S,p);const n=Number(s&&s.leadDays);return Number.isFinite(n)&&n>0?n:3}

/* purchase plan: H = cycle + safety days. returns {moves, buys:[{pid,packs,alloc,shortBase}], perFarm} */
/* ordered-not-received POs, in base units of the slot they were bought for (it.for = original pid when a substitute was ordered) */
function onOrder(S){const o={};const ratio=(orig,alt)=>{for(const r of S.recipe||[])for(const m of MIXES)for(const it of (r.mixes&&r.mixes[m])||[]){const ch=[{pid:it.pid,dose:Number(it.dose)},...(it.alts||[]).map(a=>({pid:a.pid,dose:Number(a.dose)||Number(it.dose)}))];const a=ch.find(c=>c.pid===orig),b=ch.find(c=>c.pid===alt);if(a&&b&&a.dose&&b.dose)return b.dose/a.dose}return 1};
  for(const po of S.po||[]){if(po.status!=='ordered')continue;for(const it of po.items||[]){if(it.cancelled)continue;const p=S.products.find(x=>x.id===it.pid);const pb=packBase(p);if(!pb||!(Number(it.packs)>0))continue;const k=it.for||it.pid;const q=Number(it.packs)*pb/(it.for?ratio(it.for,it.pid):1);o[k]=(o[k]||0)+q}}
  return o}
function buyPlan(S){const c=cfg(S);const H=(Number(c.cycle)||14)+(Number(c.safety)||7);const t=todayStr();const {st}=stockAt(S,t,{last:'recorded'});
  const P=pool(S);const res={};const end={};
  for(const f of FARMS){const s={...st[f]};const sh={};for(let i=0;i<H;i++){const d0=addDays(t,i);if(i===0&&recOn(S,f,d0))continue;const r=dayUse(S,f,d0,s);for(const x of r.short)sh[x.pid]=(sh[x.pid]||0)+x.amt}res[f]=sh;end[f]=s}

function doseHint(pid){const p0=P(pid);if(p0&&Number(p0.dose)>0)return Number(p0.dose);for(const r of S.recipe)for(const m of MIXES)for(const it of r.mixes[m]||[]){if(it.pid===pid)return Number(it.dose);for(const a of it.alts||[])if(a.pid===pid)return Number(a.dose)}return null}

  let list='';if(st.prob){const kw=PROBS.flatMap(x=>x[1]).find(x=>x[0]===st.prob)[1];const stock=before(d)[f]||{};const r=plan(f,d);
    const todayG=new Map();for(const l of r.lines.filter(l=>!l.off&&!l.none)){const g=grpOf(P(l.use));if(g)for(const x of g.split('+'))todayG.set(x,P(l.use)?.name)}
    const inMix=new Set(r.lines.filter(l=>!l.off).map(l=>l.use));const C=S.products.filter(p=>p.active!==false&&!has(p.id)&&!inMix.has(p.id)&&kw.some(k=>String(p.target||'').includes(k))&&!String(p.target||'').includes('不放进喷药桶')).map(p=>{const pb=packBase(p);const v=stock[p.id];const ok=!pb||v>0;const g=grpOf(p);const clash=g?g.split('+').map(x=>todayG.get(x)).filter(Boolean):[];return {p,ok,v,g,clash,dose:doseHint(p.id)}})
      .sort((a,b)=>(b.ok-a.ok)||(a.clash.length-b.clash.length)||a.p.name.localeCompare(b.p.name));

  return `<label class="l">遇到什么情况？</label>${chips}${list}`}

  sheet(`<div class="row wrapf" style="gap:6px"><span class="badge ${pc}">${pl}</span><span class="badge grey">${h(x.ty)}</span>${x.status?`<span class="badge amber">${h(x.status)} · 不能当确诊教材</span>`:''}</div><h2 style="margin:6px 0">${h(x.t)}</h2>
  <div style="display:flex;gap:4px;border-radius:10px;overflow:hidden;background:#eef2ee;min-height:90px">${dxImgs(x)}</div><p class="tiny">示意图＝AI 生成的教学图，帮你认样子，不是园里实拍。点图可以放大。</p>
  ${x.cases.length?`<label class="l">园里实拍（初判）</label><div class="row wrapf" style="gap:6px">${x.cases.map(n=>`<button class="btn sm" data-dx="case" data-n="${n}">案例 ${n}</button>`).join('')}</div>`:''}
  ${dxReading(x)}<label class="l">先看哪里</label><div>${h(x.look)}</div><label class="l">关键特征</label><div>${h(x.key)}</div><label class="l">第一眼判断</label><div>${h(x.judge)}</div><label class="l">怎么确认</label><div>${h(x.confirm)}</div>
  <label class="l" style="font-size:16px;color:var(--green)">怎么做</label>
  <div class="dxdo" style="margin:4px 0"><b>A · 立即措施</b>${h(x.a)}</div><div class="dxdo" style="margin:4px 0;background:#365f91"><b>B · 进一步确认</b>${h(x.b)}</div>
  <div style="margin-top:4px"><b style="font-size:13px">C · 用药参考</b>${dxDrugs(x)}</div>
  <div class="row" style="margin-top:12px"><button class="btn p grow neededit" data-dx="rec" data-id="${x.id}">记录发现（带入这个问题）</button><button class="btn" data-act="close">关</button></div>`)}
async function sheetCase(n){const c=CASES.find(v=>v.n===n);const x=DXP(c.to);
  sheet(`<div class="row wrapf" style="gap:6px"><span class="badge" style="background:#7c2d12;color:#fff">真实巡园图 ${n}</span><span class="badge amber">初判，未确诊</span></div><h2 style="margin:6px 0">${h(c.t)}</h2>
  <div id="cimg" style="background:#111;border-radius:10px;min-height:240px;display:flex;align-items:center;justify-content:center;color:#fff">读取原图…</div><p class="tiny">原图完整保留（绿圈是工人画的）。点图片放大。</p>
  <label class="l">第一眼判断（初判）</label><div>${h(c.g)}</div><label class="l">判断依据</label><div>${h(c.why)}</div><label class="l">可能混淆的问题</label><div>${h(c.mix)}</div><label class="l">还要补查</label><div>${h(c.need)}</div>
  <label class="l">对应教学卡</label><button class="btn s" data-dx="open" data-id="${c.to}">${h(x?.t||c.to)} →</button>
  <div class="row" style="margin-top:12px"><button class="btn p grow neededit" data-dx="rec" data-id="${c.to}">园里也看到这个 → 记录发现</button><button class="btn" data-act="close">关</button></div>`);
  try{const src=await dxFull(n);const box=$('#cimg');if(box)box.innerHTML=src?`<img src="${src}" style="width:100%;border-radius:10px;cursor:zoom-in" data-dxzoom="${src}" data-cap="真实巡园图 ${n} · ${h(c.t)}">`:'没有原图'}catch(e){const box=$('#cimg');if(box)box.textContent='⚠ 读不到原图：'+(e.message||e)}}
function dxZoom(src,cap){let z=document.getElementById('dxz');if(!z){z=document.createElement('div');z.id='dxz';z.className='dxz';document.body.appendChild(z)}
  z.innerHTML=`<div class="zi"><img src="${src}" alt=""></div><div class="zb"><span>${cap||''}</span><span><button class="btn sm" data-dx="zbig">放大 / 缩小</button> <button class="btn sm p" data-dx="zclose">关</button></span></div>`;z.hidden=false;z.classList.remove('big')}
/* 一次性：把 21 张巡园原图存进资料库（sg16_dximg，原图不压缩；另存一张小图） */
async function dxImport(files){const st=$('#dximpst');let ok=0,bad=[];const L=[...files].map(f=>({f,n:Number((f.name.match(/(\d+)/)||[])[1])})).filter(x=>x.n>=1&&x.n<=21);if(!L.length){toast('⚠ 档名要有编号，例如 case_01.jpg');return}
  const rd=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(f)});
  for(const {f,n} of L){try{st.textContent=`上传中 ${ok+1}/${L.length}…`;let full=await rd(f);if(f.size>1500000){const b=await shrinkImg(f);full=await rd(b)}
      const img=await new Promise((y,no)=>{const i=new Image();i.onload=()=>y(i);i.onerror=()=>no(new Error('打不开'));i.src=full});const k=Math.min(1,480/img.height,360/img.width);const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const th=c.toDataURL('image/jpeg',.72);
      const id='case_'+String(n).padStart(2,'0');const rows=[{col:PRE+'dximg',id,doc:{src:full,name:f.name,by:ME.name,at:nowIso()}},{col:PRE+'dximg',id:id+'_t',doc:{src:th}}];
      if(MOCK){MOCK.dximg=MOCK.dximg||{};MOCK.dximg['f'+n]=full;MOCK.dximg['t'+n]=th}else{const {error}=await sb.from(T).upsert(rows,{onConflict:'col,id'});if(error)throw error}ok++}
    catch(e){bad.push(n+'：'+(e.message||e))}}
  DXC=null;for(const k in DXF)delete DXF[k];toast(bad.length?`⚠ 存了 ${ok} 张，${bad.length} 张失败`:`已存 ${ok} 张巡园原图`);if(bad.length)alert('没存到：\n'+bad.join('\n'));render()}
document.addEventListener('change',e=>{if(e.target.id==='dximp'&&e.target.files.length)dxImport(e.target.files)});
/* ---- 发现记录 ---- */
function nowLocal(){const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,16)}
function sheetRec(issue){sheetRec.st={farm:farmSel||'AD1',sev:'轻',status:'待确认'};const seg=(k,L)=>`<div class="seg" data-rseg="${k}">${L.map(v=>`<button class="${sheetRec.st[k]===v?'on':''}" data-rv="${h(v)}">${h(v)}</button>`).join('')}</div>`;
  sheet(`<h2>记录发现</h2><p class="tiny">只填看得到的。看不准就选「待确认」。</p>
  <label class="l">哪个园</label>${seg('farm',FARMS)}
  <label class="l">位置（区、行、哪一边）</label><input class="in" id="rloc" placeholder="例如：B 区第 3 行近水管" style="width:100%">
  <label class="l">拍摄时间</label><input class="in" type="datetime-local" id="rshot" value="${nowLocal()}" style="width:100%">
  <label class="l">现场照片（可多张，从 WhatsApp 存下来的也可以）</label><input type="file" id="rph" accept="image/*" multiple>
  <label class="l">疑似问题</label><select id="riss" style="width:100%"><option value="">— 还不知道 —</option>${DX_TYPES.map(([t])=>`<optgroup label="${t}">${DX.filter(x=>x.ty===t).map(x=>`<option value="${x.id}"${x.id===issue?' selected':''}>${h(x.t)}</option>`).join('')}</optgroup>`).join('')}</select>
  <label class="l">判断</label>${seg('status',['待确认','已确认'])}
  <label class="l">严重程度</label>${seg('sev',['轻','中','重'])}
  <label class="l">受害范围（可不填）</label><div class="row" style="gap:6px"><span class="tiny">看了</span><input class="num" id="rn" inputmode="numeric" placeholder="10" style="width:70px"><span class="tiny">株，有</span><input class="num" id="rk" inputmode="numeric" style="width:70px"><span class="tiny">株有问题</span></div>
  <label class="l">备注（可不填）</label><input class="in" id="rnote" style="width:100%">
  <div class="row" style="margin-top:12px"><button class="btn p grow" data-dx="rsave">存</button><button class="btn" data-act="close">取消</button></div>`)}
async function shrinkImg(file){const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('这张照片打不开'));i.src=URL.createObjectURL(file)});const k=Math.min(1,1600/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82))}
async function recSave(btn){const st=sheetRec.st;const files=[...($('#rph').files||[])];const id=uid('F');const photos=[];btn.disabled=true;btn.textContent='存照片中…';
  try{for(let i=0;i<files.length;i++){const blob=await shrinkImg(files[i]);const path=`finding/${id}/${i+1}.jpg`;if(!MOCK){const {error}=await sb.storage.from('storego-receipts').upload(path,blob,{contentType:'image/jpeg'});if(error)throw new Error('照片没存到：'+error.message)}photos.push(path)}
    const n=Number($('#rn').value)||null,k=Number($('#rk').value)||null;const iss=$('#riss').value;
    await put('finding',{id,farm:st.farm,loc:$('#rloc').value.trim(),shotAt:$('#rshot').value,photos,issue:iss||null,status:st.status,sev:st.sev,hit:n&&k!=null?`${k}/${n} 株`:(k?`${k} 株`:''),note:$('#rnote').value.trim(),by:ME.name,at:nowIso()});
     if(!MOCK){const check=await sb.from(T).select('id').eq('col',PRE+'finding').eq('id',id).maybeSingle();if(check.error||!check.data)throw new Error('记录已尝试写入，但云端复查失败；请检查权限与网络，勿当作保存成功');}
    closeSheet();toast('已存：'+st.farm+' 发现记录');sub.dx='log';tab='dict';render()}
  catch(e){btn.disabled=false;btn.textContent='存';toast('⚠ 没存到：'+(e.message||e))}}
async function fPhoto(id){const x=S.finding.find(v=>v.id===id);if(!x)return;if(MOCK){toast('（测试模式没有照片）');return}
  const urls=[];for(const p of x.photos||[]){const {data,error}=await sb.storage.from('storego-receipts').createSignedUrl(p,600);if(error){toast('⚠ 读不到照片：'+error.message);return}urls.push(data.signedUrl)}
  sheet(`<h2>${h(x.farm)} · ${h(x.loc||'')}</h2>${urls.map(u=>`<img src="${u}" style="width:100%;border-radius:10px;margin:4px 0;cursor:zoom-in" data-dxzoom="${u}" data-cap="现场照片">`).join('')}<div class="row" style="margin-top:8px"><button class="btn" data-act="close">关</button></div>`)}
document.addEventListener('input',e=>{if(e.target.id==='dxq'){sub.dxq=e.target.value;clearTimeout(vDx.t);vDx.t=setTimeout(()=>{const pos=e.target.selectionStart;render();const q=$('#dxq');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}},350)}});
document.addEventListener('click',async e=>{const zm=e.target.closest('[data-dxzoom]');if(zm){dxZoom(zm.dataset.dxzoom,zm.dataset.cap);return}
  const rs=e.target.closest('[data-rv]');if(rs){const k=rs.parentNode.dataset.rseg;sheetRec.st[k]=rs.dataset.rv;rs.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===rs));return}
  const a=e.target.closest('[data-dx]');if(!a)return;const act=a.dataset.dx;
  try{switch(act){case 'open':sheetDx(a.dataset.id);break;case 'case':await sheetCase(Number(a.dataset.n));break;case 'rec':sheetRec(a.dataset.id||'');break;case 'rsave':await recSave(a);break;
    case 'zbig':document.getElementById('dxz').classList.toggle('big');break;case 'zclose':{const z=document.getElementById('dxz');z.hidden=true;z.innerHTML='';break}
    case 'fphoto':await fPhoto(a.dataset.id);break;
    case 'fconf':case 'funconf':{const x=S.finding.find(v=>v.id===a.dataset.id);await put('finding',{...x,status:act==='fconf'?'已确认':'待确认',confBy:ME.name,confAt:nowIso()});toast('已改');render();break}
    case 'fdel':{const x=S.finding.find(v=>v.id===a.dataset.id);if(!confirm('撤回这条发现记录？'))return;await put('finding',{...x,void:true,voidBy:ME.name,voidAt:nowIso()});toast('已撤回');render();break}}}
  catch(x){console.error(x);toast('⚠ '+(x.message||x))}});

boot();
})();
</script></body></html>
