<body><div id="root"><div class="top"><div class="in"><div class="logo">🧴</div><div class="brand">SprayGo<small>AZURA DELTA · v13</small></div><div class="who" id="who"></div></div></div>

<script>/* StoreGo v16 engine: stock / usage / days-left / purchase plan. Pure functions over S (loaded docs). */
const FARMS=['AD1','AD2','AD3'];const MIXES=['A','B','C'];
const D=s=>new Date(s+'T00:00:00Z');const ymd=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((D(b)-D(a))/86400000);
const todayStr=()=>{if(globalThis.__TODAY)return globalThis.__TODAY;const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const mult=u=>({L:1000,l:1000,kg:1000,KG:1000,ml:1,g:1})[u]||null;
function packBase(p){if(!p)return null;const s=Number(p.packSize),m=mult(p.packUnit);return s>0&&m?s*m:null}
function unitOf(p){return p&&p.unit==='g'?'g':'ml'}
function packLabel(p){if(!p||!(Number(p.packSize)>0))return '包装待补';return `${p.packSize} ${p.packUnit||''}`.trim()}
function packWord(p){return p&&p.packWord||(unitOf(p)==='g'?'包':'瓶')}
/* refill source: product.home='AD2' (big container); other farms keep small containers product.sub={size,unit,word} filled from home */
function homeOf(S,pid){const p=S.products.find(x=>x.id===pid);return p&&p.home&&FARMS.includes(p.home)?p.home:null}
function subBase(p){if(!p||!p.sub)return null;const s=Number(p.sub.size),m=mult(p.sub.unit);return s>0&&m?s*m:null}
function packAt(p,f){return p&&p.home&&f&&f!==p.home&&subBase(p)?subBase(p):packBase(p)}
function packWordAt(p,f){return p&&p.home&&f&&f!==p.home&&p.sub?(p.sub.word||'小桶'):packWord(p)}

/* plan for farm on a date: farmplan hist sorted by from; returns {ver, mix} or null */
/* spray / skip records per farm-day (latest wins) */
function recIdx(S){const k=S.ledger.length+':'+(S.ledger.at(-1)?.id||'');if(S._ri&&S._ri.k===k)return S._ri.m;const m={};
  for(const x of S.ledger)if((x.t==='spray'||x.t==='skip')&&!x.void){const key=x.farm+'|'+x.date;if(!m[key]||(x.at||'')>(m[key].at||''))m[key]=x}S._ri={k,m};return m}
function recOn(S,f,day){return recIdx(S)[f+'|'+day]||null}
function skipsBetween(S,f,from,day){let n=0;const m=recIdx(S);for(const key in m){const x=m[key];if(x.t==='skip'&&x.farm===f&&x.date>=from&&x.date<day)n++}return n}
function planOn(S,f,day){const fp=S.farmplan.find(x=>x.id===f);if(!fp||!Array.isArray(fp.hist))return null;
  const h=fp.hist.filter(x=>x.from<=day).sort((a,b)=>a.from<b.from?-1:1).at(-1);if(!h)return null;
  const ms=mixSetOf(S,f,h.from,day);const base=ms?ms.date:h.from,m0=ms?ms.mix:h.mix0;
  const n=diffDays(base,day)-skipsBetween(S,f,base,day);const i=(MIXES.indexOf(m0)+((n%3)+3)%3)%3;return {ver:h.ver,mix:MIXES[i],from:h.from,set:!!ms&&ms.date===day,auto:ms&&ms.date===day?ms.auto:null}}
/* manual Mix change (ledger t:'mixset'): latest per farm-day wins; rotation continues from it */
function mixSetOf(S,f,from,day){let best=null;for(const x of S.ledger){if(x.t!=='mixset'||x.void||x.farm!==f||x.date<from||x.date>day||!MIXES.includes(x.mix))continue;if(!best||x.date>best.date||(x.date===best.date&&(x.at||'')>(best.at||'')))best=x}return best}
/* what to actually put in each tank today, given stock before spraying (st) */
function resolveDay(S,f,day,st,opts={}){const pl=planOn(S,f,day);if(!pl)return null;const r=recipeOf(S,pl.ver);const t=opts.tanks??tanksOf(S,f);const lines=[];
  for(const it of (r&&r.mixes[pl.mix])||[]){const P0=S.products.find(x=>x.id===it.pid);const tracked=P0&&P0.track!=='No'&&packBase(P0);
    if(it.cond&&!(opts.extras||[]).includes(it.pid)){lines.push({slot:it.pid,use:it.pid,dose:Number(it.dose),cond:it.cond,off:true});continue}
    const chain=[{pid:it.pid,dose:Number(it.dose)},...(it.alts||[]).map(a=>({pid:a.pid,dose:Number(a.dose)||Number(it.dose)}))];
    let pick=null,nocount=false;if(!tracked)pick=chain[0];else{for(const c of chain){const need=c.dose*t;if((st[c.pid]||0)>=need-1e-6){pick=c;break}}
      if(!pick)pick=chain.find(c=>(st[c.pid]||0)>0)||null;
      if(!pick&&st[chain[0].pid]===undefined){pick=chain[0];nocount=true}}
    lines.push({slot:it.pid,use:pick?pick.pid:it.pid,dose:pick?pick.dose:Number(it.dose),cond:it.cond||'',sub:!!pick&&pick.pid!==it.pid,none:!pick,nocount,left:pick?st[pick.pid]:st[it.pid],partial:!!pick&&!nocount&&tracked&&(st[pick.pid]||0)<pick.dose*t-1e-6,untracked:!tracked})}
  return {...pl,tanks:t,lines}}
function recipeOf(S,ver){return S.recipe.find(r=>r.id===ver)||null}
function itemsOn(S,f,day){const p=planOn(S,f,day);if(!p)return [];const r=recipeOf(S,p.ver);return (r&&r.mixes&&r.mixes[p.mix]||[])}
function tanksOf(S,f){const c=cfg(S);return Number(c.tanks&&c.tanks[f])||0}
function cfg(S){return S.cfg.find(x=>x.id==='main')||{tanks:{},safety:7,cycle:14,start:'2026-11-21'}}

/* all pids a farm's current+future recipe could touch (primary + alts) */
function pidsUsed(S,f,ver){const r=recipeOf(S,ver);const set=new Set();if(!r)return set;
  for(const m of MIXES)for(const it of (r.mixes[m]||[])){set.add(it.pid);for(const a of it.alts||[])set.add(a.pid)}return set}

/* one farm-day of spraying: mutates st (pid->base qty|undefined). returns shortages [{pid,amt(base of primary),slot}] */
function sprayDay(S,f,day,st){const rec=recOn(S,f,day);
  if(rec&&rec.t==='skip')return {short:[],used:{},skip:true};
  if(rec&&rec.t==='spray'){const used={};for(const it of rec.items||[]){const q=Number(it.qty);if(!(q>0))continue;if(st[it.pid]!=null||q){st[it.pid]=(st[it.pid]||0)-q;used[it.pid]=(used[it.pid]||0)+q}}return {short:[],used,rec:true}}
  const items=itemsOn(S,f,day);const t=tanksOf(S,f);const short=[];const used={};
  for(const it of items){if(it.cond)continue;const P0=S.products.find(x=>x.id===it.pid);if(!P0||P0.track==='No'||!packBase(P0))continue;const dose=Number(it.dose)||0;if(!dose||!t)continue;let need=dose*t;
    const chain=[{pid:it.pid,dose},...(it.alts||[]).map(a=>({pid:a.pid,dose:Number(a.dose)||dose}))];
    for(const c of chain){if(need<=1e-9)break;const have=st[c.pid];if(!(have>0))continue;const want=need*c.dose/dose;const take=Math.min(have,want);st[c.pid]=have-take;used[c.pid]=(used[c.pid]||0)+take;need-=take*dose/c.dose}
    if(need>1e-6)short.push({pid:it.pid,amt:need,slot:it.pid})}
  return {short,used}}

/* ledger entries (from cfg.start) sorted */
function ledger(S){const st=cfg(S).start||'2026-11-21';return S.ledger.filter(x=>x.date>=st).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.at||'')<(b.at||'')?-1:1)}

/* stock of every farm at END of `upto` day. Order per day: spraying first, then that day's records (counts = end-of-day). */
function stockAt(S,upto,opts={}){const c=cfg(S);const start=c.start||'2026-11-21';const L=ledger(S).filter(x=>x.date<=upto);
  const st={AD1:{},AD2:{},AD3:{}};const counted={AD1:{},AD2:{},AD3:{}};let li=0;
  for(let d=start;d<=upto;d=addDays(d,1)){
    const doSpray=()=>{for(const f of FARMS){if(d===start&&!recOn(S,f,d))continue;if(d===upto&&opts.last){if(opts.last==='none')continue;if(opts.last==='recorded'&&!recOn(S,f,d))continue}sprayDay(S,f,d,st[f])}};
    /* start day: counts were taken before spraying, so records first, then that day's recorded spray */
    if(d>start)doSpray();
    while(li<L.length&&L[li].date===d){const x=L[li++];let qv=x.qty;if(qv==null&&x.packs!=null){const pb=packAt(S.products.find(p=>p.id===x.pid),x.farm);if(pb)qv=Number(x.packs)*pb}if(qv==null)continue;const q=Number(qv);if(!Number.isFinite(q))continue;
      if(x.t==='count'){st[x.farm][x.pid]=q;counted[x.farm][x.pid]=x.date}
      else if(x.t==='dist'){st[x.farm][x.pid]=(st[x.farm][x.pid]||0)+q}
      else if(x.t==='move'){st[x.from][x.pid]=(st[x.from][x.pid]||0)-q;st[x.to][x.pid]=(st[x.to][x.pid]||0)+q}}
    if(d===start)doSpray()}
  return {st,counted}}

/* pool (received, not yet distributed) per pid */
function pool(S){const p={};for(const x of ledger(S)){if(x.t==='recv')p[x.pid]=(p[x.pid]||0)+Number(x.qty||0);if(x.t==='dist')p[x.pid]=(p[x.pid]||0)-Number(x.qty||0)}
  for(const k in p)if(Math.abs(p[k])<1e-6)delete p[k];return p}

/* forward projection from today: per farm, per pid, days until runs out; per slot, first short day */
function project(S,days=60){const t=todayStr();const {st}=stockAt(S,t,{last:'recorded'});const out={};
  for(const f of FARMS){const s={...st[f]};const runOut={};const slotShort={};
    for(let i=0;i<=days;i++){const d=addDays(t,i);if(i===0&&recOn(S,f,d))continue;const before={...s};const r=sprayDay(S,f,d,s);
      for(const k in r.used)if(!(s[k]>1e-9)&&before[k]>1e-9&&runOut[k]==null)runOut[k]=i;
      for(const sh of r.short)if(slotShort[sh.pid]==null)slotShort[sh.pid]=i}
    out[f]={stock:st[f],runOut,slotShort}}
  return out}

function supplierOf(S,p){const id=p&&Array.isArray(p.shops)?p.shops[0]:null;return S.suppliers.find(s=>s.id===id)||null}
function leadOf(S,p){const s=supplierOf(S,p);const n=Number(s&&s.leadDays);return Number.isFinite(n)&&n>0?n:3}

/* purchase plan: H = cycle + safety days. returns {moves, buys:[{pid,packs,alloc,shortBase}], perFarm} */
function buyPlan(S){const c=cfg(S);const H=(Number(c.cycle)||14)+(Number(c.safety)||7);const t=todayStr();const {st}=stockAt(S,t,{last:'recorded'});
  const P=pool(S);const res={};const end={};
  for(const f of FARMS){const s={...st[f]};const sh={};for(let i=0;i<H;i++){const d0=addDays(t,i);if(i===0&&recOn(S,f,d0))continue;const r=sprayDay(S,f,d0,s);for(const x of r.short)sh[x.pid]=(sh[x.pid]||0)+x.amt}res[f]=sh;end[f]=s}
  /* moves: cover a farm's short from another farm's leftover (same pid or an alt of the slot) */
  const moves=[];const slotAlts={};for(const r of S.recipe)for(const m of MIXES)for(const it of (r.mixes&&r.mixes[m])||[])slotAlts[it.pid]=[{pid:it.pid,dose:Number(it.dose)},...(it.alts||[]).map(a=>({pid:a.pid,dose:Number(a.dose)}))];
  for(const f of FARMS)for(const pid in res[f]){let need=res[f][pid];const chain=slotAlts[pid]||[{pid,dose:1}];const pd=chain[0].dose||1;
    for(const g of FARMS){if(g===f||need<=1e-6)continue;for(const c of chain){const left=end[g][c.pid];const gUses=res[g][c.pid]>0;if(!(left>1e-6)||gUses)continue;
      const p=S.products.find(x=>x.id===c.pid);const pb=packAt(p,f);const want=need*(c.dose||pd)/pd;let give=Math.min(left,want);const loose=p&&p.unit==='g';if(pb&&!loose){give=Math.floor(give/pb+1e-9)*pb;if(give<=0&&left>=pb)give=pb}else if(pb){give=Math.round(give/50)*50}if(give<=0)continue;give=Math.min(give,left);
      end[g][c.pid]-=give;need-=give*pd/(c.dose||pd);moves.push({pid:c.pid,from:g,to:f,qty:give,forPid:pid})}}
    res[f][pid]=Math.max(0,need)}
  /* pool counts against shortage first */
  const buys=[];const pids=new Set();for(const f of FARMS)for(const k in res[f])if(res[f][k]>1e-6)pids.add(k);
  for(const pid of pids){const p=S.products.find(x=>x.id===pid);const pb=packBase(p);let tot=FARMS.reduce((a,f)=>a+(res[f][pid]||0),0);const fromPool=Math.min(tot,Math.max(0,P[pid]||0));tot-=fromPool;
    const packs=pb?Math.ceil(tot/pb-1e-9):null;const alloc={};
    if(packs){const base=FARMS.reduce((a,f)=>a+(res[f][pid]||0),0)||1;const q={};let sum=0;for(const f of FARMS){q[f]=packs*(res[f][pid]||0)/base;alloc[f]=Math.floor(q[f]);sum+=alloc[f]}
      FARMS.slice().sort((a,b)=>(q[b]-alloc[b])-(q[a]-alloc[a])).slice(0,packs-sum).forEach(f=>alloc[f]++)}
    const hm=homeOf(S,pid);if(hm&&packs){for(const f of FARMS)alloc[f]=0;alloc[hm]=packs}
    buys.push({pid,packs,alloc,shortBase:tot,fromPool,noPack:!pb})}

function doneCalc(){const s=sheetDone.st;const tanks=Number($('#dtk').value)||0;const extras=[...document.querySelectorAll('[data-extra]:checked')].map(x=>x.dataset.extra);
  const d=day();const st={...before(d)[s.f]};const free=extrasOf(s.f,d).filter(x=>!x.cond);const r=plan(s.f,d,{tanks,ex:[...free,...extras.map(pid=>({pid,cond:true}))]});
  const items=r.lines.filter(l=>!l.off&&!l.none).map(l=>{let q=l.dose*tanks;const p=P(l.use);if(l.partial&&!l.untracked)q=Math.max(0,st[l.use]||0);return {pid:l.use,for:l.slot,dose:l.dose,qty:Math.round(q*100)/100,untracked:!!l.untracked}});
  return {r,tanks,extras,items}}
function donePrev(){const {r,items}=doneCalc();$('#dprev').innerHTML=`<label class="l">会扣掉（照每桶用量 × 桶数）</label><table class="t">${items.map(it=>{const p=P(it.pid);return `<tr><td>${h(p?.name)}${it.for!==it.pid?` <span class="tiny">顶 ${h(P(it.for)?.name)}</span>`:''}</td><td class="n">${it.untracked?'<span class="tiny">不追踪</span>':fmt(it.qty)+' '+unit(p)}</td></tr>`}).join('')}</table>${r.lines.some(l=>l.none&&!l.off)?`<p class="tiny" style="color:var(--red)">没货的不扣：${r.lines.filter(l=>l.none&&!l.off).map(l=>h(P(l.slot)?.name)).join('、')}</p>`:''}`}
async function doneSave(f){const {r,tanks,extras,items}=doneCalc();if(!(tanks>0)){toast('⚠ 桶数不对');return}
  await put('ledger',{id:uid('L'),t:'spray',date:day(),at:nowIso(),by:ME.name,farm:f,ver:r.ver,mix:r.mix,tanks,extras,items:items.filter(x=>!x.untracked)});closeSheet();toast(`${f} 已记：喷好了 ${fmt(tanks)} 桶`);render()}
function sheetExtra(f){const d=day();const pl=planOn(S,f,d);const r=S.recipe.find(x=>x.id===pl?.ver);const ex=extrasOf(f,d);sheetExtra.st={f,ex:ex.map(x=>({...x}))};drawExtra()}

/* 遇到什么情况 → 能用什么药（照药品「杀什么」说明找） */
const PROBS=[['虫',[['蓟马',['蓟马']],['白粉虱',['白粉虱']],['蚜虫',['蚜虫']],['叶蝉',['叶蝉']],['红蜘蛛',['红蜘蛛']],['钻心虫 / 钻果虫',['钻心虫','钻果虫']],['毛虫',['毛虫']],['椿象',['椿象']],['甲虫',['甲虫']]]],
  ['病',[['叶斑',['叶斑']],['炭疽',['炭疽']],['疫病',['疫病']],['霜霉',['霜霉']],['白锈',['白锈']],['果身巧克力色水渍斑',['水渍斑']]]]];
const grpOf=p=>{const m=String(p?.target||'').match(/([0-9]+[A-Z]?(?:\+[0-9]+[A-Z]?)?)\s*组/);return m?m[1]:''};
function doseHint(pid){const p0=P(pid);if(p0&&Number(p0.dose)>0)return Number(p0.dose);for(const r of S.recipe)for(const m of MIXES)for(const it of r.mixes[m]||[]){if(it.pid===pid)return Number(it.dose);for(const a of it.alts||[])if(a.pid===pid)return Number(a.dose)}return null}
function probBlock(f,d,has){const st=sheetExtra.st;const chips=PROBS.map(([g,L])=>`<div class="tiny" style="margin-top:6px;font-weight:800">${g}</div><div class="row wrapf" style="gap:6px;margin-top:4px">${L.map(([n])=>`<button class="btn sm ${st.prob===n?'p':''}" data-act="ex-prob" data-v="${h(n)}">${h(n)}</button>`).join('')}</div>`).join('');
  let list='';if(st.prob){const kw=PROBS.flatMap(x=>x[1]).find(x=>x[0]===st.prob)[1];const stock=before(d)[f]||{};const r=plan(f,d);
    const todayG=new Map();for(const l of r.lines.filter(l=>!l.off&&!l.none)){const g=grpOf(P(l.use));if(g)for(const x of g.split('+'))todayG.set(x,P(l.use)?.name)}
    const inMix=new Set(r.lines.filter(l=>!l.off).map(l=>l.use));const C=S.products.filter(p=>p.active!==false&&!has(p.id)&&!inMix.has(p.id)&&kw.some(k=>String(p.target||'').includes(k))&&!String(p.target||'').includes('不放进喷药桶')).map(p=>{const pb=packBase(p);const v=stock[p.id];const ok=!pb||v>0;const g=grpOf(p);const clash=g?g.split('+').map(x=>todayG.get(x)).filter(Boolean):[];return {p,ok,v,g,clash,dose:doseHint(p.id)}})
      .sort((a,b)=>(b.ok-a.ok)||(a.clash.length-b.clash.length)||a.p.name.localeCompare(b.p.name));
    list=C.length?`<div class="list" style="margin-top:8px">${C.map(c=>`<div style="${c.ok?'':'opacity:.55'}">${pic(c.p)}<div class="grow"><b>${h(c.p.name)}</b><div class="tiny" style="color:#a63638">${h(c.p.target)}</div><div class="tiny">${c.ok?(packBase(c.p)?'这园'+leftTxt(c.p,{left:c.v}):'有'):'这园没货'}${c.dose?` · 每桶 ${fmt(c.dose)} ${unit(c.p)}`:' · 用量要自己填'}</div>${c.clash.length?`<div class="tiny" style="color:#926212;font-weight:700">今天的 Mix 已经有同组的 ${h([...new Set(c.clash)].join('、'))}，最好换别组</div>`:''}</div>${c.ok?(c.dose?`<button class="btn s sm" data-act="ex-add" data-id="${h(c.p.id)}" data-dose="${c.dose}" data-cond="0">加</button>`:`<button class="btn sm" data-act="ex-pick" data-id="${h(c.p.id)}">选</button>`):''}</div>`).join('')}</div>`:'<p class="tiny">药品里还没有写「杀这个」的药。到 StoreGo「设定 → 药品」补说明，或在下面自己选。</p>'}
  return `<label class="l">遇到什么情况？</label>${chips}${list}`}
function drawExtra(){const {f,ex}=sheetExtra.st;const d=day();const pl=planOn(S,f,d);const vers=[pl?.ver,...S.recipe.map(x=>x.id)];const seen=new Set();const cands=[];
  for(const v of vers){const r=S.recipe.find(x=>x.id===v);if(!r)continue;for(const m of MIXES)for(const it of r.mixes[m]||[])if(it.cond&&!seen.has(it.pid)){seen.add(it.pid);cands.push({pid:it.pid,dose:Number(it.dose),cond:v===pl?.ver&&(r.mixes[pl.mix]||[]).some(x=>x.pid===it.pid&&x.cond),note:it.cond})}}
  const has=pid=>ex.some(x=>x.pid===pid);
  sheet(`<h2>${f} 加病害药 · ${dd(d)}</h2><p class="tiny">只加今天这一园。加了会出现在喷药卡上，按「喷好了」时一起扣库存。</p>
  ${ex.length?`<label class="l">今天已加</label><div class="list">${ex.map((x,i)=>`<div>${pic(P(x.pid))}<div class="grow"><b>${h(P(x.pid)?.name)}</b><div class="tiny">每桶 ${fmt(x.dose)} ${unit(P(x.pid))}</div></div><button class="btn w sm" data-act="ex-del" data-i="${i}">拿掉</button></div>`).join('')}</div>`:''}
  ${cands.filter(c=>!has(c.pid)).length?`<label class="l">配方里写好的病害药</label><div class="list">${cands.filter(c=>!has(c.pid)).map(c=>`<div>${pic(P(c.pid))}<div class="grow"><b>${h(P(c.pid)?.name)}</b><div class="tiny">每桶 ${fmt(c.dose)} ${unit(P(c.pid))} · ${h(c.note)}</div>${P(c.pid)?.target?`<div class="tiny" style="color:#a63638">${h(P(c.pid).target)}</div>`:''}</div><button class="btn s sm" data-act="ex-add" data-id="${h(c.pid)}" data-dose="${c.dose}" data-cond="${c.cond?1:0}">加</button></div>`).join('')}</div>`:''}
  ${probBlock(f,d,has)}
  <label class="l">${sheetExtra.st.prob?'都不合适？自己选药':'或直接选药'}</label><select id="ex-p"><option value="">— 选药 —</option>${S.products.filter(p=>p.active!==false&&['杀虫剂','杀菌剂','生物制剂','营养 / 叶面肥'].includes(p.kind)&&!has(p.id)).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${h(p.id)}">${h(p.name)}（${h(p.kind.replace(' / 叶面肥',''))}）${p.target?' · '+h(p.target.split(/（|·/)[0].trim()):''}</option>`).join('')}</select>
  <div class="row" style="margin-top:6px"><input class="num" id="ex-d" inputmode="decimal" placeholder="每桶"><span class="tiny">ml 或 g</span><span class="grow"></span><button class="btn s sm" data-act="ex-add-other">加</button></div>
  <div class="row" style="margin-top:14px"><button class="btn p grow" data-act="ex-save">存</button><button class="btn" data-act="close">取消</button></div>`)}
async function exSave(){const {f,ex}=sheetExtra.st;await put('ledger',{id:uid('L'),t:'plan',date:day(),at:nowIso(),by:ME.name,farm:f,extras:ex});closeSheet();toast(ex.length?`${f} 今天加了：${ex.map(x=>P(x.pid)?.name).join('、')}`:`${f} 今天没有加病害药`);render()}
function sheetSkip(f){sheet(`<h2>${f} 没喷</h2><p class="tiny">记了之后，${f} 的配方顺延一天（今天的 Mix 明天喷），库存不扣。</p><label class="l">原因</label><div class="seg">${['下雨','叶子湿','缺药','其他'].map((x,i)=>`<button class="${i===0?'on':''}" data-reason="${x}">${x}</button>`).join('')}</div>
  <div class="row" style="margin-top:12px"><button class="btn p grow" data-act="skip-save" data-f="${f}">记下来</button><button class="btn" data-act="close">取消</button></div>`);sheetSkip.reason='下雨'}
function sheetMix(f){const d=day();const cur=plan(f,d);const auto=autoMix(f,d);
  sheet(`<h2>${f} · ${dd(d)} 换 Mix</h2><p class="tiny">原本排的是 Mix ${auto}。换了之后，接下去照这个往下排（例：今天 B → 明天 C → 后天 A）。</p>
  <div class="seg" style="margin:12px 0">${MIXES.map(m=>`<button class="${cur.mix===m?'on':''}" data-act="mix-set" data-f="${f}" data-mix="${m}">Mix ${m}</button>`).join('')}</div>
  ${cur.set?`<button class="btn w" data-act="mix-reset" data-f="${f}">取消，照原本排（Mix ${auto}）</button>`:''}<button class="btn w" data-act="close" style="margin-top:8px">关闭</button>`)}
function autoMix(f,d){const L=S.ledger.filter(x=>x.t==='mixset'&&x.farm===f&&x.date===d&&!x.void);L.forEach(x=>x.void=true);delete S._ri;const m=planOn(S,f,d)?.mix;L.forEach(x=>delete x.void);delete S._ri;return m}
async function mixSave(f,mix){const d=day();const auto=autoMix(f,d);for(const x of S.ledger.filter(x=>x.t==='mixset'&&x.farm===f&&x.date===d&&!x.void))await put('ledger',{...x,void:true,voidAt:nowIso(),voidBy:ME.name});
  if(mix&&mix!==auto)await put('ledger',{id:uid('L'),t:'mixset',date:d,at:nowIso(),by:ME.name,farm:f,mix,auto});
  closeSheet();toast(mix&&mix!==auto?`${f} ${dd(d)} 改成 Mix ${mix}，之后照这个往下排`:`${f} ${dd(d)} 照原本排 Mix ${auto}`);render()}
async function skipSave(f){await put('ledger',{id:uid('L'),t:'skip',date:day(),at:nowIso(),by:ME.name,farm:f,reason:sheetSkip.reason});closeSheet();toast(`${f} 已记：没喷，配方顺延`);render()}
async function undo(f){const rec=recOn(S,f,day());if(!rec||!confirm(`撤回 ${f} ${dd(day())} 的「${rec.t==='spray'?'喷好了':'没喷'}」？`))return;await put('ledger',{...rec,void:true,voidBy:ME.name,voidAt:nowIso()});toast('已撤回');render()}

   <button class="btn sm owneronly" style="margin-top:6px" data-act="rec-edit" data-v="${h(v)}" data-m="${m}" data-i="-1">＋ 加一样</button></div>`).join('')}

  <label class="l">从哪天开始</label><input class="txt" type="date" id="vs-from" value="${h(s.from)}"><label class="l">那天喷哪个 Mix</label><div class="seg">${MIXES.map(m=>`<button class="${m===s.mix0?'on':''}" data-vs="mix0" data-v="${m}">Mix ${m}</button>`).join('')}</div>
  ${left.length?`<div class="card amber"><b>旧版剩下、新版没用到的药</b><p class="tiny">每一样你决定：顶替新版的哪一项，还是放着不用（放着的只记库存，不算采购）。</p><div class="list">${left.map(pid=>`<div><div class="grow"><b>${h(P(pid)?.name)}</b><div class="tiny">${leftTxt(P(pid),{left:st[s.f][pid]})}</div></div><button class="btn sm" data-act="ver-sub" data-id="${h(pid)}">顶替…</button></div>`).join('')}</div></div>`:''}
  <div class="row" style="margin-top:12px"><button class="btn p grow" data-act="ver-save">换</button><button class="btn" data-act="close">取消</button></div>`)}
async function setAct(act,a){const id=a.dataset.id;
  switch(act){
    case 'tk-save':{if(!ME.edit){toast('⚠ 你没有修改权限');return true}const c={...cfg(S),id:'main'};c.tanks={...(c.tanks||{})};for(const f of FARMS)c.tanks[f]=Number($('#tk'+f).value)||0;
      await put('cfg',c);await audit(`桶数 ${FARMS.map(f=>f+' '+c.tanks[f]).join(' / ')}`,'cfg','main');toast('已存');render();return true}
    case 'rec-edit':sheetRecEdit(a.dataset.v,a.dataset.m,Number(a.dataset.i));return true;
    case 'rec-save':case 'rec-del':{if(!ME.owner){toast('⚠ 只有 Owner 能改配方');return true}const r=JSON.parse(JSON.stringify(S.recipe.find(x=>x.id===a.dataset.v)));const m=a.dataset.m,i=Number(a.dataset.i);let what;
      if(act==='rec-del'){what=`${r.name} Mix ${m} 拿掉 ${P(r.mixes[m][i].pid)?.name}`;r.mixes[m].splice(i,1)}else{const it={pid:$('#re-p').value,dose:Number($('#re-d').value)};if(!it.pid||!(it.dose>0)){toast('⚠ 选药、填用量');return true}
        const c=$('#re-c').value.trim();if(c)it.cond=c;const alts=[0,1].map(k=>({pid:$('#re-a'+k).value,dose:Number($('#re-ad'+k).value)})).filter(x=>x.pid&&x.dose>0);if(alts.length)it.alts=alts;
        if(i>=0)r.mixes[m][i]=it;else r.mixes[m].push(it);what=`${r.name} Mix ${m} ${i>=0?'改':'加'} ${P(it.pid)?.name} ${it.dose}`}
      await put('recipe',r);await audit(what,'recipe',r.id);closeSheet();toast('已存：'+what);render();return true}
    case 'rec-copy':{if(!ME.owner)return true;const src=S.recipe.find(x=>x.id===a.dataset.v);const n=Math.max(...S.recipe.map(x=>Number(String(x.id).replace(/\D/g,''))||0))+1;
      const r={...JSON.parse(JSON.stringify(src)),id:'v'+n,name:`第 ${n} 版`,note:`从 ${src.name} 复制`};await put('recipe',r);await audit(`新配方 ${r.name}（从 ${src.name} 复制）`,'recipe',r.id);sub.rv=r.id;render();return true}
    case 'ver-switch':sheetVer(a.dataset.f);return true;
    case 'ver-sub':{const s=sheetVer.st;const r=JSON.parse(JSON.stringify(S.recipe.find(x=>x.id===s.ver)));const slots=MIXES.flatMap(m=>(r.mixes[m]||[]).map((it,i)=>({m,i,it})));
      const pick=prompt(`${P(id)?.name} 顶替哪一项？输入号码：\n${slots.map((x,k)=>`${k+1}. Mix ${x.m} ${P(x.it.pid)?.name}`).join('\n')}`);const k=Number(pick)-1;if(!slots[k])return true;const dose=Number(prompt(`${P(id)?.name} 每桶用量（${unitOf(P(id))}）`,slots[k].it.dose));if(!(dose>0))return true;
      const it=r.mixes[slots[k].m][slots[k].i];it.alts=[...(it.alts||[]),{pid:id,dose}];await put('recipe',r);await audit(`${r.name} Mix ${slots[k].m} ${P(it.pid)?.name} 加顶替：${P(id)?.name} ${dose}`,'recipe',r.id);drawVer();return true}
    case 'ver-save':{if(!ME.owner){toast('⚠ 只有 Owner 能换版本');return true}const s=sheetVer.st;s.from=$('#vs-from').value;if(!s.ver||!s.from)return true;const fp=JSON.parse(JSON.stringify(S.farmplan.find(x=>x.id===s.f)||{id:s.f,hist:[]}));
      fp.hist=fp.hist.filter(x=>x.from<s.from);fp.hist.push({from:s.from,ver:s.ver,mix0:s.mix0});await put('farmplan',fp);await audit(`${s.f} ${dd(s.from)} 起换 ${S.recipe.find(r=>r.id===s.ver)?.name}（那天 Mix ${s.mix0}）`,'farmplan',s.f);closeSheet();toast('已换');render();return true}}
  return false}


/* ---------------- 病虫字典：遇到什么虫 / 病 → 用什么药 ---------------- */
function drugsFor(name){const kw=PROBS.flatMap(x=>x[1]).find(x=>x[0]===name)[1];return S.products.filter(p=>p.active!==false&&kw.some(k=>String(p.target||'').includes(k))&&!String(p.target||'').includes('不放进喷药桶'))}
function usedIn(pid){const out=[];for(const r of S.recipe)for(const m of MIXES)for(const it of r.mixes[m]||[]){if(it.pid===pid)out.push(`${r.name} Mix ${m}${it.cond?'（'+it.cond+'）':''}`);else if((it.alts||[]).some(a=>a.pid===pid))out.push(`${r.name} Mix ${m} 顶替`)}return out}
function vDict(){const sel=sub.prob||null;const stock=before(todayStr());
  const chips=PROBS.map(([g,L])=>`<div class="card"><h2>${g==='虫'?'🐛 虫':'🍂 病'}</h2><div class="row wrapf" style="gap:6px;margin-top:6px">${L.map(([n])=>{const c=drugsFor(n).length;return `<button class="btn sm ${sel===n?'p':''}" data-sub="prob" data-v="${h(n)}">${h(n)} <span class="tiny">${c}</span></button>`}).join('')}</div></div>`).join('');
  let body='';if(sel){const L=drugsFor(sel).map(p=>{const pb=packBase(p);const tot=FARMS.reduce((a,f)=>a+(stock[f][p.id]>0?stock[f][p.id]:0),0);return {p,pb,tot,g:grpOf(p),dose:doseHint(p.id),used:usedIn(p.id)}}).sort((a,b)=>((b.tot>0)-(a.tot>0))||a.g.localeCompare(b.g)||a.p.name.localeCompare(b.p.name));
    body=`<div class="card"><h2>${h(sel)} · 可以用的药</h2><p class="tiny">照每样药的「杀什么」说明找出来。同一组的药不要连着用，换组效果比较好。</p><div class="list" style="margin-top:6px">${L.map(x=>`<div style="${x.tot>0||!x.pb?'':'opacity:.6'}">${pic(x.p)}<div class="grow"><b>${h(x.p.name)}</b>${x.g?` <span class="badge grey">${h(x.g)} 组</span>`:''}<div class="tiny" style="color:#a63638">${h(x.p.target)}</div>${x.p.ai?`<div class="tiny">成分：${h(x.p.ai)}</div>`:''}<div class="tiny">${x.pb?FARMS.map(f=>`${f} ${stock[f][x.p.id]==null?'没点':leftTxt(x.p,{left:stock[f][x.p.id]}).replace('剩 ','')}`).join(' · '):'不追踪库存'}${x.dose?` · 每桶 ${fmt(x.dose)} ${unit(x.p)}`:''}</div><div class="tiny">${x.used.length?'配方里：'+h(x.used.join('、')):'配方里没有'}</div></div></div>`).join('')||'<div class="empty">还没有药写「杀这个」</div>'}</div></div>`}
  return `<div class="eyebrow">DICTIONARY</div><h1>病虫字典</h1><p class="tiny">点遇到的虫或病，看可以用什么药、三园各剩多少。要今天加药，到「喷药」那园按「＋ 加病害药」。</p>${body}${chips}`}

const NAV=[['today','🧴','喷药'],['hist','🗂️','纪录'],['set','⚙️','配方'],['dict','📖','病虫字典']];
function render(keepSheet){const v=tab==='hist'?vHist:tab==='set'?vSet:tab==='dict'?vDict:vToday;try{$('#view').innerHTML=v()}catch(x){console.error(x);$('#view').innerHTML=`<div class="card red">画面出错：${h(x.message)}</div>`}
  $('#bar').innerHTML=NAV.map(([k,i,l])=>`<button class="${tab===k?'on':''}" data-go="${k}"><b>${i}</b>${l}</button>`).join('')}
document.addEventListener('input',e=>{if(e.target.id==='dtk')donePrev()});
document.addEventListener('change',e=>{if(e.target.dataset.extra)donePrev()});
document.addEventListener('click',async e=>{const g=e.target.closest('[data-go]');if(g){if(g.dataset.go==='store'){location.href='StoreGo.html';return}tab=g.dataset.go;closeSheet();render();scrollTo(0,0);return}
  const dy=e.target.closest('[data-day]');if(dy){dayOff=Number(dy.dataset.day);render();return}
  const sbn=e.target.closest('[data-sub]');if(sbn){sub[sbn.dataset.sub]=sbn.dataset.v;render();return}
  const vs=e.target.closest('[data-vs]');if(vs){sheetVer.st[vs.dataset.vs]=vs.dataset.v;sheetVer.st.from=$('#vs-from').value;drawVer();return}
  const fm=e.target.closest('[data-farm]');if(fm){farmSel=fm.dataset.farm;try{localStorage.setItem('sg_farm',farmSel)}catch(_){}render();return}
  const rs=e.target.closest('[data-reason]');if(rs){sheetSkip.reason=rs.dataset.reason;rs.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===rs));return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,f=a.dataset.f;if(act==='close-bg'&&e.target!==a)return;
  try{if(await setAct(act,a))return;switch(act){case 'close':case 'close-bg':closeSheet();break;
    case 'card':a.disabled=true;await showCard(f);a.disabled=false;break;case 'share':await shareCard();break;
    case 'done':sheetDone(f);break;case 'tk':{const n=$('#dtk');n.value=fmt(Math.max(0,(Number(n.value)||0)+Number(a.dataset.d)));donePrev();break}
    case 'done-save':a.disabled=true;await doneSave(f);break;case 'skip':sheetSkip(f);break;case 'skip-save':a.disabled=true;await skipSave(f);break;case 'undo':await undo(f);break;
    case 'extra':sheetExtra(f);break;
    case 'mix':sheetMix(f);break;case 'mix-set':a.disabled=true;await mixSave(f,a.dataset.mix);break;case 'mix-reset':a.disabled=true;await mixSave(f,null);break;
    case 'ex-prob':sheetExtra.st.prob=sheetExtra.st.prob===a.dataset.v?null:a.dataset.v;drawExtra();break;
    case 'ex-pick':{$('#ex-p').value=a.dataset.id;$('#ex-d').focus();toast('填每桶用量，再按「加」');break}
    case 'ex-add':sheetExtra.st.ex.push({pid:a.dataset.id,dose:Number(a.dataset.dose),cond:a.dataset.cond==='1'});drawExtra();break;
    case 'ex-add-other':{const pid=$('#ex-p').value,dose=Number($('#ex-d').value);if(!pid||!(dose>0)){toast('⚠ 选药、填每桶多少');return}sheetExtra.st.ex.push({pid,dose});drawExtra();break}
    case 'ex-del':sheetExtra.st.ex.splice(Number(a.dataset.i),1);drawExtra();break;
    case 'ex-save':a.disabled=true;await exSave();break}}
  catch(x){console.error(x);toast('⚠ '+(x.message||x))}});
function gate(msg){$('#root').innerHTML=`<div class="gate"><h2>SprayGo</h2><p class="muted">${h(msg)}</p><a class="btn" href="../index.html">← 回主页登入</a></div>`}
async function boot(){
  if(MOCK)ME={name:MOCK.me||'Teo',role:MOCK.role||'OWNER',edit:true,owner:(MOCK.role||'OWNER')==='OWNER'};
  else{if(!window.supabase){gate('连不上资料库，请检查网络后重新整理。');return}sb=window.supabase.createClient(SB_URL,SB_KEY);
    let ss=null;try{ss=(await sb.auth.getSession()).data.session}catch(x){gate('连不上资料库：'+x.message);return}if(!ss){gate('还没登入。请回主页登入后再打开 SprayGo。');return}
    const {data:me}=await sb.from('hub_app_user').select('display_name,role,status').eq('id',ss.user.id).maybeSingle();if(!me||me.status!=='ACTIVE'){gate('你的账号没有 SprayGo 权限。');return}
    const [{data:see1},{data:see2},{data:edit}]=await Promise.all([sb.rpc('hub_can',{p_system:'SPRAY',p_action:'see'}),sb.rpc('hub_can',{p_system:'STORE',p_action:'see'}),sb.rpc('hub_can',{p_system:'STORE',p_action:'edit'})]);
    if(!see1&&!see2){gate('你的账号没有 SprayGo 权限。');return}ME={name:me.display_name,role:me.role,edit:!!edit,owner:me.role==='OWNER'}}
  document.body.classList.toggle('noedit',!ME.edit);document.body.classList.toggle('notowner',!ME.owner);$('#who').innerHTML=`${h(ME.name)}<br><a href="StoreGo.html" style="color:var(--green);font-weight:750;text-decoration:none">📦 StoreGo</a>`;
  try{await load()}catch(x){gate('读不到资料：'+(x.message||x));return}if(location.hash==='#set')tab='set';render();
  setInterval(async()=>{if(!document.hidden&&!$('#modal').innerHTML){try{await load();render()}catch(x){}}},90000)}
boot();
})();
