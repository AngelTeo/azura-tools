<header class="top"><div class="topin"><span class="brand">🌿 FoodFlow</span><span class="ver">v8</span><div class="mode"><button id="role-leader" onclick="setRole('leader')">👩‍🌾 Farm Leader</button><button id="role-admin" onclick="setRole('admin')">🗂 Management</button></div></div></header>
<main class="shell"><div id="app"></div></main><div id="modalOverlay" class="over" onclick="if(event.target===this)closeModal()"><div id="modalBox" class="modal"></div></div><div id="toast" class="toast"></div><input id="fileImport" type="file" accept="application/json,.json" hidden onchange="importFile(this)"><script>
const VERSION='v8', STORE='azura_foodflow_v5', FARMS=['AD 1','AD 2','AD 3'];
const QS=new URLSearchParams(location.search);
const FIXED=({'1':'AD 1','2':'AD 2','3':'AD 3'})[QS.get('farm')]||null; // Leader link: ?farm=1 / 2 / 3
const OWNER=QS.has('owner');                                            // Owner link: ?owner
const LINK=!OWNER;                                                       // Leader phones send by WhatsApp
const CATS=['Rice & Oil','Meat & Fish','Eggs & Milk','Vegetables','Dry Goods','Drinks & Noodles','Household'];
const SUPPLIERS=['Huat Tiong','Grocery','Wet Market'];
/* seed data */
const ITEM_ICONS={
 beras:['🛍️','BERAS'], minyak:['🧴','OIL'], ayam:['🐓','AYAM'],
 ikan_keli:['🐟','KELI'], ikan_bilis:['🐟','BILIS'], sardin:['🥫','SARDIN'],
 susu:['🥫','SUSU'], kunyit:['🫚','KUNYIT'], rebung:['🎍','REBUNG'],
 ajinomoto:['🧂','AJI'], kacang_tanah:['🥜','TANAH'], kacang_kuning:['🫘','KUNING'],
 tepung:['🌾','TEPUNG'], asam_jawa:['🫘','ASAM'], fish_sauce:['🫙','SOS IKAN'],
 kicap_pekat:['🍶','KICAP'], mee_sedap:['🍜','MEE'], mee_hoon:['🍝','BIHUN'],
 kopi_3in1:['☕','3-IN-1'], shampoo:['🧴','RAMBUT'], sabun_baju:['🧼','BAJU'],
 kobis:['🥬','KOBIS'], kobis_bunga:['🥦','BUNGA'], garam:['🧂','GARAM']
};
const SEED_ITEMS=[
 ['beras','Beras','Rice & Oil','bag 10kg','Grocery','🍚',0],
 ['minyak','Minyak Masak','Rice & Oil','bottle','Grocery','🫗',0],
 ['ayam','Ayam','Meat & Fish','bird','Wet Market','🐔',0],
 ['ikan_keli','Ikan Keli','Meat & Fish','kg','Wet Market','🐟',1],
 ['ikan_bilis','Ikan Bilis','Meat & Fish','kg','Grocery','🐟',1],
 ['sardin','Ikan Sardin (can)','Meat & Fish','can','Grocery','🥫',1],
 ['telur','Telur','Eggs & Milk','pcs','Grocery','🥚',1],
 ['susu','Susu Pekat','Eggs & Milk','can','Grocery','🥛',0],
 ['bawang_merah','Bawang Merah','Vegetables','kg','Huat Tiong','🧅',1],
 ['bawang_putih','Bawang Putih','Vegetables','kg','Huat Tiong','🧄',1],
 ['halia','Halia','Vegetables','kg','Huat Tiong','🫚',1],
 ['kunyit','Kunyit','Vegetables','pack','Huat Tiong','🟡',0],
 ['cili','Cili','Vegetables','kg','Huat Tiong','🌶️',1],
 ['tomato','Tomato','Vegetables','kg','Huat Tiong','🍅',1],
 ['kentang','Kentang','Vegetables','kg','Huat Tiong','🥔',1],
 ['kobis','Kobis','Vegetables','pcs','Huat Tiong','🥬',0],

 ['rebung','Rebung (Bamboo)','Vegetables','kg','Huat Tiong','🎋',1],
 ['garam','Garam','Dry Goods','pack','Grocery','🧂',0],
 ['ajinomoto','Ajinomoto','Dry Goods','pack','Grocery','✨',0],
 ['kacang_tanah','Kacang Tanah','Dry Goods','kg','Huat Tiong','🥜',0],
 ['kacang_kuning','Kacang Kuning','Dry Goods','kg','Grocery','🫘',0],
 ['tepung','Tepung','Dry Goods','kg','Grocery','🌾',0],
 ['asam_jawa','Asam Jawa','Dry Goods','pack','Grocery','🟤',0],
 ['fish_sauce','Thai Fish Sauce','Dry Goods','bottle','Grocery','🍶',0],
 ['kicap_pekat','Kicap Pekat','Dry Goods','bottle','Grocery','🍶',0],
 ['mee_sedap','Mee Sedap','Drinks & Noodles','pack 5','Grocery','🍜',0],
 ['mee_hoon','Mee Hoon','Drinks & Noodles','pack','Grocery','🍜',0],
 ['kopi_3in1','Coffee Mix 3in1','Drinks & Noodles','pack','Grocery','☕',0],
 ['shampoo','Shampoo','Household','bottle','Grocery','🧴',0],
 ['sabun_baju','Sabun Cuci Baju','Household','pack','Grocery','🧺',0]
];
const SEED_ORDERS={
 'AD 2':{beras:6,minyak:2,garam:3,ajinomoto:1,kacang_tanah:3,ikan_bilis:2,sardin:9,ayam:4,telur:150,shampoo:3,mee_sedap:9,kopi_3in1:9,susu:9,tepung:3,bawang_merah:3,bawang_putih:1,rebung:3,kobis:2,kobis_bunga:2,tomato:3,ikan_keli:2,kentang:3,cili:1,fish_sauce:2,kacang_kuning:3},
 'AD 3':{beras:4,minyak:1,garam:3,kunyit:1,bawang_merah:3,bawang_putih:1,halia:1,sardin:6,ayam:2,ikan_bilis:1,ikan_keli:2,tomato:3,mee_sedap:3,mee_hoon:2,cili:1,susu:3,telur:60,kopi_3in1:5,kobis:2,kobis_bunga:2,rebung:3,asam_jawa:1,fish_sauce:1},
 'AD 1':{beras:5,minyak:2,telur:90,bawang_merah:3,bawang_putih:1,sardin:6,tomato:3,kentang:3,kobis:2,kobis_bunga:2,kicap_pekat:1,rebung:3,mee_sedap:6,kopi_3in1:6,susu:3,sabun_baju:1,kacang_tanah:3,fish_sauce:1,ayam:3}
};
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function newDB(){return {version:VERSION,items:SEED_ITEMS.map((a,i)=>({id:a[0],name:a[1],cat:a[2],unit:a[3],supplier:a[4],emoji:a[5],unitOk:!!a[6],active:true,sort:i})),rounds:[{id:'R_'+Date.now(),date:today(),status:'open',orderedAt:null,orderedSuppliers:{},createdAt:new Date().toISOString()}],orders:[],delivery:{},received:{},audit:[],demo:false}}
let db;try{db=JSON.parse(localStorage.getItem(STORE))||newDB();if(!db.items||!db.rounds)throw 0}catch(e){db=newDB()}
db.delivery ||= {};db.received ||= {};db.audit ||= [];db.demo ||= false;
try{if(!localStorage.getItem(STORE))localStorage.setItem(STORE,JSON.stringify(db))}catch(e){}
let ui={role:'leader',farm:null,tab:'today',cat:'All',query:'',roundId:null,supplier:'Huat Tiong',draft:null,historyFarm:'All'};
function id(){return 'ID'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function log(action,farm,detail){db.audit.push({at:new Date().toISOString(),action,farm:farm||'',detail:detail||''})}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){alert('Could not save on this device. Export backup now.')}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function qty(n){return String(Math.round((Number(n)||0)*100)/100)}
function datefmt(v){if(!v)return '—';return new Date(v.length===10?v+'T12:00:00':v).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('on');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('on'),2300)}
function product(id){return db.items.find(x=>x.id===id)}
function art(it){const v=ITEM_ICONS[it.id]||[it.emoji||'📦',''];return `<span class="ico"><span>${esc(v[0])}</span><small>${esc(v[1]||'')}</small></span>`}
function round(){return db.rounds.find(r=>r.id===ui.roundId)||db.rounds.find(r=>r.status!=='closed')||db.rounds[db.rounds.length-1]}
function currentRound(){return db.rounds.find(r=>r.status!=='closed')}
function order(rid,f){return db.orders.find(o=>o.roundId===rid&&o.farm===f)}
function del(rid,f){db.delivery[rid] ||= {};return db.delivery[rid][f] ||= {packed:false,delivered:false,checked:false,actual:{},issue:'',checkedAt:null}}
function allOrders(r){return db.orders.filter(o=>o.roundId===r.id&&o.status==='submitted')}
function requested(o){return Object.entries(o?.lines||{}).filter(([k,q])=>q>0)}
function skipped(r,f){return !!(r&&r.skip&&r.skip[f])}
function waitingFarms(r){return FARMS.filter(f=>!order(r.id,f)&&!skipped(r,f))}
function stats(r){let os=allOrders(r);return {submitted:os.length,need:FARMS.filter(f=>order(r.id,f)||!skipped(r,f)).length,waiting:waitingFarms(r).length,received:os.filter(o=>del(r.id,o.farm).checked&&!hasDifference(o,del(r.id,o.farm))).length}}
function hasDifference(o,d){return requested(o).some(([k,v])=>Number(d.actual[k]??v)!==Number(v))}
function tag(t,type=''){return `<span class="tag ${type}">${esc(t)}</span>`}
function setRole(role){ui.role=role;ui.tab='today';ui.draft=null;render()}
function setFarm(f){ui.farm=f;ui.draft=null;render()}
function setTab(t){ui.tab=t;ui.draft=null;render()}
function setRound(rid){ui.roundId=rid;render()}
function render(){document.getElementById('role-leader').classList.toggle('on',ui.role==='leader');document.getElementById('role-admin').classList.toggle('on',ui.role==='admin');document.getElementById('app').innerHTML=ui.role==='leader'?leaderPage():adminPage()}
function leaderPage(){const r=currentRound();let top=`<div class="hero"><div><h1>Farm Leader</h1><div class="sub">One screen · One next action</div></div>${ui.farm&&!FIXED?`<button class="btn small" onclick="setFarm(null)">Change farm</button>`:''}</div>`;
 if(!ui.farm)return top+`<div class="card"><h2>Choose your farm</h2><div class="farmgrid">${FARMS.map(f=>`<button class="farmcard" onclick="setFarm('${f}')"><span class="house">🏡</span><b>${f}</b><span class="mut">Tap to continue</span></button>`).join('')}</div></div><div class="card"><h2>How to use</h2><div class="howgrid"><div class="howcard"><span class="num">1️⃣</span><b>Order Food</b><span class="mut">Tap + / −. No handwriting.</span></div><div class="howcard gold"><span class="num">2️⃣</span><b>Receive Food</b><span class="mut">Food arrives → check → confirm.</span></div></div><div class="legend"><span><i style="background:var(--green)"></i>All OK</span><span><i style="background:#e8892a"></i>Need to check</span><span><i style="background:var(--red)"></i>Missing / Wrong</span></div></div>`;
 let o=r&&order(r.id,ui.farm),d=o?del(r.id,ui.farm):null;
 const past=[...db.orders].filter(x=>x.farm===ui.farm&&x.status==='submitted').sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt));
 if(ui.tab==='edit'&&ui.draft)return `<div class="hero"><h1>Edit order · ${ui.farm}</h1><button class="btn" onclick="ui.tab='today';ui.draft=null;clearDraft();render()">Cancel</button></div>`+orderEditor(ui.farm,r);
 if(ui.tab==='history')return top+`<div class="tools"><button class="btn" onclick="setTab('today')">← Back</button></div><h2>Past orders · ${ui.farm}</h2>${past.length?past.map(x=>`<div class="card"><div class="titleline"><b>${datefmt(db.rounds.find(r=>r.id===x.roundId)?.date)}</b>${tag(del(x.roundId,x.farm).checked?'Received':'Submitted',del(x.roundId,x.farm).checked?'ok':'blue')}</div><div class="sub">${requested(x).length} items</div><button class="btn small" onclick="viewPast('${esc(x.id)}')">View order</button></div>`).join(''):`<div class="card empty">No previous orders</div>`}`;
 top+=`<div class="btnrow" style="margin-bottom:14px"><strong>${ui.farm}</strong><span class="grow"></span><button class="btn small" onclick="setTab('history')">🕘 History</button></div>`;
 if(!r)return top+`<div class="card empty">No open order round. Management will open the next one.</div>`;
 if(!o&&skipped(r,ui.farm))return top+`<div class="donebox"><div class="tick">👌</div><h2>No food needed this round</h2>${r.status==='open'?`<button class="btn gold" onclick="toggleSkip('${ui.farm}')">I need food after all</button>`:''}</div>`;
 if(o&&d.checked&&!hasDifference(o,d))return top+`<div class="donebox"><div class="tick">✅</div><h2>All received. Thank you!</h2>${tag('All OK','ok')}<div class="sub">No outstanding food tasks for ${ui.farm}.</div>${LINK?`<div class="btnrow" style="justify-content:center;margin-top:14px"><button class="btn primary" onclick="leaderNewRound()">🛒 New food order</button></div>`:''}</div>`;
 if(o&&d.checked&&hasDifference(o,d)&&!d.recheckAllowed)return top+`<div class="card"><div class="titleline"><h2>⚠ Difference reported</h2>${tag('Missing / Wrong','bad')}</div><p>Your actual received quantities have been recorded. Please wait for the missing goods or correction before checking again.</p><div class="note bad">${esc(d.issue||'Quantity difference reported')}</div><div class="btnrow"><button class="btn" onclick="viewPast('${o.id}')">View order</button>${LINK?`<button class="btn" onclick="sendReceipt('${ui.farm}')">📤 Send to boss again</button><button class="btn primary" onclick="leaderNewRound()">🛒 New food order</button>`:''}</div></div>`;
 if(o&&(r.status!=='open'||d.packed||d.delivered||d.receiving||d.recheckAllowed))return top+`<div class="card"><div class="titleline"><h2>📦 Receive Food</h2>${tag('Need to check','warn')}</div><p><b>Food arrived at ${ui.farm}?</b> You can check it yourself. No need to wait for Management to mark Delivered.</p><div class="btnrow"><button class="btn primary grow" onclick="startReceive('${ui.farm}')">📦 Receive Food →</button></div>${d.receiving?`<div class="note">Check each item below. If all correct, confirm. Otherwise report the actual quantity.</div><div class="btnrow"><button class="btn primary grow" onclick="confirmAll('${ui.farm}')">✓ Confirm All Received</button><button class="btn" onclick="reportDifference('${ui.farm}')">⚠ Missing / Wrong</button></div>`:''}</div>${d.receiving?orderSummary(o):''}`;
 if(o)return top+`<div class="card"><div class="titleline"><h2>✅ Order submitted</h2>${tag('Waiting for purchasing','blue')}</div><p class="mut">${requested(o).length} food items · ${datefmt(r.date)}</p><div class="btnrow"><button class="btn" onclick="viewPast('${o.id}')">View order</button>${r.status==='open'?`<button class="btn gold" onclick="startEdit('${ui.farm}')">Edit before order closes</button>`:''}</div>${LINK?`<div class="btnrow" style="margin-top:10px"><button class="btn" onclick="sendOrderWA('${ui.farm}')">📤 Send to boss again</button><button class="btn primary grow" onclick="startReceive('${ui.farm}')">📦 Food arrived → Receive</button></div><div class="note">Order sent by WhatsApp. When the food arrives, tap Receive Food and check each item.</div>`:`<div class="note">Once Management places the order, the Receive Food button appears. You can start checking as soon as goods arrive.</div>`}</div>`;
 if(r.status!=='open')return top+`<div class="card empty">This order is already closed for purchasing. Please contact Management for any extra request.</div>`;
 return top+orderEditor(ui.farm,r);
}
function orderEditor(f,r){if(!ui.draft||ui.draft.farm!==f){ui.draft=loadDraft(f,r)||{farm:f,lines:{},note:''}}const d=ui.draft;let list=db.items.filter(x=>x.active&&(ui.cat==='All'||x.cat===ui.cat)&&x.name.toLowerCase().includes(ui.query.toLowerCase()));
 let n=Object.values(d.lines).filter(v=>v>0).length;
 return `<div class="titleline"><h2>🛒 Your food order</h2>${tag(datefmt(r.date))}</div><div class="card" style="padding:13px"><div class="btnrow"><button class="btn gold" onclick="copyPrevious('${f}')">↺ Same as Last Order</button><span class="sub">Copy, then adjust quantities</span>${!order(r.id,f)?`<span class="grow"></span><button class="btn small" onclick="leaderSkip('${f}')">Nothing needed this round</button>`:''}</div></div><input class="search" placeholder="🔎 Search food..." value="${esc(ui.query)}" oninput="ui.query=this.value;refreshOrderEditor()"><div class="pills">${['All',...CATS].map(c=>`<button class="pill ${ui.cat===c?'on':''}" onclick="ui.cat='${c}';refreshOrderEditor()">${esc(c)}</button>`).join('')}</div><div class="itemsgrid">${list.map(x=>`<div class="food ${(d.lines[x.id]||0)>0?'chosen':''}">${art(x)}<div class="foodname"><b>${esc(x.name)}</b><small>${esc(x.unit)}</small></div><div class="step"><button onclick="changeQty('${x.id}',-1)">−</button><button class="count" onclick="typeQty('${x.id}')">${qty(d.lines[x.id])}</button><button class="plus" onclick="changeQty('${x.id}',1)">+</button></div></div>`).join('')}</div>${!list.length?'<div class="empty">No matching food</div>':''}<div class="card" style="margin-top:14px"><div class="field"><label>Other request / remarks</label><textarea rows="2" placeholder="Anything not on the list?" oninput="ui.draft.note=this.value;saveDraft()">${esc(d.note)}</textarea></div></div><div class="bottom"><strong>${n} items</strong><button class="btn primary" ${n?'':'disabled'} onclick="reviewOrder('${f}')">Review & Submit →</button></div>`}
function refreshOrderEditor(){const active=document.activeElement;const focusSearch=active?.classList?.contains('search');const p=active?.selectionStart;render();if(focusSearch){const el=document.querySelector('.search');el?.focus();if(el&&p!=null)el.setSelectionRange(p,p)}}
function changeQty(k,delta){let it=product(k),step=it.unit==='kg'?.5:it.id==='telur'?30:1;let n=Math.round(((ui.draft.lines[k]||0)+delta*step)*100)/100;if(n>0)ui.draft.lines[k]=n;else delete ui.draft.lines[k];saveDraft();refreshOrderEditor()}
function typeQty(k){const it=product(k);openModal(`<h2>${art(it)} ${esc(it.name)}</h2><div class="field"><label>Quantity · ${esc(it.unit)}</label><input id="typedqty" type="number" min="0" step="any" value="${ui.draft.lines[k]||0}"></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTypedQty('${k}')">Apply</button></div>`)}
function saveTypedQty(k){let v=Number(document.getElementById('typedqty').value);if(!Number.isFinite(v)||v<0){toast('Enter a valid quantity');return}if(v===0)delete ui.draft.lines[k];else ui.draft.lines[k]=v;saveDraft();closeModal();render()}
function copyPrevious(f){const r=currentRound();const prior=[...db.orders].filter(o=>o.farm===f&&o.roundId!==r.id&&o.status==='submitted').sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt))[0];if(!prior){toast('No previous order yet');return}ui.draft.lines={...prior.lines};ui.draft.note=prior.note||'';saveDraft();render();toast('Previous order copied')}
function startEdit(f){const r=currentRound(),o=order(r.id,f);if(!o||r.status!=='open')return;ui.draft={farm:f,lines:{...o.lines},note:o.note||''};ui.tab='edit';saveDraft();renderEdit()}
function renderEdit(){render()}
function reviewOrder(f){const d=ui.draft,rows=Object.entries(d.lines).filter(([k,v])=>v>0);if(!rows.length)return;openModal(`<h2>Check your order · ${f}</h2>${rows.map(([k,v])=>`<div class="line"><span>${art(product(k))} ${esc(product(k).name)}</span><strong>${qty(v)} ${esc(product(k).unit)}</strong></div>`).join('')}${d.note?`<p>${esc(d.note)}</p>`:''}<div class="modalfoot"><button class="btn" onclick="closeModal()">Edit</button><button class="btn primary" onclick="submitOrder('${f}')">✓ Submit Order</button></div>`)}
function submitOrder(f){const r=currentRound();if(!r||r.status!=='open'){toast('Ordering is closed');return}const now=new Date().toISOString();let o=order(r.id,f);if(o){o.lines={...ui.draft.lines};o.note=ui.draft.note;o.updatedAt=now}else db.orders.push({id:id(),roundId:r.id,farm:f,lines:{...ui.draft.lines},note:ui.draft.note,status:'submitted',submittedAt:now,updatedAt:now});if(r.skip)delete r.skip[f];log('ORDER_SUBMITTED',f,r.id);persist();ui.draft=null;clearDraft();ui.tab='today';closeModal();render();toast('Order submitted ✓');if(LINK)sendOrderWA(f)}
function orderSummary(o){return `<div class="card"><h3>Ordered food</h3>${requested(o).map(([k,v])=>`<div class="line"><span>${esc(product(k)?.name||k)}</span><strong>${qty(v)} ${esc(product(k)?.unit)}</strong></div>`).join('')}${o.note?`<div class="note">${esc(o.note)}</div>`:''}</div>`}
function viewPast(oid){let o=db.orders.find(x=>x.id===oid);if(!o)return;openModal(`<h2>${o.farm} · ${datefmt(db.rounds.find(r=>r.id===o.roundId)?.date)}</h2>${requested(o).map(([k,v])=>`<div class="line"><span>${esc(product(k)?.name||k)}</span><strong>${qty(v)} ${esc(product(k)?.unit)}</strong></div>`).join('')}${o.note?`<div class="note">${esc(o.note)}</div>`:''}<div class="modalfoot"><button class="btn" onclick="closeModal()">Close</button></div>`)}
function startReceive(f){const r=currentRound(),o=r&&order(r.id,f);if(!o)return;const d=del(r.id,f);if(d.checked&&!d.recheckAllowed)return;if(!LINK&&r.status==='open'&&!d.packed&&!d.delivered){toast('Management has not placed the order yet');return}d.receiving=true;log('RECEIVE_STARTED',f,r.id);persist();render()}
function confirmAll(f){const r=currentRound(),o=r&&order(r.id,f);if(!o)return;let d=del(r.id,f);if(!d.receiving)return toast('Tap Receive Food first');if(d.checked&&!d.recheckAllowed)return toast('Management must release a recount first');d.recheckAllowed=false;d.receiving=false;d.actual=Object.fromEntries(requested(o));d.issue='';d.checked=true;d.checkedAt=new Date().toISOString();log('CONFIRMED_RECEIVED',f,r.id);persist();render();toast('Received ✓');if(LINK)sendReceipt(f)}
function reportDifference(f){const r=currentRound(),o=order(r.id,f),d=del(r.id,f);if(!d.receiving||d.checked&&!d.recheckAllowed)return;openModal(`<h2>⚠ Missing / Wrong · ${f}</h2><p class="mut">Enter ACTUAL quantity only where different. Keep the rest unchanged.</p>${requested(o).map(([k,v])=>`<div class="line"><span>${esc(product(k)?.name||k)}<div class="hint">Ordered ${qty(v)} ${esc(product(k)?.unit)}</div></span><input style="width:100px" type="number" min="0" step="any" data-actual="${esc(k)}" value="${qty(d.actual[k]??v)}"></div>`).join('')}<div class="field"><label>What went wrong?</label><textarea id="differenceNote" rows="2" placeholder="Example: 1 chicken missing">${esc(d.issue)}</textarea></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveDifference('${f}')">Report Difference</button></div>`)}
function saveDifference(f){const r=currentRound(),o=order(r.id,f),d=del(r.id,f),actual={};for(const el of document.querySelectorAll('[data-actual]')){let n=Number(el.value);if(!Number.isFinite(n)||n<0){toast('Invalid quantity');return}actual[el.dataset.actual]=n}const issue=document.getElementById('differenceNote').value.trim();const bad=requested(o).some(([k,v])=>Number(actual[k])!==Number(v));if(!bad&&!issue){toast('All quantities match: use Confirm All Received');return}d.receiving=false;d.actual=actual;d.issue=issue;d.recheckAllowed=false;d.checked=true;d.checkedAt=new Date().toISOString();log('DIFFERENCE_REPORTED',f,issue);persist();closeModal();render();toast('Difference reported');if(LINK)sendReceipt(f)}
function adminPage(){const r=round();if(ui.tab==='history')return adminHistory();if(ui.tab==='items')return itemSettings();let sel=`<div class="tools"><select onchange="setRound(this.value)">${[...db.rounds].reverse().map(x=>`<option value="${x.id}" ${r?.id===x.id?'selected':''}>${datefmt(x.date)} · ${x.status}</option>`).join('')}</select><button class="btn small" onclick="openNewRound()">+ New round</button><button class="btn small" onclick="exportJSON()">⬇ Backup</button><button class="btn small" onclick="document.getElementById('fileImport').click()">Import</button></div>`;
 const menu=`<div class="nav">${[['today','🏠 Overview'],['buy','🛒 Buy'],['collect','📦 Collect'],['deliver','🚚 Deliver'],['history','🕘 History'],['items','⚙ Items']].map(([k,v])=>`<button class="${ui.tab===k?'on':''}" onclick="setTab('${k}')">${v}</button>`).join('')}</div>`;
 let h=`<div class="hero"><div><h1>Management</h1><div class="sub">Three farms · One clear next action</div></div>${db.demo?tag('DEMO DATA','warn'):''}</div>${menu}${sel}`;
 if(!r)return h+`<div class="card empty">No order rounds yet.</div>`;
 return h+({today:overview,buy:buyPage,collect:collectPage,deliver:deliveryPage}[ui.tab]||overview)(r);
}
function overview(r){const s=stats(r);let os=allOrders(r);let html=`<div class="statgrid"><div class="stat"><strong>${s.submitted}/${s.need}</strong><span>Submitted</span></div><div class="stat"><strong>${s.waiting}</strong><span>Waiting</span></div><div class="stat"><strong>${s.received}/${s.need}</strong><span>Received</span></div></div><div class="card"><div class="titleline"><h2>${datefmt(r.date)}</h2>${tag(r.status.toUpperCase(),r.status==='closed'?'ok':'blue')}</div><div class="farmgrid">${FARMS.map(f=>{const o=order(r.id,f),d=o?del(r.id,f):null;return `<div class="farmcard"><b>${f}</b>${o?tag(d.checked?(hasDifference(o,d)?'Difference':'Received'):d.delivered?'Delivered':d.packed?'Packed':'Order submitted',d.checked&&!hasDifference(o,d)?'ok':d.checked?'bad':'blue'):skipped(r,f)?tag('No order this round'):tag('Waiting for Leader','warn')}<span class="hint">${o?requested(o).length+' items':skipped(r,f)?'Not needed':'No order yet'}</span>${!o&&r.status==='open'?`<button class="btn small" onclick="toggleSkip('${f}')">${skipped(r,f)?'Undo':'No order this round'}</button>`:''}</div>`}).join('')}</div></div>`;
 let action=r.status==='open'?(s.waiting?`Waiting for ${waitingFarms(r).join(', ')} to submit.`:`All orders received. Ready to prepare one purchase order.`):r.status==='ordered'?'Orders prepared. Check collection and deliveries.':r.status==='closed'?'All completed. View history.':'Review deliveries and differences.';
 return html+`<div class="card"><div class="titleline"><h2>➡ Next action</h2></div><p>${esc(action)}</p><div class="btnrow"><button class="btn primary" onclick="setTab('${r.status==='open'?'buy':r.status==='ordered'?'collect':'deliver'}')">Continue →</button><button class="btn gold" onclick="openPaste()">📥 Paste WhatsApp from Leaders</button>${!db.demo?`<button class="btn" onclick="loadDemo()">Try with sample orders</button>`:''}</div></div>`}
function bySupplier(r,sup){const os=allOrders(r);let ids=new Set(os.flatMap(o=>requested(o).map(([k])=>k)));return [...ids].map(product).filter(x=>x&&x.supplier===sup).sort((a,b)=>a.sort-b.sort)}
function supplierTable(r,sup,check=false){const items=bySupplier(r,sup),os=allOrders(r);if(!items.length)return `<div class="card empty">No items for ${esc(sup)}</div>`;return `<div class="tablewrap"><table><thead><tr><th>Food</th>${FARMS.map(f=>`<th class="num">${f}</th>`).join('')}<th class="num">TOTAL</th>${check?'<th>Collected</th>':''}</tr></thead><tbody>${items.map(it=>{const vals=FARMS.map(f=>Number(order(r.id,f)?.lines[it.id]||0)),total=vals.reduce((a,b)=>a+b,0);let done=!!db.received[r.id]?.[it.id];return `<tr><td><b>${esc(it.name)}</b><div class="hint">${esc(it.unit)} ${it.unitOk?'':'⚠ unit unconfirmed'}</div></td>${vals.map(v=>`<td class="num">${v?qty(v):'–'}</td>`).join('')}<td class="num"><b>${qty(total)}</b></td>${check?`<td><input type="checkbox" aria-label="Collected ${esc(it.name)}" ${done?'checked':''} onchange="collected('${it.id}',this.checked)"></td>`:''}</tr>`}).join('')}</tbody></table></div>`}
function buyPage(r){let s=stats(r);let sup=ui.supplier;return `<div class="card"><div class="titleline"><h2>🛒 One order · 3 farms</h2>${tag(s.submitted+'/'+s.need+' submitted',s.waiting?'warn':'ok')}</div>${s.waiting?`<div class="note warn">Waiting for: <b>${waitingFarms(r).join(', ')}</b>. You can preview, but do not submit an incomplete order by mistake.</div>`:''}<div class="pills">${SUPPLIERS.map(x=>`<button class="pill ${x===sup?'on':''}" onclick="ui.supplier='${x}';render()">${esc(x)}</button>`).join('')}</div>${supplierTable(r,sup)}<div class="btnrow" style="margin-top:14px"><button class="btn gold" onclick="copySupplier('${sup}')">📋 Copy WhatsApp Order</button><button class="btn" onclick="window.print()">Print</button>${r.status==='open'?`<button class="btn primary" ${s.waiting?'disabled':''} onclick="markOrdered()">✓ Confirm orders placed</button>`:tag('Orders placed','ok')}</div><div class="hint" style="margin-top:9px">Copying alone does not prove the supplier received the order. Confirm only after actually placing orders.</div></div>`}
function supplierText(r,sup){const its=bySupplier(r,sup);let t=`AZURA DELTA · FOOD ORDER\nDate: ${datefmt(r.date)}\nSupplier: ${sup}\n\n`;for(const f of FARMS){t+=`====== ${f} ======\n`;for(const it of its){let v=order(r.id,f)?.lines[it.id]||0;if(v)t+=`${it.name}: ${qty(v)} ${it.unit}\n`}let n=order(r.id,f)?.note;if(n)t+=`Note: ${n}\n`;t+='\n'}t+=`====== TOTAL ======\n`;for(const it of its){let n=FARMS.reduce((s,f)=>s+Number(order(r.id,f)?.lines[it.id]||0),0);t+=`${it.name}: ${qty(n)} ${it.unit}\n`}return t}
function copySupplier(sup){const r=round();const text=supplierText(r,sup);openModal(`<h2>📋 ${esc(sup)} · WhatsApp</h2><div class="field"><label>Farm-by-farm order (editable before copying)</label><textarea id="waText" rows="17">${esc(text)}</textarea></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="copyOrderText()">Copy to clipboard</button></div>`)}
async function copyOrderText(){let s=document.getElementById('waText').value;try{await navigator.clipboard.writeText(s);toast('Copied · paste into WhatsApp')}catch(e){document.getElementById('waText').select();toast('Select and copy text manually')}}
function markOrdered(){const r=round(),s=stats(r);if(r.status!=='open'||s.waiting){toast('Wait for all three farm orders');return}if(!confirm('Have you actually placed the supplier orders? This locks farm edits.'))return;r.status='ordered';r.orderedAt=new Date().toISOString();log('PURCHASE_PLACED','',r.id);persist();render()}
function collectPage(r){let ids=new Set(allOrders(r).flatMap(o=>requested(o).map(([k])=>k)));let done=[...ids].filter(k=>db.received[r.id]?.[k]).length;return `<div class="card"><div class="titleline"><h2>📦 Collect from suppliers</h2>${tag(done+'/'+ids.size+' items checked',done===ids.size&&ids.size?'ok':'warn')}</div><div class="note">Tick each item when you have actually collected it. Collection is not farm delivery.</div>${SUPPLIERS.map(s=>`<div class="sectionhead">${esc(s)}</div>${supplierTable(r,s,true)}`).join('')}${ids.size&&done===ids.size?`<div class="note">✅ All purchase items collected. Now deliver to each farm.</div><button class="btn primary" onclick="setTab('deliver')">Go to delivery →</button>`:''}</div>`}
function collected(k,v){let r=round();if(r.status==='closed')return;db.received[r.id] ||= {};if(v)db.received[r.id][k]=true;else delete db.received[r.id][k];log('COLLECTED','',`${k}:${v}`);persist();render()}
function deliveryPage(r){let os=allOrders(r);return `<div class="titleline"><h2>🚚 Deliver & confirm</h2>${tag(stats(r).received+'/'+stats(r).need+' received','blue')}</div>${FARMS.map(f=>{let o=order(r.id,f);if(!o)return `<div class="card"><b>${f}</b><p class="mut">No order submitted</p></div>`;let d=del(r.id,f),bad=d.checked&&hasDifference(o,d);return `<div class="card"><div class="titleline"><div><h2>${f}</h2><div class="mut">${requested(o).length} items</div></div>${tag(bad?'⚠ Difference':d.checked?'✓ Received':d.delivered?'Delivered':d.packed?'Packed':'To pack',bad?'bad':d.checked?'ok':'blue')}</div><div class="btnrow"><button class="btn ${d.packed?'light':''}" ${r.status==='closed'?'disabled':''} onclick="toggleDelivery('${f}','packed')">${d.packed?'✓ Packed':'Mark packed'}</button><button class="btn ${d.delivered?'light':''}" ${!d.packed||r.status==='closed'?'disabled':''} onclick="toggleDelivery('${f}','delivered')">${d.delivered?'✓ Delivered':'Mark delivered'}</button><button class="btn" onclick="viewPast('${o.id}')">View list</button>${bad?`<button class="btn danger" onclick="resolveIssue('${f}')">Resolve difference</button>`:''}</div>${bad?`<div class="note bad">${esc(d.issue||'Quantities differ. Management action required.')}</div>`:''}</div>`}).join('')}${os.length&&os.length===stats(r).need&&os.every(o=>{let d=del(r.id,o.farm);return d.checked&&!hasDifference(o,d)})?`<div class="card"><div class="note">✅ All farms confirmed their food.</div><button class="btn primary" ${r.status==='closed'?'disabled':''} onclick="closeRound()">Close completed round</button></div>`:''}`}
function toggleDelivery(f,key){let r=round(),o=order(r.id,f);if(!o||r.status==='closed')return;let d=del(r.id,f);if(key==='packed'&&!d.packed){let ids=requested(o).map(([k])=>k);if(ids.some(k=>!db.received[r.id]?.[k])){toast('Collect all items for this farm first');return}}if(key==='delivered'&&!d.packed){toast('Pack first');return}if(d.checked){toast('Already checked by Farm Leader');return}d[key]=!d[key];if(key==='packed'&&!d.packed)d.delivered=false;log(key.toUpperCase(),f,String(d[key]));persist();render()}
function resolveIssue(f){let r=round(),o=order(r.id,f),d=del(r.id,f);openModal(`<h2>Resolve shortage · ${f}</h2><div class="note bad">Do not clear a reported difference unless the farm has physically received the missing items or a correction is agreed.</div><p>${esc(d.issue||'Quantities differ')}</p><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="resolveConfirmed('${f}')">Leader reconfirms quantities</button></div>`)}
function resolveConfirmed(f){const r=round(),d=del(r.id,f);d.recheckAllowed=true;log('RECOUNT_APPROVED',f,r.id);persist();closeModal();toast('Recount released to Farm Leader');render()}
function closeRound(){let r=round();if(stats(r).received!==stats(r).need||!confirm('Close this round after all farms received everything?'))return;r.status='closed';log('ROUND_CLOSED','',r.id);persist();render()}
function openNewRound(){openModal(`<h2>+ New food order round</h2><div class="field"><label>Order date</label><input type="date" id="roundDate" value="${today()}"></div><div class="note warn">The current incomplete round will remain available in history. Only one round can accept new Leader orders.</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createRound()">Open new round</button></div>`)}
function createRound(){const v=document.getElementById('roundDate').value;if(!v)return;const a=currentRound();if(a&&a.status!=='closed'){const left=FARMS.filter(f=>{const o=order(a.id,f);if(!o)return !skipped(a,f);const d=del(a.id,f);return !d.checked||hasDifference(o,d)});if(!confirm(left.length?'Not finished: '+left.join(', ')+'. These farms will no longer see the current round. Open a new round anyway?':'Close the current round and open a new one?'))return}if(a)a.status='closed';const r={id:id(),date:v,status:'open',orderedAt:null,createdAt:new Date().toISOString()};db.rounds.push(r);ui.roundId=r.id;log('ROUND_OPENED','',r.id);persist();closeModal();setTab('today')}
function adminHistory(){const rs=[...db.rounds].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="hero"><h1>🕘 Food history</h1></div><div class="tools"><button class="btn" onclick="setTab('today')">← Back</button><button class="btn" onclick="exportJSON()">⬇ Export all records</button></div>${rs.map(r=>`<div class="card"><div class="titleline"><h2>${datefmt(r.date)}</h2>${tag(r.status,r.status==='closed'?'ok':'blue')}</div><div class="farmgrid">${FARMS.map(f=>{let o=order(r.id,f);return `<div><b>${f}</b><div class="sub">${o?requested(o).length+' items':'No order'} · ${o&&del(r.id,f).checked?'Received':'Pending'}</div>${o?`<button class="btn small" onclick="viewPast('${o.id}')">View</button>`:''}</div>`}).join('')}</div><hr class="sep"><button class="btn small" onclick="ui.roundId='${r.id}';setTab('buy')">View supplier totals</button></div>`).join('')}</div>`}
function itemSettings(){return `<div class="hero"><h1>⚙ Food items</h1></div><div class="tools"><button class="btn" onclick="setTab('today')">← Back</button><button class="btn primary" onclick="editItem()">+ Add item</button></div><div class="card">${db.items.map(it=>`<div class="line"><span>${art(it)} ${esc(it.name)}<div class="hint">${esc(it.unit)} · ${esc(it.supplier)} · ${it.active?'Active':'Hidden'}</div></span><button class="btn small" onclick="editItem('${it.id}')">Edit</button></div>`).join('')}</div>`}
function editItem(k){const it=k?product(k):{name:'',unit:'',supplier:SUPPLIERS[0],cat:CATS[0],emoji:'📦',active:true,unitOk:false};openModal(`<h2>${k?'Edit food':'Add food'}</h2><div class="field"><label>Name</label><input id="itemName" value="${esc(it.name)}"></div><div class="field"><label>Unit (kg / pcs / pack)</label><input id="itemUnit" value="${esc(it.unit)}"></div><div class="field"><label>Supplier</label><select id="itemSup">${SUPPLIERS.map(s=>`<option ${it.supplier===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Category</label><select id="itemCat">${CATS.map(s=>`<option ${it.cat===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Icon (emoji)</label><input id="itemEmoji" value="${esc(it.emoji)}"></div><label class="checkrow"><input id="itemActive" type="checkbox" ${it.active?'checked':''}> Available to order</label><label class="checkrow"><input id="itemUnitOk" type="checkbox" ${it.unitOk?'checked':''}> Unit confirmed</label><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveItem('${k||''}')">Save</button></div>`)}
function saveItem(k){let name=document.getElementById('itemName').value.trim(),unit=document.getElementById('itemUnit').value.trim();if(!name||!unit){toast('Name and unit required');return}let it=k?product(k):{id:id(),sort:db.items.length};Object.assign(it,{name,unit,supplier:document.getElementById('itemSup').value,cat:document.getElementById('itemCat').value,emoji:document.getElementById('itemEmoji').value,active:document.getElementById('itemActive').checked,unitOk:document.getElementById('itemUnitOk').checked});if(!k)db.items.push(it);log('ITEM_SAVED','',it.id);persist();closeModal();render()}
function loadDemo(){if(db.orders.length&&!confirm('Demo orders will be added to the current round. Continue?'))return;let r=currentRound();if(!r){toast('Open a new round first');return}let now=new Date().toISOString();for(const f of FARMS){let o=order(r.id,f);if(!o)db.orders.push({id:id(),roundId:r.id,farm:f,lines:{...SEED_ORDERS[f]},note:'',status:'submitted',submittedAt:now,updatedAt:now})}db.demo=true;log('DEMO_LOADED','',r.id);persist();render();toast('Sample orders loaded · not real data')}
function waOpen(text){const u='https://wa.me/?text='+encodeURIComponent(text);const w=window.open(u,'_blank');if(!w)location.href=u}
function orderCode(o,r){return '#FF1|'+o.farm+'|'+r.date+'|'+requested(o).map(([k,v])=>k+'='+qty(v)).join(',')+'|'+encodeURIComponent(o.note||'')}
function sendOrderWA(f){const r=currentRound(),o=r&&order(r.id,f);if(!o)return;let t=`🌿 FOOD ORDER · ${f}\n${datefmt(r.date)}\n\n`;for(const c of CATS)for(const [k,v] of requested(o)){const it=product(k);if(it&&it.cat===c)t+=`${it.name} — ${qty(v)} ${it.unit}\n`}if(o.note)t+=`\nOther: ${o.note}\n`;t+=`\n${orderCode(o,r)}`;waOpen(t)}
function sendReceipt(f){const r=currentRound(),o=r&&order(r.id,f);if(!o)return;const d=del(r.id,f);if(!d.checked)return;const bad=hasDifference(o,d);let t=`📦 FOOD RECEIVED · ${f}\n${datefmt(r.date)}\n\n`;if(!bad&&!d.issue)t+='✅ All OK — everything received.\n';else{t+='⚠ Missing / Wrong:\n';for(const [k,v] of requested(o)){const a=Number(d.actual[k]??v);if(a!==Number(v))t+=`${product(k)?.name||k} — ordered ${qty(v)}, got ${qty(a)}\n`}if(d.issue)t+=`Note: ${d.issue}\n`}t+=`\n#FR1|${f}|${r.date}|${bad?Object.entries(d.actual).map(([k,v])=>k+'='+qty(v)).join(','):'ok'}|${encodeURIComponent(d.issue||'')}`;waOpen(t)}
function leaderNewRound(){const a=currentRound();if(a)a.status='closed';db.rounds.push({id:id(),date:today(),status:'open',orderedAt:null,createdAt:new Date().toISOString()});ui.draft=null;clearDraft();ui.tab='today';log('LEADER_NEW_ORDER',ui.farm,'');persist();render()}
function openPaste(){openModal(`<h2>📥 Paste WhatsApp from Leaders</h2><p class="mut">In WhatsApp, long-press the Leader's message → Copy → paste here. You can paste several messages together. Orders go into the round on screen.</p><div class="field"><textarea id="pasteBox" rows="10" placeholder="Paste here"></textarea></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="importPasted()">Read messages</button></div>`)}
function importPasted(){const txt=document.getElementById('pasteBox').value;const r=round();if(!r){toast('Open a round first');return}const done=[],unknown=[];
 for(const m of txt.matchAll(/#FF1\|(AD [123])\|[^|]*\|([^|\n]*)\|?([^\n]*)/g)){const f=m[1],lines={};for(const p of m[2].split(',').filter(Boolean)){const [k,v]=p.split('=');if(product(k))lines[k]=Number(v)||0;else unknown.push(k)}let note='';try{note=decodeURIComponent(m[3]||'')}catch(e){note=m[3]||''}
  if(r.status!=='open'){toast('This round is already ordered — open a new round first');return}
  const now=new Date().toISOString();let o=order(r.id,f);if(o){o.lines=lines;o.note=note;o.updatedAt=now}else db.orders.push({id:id(),roundId:r.id,farm:f,lines,note,status:'submitted',submittedAt:now,updatedAt:now});if(r.skip)delete r.skip[f];done.push(f+' order');log('WA_ORDER_IMPORTED',f,r.id)}
 for(const m of txt.matchAll(/#FR1\|(AD [123])\|[^|]*\|([^|\n]*)\|?([^\n]*)/g)){const f=m[1],o=order(r.id,f);if(!o)continue;const d=del(r.id,f);let issue='';try{issue=decodeURIComponent(m[3]||'')}catch(e){issue=m[3]||''}
  if(m[2]==='ok')d.actual=Object.fromEntries(requested(o));else{d.actual={};for(const p of m[2].split(',').filter(Boolean)){const [k,v]=p.split('=');d.actual[k]=Number(v)||0}}d.issue=issue;d.checked=true;d.receiving=false;d.recheckAllowed=false;d.checkedAt=new Date().toISOString();done.push(f+' receipt');log('WA_RECEIPT_IMPORTED',f,r.id)}
 if(!done.length){toast('No Leader message found in the pasted text');return}persist();closeModal();render();toast('Read: '+done.join(', ')+(unknown.length?' · unknown items: '+unknown.join(', '):''))}
function draftKey(){return STORE+'_draft'}
function saveDraft(){try{const r=currentRound();if(ui.draft&&r)localStorage.setItem(draftKey(),JSON.stringify({...ui.draft,roundId:r.id,edit:ui.tab==='edit'}));else localStorage.removeItem(draftKey())}catch(e){}}
function clearDraft(){try{localStorage.removeItem(draftKey())}catch(e){}}
function loadDraft(f,r){try{const d=JSON.parse(localStorage.getItem(draftKey()));if(d&&d.farm===f&&r&&d.roundId===r.id&&!d.edit)return {farm:f,lines:d.lines||{},note:d.note||''}}catch(e){}return null}
function toggleSkip(f){const r=round();if(!r||r.status!=='open'||order(r.id,f))return;r.skip ||= {};if(r.skip[f])delete r.skip[f];else r.skip[f]=true;log(r.skip[f]?'FARM_SKIPPED':'FARM_UNSKIPPED',f,r.id);persist();render()}
function leaderSkip(f){const r=currentRound();if(!r||r.status!=='open'||order(r.id,f))return;if(!confirm(f+': no food needed this round?'))return;r.skip ||= {};r.skip[f]=true;ui.draft=null;clearDraft();log('FARM_SKIPPED',f,r.id);persist();render()}
function openModal(s){document.getElementById('modalBox').innerHTML=s;document.getElementById('modalOverlay').classList.add('on')}
function closeModal(){document.getElementById('modalOverlay').classList.remove('on')}
function exportJSON(){const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='FoodFlow_Backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importFile(input){let f=input.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const p=JSON.parse(reader.result);if(!Array.isArray(p.items)||!Array.isArray(p.orders)||!Array.isArray(p.rounds))throw Error('Invalid file');if(!confirm('Replace the current data on THIS device with imported file? Export a backup first.'))return;let backup=JSON.stringify(db);localStorage.setItem(STORE+'_preimport',backup);db={...p,delivery:p.delivery||{},received:p.received||{},audit:p.audit||[],demo:!!p.demo};ui.roundId=null;ui.farm=null;ui.tab='today';ui.draft=null;persist();render();toast('Imported safely · old local data backed up')}catch(e){alert('Import failed: '+e.message)}finally{input.value=''}};reader.readAsText(f)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
if(FIXED)ui.farm=FIXED;if(OWNER)ui.role='admin';else document.querySelector('.mode').style.display='none';
render();
</script></body></html>
