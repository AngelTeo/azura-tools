<script>
'use strict';
const APP_VERSION = 9;
const SB_URL = 'https://dittqalvrjiamzdzrskd.supabase.co';
const SB_KEY = 'sb_publishable_OPS4DgPqKrwuv11bzy7ceA_VtzJ9x8t';
const QS = new URLSearchParams(location.search);

/* ================= shared ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));
const RM = n => 'RM ' + (Math.round(Number(n)*100)/100).toFixed(2);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function klToday(){ const q = QS.get('today'); if(/^\d{4}-\d{2}-\d{2}$/.test(q||'')) return q; return new Date(Date.now() + 8*3600e3).toISOString().slice(0,10); }
const addD = (s,n) => { const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return iso(d); };
const dm = s => { const d = new Date(String(s).slice(0,10)+'T00:00:00'); return `${d.getDate()}/${d.getMonth()+1}`; };

function openModal(h){ $('#modalBox').innerHTML = h; $('#modalOverlay').classList.add('on'); }

function lsGet(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;
async function rpc(name, p){
  if(!sb) throw new Error('No connection');
  const {data, error} = await sb.rpc(name, {p: p || {}});
  if(error) throw new Error(String(error.message || 'Error').replace(/^.*?ERROR:\s*/, ''));
  return data;
}

function icon(label, given){ if(given) return given; const k = String(label||'').toUpperCase(); if(ICONS[k]) return ICONS[k]; for(const w in ICONS) if(k.includes(w)) return ICONS[w]; return '📦'; }
const isAlcohol = label => /WHISK|BEER|ARAK|KAPAK|SAMSU|TODDY|WINE|BRANDY|\bRUM\b|VODKA|ALCOHOL|TIGER|GUINNESS|ANCHOR/i.test(String(label||''));

/* item photos: managers upload them (bucket "shop-items", public read); groceries fall back to the FoodOrder photos */
const PHOTO_BUCKET = 'shop-items';
const photoUrl = p => p ? `${SB_URL}/storage/v1/object/public/${PHOTO_BUCKET}/${p}` : null;
function itemPhoto(it){ if(!it) return null; if(it.photo) return photoUrl(it.photo); if(it.kind === 'FOOD' && it.code) return `foodflow_img/${it.code}.jpg`; return null; }
function icoBox(it, label, small){
  const u = itemPhoto(it), em = icon(label, it && it.icon), sm = small ? `<small>${small}</small>` : '';
  if(!u) return `<div class="ico">${em}${sm}</div>`;
  return `<span class="ico photo"><img class="${it.photo ? 'fit' : ''}" src="${esc(u)}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('photo');this.parentNode.innerHTML='${em}'">${sm}</span>`; }
/* tap a photo → full screen; tap anywhere to close */
function zoomImg(u){ let o = document.getElementById('zoomOv'); if(!o){ o = document.createElement('div'); o.id = 'zoomOv'; o.onclick = () => o.classList.remove('on'); document.body.appendChild(o); }
  o.innerHTML = `<img src="${esc(u)}" alt=""><span>✕</span>`; o.classList.add('on'); }
async function shrinkPhoto(file, max = 640){
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Not a photo')); i.src = URL.createObjectURL(file); });
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.82)); }

/* grocery round: the 15th and the last day of the month; order by 4 days before (same rule as the database) */
function foodRound(ref){ const t0 = new Date((ref||klToday())+'T00:00:00');
  for(let m = 0; m < 3; m++){ const y = t0.getFullYear(), mo = t0.getMonth()+m;
    for(const day of [15, new Date(y, mo+1, 0).getDate()]){ const del = new Date(y, mo, day), cut = new Date(y, mo, day-4); if(cut >= t0) return {deliver: iso(del), order: iso(cut)}; } } }

/* managers: one system, two tabs — Leader (the exact Leader screen, AD 1 / 2 / 3) and Management */
const Shell = (() => {
  let tab = 'leader', B0 = null, ownerOn = false, boot0 = false;   // boot0: the board loaded at opening is still fresh
  function bar(){ const n = $('#modetabs'); n.hidden = false;
    const zh = Owner.lang() === 'zh';
    n.innerHTML = [['leader', zh ? '🧑‍🌾 工头画面' : '🧑‍🌾 Leader'],['mgmt', zh ? '📋 管理' : '📋 Management']].map(([k,v]) => `<button class="${tab===k?'on':''}" onclick="Shell.show('${k}')">${v}</button>`).join(''); }
  async function show(t){
    tab = t === 'mgmt' ? 'mgmt' : 'leader'; lsSet('runcit_tab', tab); bar(); scrollTo(0,0);
    if(tab === 'mgmt'){ const fresh = boot0; boot0 = false; if(!ownerOn){ ownerOn = true; Owner.start(B0); if(fresh) return; } return Owner.refresh(); }
    boot0 = false; return Leader.startManager();
  }
  function start(B){ B0 = B; boot0 = true; document.body.classList.add('mgr'); return show(lsGet('runcit_tab', 'leader')); }
  return {start, show, bar, tab: () => tab};
})();

  function weekStrip(){ const t = B.today, d0 = new Date(t+'T00:00:00'), mon = addD(t, -((d0.getDay()+6)%7)), trip = nextTrip(), F = foodRound(t);

    for(const l of ls){ const s = HO[l.id], tot = l.qty * l.buy.price;
      const money = l.kind === 'PERSONAL' ? Z(`Deduct from salary: ${RM(tot)}`, `从薪水扣：${RM(tot)}`) : l.kind === 'FARM' ? Z(`Farm cost ${RM(tot)} · no deduction`, `园里开销 ${RM(tot)} · 不扣薪`)
        : l.kind === 'FOOD' ? Z(`${RM(tot)} · part of Groceries ${RM(foodTot)}`, `${RM(tot)} · 买菜合计 ${RM(foodTot)} 的一部分`) : `${RM(tot)} ÷ ${s.ws.length} = ${s.ws.length ? RM(tot/s.ws.length) : '—'} ${Z('each','每人')}`;
      h += `<div class="food ${s.on?'chosen':''}" style="margin-bottom:8px;flex-wrap:wrap"><input type="checkbox" style="width:24px;height:24px;min-height:24px" ${s.on?'checked':''} onchange="Owner.hoTick('${l.id}',this.checked)">${icoBox(IT(l.item_id), lname(l))}
        <div class="foodname"><b>${esc(lname(l))} × ${l.qty}</b><small class="loc">${esc(who(l))}${l.detail ? ' · 📝 ' + esc(l.detail) : ''}</small><small>${money} · ${Z('bought','买于')} ${dm(l.bought_at)}${l.buy.paid_by ? Z(' by ',' · 付钱：') + esc(l.buy.paid_by) : ''}</small></div><button class="btn small light" onclick="Owner.unbuy('${l.id}')">${Z('Undo','撤回')}</button>
        ${l.kind === 'SHARED' ? shareBox(l.id, ws) : ''}</div>`; }
    const fl = ls.filter(l => l.kind === 'FOOD');
    if(fl.length){ const s = HO[fl[0].id]; h += `<div class="card" style="padding:12px"><b>🥬 ${Z('Groceries','买菜')} ${RM(foodTot)} ÷ ${s.ws.length} = ${s.ws.length ? RM(foodTot/s.ws.length) : '—'} ${Z('each','每人')}</b><div class="hint">${Z('Untick anyone who does not share food.','不分伙食的人不要勾。')}</div>${shareBox(fl[0].id, ws, true)}</div>`; }
    const n = ls.filter(l => HO[l.id] && HO[l.id].on && hoWs(l).length !== 0).length;
    return h + `<div class="bottom" id="bottombar"><button class="btn primary" ${n?'':'disabled'} onclick="Owner.handOver('${farm}')">${Z(`✓ Handed over (${n}) · write to Salary`, `✓ 已交货 (${n}) · 写进 Salary`)}</button></div>`;
  }
  function shareBox(id, ws, food){ const s = HO[id]; return `<div style="flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${ws.map(w => `<button class="pill ${s.ws.includes(w.id)?'on':''}" style="min-height:34px;padding:5px 10px" onclick="Owner.toggleShare('${id}','${w.id}',${!!food})">${esc(w.name)}</button>`).join('')}</div>`; }
  function hoWs(l){ if(l.kind === 'PERSONAL' || l.kind === 'FARM') return [1]; if(l.kind === 'FOOD'){ const f = bought().find(x => x.kind === 'FOOD' && x.farm === l.farm); return HO[f.id] ? HO[f.id].ws : []; } return HO[l.id].ws; }
  function toggleShare(id, w){ const s = HO[id]; s.ws = s.ws.includes(w) ? s.ws.filter(x => x !== w) : [...s.ws, w]; render(); }
  function hoTick(id, on){ HO[id].on = on; render(); }
  function hoDate(v){ ui.date = v; }
  async function unbuy(id){ const l = B.lines.find(x => x.id === id); if(!confirm(Z(`Undo "bought" for ${lname(l)} (${who(l)})? It goes back to the list.`, `撤回「买了」：${lname(l)}（${who(l)}）？会回到清单上。`))) return; delete HO[id]; await act('shop_owner_unbuy', {id}, Z('Back on the list','已回到清单')); }
  async function handOver(farm){
    const ls = bought().filter(l => l.farm === farm && HO[l.id] && HO[l.id].on && hoWs(l).length);
    const lines = ls.map(l => ({id:l.id, share_ids: l.kind === 'SHARED' || l.kind === 'FOOD' ? hoWs(l) : undefined}));
    const tot = ls.reduce((s,l) => s + l.qty * l.buy.price, 0);
    if(!confirm(Z(`Hand over ${ls.length} line(s) for ${farm}, total ${RM(tot)}? This writes to Salary.`, `${farm} 交货 ${ls.length} 样，合计 ${RM(tot)}？会写进 Salary。`))) return;
    const r = await act('shop_owner_hand', {lines, date: ui.date || B.today}, r => Z(`${r.count} handed over · written to ${r.month}`, `${r.count} 样已交货 · 写进 ${r.month}`));
    if(r) for(const l of ls) delete HO[l.id];
  }

      ${SP.kind === 'PERSONAL' ? `<div class="sectionhead">4 · ${Z('Who','谁')}</div><div class="pills" style="flex-wrap:wrap">${workers(SP.farm).map(w => `<button class="pill ${SP.worker===w.id?'on':''}" onclick="Owner.sp({worker:'${w.id}'})">${esc(w.name)}</button>`).join('')}</div>` : ''}
      <div class="titleline" style="margin-top:6px"><span>${Z('Quantity','数量')}</span><div class="step"><button onclick="Owner.sp({qty:Math.max(1,${SP.qty}-1)})">−</button><input class="count" readonly value="${SP.qty}"><button class="plus" onclick="Owner.sp({qty:${SP.qty}+1})">+</button></div></div>

  function shareSp(){ return `<div style="display:flex;gap:6px;flex-wrap:wrap">${workers(SP.farm).map(w => `<button class="pill ${SP.ws.includes(w.id)?'on':''}" style="min-height:34px;padding:5px 10px" onclick="Owner.spWs('${w.id}')">${esc(w.name)}</button>`).join('')}</div>`; }
  function sp(o){ SP = {...SP, ...o}; render(); }

  async function spot(mode){
    const p = {farm:SP.farm, kind:SP.kind, worker_id: SP.kind === 'PERSONAL' ? SP.worker : undefined, qty:SP.qty, mode};
    if(SP.item) p.item_id = SP.item; else p.custom_name = SP.custom.trim();
    if((SP.detail||'').trim()) p.detail = SP.detail.trim();
    if(mode === 'TAKEN'){ p.price = SP.price; p.paid_by = ME(); if(SP.kind === 'SHARED') p.share_ids = SP.ws;
      if(!confirm(Z(`Write ${RM(SP.price*SP.qty)} now?`, `马上记 ${RM(SP.price*SP.qty)}？`))) return; }
    const r = await act('shop_owner_spot', p, mode === 'TAKEN' ? Z('Written now','已经记了') : Z('Added to the next trip — the Leader sees it too','已加进下一趟 — 工头也看得到'));

  }

    if(pin && !/^\d{4}$/.test(pin)) return toast(Z('PIN must be 4 digits','PIN 要 4 位数字')); closeModal();
    await act('shop_owner_leader_set', {worker_id:w, role, farm, pin: pin || undefined}, Z('Master list saved','总名单已存')); }
  function pinFor(wid){ openModal(`<h2>${Z('New PIN','新 PIN')} · ${esc(wname(wid))}</h2><div class="field"><input id="plpin" inputmode="numeric" maxlength="4" placeholder="${Z('4 digits','4 位数字')}"></div><div class="modalfoot"><button class="btn" onclick="closeModal()">${Z('Cancel','取消')}</button><button class="btn primary" onclick="Owner.savePin('${wid}')">${Z('Save PIN','存 PIN')}</button></div>`); }
  async function savePin(wid){ const pin = $('#plpin').value.trim(); if(!/^\d{4}$/.test(pin)) return toast(Z('PIN must be 4 digits','PIN 要 4 位数字'));
    const l = B.leaders.find(x => x.worker_id === wid); closeModal(); await act('shop_owner_leader_set', {worker_id:wid, role:l.role, farm:l.farm, pin}, Z('PIN saved','PIN 已存')); }
  async function unlead(wid){ if(!confirm(Z(`Take ${wname(wid)} off the master list? Their phone stops working at once.`, `把 ${wname(wid)} 从总名单拿掉？他的手机马上不能用。`))) return; await act('shop_owner_leader_set', {worker_id:wid, role:'NONE'}, Z('Removed','已拿掉')); }
  function approve(id){ const p = B.phones.find(x => x.id === id);
    if(!B.leaders.length) return toast(Z('Set the Leaders on the master list first','先在总名单设好工头'));
    openModal(`<h2>${Z('Approve phone','批准手机')} ${esc(p.code)}</h2><div class="hint">${Z("Check the code on the Leader's phone matches.",'确认工头手机上的码一样。')}</div><div class="field"><label>${Z('Whose phone is this?','这是谁的手机？')}</label><select id="apw">${B.leaders.map(l => `<option value="${l.worker_id}">${esc(l.name)} · ${l.role === 'CHIEF' ? Z('Chief','总工头') : l.farm}</option>`).join('')}</select></div>
      <div class="modalfoot"><button class="btn" onclick="closeModal()">${Z('Cancel','取消')}</button><button class="btn primary" onclick="Owner.saveApprove('${id}')">${Z('✓ Approve','✓ 批准')}</button></div>`); }
  async function saveApprove(id){ const w = $('#apw').value; closeModal(); await act('shop_owner_phone_set', {id, worker_id:w, status:'ACTIVE'}, Z('Phone approved · the Leader types the PIN','手机已批准 · 工头输入 PIN 就能用')); }
  async function lockPhone(id){ const p = B.phones.find(x => x.id === id); if(!confirm(Z(`Lock phone ${p.code}${p.person ? ' (' + p.person + ')' : ''}? It will show nothing.`, `锁住手机 ${p.code}${p.person ? '（' + p.person + '）' : ''}？锁了以后什么都看不到。`))) return;
    await act('shop_owner_phone_set', {id, status:'REVOKED'}, Z('Phone locked','手机已锁')); }

  /* ---------- Items & prices ---------- */
  function pricesPage(){
    let h = `<div class="hero"><div><h1>🏷 ${Z('Items & prices','物品和价钱')}</h1><div class="sub">${Z('Usual prices show as buttons when you tick "Bought"','按「买了」时，常用价钱会变成按钮')}</div></div>${back()}</div>`;
    for(const k of ['PERSONAL','SHARED','FARM','FOOD']){
      h += `<div class="sectionhead">${KINDS[k].ico} ${KINDS[k].name}${k === 'FOOD' ? '' : ` <button class="btn small light" style="margin-left:8px" onclick="Owner.addItem('${k}')">${Z('+ Add item','+ 加物品')}</button>`}</div><div class="card" style="padding:8px 14px">`;
      for(const i of B.items.filter(x => x.kind === k)) h += `<div class="line" style="flex-wrap:wrap"><span style="display:flex;gap:10px;align-items:center;min-width:0">${icoBox(i, i.label)}<span><b>${esc(i.label)}</b>${i.unit ? ` <span class="mut">${esc(i.unit)}</span>` : ''}<br>${(i.prices||[]).map(p => `<span class="tag ${p == i.default ? 'ok' : ''}">${p}</span>`).join(' ') || `<span class="mut">${Z('no price','没价钱')}</span>`}</span></span>
        <span class="btnrow"><button class="btn small light" onclick="Owner.editPrice('${i.id}')">${Z('Price','价钱')}</button><button class="btn small light" onclick="Owner.photo('${i.id}')">📷 ${i.photo ? Z('Change photo','换照片') : Z('Add photo','加照片')}</button>${i.photo ? `<button class="btn small light" onclick="Owner.photoDel('${i.id}')">✕</button>` : ''}${k === 'FOOD' ? '' : `<button class="btn small light" onclick="Owner.moveItem('${i.id}')">${Z('Move','换类')}</button><button class="btn small ${i.mgr_only?'gold':'light'}" onclick="Owner.mgrOnly('${i.id}',${!i.mgr_only})">${i.mgr_only ? Z('🔒 Managers only','🔒 只给管理层') : Z('Managers only?','只给管理层？')}</button>`}</span></div>`;
      h += '</div>'; }
    return h;
  }
  function editPrice(id){ const i = IT(id); openModal(`<h2>${esc(i.label)}</h2><div class="field"><label>${Z('Usual prices (RM), separated by commas','常用价钱 (RM)，用逗号分开')}</label><input id="pp" value="${(i.prices||[]).join(', ')}"></div>
      <div class="field"><label>${Z('Most common price','最常用的价钱')}</label><input id="pd" type="number" step="0.01" value="${i.default ?? ''}"></div>
      <div class="modalfoot"><button class="btn" onclick="closeModal()">${Z('Cancel','取消')}</button><button class="btn primary" onclick="Owner.savePrice('${id}')">${Z('Save','存')}</button></div>`); }
  async function savePrice(id){ const ps = $('#pp').value.split(/[,\s]+/).map(Number).filter(x => x > 0), d = Number($('#pd').value) || null;
    if(d && !ps.includes(d)) ps.push(d); closeModal(); await act('shop_owner_prices_set', {item_id:id, prices:ps, default:d}, Z('Prices saved','价钱已存')); }
  async function addItem(kind){ const n = prompt(Z(`New ${KINDS[kind].name} item name`, `新的「${KINDS[kind].name}」物品名称`)); if(!n || !n.trim()) return;
    const id = await act('shop_owner_item_add', {label:n.trim(), kind}, Z('Item added','物品已加'));
    if(id && confirm(Z('Add a photo for it now?','现在帮它加照片吗？'))) photo(id); }
  /* photos: pick or take a picture → made small on the phone → uploaded → shown to Leaders at once */
  function photo(id){ const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none'; document.body.appendChild(inp);
    inp.onchange = async () => { const f = inp.files[0]; inp.remove(); if(!f) return; busy(1);
      try { const blob = await shrinkPhoto(f), path = `${id}/${Date.now()}.jpg`;
        const {error} = await sb.storage.from(PHOTO_BUCKET).upload(path, blob, {contentType:'image/jpeg', upsert:false});
        if(error) throw new Error(error.message);
        busy(0); await act('shop_owner_photo_set', {item_id:id, path}, Z('Photo saved','照片已存'));
      } catch(e){ busy(0); toast(Z('Photo not saved: ','照片没存到：') + e.message); } };
    inp.click(); }
  async function photoDel(id){ if(!confirm(Z('Remove this photo?','拿掉这张照片？'))) return; await act('shop_owner_photo_set', {item_id:id, path:null}, Z('Photo removed','照片已拿掉')); }
  function moveItem(id){ const i = IT(id);
    openModal(`<h2>${esc(i.label)}</h2><div class="hint" style="margin-bottom:10px">${Z('Move to another list','换到别的类')}</div><div class="farmgrid">${['FARM','PERSONAL','SHARED'].map(k => `<button class="farmcard" style="min-height:80px" ${i.kind===k?'disabled':''} onclick="Owner.saveMove('${id}','${k}')"><span style="font-size:26px">${KINDS[k].ico}</span><b style="font-size:16px">${KINDS[k].name}</b><span class="mut" style="font-size:12px">${KINDS[k].sub}</span></button>`).join('')}</div>
      <div class="modalfoot"><button class="btn" onclick="closeModal()">${Z('Cancel','取消')}</button></div>`); }
  async function saveMove(id, k){ closeModal(); await act('shop_owner_item_move', {item_id:id, kind:k}, Z('Moved','已换类')); }

  /* ---------- Records (last 35 days) with void ---------- */
  function recordsPage(){
    const W = B.written, f = ui.f || 'ALL', ok = x => f === 'ALL' || x.farm === f;
    const row = (x, txt, to, fn) => `<div class="line" style="${x.void ? 'opacity:.45;text-decoration:line-through' : ''}"><span><b>${dm(x.date)}</b> · ${x.farm} · ${txt} <span class="mut">${to}</span></span><span><strong>${RM(x.amount)}</strong> ${x.void ? '' : `<button class="btn small light" onclick="Owner.voidRec('${fn}','${x.id}')">${Z('Void','作废')}</button>`}</span></div>`;
    const all = [...W.personal.filter(ok).map(x => ({x, h: row(x, `${esc(x.worker)} · ${esc(x.item)}${x.qty > 1 ? ' × ' + x.qty : ''}`, 'Salary Personal', 'shop_owner_void')})),
                 ...W.shared.filter(ok).map(x => ({x, h: row(x, `${esc(x.item)} ÷ ${x.n}`, 'Salary Food', 'shop_owner_share_void')})),
                 ...W.farm.filter(ok).map(x => ({x, h: row(x, `${esc(x.item)}${x.qty > 1 ? ' × ' + x.qty : ''}`, 'Farm cost', 'shop_owner_cost_void')}))]
                 .sort((a,b) => String(b.x.date).localeCompare(String(a.x.date)));
    return `<div class="hero"><div><h1>📒 ${Z('Records','记录')}</h1><div class="sub">${Z('What hand-over wrote · last 35 days','交货写进去的 · 最近 35 天')}</div></div>${back()}</div>
      <div class="pills">${['ALL', ...FARMS].map(x => `<button class="pill ${f===x?'on':''}" onclick="Owner.go('records',{f:'${x}'})">${x === 'ALL' ? Z('All','全部') : x}</button>`).join('')}</div>
      <div class="card" style="padding:8px 14px">${all.length ? all.map(a => a.h).join('') : `<div class="empty">${Z('Nothing written yet.','还没有记录。')}</div>`}</div>
      <div class="hint">${Z('Void takes the line out of Salary too. It cannot be undone — enter it again if needed.','作废会连 Salary 那笔一起作废，不能复原 — 需要的话重新记一次。')}</div>`;
  }
  async function voidRec(fn, id){ if(!confirm(Z('Void this record? It is taken out of Salary.','作废这笔？Salary 那笔也会作废。'))) return; await act(fn, {id}, Z('Voided','已作废')); }

  function render(){
    $('#app').innerHTML = ({buy:buyPage, item:itemPage, food:foodPage, hand:handPage, spot:spotPage, med:medPage, people:peoplePage, prices:pricesPage, records:recordsPage}[ui.view] || home)();
    spotBar(); medBar();
  }
  return {start, refresh, setLang, lang, go, setDay, setMe, alc, copyList, buySheet, bsSet, bsTick, bsPrice, confirmBuy, nobuy, finishTrip, copySup, copyWa, printSup,
          hoTick, hoDate, toggleShare, unbuy, handOver, sp, spWs, spCustom, spPrice, spot, pickLeader, saveLeader, pinFor, savePin, unlead,
          approve, saveApprove, lockPhone, editPrice, savePrice, addItem, photo, photoDel, moveItem, saveMove, md, mdAmt, medSave, mgrOnly, editLine, edSet, saveEdit, spDet, voidRec, _state: () => ({B, ui, HO, SP, MD, ED})};
})();


window.addEventListener('load', boot);

</script>
</body></html>
