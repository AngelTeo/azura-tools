<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1b19">
<meta name="robots" content="noindex">
<title>Kedai Runcit</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f0eb;--white:#fff;--border:#d8d5ce;--border2:#c4c0b8;--text:#1c1b19;--muted:#8a857c;
  --acc:#1A56A0;--accl:#ddeaff;--accd:#0f3d78;--ok:#2f6b3f;--okl:#e3f1e6;--bad:#a33a2c;--badl:#fbe9e6;--warn:#8a6418;--warnl:#fbf1dc;
  --bar:#1c1b19;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;font-size:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--bar);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.top b{font-size:17px}
.top .farm{margin-left:auto;background:#fff2;border-radius:6px;padding:4px 10px;font-weight:600;font-size:14px}
.tabs{display:flex;gap:4px;margin-left:16px}
.tab{border:0;background:none;color:#aaa;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:500;font-size:13px}
.tab.on{background:var(--acc);color:#fff}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 120px}
.wide{max-width:980px}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.lbl{font-size:13px;color:var(--muted);margin:2px 0 8px;display:flex;justify-content:space-between;align-items:center}
.lbl b{color:var(--text);font-weight:600}
.lnk{color:var(--acc);font-weight:600;cursor:pointer;background:none;border:0;font-size:13px}
.g{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.opt{border:1.5px solid var(--border);background:var(--white);border-radius:10px;min-height:48px;padding:8px 6px;font-weight:600;cursor:pointer;text-align:center;line-height:1.2;user-select:none}
.opt.on{border-color:var(--acc);background:var(--accl);color:var(--accd)}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.opt.name{text-align:left;padding-left:12px;font-weight:500}
.opt.name.on{font-weight:700}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:48px;height:48px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:22px;font-weight:600;cursor:pointer}
.qty span{min-width:40px;text-align:center;font-size:22px;font-weight:700;font-family:'IBM Plex Mono',monospace}
.in{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px;background:#fff;font-size:16px}
.in:focus{outline:none;border-color:var(--acc)}
.chg{margin-top:6px;font-size:13px;color:var(--warn)}
.sumbar{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--border);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));z-index:6}
.sumbar .inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.sumbar .txt{flex:1;font-size:14px;line-height:1.3}
.sumbar .txt b{font-size:18px;font-family:'IBM Plex Mono',monospace}
.save{border:0;background:var(--ok);color:#fff;font-weight:700;border-radius:10px;padding:14px 22px;font-size:16px;cursor:pointer;min-width:120px}
.save:disabled{background:var(--border2);cursor:default}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #eee}
.row:first-child{border-top:0}
.row .m{flex:1;min-width:0}
.row .m div{font-weight:600}
.row .m small{color:var(--muted)}
.row .amt{font-family:'IBM Plex Mono',monospace;font-weight:500}
.undo{border:1px solid var(--bad);color:var(--bad);background:#fff;border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer}
.gate{max-width:420px;margin:60px auto;text-align:center;padding:0 16px}
.gate .code{font-family:'IBM Plex Mono',monospace;font-size:34px;letter-spacing:.12em;background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin:18px 0}
.gate p{color:var(--muted);line-height:1.5}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--bar);color:#fff;padding:10px 18px;border-radius:8px;z-index:20;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.err{color:var(--bad);font-weight:600;margin-top:8px;font-size:14px}
.sheet{position:fixed;inset:0;background:#0006;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px;max-height:85vh;overflow:auto;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.sheet h3{margin-bottom:12px}
.btn{border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.red{color:var(--bad);border-color:var(--bad)}
/* owner */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid #eee;vertical-align:top}
td.n{text-align:right;font-family:'IBM Plex Mono',monospace}
tr.void td{color:#bbb;text-decoration:line-through}
.pill{display:inline-block;border-radius:5px;padding:2px 7px;font-size:12px;font-weight:600}
.pill.w{background:var(--warnl);color:var(--warn)}.pill.ok{background:var(--okl);color:var(--ok)}.pill.bad{background:var(--badl);color:var(--bad)}.pill.gr{background:#eee;color:#777}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.kpi small{color:var(--muted);font-size:12px}.kpi b{display:block;font-size:20px;font-family:'IBM Plex Mono',monospace;margin-top:2px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--border);background:#fff;border-radius:16px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--bar);color:#fff;border-color:var(--bar)}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchip{border:1px solid var(--border);border-radius:7px;padding:4px 8px;font-family:'IBM Plex Mono',monospace;font-size:13px}
.pchip.def{border-color:var(--ok);background:var(--okl)}
.demo{background:var(--warnl);color:var(--warn);text-align:center;font-size:12px;padding:4px;font-weight:600}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}.tabs{margin-left:6px}.tab{padding:6px 8px}.hide-m{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const VER = 'v1';
const APP_VERSION = 1;
const SB_URL = 'https://dittqalvrjiamzdzrskd.supabase.co';
const SB_KEY = 'sb_publishable_OPS4DgPqKrwuv11bzy7ceA_VtzJ9x8t';
const QS = new URLSearchParams(location.search);
const DEMO = QS.get('demo');            // ?demo=leader | ?demo=owner | ?demo=pending
const FORCE_LEADER = QS.has('leader');  // Owner 想看 Leader 画面时用
const KEY_NAME = 'runcit_device_key';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rm = n => 'RM ' + (Math.round(Number(n)*100)/100).toLocaleString('en-MY', {minimumFractionDigits: Number(n)%1 ? 2 : 0, maximumFractionDigits: 2});
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); }
function klDate(offset){ const d = new Date(Date.now() + 8*3600e3 - offset*864e5); return d.toISOString().slice(0,10); }
function dmy(iso){ const [y,m,d] = String(iso).slice(0,10).split('-'); return d + '/' + m; }
function hm(ts){ const d = new Date(ts); return d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}); }

function deviceKey(){
  let k = null;
  try { k = localStorage.getItem(KEY_NAME); } catch(e){}
  if(!k){ k = uuid(); try { localStorage.setItem(KEY_NAME, k); } catch(e){} }
  return k;
}

// ================= 资料层：真的走 Supabase；?demo= 走假资料（同一组函数）=================
const sb = (!DEMO && window.supabase) ? window.supabase.createClient(SB_URL, SB_KEY) : null;
async function rpc(name, p){
  if(DEMO) return MOCK.call(name, p);
  const {data, error} = await sb.rpc(name, {p});
  if(error) throw new Error(error.message.replace(/^.*?:\s*/, '') || 'Error');
  return data;
}

const MOCK = (() => {
  const names = ['AUNG KO','HAN NAING THU','KYAW MIN','MAUNG MAUNG','MIN THU','NAY LIN','PHO THAE','SAN WIN','THET NAING','ZAW ZAW','AYE KO','WIN NAING'].sort();
  const W = names.map((n,i) => ({id:'w'+i, name:n}));
  const items = [
    {id:'i1', label:'ROKOK', prices:[54,50,56,90,36], default:54},
    {id:'i2', label:'WHISKEY', prices:[25,17,20,50,56], default:25},
    {id:'i3', label:'TOP UP', prices:[35,30,50], default:35},
    {id:'i4', label:'CIGARETTES', prices:[100,50], default:100},
    {id:'i5', label:'BAJU', prices:[36,40,42], default:36},
  ];
  const entries = [];
  const now = Date.now();
  [['w2','i1',1,54,54,0],['w5','i2',2,25,25,1],['w7','i3',1,35,35,1],['w0','i1',1,60,54,2],['w9','i2',1,17,25,3]].forEach((r,i) =>
    entries.push({id:'e'+i, workerId:r[0], worker:W.find(w=>w.id===r[0]).name, item:items.find(x=>x.id===r[1]).label, qty:r[2], price:r[3], default:r[4], amount:r[2]*r[3], date:klDate(r[5]>1?1:0), at:new Date(now - (r[5]*40+3)*60e3).toISOString(), farm:'AD 1', device:'AD 1 Leader', void:false}));
  const devices = [
    {id:'d1', code:'7F3A9C', label:'AD 1 Leader', farm_code:'AD 1', status:'ACTIVE', requested_at:'2026-11-01T02:00:00Z', last_seen:new Date().toISOString()},
    {id:'d2', code:'B41E07', label:null, farm_code:null, status:'PENDING', requested_at:new Date(now-600e3).toISOString(), last_seen:null},
  ];
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function call(name, p){
    await wait(200);
    if(name === 'shop_hello'){
      if(DEMO === 'pending') return {status:'PENDING', code:'B41E07'};
      return {status:'ACTIVE', farm:'AD 1', today:klDate(0), workers:W, items,
        recent: entries.filter(e => !e.void).map(e => ({...e, undo: Date.now() - new Date(e.at) < 15*60e3}))};
    }
    if(name === 'shop_submit'){
      p.workers.forEach(wid => { const w = W.find(x => x.id === wid); const it = items.find(x => x.id === p.item_id);
        entries.unshift({id:'e'+Math.random(), workerId:wid, worker:w.name, item:it.label, qty:p.qty, price:p.price, default:it.default, amount:p.qty*p.price, date:p.date, at:new Date().toISOString(), farm:'AD 1', device:'AD 1 Leader', void:false}); });
      return {ok:true, count:p.workers.length};
    }
    if(name === 'shop_undo' || name === 'shop_owner_void'){ const e = entries.find(x => x.id === (p.entry_id || p.id)); e.void = true; e.void_by = name==='shop_undo'?'LEADER':'OWNER'; return {ok:true}; }
    if(name === 'shop_owner_data') return {devices, items:items.map(i => ({id:i.id, label:i.label, prices:i.prices.map(x => ({price:x, default:x===i.default}))})).concat([{id:'i6', label:'PINJAM', prices:null},{id:'i7', label:'XXXXX', prices:null}]), entries:entries.filter(e => e.date.slice(0,7) === p.month).map(e => ({...e, in_salary:!e.void}))};
    if(name === 'shop_owner_device_set'){ const d = devices.find(x => x.id === p.id); Object.assign(d, {status:p.status, farm_code:p.status==='ACTIVE'?p.farm:d.farm_code, label:p.label||d.label}); return null; }
    if(name === 'shop_owner_prices_set'){ let it = items.find(x => x.id === p.item_id); if(!it){ it = {id:p.item_id, label:p.label||'NEW', prices:[], default:null}; items.push(it); } it.prices = p.prices.map(Number).sort((a,b)=>a-b); it.default = Number(p.default); return null; }
    if(name === 'shop_owner_item_add'){ const id = 'i'+Math.random(); items.push({id, label:p.label.toUpperCase(), prices:[], default:null}); return id; }
    throw new Error('Unknown');
  }
  return {call};
})();

// ================= 入口 =================
async function boot(){
  const app = $('#app');
  app.innerHTML = '<div class="gate"><p>Loading…</p></div>';
  if(DEMO === 'owner') return Owner.start();
  if(!DEMO && !FORCE_LEADER && sb){
    try{
      const {data:{session}} = await sb.auth.getSession();
      if(session){
        const {data:me} = await sb.from('hub_app_user').select('role,status').eq('id', session.user.id).maybeSingle();
        if(me && me.role === 'OWNER' && me.status === 'ACTIVE') return Owner.start();
      }
    }catch(e){}
  }
  Leader.start();
}

// ================= Leader（手机）=================
const Leader = (() => {
  let D = null, F = null, busy = false;
  const fresh = () => ({workers:[], item:null, price:null, other:'', qty:1, date:D.today || klDate(0), client:uuid()});

  async function start(){
    try{ D = await rpc('shop_hello', {device_key: deviceKey(), ua: navigator.userAgent}); }
    catch(e){ return gate(e.message === 'Too many phones waiting' ? 'Please try again later.' : 'This page is not available.'); }
    if(D.status !== 'ACTIVE'){
      $('#app').innerHTML = (DEMO?'<div class="demo">DEMO</div>':'') + '<div class="gate"><h2>Waiting for approval</h2><div class="code">' + esc(D.code) + '</div><p>Show this code to the boss.<br>After approval, open this page again.</p><button class="btn" style="margin-top:16px" onclick="location.reload()">Check again</button></div>';
      return;
    }
    F = fresh(); render();
  }
  function gate(msg){ $('#app').innerHTML = '<div class="gate"><p>' + esc(msg) + '</p></div>'; }

  const item = () => D.items.find(i => i.id === F.item);
  const price = () => F.price === 'other' ? Number(F.other) : Number(F.price);
  const ready = () => F.workers.length && F.item && price() > 0 && price() <= 2000;

  function render(){
    const it = item(), p = price();
    const dates = [[klDate(0),'Today'],[klDate(1),'Yesterday'],[klDate(2),'2 days ago']];
    let h = (DEMO?'<div class="demo">DEMO · nothing is saved</div>':'')
      + '<div class="top"><b>Kedai Runcit</b><span class="farm">' + esc(D.farm) + '</span></div><div class="wrap">';

    // 1 Who
    h += '<div class="card"><div class="lbl"><b>1 · Who</b>' + (F.workers.length ? '<span>' + F.workers.length + ' picked · <button class="lnk" data-act="clearw">Clear</button></span>' : '<span>tap names</span>') + '</div>'
      + '<div class="g g2">' + D.workers.map(w => '<div class="opt name' + (F.workers.includes(w.id)?' on':'') + '" data-w="' + w.id + '">' + esc(w.name) + '</div>').join('') + '</div>'
      + (D.workers.length ? '' : '<p style="color:var(--muted)">No workers on ' + esc(D.farm) + '.</p>') + '</div>';

    // 2 What
    h += '<div class="card"><div class="lbl"><b>2 · What</b></div><div class="g g3">'
      + D.items.map(i => '<div class="opt' + (F.item===i.id?' on':'') + '" data-i="' + i.id + '">' + esc(i.label) + '</div>').join('') + '</div></div>';

    // 3 Price + qty
    if(it){
      const ps = it.prices || [];
      h += '<div class="card"><div class="lbl"><b>3 · Price</b><span>each</span></div><div class="g g4">'
        + ps.map(x => '<div class="opt' + (String(F.price)===String(x)?' on':'') + '" data-p="' + x + '">' + x + (x===it.default?'<small>usual</small>':'') + '</div>').join('')
        + '<div class="opt' + (F.price==='other'?' on':'') + '" data-p="other">Other</div></div>'
        + (F.price==='other' ? '<input class="in" id="other" inputmode="decimal" placeholder="RM" value="' + esc(F.other) + '" style="margin-top:8px">' : '')
        + (it.default != null && p > 0 && p !== Number(it.default) ? '<div class="chg">Usual price is ' + rm(it.default) + '</div>' : '')
        + '<div class="lbl" style="margin-top:14px"><b>How many</b></div><div class="qty"><button data-q="-1">−</button><span>' + F.qty + '</span><button data-q="1">+</button></div></div>';
    }

    // 4 Date
    h += '<div class="card"><div class="lbl"><b>' + (it ? '4' : '3') + ' · Date</b></div><div class="g g3">'
      + dates.map(d => '<div class="opt' + (F.date===d[0]?' on':'') + '" data-d="' + d[0] + '">' + d[1] + '<small>' + dmy(d[0]) + '</small></div>').join('') + '</div></div>';

    // Recent
    const rec = D.recent || [];
    h += '<div class="card"><div class="lbl"><b>Saved · last 3 days</b><span>' + rec.length + '</span></div>'
      + (rec.length ? rec.map(e => '<div class="row"><div class="m"><div>' + esc(e.worker) + '</div><small>' + esc(e.item) + (e.qty>1?' × '+e.qty:'') + ' · ' + dmy(e.date) + ' · ' + hm(e.at) + '</small></div><span class="amt">' + rm(e.amount) + '</span>'
          + (e.undo ? '<button class="undo" data-undo="' + e.id + '">Undo</button>' : '') + '</div>').join('') : '<p style="color:var(--muted)">Nothing yet.</p>')
      + '</div>';
    h += '<div id="err" class="err"></div></div>';

    // 底部
    const n = F.workers.length, total = n * F.qty * (p || 0);
    h += '<div class="sumbar"><div class="inner"><div class="txt">' + (ready()
        ? esc(it.label) + (F.qty>1?' × '+F.qty:'') + ' · ' + rm(p) + (n>1 ? ' · ' + n + ' workers' : '') + '<br><b>' + rm(total) + '</b>'
        : '<span style="color:var(--muted)">Pick who, what and price</span>')
      + '</div><button class="save" data-act="save"' + (ready() && !busy ? '' : ' disabled') + '>' + (busy ? 'Saving…' : 'Save') + '</button></div></div>';

    const y = window.scrollY; $('#app').innerHTML = h; window.scrollTo(0, y);
    const o = $('#other'); if(o){ o.oninput = () => { F.other = o.value.replace(/[^0-9.]/g,''); renderBar(); }; if(F.focusOther){ o.focus(); F.focusOther = false; } }
  }
  function renderBar(){ // 打字时只更新底部，不重画整页
    const it = item(), p = price(), n = F.workers.length;
    $('.sumbar .txt').innerHTML = ready() ? esc(it.label) + (F.qty>1?' × '+F.qty:'') + ' · ' + rm(p) + (n>1 ? ' · ' + n + ' workers' : '') + '<br><b>' + rm(n*F.qty*p) + '</b>' : '<span style="color:var(--muted)">Pick who, what and price</span>';
    $('.save').disabled = !ready() || busy;
  }

  document.addEventListener('click', async ev => {
    if(!F) return;
    const t = ev.target.closest('[data-w],[data-i],[data-p],[data-q],[data-d],[data-act],[data-undo]'); if(!t) return;
    if(t.dataset.w){ const id = t.dataset.w; F.workers = F.workers.includes(id) ? F.workers.filter(x => x !== id) : F.workers.concat(id); }
    else if(t.dataset.i){ F.item = t.dataset.i; const it = item(); F.price = it.default != null ? String(it.default) : (it.prices && it.prices.length ? String(it.prices[0]) : 'other'); F.qty = 1; F.other = ''; }
    else if(t.dataset.p){ F.price = t.dataset.p; if(F.price === 'other') F.focusOther = true; }
    else if(t.dataset.q){ F.qty = Math.min(20, Math.max(1, F.qty + Number(t.dataset.q))); }
    else if(t.dataset.d){ F.date = t.dataset.d; }
    else if(t.dataset.act === 'clearw'){ F.workers = []; }
    else if(t.dataset.undo){ return undo(t.dataset.undo); }
    else if(t.dataset.act === 'save'){ return save(); }
    render();
  });

  async function save(){
    if(!ready() || busy) return;
    busy = true; renderBar(); $('.save').textContent = 'Saving…';
    const body = {device_key: deviceKey(), client_id: F.client, date: F.date, item_id: F.item, qty: F.qty, price: price(), workers: F.workers};
    try{
      const r = await rpc('shop_submit', body);
      toast(r.repeat ? 'Already saved' : 'Saved · ' + r.count + (r.count>1?' workers':' worker'));
      D = await rpc('shop_hello', {device_key: deviceKey()});
      const keepDate = F.date; F = fresh(); F.date = keepDate;
    }catch(e){
      busy = false; render(); $('#err').textContent = e.message === 'Failed to fetch' ? 'No internet. Try again — it will not save twice.' : e.message; return;
    }
    busy = false; render(); window.scrollTo(0,0);
  }
  async function undo(id){
    const e = (D.recent||[]).find(x => x.id === id); if(!e) return;
    if(!confirm('Undo ' + e.item + ' ' + rm(e.amount) + ' for ' + e.worker + '?')) return;
    try{ await rpc('shop_undo', {device_key: deviceKey(), entry_id: id}); toast('Undone'); D = await rpc('shop_hello', {device_key: deviceKey()}); render(); }
    catch(err){ $('#err').textContent = err.message; }
  }
  return {start};
})();

// ================= Owner（电脑 / 手机）=================
const Owner = (() => {
  let D = null, TAB = 'log', MONTH = klDate(0).slice(0,7), FARM = 'ALL', ONLYCHG = false;

  async function start(){ await load(); }
  async function load(){
    try{ D = await rpc('shop_owner_data', {month: MONTH}); }
    catch(e){ $('#app').innerHTML = '<div class="gate"><p>This page is not available.</p></div>'; return; }
    render();
  }
  function months(){ const out = []; const d = new Date(klDate(0)); for(let i=0;i<4;i++){ const x = new Date(d.getFullYear(), d.getMonth()-i, 15); out.push(x.toISOString().slice(0,7)); } return out; }
  const mLabel = m => new Date(m + '-15').toLocaleDateString('en-GB', {month:'short', year:'numeric'});

  function render(){
    const pend = D.devices.filter(d => d.status === 'PENDING').length;
    let h = (DEMO?'<div class="demo">DEMO · nothing is saved</div>':'')
      + '<div class="top"><a href="../index.html" style="color:#fff;text-decoration:none"><b>Kedai Runcit</b></a><div class="tabs">'
      + [['log','Purchases'],['prices','Prices'],['phones','Phones' + (pend ? ' · ' + pend : '')]].map(t => '<button class="tab' + (TAB===t[0]?' on':'') + '" data-tab="' + t[0] + '">' + t[1] + '</button>').join('')
      + '</div></div><div class="wrap wide">';
    h += TAB === 'log' ? logView() : TAB === 'prices' ? priceView() : phoneView();
    h += '</div>';
    $('#app').innerHTML = h;
  }

  function logView(){
    const all = D.entries, live = all.filter(e => !e.void);
    const rows = all.filter(e => (FARM==='ALL' || e.farm===FARM) && (!ONLYCHG || (e.default!=null && Number(e.price)!==Number(e.default))));
    const sum = a => a.reduce((s,e) => s + Number(e.amount), 0);
    const chg = live.filter(e => e.default!=null && Number(e.price)!==Number(e.default));
    let h = '<div class="filters">' + months().map(m => '<span class="chip' + (MONTH===m?' on':'') + '" data-month="' + m + '">' + mLabel(m) + '</span>').join('') + '</div>';
    h += '<div class="kpis"><div class="kpi"><small>Total · ' + mLabel(MONTH) + '</small><b>' + rm(sum(live)) + '</b></div>'
      + ['AD 1','AD 2','AD 3'].map(f => '<div class="kpi"><small>' + f + '</small><b>' + rm(sum(live.filter(e => e.farm===f))) + '</b></div>').join('').replace(/<div class="kpi"><small>AD 3/, '<div class="kpi hide-m"><small>AD 3') + '</div>';
    h += '<div class="filters">' + ['ALL','AD 1','AD 2','AD 3'].map(f => '<span class="chip' + (FARM===f?' on':'') + '" data-farm="' + f + '">' + (f==='ALL'?'All farms':f) + '</span>').join('')
      + '<span class="chip' + (ONLYCHG?' on':'') + '" data-chg="1">Price changed · ' + chg.length + '</span></div>';
    h += '<div class="card" style="padding:6px 10px;overflow-x:auto"><table><thead><tr><th>Date</th><th>Farm</th><th>Worker</th><th>Item</th><th class="n">Price</th><th class="n">Amount</th><th>Phone</th><th></th></tr></thead><tbody>'
      + (rows.length ? rows.map(e => {
          const changed = e.default!=null && Number(e.price)!==Number(e.default);
          return '<tr class="' + (e.void?'void':'') + '"><td>' + dmy(e.date) + ' <small style="color:var(--muted)">' + hm(e.at) + '</small></td><td>' + esc(e.farm) + '</td><td>' + esc(e.worker) + '</td><td>' + esc(e.item) + (e.qty>1?' × '+e.qty:'') + '</td>'
            + '<td class="n">' + Number(e.price) + (changed ? ' <span class="pill w">was ' + Number(e.default) + '</span>' : '') + '</td><td class="n">' + rm(e.amount) + '</td><td><small>' + esc(e.device) + '</small></td>'
            + '<td>' + (e.void ? '<span class="pill gr">Undone · ' + esc((e.void_by||'').toLowerCase()) + '</span>' : (!e.in_salary ? '<span class="pill bad">Removed in Salary</span>' : '<button class="lnk" data-void="' + e.id + '">Remove</button>')) + '</td></tr>';
        }).join('') : '<tr><td colspan="8" style="color:var(--muted);padding:20px 6px">No purchases.</td></tr>')
      + '</tbody></table></div>';
    return h;
  }

  function priceView(){
    const on = D.items.filter(i => i.prices && i.prices.length), off = D.items.filter(i => !(i.prices && i.prices.length));
    let h = '<div class="card"><div class="lbl"><b>On Kedai Runcit</b><span>Leaders see these</span></div>'
      + on.map(i => '<div class="row"><div class="m"><div>' + esc(i.label) + '</div><div class="pchips" style="margin-top:6px">' + i.prices.map(p => '<span class="pchip' + (p.default?' def':'') + '">' + Number(p.price) + '</span>').join('') + '</div></div><button class="btn" data-edit="' + i.id + '">Edit</button></div>').join('')
      + '</div>';
    h += '<div class="card"><div class="lbl"><b>Not on Kedai Runcit</b><span>Salary list only</span></div>'
      + off.map(i => '<div class="row"><div class="m"><div style="color:var(--muted)">' + esc(i.label) + '</div></div><button class="btn" data-edit="' + i.id + '">Add prices</button></div>').join('')
      + '<div class="row"><div class="m"></div><button class="btn pri" data-act="newitem">+ New item</button></div></div>';
    return h;
  }

  function phoneView(){
    const ord = {PENDING:0, ACTIVE:1, REVOKED:2};
    const ds = D.devices.slice().sort((a,b) => ord[a.status]-ord[b.status]);
    return '<div class="card"><div class="lbl"><b>Phones</b><span>A Leader opens the link · the code shows on their phone</span></div>'
      + (ds.length ? ds.map(d => '<div class="row"><div class="m"><div><span style="font-family:IBM Plex Mono,monospace">' + esc(d.code) + '</span> ' + (d.label ? '· ' + esc(d.label) : '') + '</div><small>'
          + (d.status==='ACTIVE' ? '<span class="pill ok">' + esc(d.farm_code) + '</span> ' : d.status==='PENDING' ? '<span class="pill w">Waiting</span> ' : '<span class="pill gr">Blocked</span> ')
          + (d.last_seen ? 'last used ' + dmy(d.last_seen) + ' ' + hm(d.last_seen) : 'asked ' + dmy(d.requested_at) + ' ' + hm(d.requested_at)) + '</small></div>'
          + (d.status!=='ACTIVE' ? '<button class="btn pri" data-approve="' + d.id + '">Approve</button>' : '<button class="btn red" data-block="' + d.id + '">Block</button>') + '</div>').join('')
        : '<p style="color:var(--muted)">No phones yet.</p>')
      + '</div>';
  }

  // ---- sheets ----
  function sheet(html){ const s = document.createElement('div'); s.className = 'sheet'; s.innerHTML = '<div class="box">' + html + '</div>'; s.onclick = e => { if(e.target === s) s.remove(); }; document.body.appendChild(s); return s; }

  function approve(id){
    const d = D.devices.find(x => x.id === id); let farm = d.farm_code || null;
    const s = sheet('<h3>Approve phone ' + esc(d.code) + '</h3><div class="lbl"><b>Farm</b></div><div class="g g3">' + ['AD 1','AD 2','AD 3'].map(f => '<div class="opt' + (farm===f?' on':'') + '" data-f="' + f + '">' + f + '</div>').join('') + '</div>'
      + '<div class="lbl" style="margin-top:12px"><b>Name</b><span>optional</span></div><input class="in" id="dl" placeholder="e.g. AD 1 Leader" value="' + esc(d.label||'') + '">'
      + '<div class="err" id="se"></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" data-x>Cancel</button><button class="btn pri" style="flex:1" data-ok>Approve</button></div>');
    s.addEventListener('click', async e => {
      const f = e.target.closest('[data-f]'); if(f){ farm = f.dataset.f; s.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x===f)); }
      if(e.target.closest('[data-x]')) s.remove();
      if(e.target.closest('[data-ok]')){
        if(!farm) return s.querySelector('#se').textContent = 'Pick a farm';
        try{ await rpc('shop_owner_device_set', {id, status:'ACTIVE', farm, label: s.querySelector('#dl').value}); s.remove(); toast('Approved'); load(); }
        catch(err){ s.querySelector('#se').textContent = err.message; }
      }
    });
  }

  function editPrices(id){
    const it = D.items.find(x => x.id === id);
    let ps = (it.prices||[]).map(p => Number(p.price)), def = ((it.prices||[]).find(p => p.default)||{}).price; def = def!=null ? Number(def) : null;
    const s = sheet('<h3>' + esc(it.label) + '</h3><div id="pp"></div><div style="display:flex;gap:8px;margin-top:10px"><input class="in" id="np" inputmode="decimal" placeholder="Add a price (RM)"><button class="btn" data-add>Add</button></div>'
      + '<p style="color:var(--muted);font-size:13px;margin-top:10px">Tap a price to make it the usual one. Leaders can still type another price — you will see it marked in Purchases.</p>'
      + '<div class="err" id="se"></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" data-x>Cancel</button>' + (ps.length ? '<button class="btn red" data-off>Remove from Kedai Runcit</button>' : '') + '<button class="btn pri" style="flex:1" data-ok>Save</button></div>');
    const draw = () => s.querySelector('#pp').innerHTML = ps.length ? '<div class="g g4">' + ps.sort((a,b)=>a-b).map(p => '<div class="opt' + (p===def?' on':'') + '" data-pick="' + p + '">' + p + (p===def?'<small>usual</small>':'') + '<small data-rm="' + p + '" style="color:var(--bad)">remove</small></div>').join('') + '</div>' : '<p style="color:var(--muted)">No prices yet.</p>';
    draw();
    s.addEventListener('click', async e => {
      const rmv = e.target.closest('[data-rm]'); if(rmv){ const v = Number(rmv.dataset.rm); ps = ps.filter(x => x!==v); if(def===v) def = ps[0] ?? null; return draw(); }
      const pk = e.target.closest('[data-pick]'); if(pk){ def = Number(pk.dataset.pick); return draw(); }
      if(e.target.closest('[data-add]')){ const v = Math.round(Number(s.querySelector('#np').value)*100)/100; if(!(v>0 && v<=2000)) return s.querySelector('#se').textContent = 'Price 0.01 to 2000'; if(!ps.includes(v)) ps.push(v); if(def==null) def = v; s.querySelector('#np').value=''; s.querySelector('#se').textContent=''; return draw(); }
      if(e.target.closest('[data-x]')) return s.remove();
      const off = e.target.closest('[data-off]');
      if(off || e.target.closest('[data-ok]')){
        if(!off && !ps.length) return s.querySelector('#se').textContent = 'Add at least one price';
        try{ await rpc('shop_owner_prices_set', {item_id:id, prices: off ? [] : ps, default: off ? null : def}); s.remove(); toast(off ? 'Removed' : 'Saved'); load(); }
        catch(err){ s.querySelector('#se').textContent = err.message; }
      }
    });
  }

  function newItem(){
    const s = sheet('<h3>New item</h3><input class="in" id="ni" placeholder="e.g. SABUN" maxlength="30"><p style="color:var(--muted);font-size:13px;margin-top:8px">It is also added to the Salary item list.</p><div class="err" id="se"></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" data-x>Cancel</button><button class="btn pri" style="flex:1" data-ok>Next · prices</button></div>');
    s.addEventListener('click', async e => {
      if(e.target.closest('[data-x]')) return s.remove();
      if(e.target.closest('[data-ok]')){
        const v = s.querySelector('#ni').value.trim(); if(!v) return s.querySelector('#se').textContent = 'Enter a name';
        try{ const id = await rpc('shop_owner_item_add', {label:v}); s.remove(); await load(); editPrices(id); }
        catch(err){ s.querySelector('#se').textContent = err.message; }
      }
    });
  }

  document.addEventListener('click', async ev => {
    if(!D) return;
    const t = ev.target.closest('[data-tab],[data-month],[data-farm],[data-chg],[data-void],[data-edit],[data-act],[data-approve],[data-block]'); if(!t || t.closest('.sheet')) return;
    if(t.dataset.tab){ TAB = t.dataset.tab; return render(); }
    if(t.dataset.month){ MONTH = t.dataset.month; return load(); }
    if(t.dataset.farm){ FARM = t.dataset.farm; return render(); }
    if(t.dataset.chg){ ONLYCHG = !ONLYCHG; return render(); }
    if(t.dataset.edit) return editPrices(t.dataset.edit);
    if(t.dataset.act === 'newitem') return newItem();
    if(t.dataset.approve) return approve(t.dataset.approve);
    if(t.dataset.block){ if(!confirm('Block this phone? It can no longer add purchases.')) return; await rpc('shop_owner_device_set', {id:t.dataset.block, status:'REVOKED'}); toast('Blocked'); return load(); }
    if(t.dataset.void){ const e = D.entries.find(x => x.id === t.dataset.void); if(!confirm('Remove ' + e.item + ' ' + rm(e.amount) + ' for ' + e.worker + '? It is also removed from Salary.')) return;
      try{ await rpc('shop_owner_void', {id:e.id}); toast('Removed'); load(); }catch(err){ alert(err.message); } }
  });

  return {start};
})();

boot();
</script>
</body>
</html>
