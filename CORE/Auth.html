<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users &amp; Access v3</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f2ec;--card:#fffdf8;--ink:#1f2a22;--ink2:#55605a;--ink3:#8a948e;--line:#e2ddd2;--brand:#5C1010;--green:#2f5d3f;--greenl:#e3eee5;--red:#a33a2c;--redl:#f8e3df;--amb:#9a6b00;--ambl:#fff6e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px}
header{background:var(--brand);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:17px}
header .sub{font-size:12px;opacity:.8}
.home{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:7px;padding:6px 12px;text-decoration:none;font-size:13px}
#who{margin-left:auto;font-size:12px;opacity:.9}
main{max-width:1150px;margin:0 auto;padding:18px 14px 60px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;overflow-x:auto}
h3{margin:0 0 10px;font-size:15px}
.hint{font-size:12px;color:var(--ink3);margin:0 0 10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:12px;color:var(--ink2);font-weight:500;background:#faf8f2}
.btn{font:inherit;font-size:12px;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:#fff;padding:5px 10px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.red{color:var(--red);border-color:#e6b9b1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:500}
.p-ok{background:var(--greenl);color:var(--green)}.p-bad{background:var(--redl);color:var(--red)}.p-amb{background:var(--ambl);color:var(--amb)}.p-grey{background:#eee;color:#777}
input,select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;align-items:end}
.form label{font-size:12px;color:var(--ink2);display:block;margin-bottom:3px}
.form input,.form select{width:100%}
.mx td{text-align:center}.mx td:first-child,.mx th:first-child{text-align:left}
.mx .layer{font-size:10px;color:var(--ink3);margin-left:4px}
.cell{display:inline-flex;gap:3px}
.cell label{font-size:11px;display:inline-flex;align-items:center;gap:1px;padding:2px 4px;border-radius:4px;cursor:pointer}
.cell label.on{background:var(--greenl);color:var(--green)}
.pend{color:var(--amb);font-size:10px}
#gate{max-width:420px;margin:70px auto;text-align:center}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;display:none;z-index:9;max-width:90vw}
#toast.err{background:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:8;padding:16px}
.modal{background:var(--card);border-radius:12px;padding:18px;width:100%;max-width:440px}
.modal .form{grid-template-columns:1fr}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
</style>
</head>
<body>
<header>
  <a class="home" href="../index.html">← Home</a>
  <div><h1>Users &amp; Access</h1></div>
  <div id="who"></div>
</header>
<main>
  <div id="gate" class="card" style="display:none"></div>
  <div id="app" style="display:none">
    <div class="tabs">
      <button class="tab on" data-t="people" onclick="tab('people')">Staff</button>
      <button class="tab" data-t="invite" onclick="tab('invite')">Invitations</button>
      <button class="tab" data-t="matrix" onclick="tab('matrix')">Role Access</button>
      <button class="tab" data-t="override" onclick="tab('override')">Individual Access</button>
    </div>
    <div id="v-people"></div>
    <div id="v-invite" hidden></div>
    <div id="v-matrix" hidden></div>
    <div id="v-override" hidden></div>
  </div>
</main>
<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
const APP_VERSION = 3;
const SB_URL = 'https://dittqalvrjiamzdzrskd.supabase.co';
const SB_KEY = 'sb_publishable_OPS4DgPqKrwuv11bzy7ceA_VtzJ9x8t';
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROLES_FALLBACK = [['OWNER','Owner'],['ADMIN','Admin'],['MANAGER','Manager'],['SUPERVISOR','Supervisor'],['CLERK','Clerk']];
const STATUS = {ACTIVE:['Active','p-ok'], SUSPENDED:['Suspended','p-amb'], TERMINATED:['Left','p-bad']};
const ACTS = [['can_see','View'],['can_edit','Edit'],['can_approve','Approve']];
let ME = null, MYROLE = '', CAN_EDIT = false, ROLES = ROLES_FALLBACK, SYS = [], USERS = [], INV = [], RA = [], OV = [];

function toast(t, bad){ const x = $('toast'); x.textContent = t; x.className = bad ? 'err' : ''; x.style.display = 'block'; clearTimeout(x._t); x._t = setTimeout(() => x.style.display = 'none', bad ? 6000 : 2500); }
function dbErr(e){ if(!e) return false; let m = e.message || String(e);
  if(/Failed to fetch|NetworkError/i.test(m)) m = 'No connection. Nothing was saved. Please try again.';
  else if(/row-level security|permission denied/i.test(m)) m = 'You do not have permission to do this.';
  else if(/hub_pending_invite_open_uq|duplicate key/i.test(m)) m = 'This email already has an open invitation.';
  toast(m, true); return true; }
const roleLabel = c => (ROLES.find(r => r[0] === c) || [c, c])[1];
const ownerLocked = role => role === 'OWNER' && MYROLE !== 'OWNER';
function tab(t){ document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t)); ['people','invite','matrix','override'].forEach(k => $('v-' + k).hidden = k !== t); }
function modal(html){ $('modal').innerHTML = html; $('mbg').style.display = 'flex'; }
function closeModal(){ $('mbg').style.display = 'none'; }
$('mbg').addEventListener('click', e => { if(e.target.id === 'mbg') closeModal(); });

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return gate('Please sign in', 'Sign in from the Home page first.');
  const {data:me} = await sb.from('hub_app_user').select('id,display_name,role,status').eq('id', session.user.id).maybeSingle();
  if(!me || me.status !== 'ACTIVE') return gate('No access', 'This account cannot use the system.');
  const {data:acc, error} = await sb.rpc('hub_can_access', {p_system:'AUTH'});
  const a = (acc && acc[0]) || {};
  if(error || !a.can_see) return gate('No access', 'Please ask the owner for access.');
  ME = me; MYROLE = me.role; CAN_EDIT = !!a.can_edit;
  $('who').textContent = me.display_name + ' · ' + roleLabel(me.role) + (CAN_EDIT ? '' : ' · View only');
  $('gate').style.display = 'none'; $('app').style.display = 'block';
  await loadAll();
}
function gate(title, body){ $('app').style.display = 'none'; const g = $('gate'); g.style.display = 'block';
  g.innerHTML = '<h3>' + esc(title) + '</h3><p class="hint">' + esc(body) + '</p><a class="btn pri" style="text-decoration:none;display:inline-block;padding:8px 16px" href="../index.html">Go to Home</a>'; }

async function loadAll(){
  const [r1, r2, r3, r4, r5, r6] = await Promise.all([
    sb.from('hub_option').select('code,label,sort').eq('list_code','ROLE').order('sort'),
    sb.from('hub_system').select('code,label,layer,href,sort,shown').order('sort'),
    sb.from('hub_app_user').select('id,display_name,email,role,position,status,status_reason,created_at').order('created_at'),
    sb.from('hub_pending_invite').select('id,email,display_name,role,position,invited_at,accepted_at,cancelled_at').order('invited_at', {ascending:false}),
    sb.from('hub_role_access').select('system_code,role,can_see,can_edit,can_approve'),
    sb.from('hub_user_override').select('user_id,system_code,can_see,can_edit,can_approve'),
  ]);
  for(const r of [r2, r3, r4, r5, r6]) if(r.error){ dbErr(r.error); return; }
  if(!r1.error && r1.data && r1.data.length) ROLES = r1.data.map(o => [o.code, o.label]);
  SYS = r2.data; USERS = r3.data; INV = r4.data; RA = r5.data; OV = r6.data;
  renderPeople(); renderInvite(); renderMatrix(); renderOverride();
}

function renderPeople(){
  const rows = USERS.map(u => { const [sl, sc] = STATUS[u.status] || [u.status, 'p-grey']; const lock = !CAN_EDIT || ownerLocked(u.role); const self = u.id === ME.id;
    return `<tr><td><b>${esc(u.display_name)}</b>${self ? ' <span class="pill p-grey">You</span>' : ''}</td><td>${esc(u.email || '')}</td><td>${esc(roleLabel(u.role))}</td><td>${esc(u.position || '')}</td>
      <td><span class="pill ${sc}">${sl}</span>${u.status_reason ? `<div class="hint" style="margin:2px 0 0">${esc(u.status_reason)}</div>` : ''}</td>
      <td><button class="btn" ${lock ? 'disabled' : ''} onclick="editUser('${u.id}')">Edit</button>
      ${u.status === 'ACTIVE'
        ? `<button class="btn red" ${lock || self ? 'disabled' : ''} onclick="setStatus('${u.id}','SUSPENDED')">Suspend</button> <button class="btn red" ${lock || self ? 'disabled' : ''} onclick="setStatus('${u.id}','TERMINATED')">Left company</button>`
        : `<button class="btn" ${lock ? 'disabled' : ''} onclick="setStatus('${u.id}','ACTIVE')">Reactivate</button>`}</td></tr>`; }).join('');
  const n = s => USERS.filter(u => u.status === s).length;
  $('v-people').innerHTML = `<div class="card"><h3>Staff (Active ${n('ACTIVE')} · Suspended ${n('SUSPENDED')} · Left ${n('TERMINATED')})</h3>
    <table><tr><th>Name</th><th>Email</th><th>Role</th><th>Position</th><th>Status</th><th></th></tr>${rows || '<tr><td colspan="6" class="hint">No staff yet</td></tr>'}</table></div>`;
}
function roleOptions(sel){ return ROLES.filter(r => r[0] !== 'OWNER' || MYROLE === 'OWNER').map(r => `<option value="${r[0]}" ${r[0] === sel ? 'selected' : ''}>${esc(r[1])}</option>`).join(''); }
function editUser(id){
  const u = USERS.find(x => x.id === id); const self = u.id === ME.id;
  modal(`<h3>Edit · ${esc(u.display_name)}</h3><div class="form">
    <div><label>Name</label><input id="m-name" value="${esc(u.display_name)}"></div>
    <div><label>Role</label><select id="m-role" ${self && u.role === 'OWNER' ? 'disabled' : ''}>${roleOptions(u.role)}</select></div>
    <div><label>Position</label><input id="m-pos" value="${esc(u.position || '')}"></div></div>
    <div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveUser('${id}')">Save</button></div>`);
}
async function saveUser(id){
  const name = $('m-name').value.trim(), role = $('m-role').value, pos = $('m-pos').value.trim();
  if(!name) return toast('Name is required.', true);
  const {error} = await sb.from('hub_app_user').update({display_name:name, role, position:pos || null}).eq('id', id);
  if(dbErr(error)) return; closeModal(); toast('Saved'); await loadAll();
}
function setStatus(id, st){
  const u = USERS.find(x => x.id === id); const word = {ACTIVE:'Reactivate', SUSPENDED:'Suspend', TERMINATED:'Left company'}[st];
  modal(`<h3>${word} · ${esc(u.display_name)}</h3>
    ${st === 'ACTIVE' ? '' : '<p class="hint">They will be signed out immediately.</p>'}
    <div class="form"><div><label>Reason (required)</label><input id="m-why"></div></div>
    <div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn ${st === 'ACTIVE' ? 'pri' : 'red'}" onclick="doStatus('${id}','${st}')">${word}</button></div>`);
}
async function doStatus(id, st){
  const why = $('m-why').value.trim(); if(!why) return toast('Please enter a reason.', true);
  const {error} = await sb.from('hub_app_user').update({status:st, status_reason:why}).eq('id', id);
  if(dbErr(error)) return; closeModal(); toast('Updated'); await loadAll();
}

function renderInvite(){
  const st = i => i.cancelled_at ? ['Cancelled','p-grey'] : i.accepted_at ? ['Joined','p-ok'] : ['Waiting','p-amb'];
  const rows = INV.map(i => { const [l, c] = st(i); const open = !i.cancelled_at && !i.accepted_at;
    return `<tr><td>${esc(i.email)}</td><td>${esc(i.display_name || '')}</td><td>${esc(roleLabel(i.role))}</td><td>${esc(i.position || '')}</td>
      <td>${new Date(i.invited_at).toLocaleDateString('en-GB')}</td><td><span class="pill ${c}">${l}</span></td>
      <td>${open ? `<button class="btn red" ${!CAN_EDIT || ownerLocked(i.role) ? 'disabled' : ''} onclick="cancelInvite('${i.id}')">Cancel</button>` : ''}</td></tr>`; }).join('');
  $('v-invite').innerHTML = (CAN_EDIT ? `<div class="card"><h3>Invite staff</h3>
    <p class="hint">Then tell them to open the Home page and press "First time? Set password".</p>
    <div class="form"><div><label>Email</label><input id="i-em" type="email"></div><div><label>Name</label><input id="i-name"></div>
      <div><label>Role</label><select id="i-role">${roleOptions('CLERK')}</select></div><div><label>Position</label><input id="i-pos"></div>
      <div><button class="btn pri" style="padding:7px 14px" onclick="doInvite()">Invite</button></div></div></div>` : '')
    + `<div class="card"><h3>Invitations</h3>
    <table><tr><th>Email</th><th>Name</th><th>Role</th><th>Position</th><th>Invited</th><th>Status</th><th></th></tr>${rows || '<tr><td colspan="7" class="hint">No invitations yet</td></tr>'}</table></div>`;
}
async function doInvite(){
  const email = $('i-em').value.trim().toLowerCase(), name = $('i-name').value.trim(), role = $('i-role').value, pos = $('i-pos').value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('Please enter a valid email.', true);
  if(USERS.some(u => (u.email || '').toLowerCase() === email)) return toast('This email is already on the Staff list.', true);
  const {error} = await sb.from('hub_pending_invite').insert({email, display_name:name || null, role, position:pos || null, invited_by:ME.id});
  if(dbErr(error)) return; toast('Invited ' + email); await loadAll();
}
async function cancelInvite(id){
  const i = INV.find(x => x.id === id);
  if(!confirm('Cancel the invitation for ' + i.email + '?')) return;
  const {error} = await sb.from('hub_pending_invite').update({cancelled_at:new Date().toISOString()}).eq('id', id);
  if(dbErr(error)) return; toast('Cancelled'); await loadAll();
}

const LAYER_NAME = {CORE:'Admin', HUB:'Master Data', OPR:'Operations', BIZ:'Sales', RPT:'Reports'};
function raOf(sys, role){ return RA.find(r => r.system_code === sys && r.role === role) || {can_see:false, can_edit:false, can_approve:false}; }
function renderMatrix(){
  const head = '<tr><th>System</th>' + ROLES.map(r => `<th style="text-align:center">${esc(r[1])}</th>`).join('') + '</tr>';
  const body = SYS.map(s => '<tr><td>' + esc(s.label) + `<span class="layer">${esc(LAYER_NAME[s.layer] || s.layer || '')}</span>` + (s.href ? '' : ' <span class="pend">Coming soon</span>') + '</td>'
    + ROLES.map(([role]) => { const a = raOf(s.code, role);
        const fixed = role === 'OWNER' && s.code === 'AUTH'; const lock = !CAN_EDIT || ownerLocked(role) || fixed;
        return '<td><span class="cell">' + ACTS.map(([k, l]) => `<label class="${a[k] || fixed ? 'on' : ''}" title="${fixed ? 'The owner always has access' : ''}"><input type="checkbox" ${a[k] || fixed ? 'checked' : ''} ${lock ? 'disabled' : ''} onchange="setRA('${s.code}','${role}','${k}',this.checked)">${l}</label>`).join('') + '</span></td>'; }).join('') + '</tr>').join('');
  $('v-matrix').innerHTML = `<div class="card mx"><h3>Role Access</h3>
    <p class="hint">Changes save immediately.</p>
    <table>${head}${body}</table></div>`;
}
async function setRA(sys, role, key, val){
  const a = {...raOf(sys, role)}; a[key] = val;
  if(val && key !== 'can_see') a.can_see = true;
  if(val && key === 'can_approve') a.can_edit = true;
  if(!val && key === 'can_see'){ a.can_edit = false; a.can_approve = false; }
  if(!val && key === 'can_edit') a.can_approve = false;
  const row = {system_code:sys, role, can_see:a.can_see, can_edit:a.can_edit, can_approve:a.can_approve};
  const {error} = await sb.from('hub_role_access').upsert(row, {onConflict:'system_code,role'});
  if(dbErr(error)){ renderMatrix(); return; }
  const i = RA.findIndex(r => r.system_code === sys && r.role === role); if(i >= 0) RA[i] = row; else RA.push(row);
  renderMatrix(); renderOverride(); toast('Saved: ' + (SYS.find(s => s.code === sys) || {}).label + ' · ' + roleLabel(role));
}

let OV_USER = '';
function renderOverride(){
  const people = USERS.filter(u => u.status === 'ACTIVE');
  if(!OV_USER || !people.some(u => u.id === OV_USER)) OV_USER = (people.find(u => u.id !== ME.id) || people[0] || {}).id || '';
  const u = USERS.find(x => x.id === OV_USER);
  const sel = `<select onchange="OV_USER=this.value;renderOverride()">${people.map(p => `<option value="${p.id}" ${p.id === OV_USER ? 'selected' : ''}>${esc(p.display_name)} · ${esc(roleLabel(p.role))}</option>`).join('')}</select>`;
  let table = '';
  if(u){ const lock = !CAN_EDIT || ownerLocked(u.role);
    table = '<table><tr><th>System</th>' + ACTS.map(a => `<th>${a[1]}</th>`).join('') + '<th>Result</th></tr>' + SYS.map(s => {
      const o = OV.find(x => x.user_id === u.id && x.system_code === s.code) || {}; const ra = raOf(s.code, u.role);
      const eff = k => (u.role === 'OWNER' && s.code === 'AUTH') || (o[k] ?? ra[k]);
      return '<tr><td>' + esc(s.label) + (s.href ? '' : ' <span class="pend">Coming soon</span>') + '</td>' + ACTS.map(([k]) => {
        const v = o[k] === true ? '1' : o[k] === false ? '0' : '';
        return `<td><select ${lock ? 'disabled' : ''} onchange="setOV('${u.id}','${s.code}','${k}',this.value)">
          <option value="" ${v === '' ? 'selected' : ''}>Same as role (${ra[k] ? 'Yes' : 'No'})</option><option value="1" ${v === '1' ? 'selected' : ''}>Yes</option><option value="0" ${v === '0' ? 'selected' : ''}>No</option></select></td>`; }).join('')
        + '<td>' + (eff('can_see') ? (eff('can_edit') ? (eff('can_approve') ? 'View · Edit · Approve' : 'View · Edit') : 'View only') : '<span class="hint">No access</span>') + '</td></tr>'; }).join('') + '</table>';
  }
  $('v-override').innerHTML = `<div class="card"><h3>Individual Access</h3>
    <p class="hint">Only needed when one person should differ from their role.</p>
    <div style="margin-bottom:10px">Staff: ${sel}</div>${table || '<p class="hint">No active staff</p>'}</div>`;
}
async function setOV(uid, sys, key, v){
  const cur = OV.find(x => x.user_id === uid && x.system_code === sys) || {user_id:uid, system_code:sys, can_see:null, can_edit:null, can_approve:null};
  const row = {user_id:uid, system_code:sys, can_see:cur.can_see ?? null, can_edit:cur.can_edit ?? null, can_approve:cur.can_approve ?? null};
  row[key] = v === '' ? null : v === '1';
  const {error} = await sb.from('hub_user_override').upsert(row, {onConflict:'user_id,system_code'});
  if(dbErr(error)){ renderOverride(); return; }
  const i = OV.findIndex(x => x.user_id === uid && x.system_code === sys); if(i >= 0) OV[i] = row; else OV.push(row);
  renderOverride(); toast('Saved');
}
boot();
</script>
</body>
</html>
