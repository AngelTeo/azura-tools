<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farms v1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg:#f2f0eb;--bg2:#e8e5de;--white:#fff;--border:#d8d5ce;--hint:#c4c0b8;--text:#1a1916;--text2:#4a4740;--text3:#8a8680;
--acc:#1A56A0;--accl:#ddeaff;--grn:#0E6B4A;--grnl:#d8f3e8;--red:#A3291F;--redl:#fce8e6;--amb:#7A4A00;--ambl:#fff3d6;--pur:#5C2DA0;--purl:#ede5ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;min-height:100vh}
button,input,select{font-family:inherit}
.wrap{max-width:560px;margin:0 auto;padding-bottom:90px}
header{background:var(--text);color:#fff;padding:9px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header a,header .back{color:#fff;text-decoration:none;font-size:15px;background:none;border:0;cursor:pointer;white-space:nowrap}
header h1{font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .who{font-size:12px;color:#aaa;white-space:nowrap}
.search{margin:10px 14px 6px;display:block;width:calc(100% - 28px);padding:8px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap;color:var(--text2);cursor:pointer}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}
.count{font-size:12px;color:var(--text3);padding:0 16px 6px}
.list{background:#fff;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--bg2);cursor:pointer}
.row:last-child{border-bottom:0}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av.cam{position:relative}.av.cam::after{content:'📷';position:absolute;right:-4px;bottom:-4px;font-size:13px;background:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.av.hx{background:var(--ambl);color:var(--amb)}.av.ad{background:var(--grnl);color:var(--grn)}.av.both{background:var(--purl);color:var(--pur)}.av.stop{background:var(--bg2);color:var(--text3)}
.row .t{flex:1;min-width:0}.row .n{font-weight:600}.row .s{font-size:12px;color:var(--text3);margin-top:2px}
.chev{color:var(--hint);font-size:20px}
.empty{padding:30px 16px;text-align:center;color:var(--text3)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:18px;width:48px;height:48px;border-radius:50%;background:var(--acc);color:#fff;font-size:24px;border:0;box-shadow:0 6px 18px rgba(26,86,160,.35);cursor:pointer}
.hero{padding:12px 14px 10px;display:flex;align-items:center;gap:12px;cursor:pointer}
.hero .av{width:42px;height:42px;font-size:15px}
.hero .n{font-size:17px;font-weight:700}.hero .s{font-size:12px;color:var(--text3);margin-top:3px}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;margin-top:4px}
.pill.on{background:var(--grnl);color:var(--grn)}.pill.off{background:var(--redl);color:var(--red)}
.grp{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;padding:10px 14px 4px}
.item{display:flex;align-items:center;padding:9px 14px;background:#fff;border-bottom:1px solid var(--bg2);gap:10px}
.item.tap{cursor:pointer}
.item .k{width:84px;color:var(--text3);font-size:13px;flex:none}.item .v{flex:1;font-weight:500;min-width:0}
.item .v small{display:block;font-weight:400;color:var(--text3);font-size:11px;margin-top:1px}
.btn-wide{display:block;width:calc(100% - 28px);margin:12px 14px 0;padding:10px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:14px;font-weight:600;cursor:pointer}
.btn-wide.red{border-color:#f0b8b4;color:var(--red)}
.btn-wide.link{border:0;background:none;color:var(--text3);font-weight:500;font-size:13px;margin-top:6px}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:#fff;border-radius:18px 18px 0 0;padding:10px 16px 22px;z-index:21;display:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 12px}
.sheet h3{font-size:16px;margin-bottom:2px}.sheet p.h{font-size:12px;color:var(--text3);margin-bottom:6px}
.lbl{font-size:12px;color:var(--text3);margin:10px 0 6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer}
.opt.on{border-color:var(--acc);background:var(--accl);color:var(--acc)}
.opt.dark.on{border-color:var(--text);background:var(--text);color:#fff}
.opt.red.on{border-color:var(--red);background:var(--redl);color:var(--red)}
.opt:disabled{opacity:.4;cursor:default}
.inp{width:100%;margin-top:6px;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;background:#fff}
.save{width:100%;margin-top:14px;padding:11px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.save.red{background:var(--red)}
.cancel{width:100%;margin-top:8px;padding:10px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text2);font-size:14px;font-weight:600;cursor:pointer}
.save:disabled{opacity:.6}
.err{margin-top:10px;font-size:13px;color:var(--red);display:none}
.pcard{border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;margin-top:6px;display:flex;align-items:center;gap:10px;cursor:pointer}
.pcard .v{flex:1}.pcard small{display:block;color:var(--text3);font-size:12px}
.hist td{padding:7px 4px;border-bottom:1px solid var(--bg2);font-size:13px;vertical-align:top}
.hist{width:100%;border-collapse:collapse}
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:30;max-width:90vw}
#toast.bad{background:var(--red)}
#gate{padding:60px 20px;text-align:center;display:none}
#gate b{display:block;font-size:17px;margin-bottom:8px;color:var(--red)}
#gate a{display:inline-block;margin-top:16px;background:var(--acc);color:#fff;border-radius:10px;padding:10px 18px;text-decoration:none}
.view{display:none}.view.on{display:block}
.dk-ph{display:none}
.sums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 14px 4px}
.sum{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.sum small{display:block;font-size:11px;color:var(--text3)}.sum b{font-size:17px}
.row .r{text-align:right;flex:none}.row .r small{display:block;font-size:11px;color:var(--text3)}
.pill.warn{background:var(--ambl);color:var(--amb)}.pill.grey{background:var(--bg2);color:var(--text3)}
.item.add .v{color:var(--acc);font-weight:600}
/* 电脑（宽 1100 以上）：农场名单在左，详情在右；手机不变 */
@media(min-width:1100px){
  .wrap{max-width:1200px;display:grid;grid-template-columns:520px 1fr;gap:0 24px;align-items:start;padding:0 14px 90px}
  #gate{grid-column:1/-1}
  #v-farms{display:block!important;grid-column:1}
  #v-farm{grid-column:2;margin-top:14px;background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow-y:auto}
  #v-farm > header{display:none}
  #v-farm:not(.on) ~ .dk-ph{display:flex;grid-column:2;margin-top:14px;height:240px;border:2px dashed var(--border);border-radius:14px;align-items:center;justify-content:center;color:var(--text3)}
  .row.sel{background:var(--accl)}
  .sheet{top:50%;bottom:auto;transform:translate(-50%,-50%);border-radius:18px}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="gate"></div>

  <div class="view" id="v-farms">
    <header><a href="../index.html">← Home</a><h1>Farms</h1><span class="who" id="who"></span></header>
    <div class="sums" id="fsums"></div>
    <div id="flist"></div>
  </div>

  <div class="view" id="v-farm">
    <header><button class="back" onclick="backToFarms()">← Farms</button><h1></h1></header>
    <div id="fdet"></div>
  </div>
  <div class="dk-ph">Tap a farm to see details</div>
</div>

<div class="dim" id="dim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>

<script>
const APP_VERSION = 1;
const SB_URL = 'https://dittqalvrjiamzdzrskd.supabase.co';
const SB_KEY = 'sb_publishable_OPS4DgPqKrwuv11bzy7ceA_VtzJ9x8t';
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const D = {allFarms:[], blocks:[], titles:[], co:{}, coName:{}};
let CAN_EDIT = false;

function toast(t, bad){ const x = $('toast'); x.textContent = t; x.className = bad ? 'bad' : ''; x.style.display = 'block'; clearTimeout(x._t); x._t = setTimeout(() => x.style.display = 'none', bad ? 6000 : 2200); }
function nice(e){
  const m = (e && (e.message || String(e))) || '';
  if(/Failed to fetch|NetworkError/i.test(m)) return 'No connection. Nothing was saved. Please try again.';
  if(/row-level security|permission denied/i.test(m)) return 'You do not have permission to do this.';
  if(/duplicate key/i.test(m)) return 'Already saved. Please refresh.';
  return m;
}
async function db(p){ const {data, error} = await p; if(error) throw error; return data; }
function gate(title, body, home){ $('gate').style.display = 'block'; $('gate').innerHTML = '<b>' + esc(title) + '</b><div>' + esc(body) + '</div>' + (home ? '<a href="../index.html">Go to Home</a>' : ''); }

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return gate('Please sign in', 'Sign in from the Home page first.', true);
  const {data:me, error:e1} = await sb.from('hub_app_user').select('display_name,role,position,status').eq('id', session.user.id).maybeSingle();
  if(e1) return gate('Could not load your account', 'Please refresh the page.');
  if(!me || me.status !== 'ACTIVE') return gate('No access', 'This account cannot use the system.', true);
  const {data:a1} = await sb.rpc('hub_can_access', {p_system:'FARM'});
  const a = (a1 && a1[0]) || {};
  if(!a.can_see) return gate('No access', 'Please ask the owner for access to Farms.', true);
  CAN_EDIT = !!a.can_edit;
  $('who').textContent = me.display_name || '';
  await load();
  const m = location.hash.match(/farm=([0-9a-f-]{36})/);
  if(m && D.allFarms.some(f => f.id === m[1])) openFarm(m[1]); else show('v-farms');
}

async function load(){
  const q = (t, cols, f) => { let x = sb.from(t).select(cols); return f ? f(x) : x; };
  const res = await Promise.all([
    q('hub_company', 'id,code,name'),
    q('hub_farm', 'id,code,company_id,name,location,active,status', x => x.order('code')),
    q('hub_farm_block', 'id,farm_id,code,name,block_type,bag_capacity,active', x => x.order('code')),
    q('hub_farm_title', 'id,farm_id,title_no,acres,active', x => x.order('created_at')),
  ]);
  const bad = res.find(x => x.error); if(bad){ toast(nice(bad.error), true); throw bad.error; }
  const [co, af, bl, ti] = res.map(x => x.data);
  D.co = {}; D.coName = {}; co.forEach(x => { D.co[x.id] = x.code; D.coName[x.code] = x.name; });
  D.allFarms = af; D.blocks = bl; D.titles = ti;
  renderFarms();
}

function show(id){ document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id)); if(innerWidth < 1100) scrollTo(0, 0); else if(id === 'v-farm') $('v-farm').scrollTop = 0; }

// ── bottom sheets ──
function sheet(html){ $('sheet').innerHTML = '<div class="grab"></div>' + html + '<div class="err" id="serr"></div><button class="cancel" onclick="closeSheet()">Cancel</button>'; $('dim').style.display = 'block'; $('sheet').style.display = 'block';
}
// one tap handler for every option group in the sheet (groups can be redrawn)
$('sheet').addEventListener('click', e => {
  const b = e.target.closest('button.opt'); if(!b || b.disabled) return; const g = b.closest('[data-g]'); if(!g) return;
  g.querySelectorAll('button.opt').forEach(x => x.classList.toggle('on', x === b));
  if(g.dataset.on) window[g.dataset.on](b.dataset.v);
});
function closeSheet(){ $('dim').style.display = 'none'; $('sheet').style.display = 'none'; }
const pick = g => { const b = $('sheet').querySelector('[data-g="' + g + '"] button.opt.on'); return b ? b.dataset.v : null; };
const opts = (g, list, on, cls, cols) => '<div class="' + (cols || 'g' + list.length) + '" data-g="' + g + '">' + list.map(([v, l, dis]) => '<button class="opt ' + (cls || '') + (v === on ? ' on' : '') + '" data-v="' + esc(v) + '"' + (dis ? ' disabled' : '') + '>' + l + '</button>').join('') + '</div>';
function serr(t){ $('serr').textContent = t; $('serr').style.display = 'block'; return false; }
async function saveWith(btn, fn, msg){
  btn.disabled = true;
  try{ const r = await fn(); if(r === false){ btn.disabled = false; return; } closeSheet(); await load(); if(FOPEN) openFarm(FOPEN); toast(typeof r === 'string' ? r : (msg || 'Saved')); }
  catch(e){ serr(nice(e)); btn.disabled = false; }
}
function sheetText(title, val, type, fn){
  sheet('<h3>' + title + '</h3><input class="inp" id="s-txt" value="' + esc(val || '') + '"' + (type ? ' inputmode="' + type + '"' : '') + '><button class="save" id="s-save">Save</button>');
  $('s-save').onclick = () => saveWith($('s-save'), () => fn($('s-txt').value.trim()));
}
// ── farms ──
let FOPEN = null;
const FSTATUS = {ACTIVE:'Active', NOT_STARTED:'Not started', STOPPED:'Stopped'};
const fBlocks = id => D.blocks.filter(b => b.farm_id === id && b.active);
const fTitles = id => D.titles.filter(t => t.farm_id === id && t.active);
const fBags = id => fBlocks(id).reduce((s, b) => s + (b.bag_capacity || 0), 0);
const fAcres = id => Math.round(fTitles(id).reduce((s, t) => s + Number(t.acres || 0), 0) * 100) / 100;
const num = n => Number(n).toLocaleString('en');
const curF = () => D.allFarms.find(f => f.id === FOPEN);
function renderFarms(){
  if(!D.allFarms) return;
  const live = D.allFarms.filter(f => f.status !== 'STOPPED');
  $('fsums').innerHTML = '<div class="sum"><small>Farms</small><b>' + live.length + '</b></div><div class="sum"><small>Polybags</small><b>' + num(live.reduce((s, f) => s + fBags(f.id), 0)) + '</b></div><div class="sum"><small>Acres</small><b>' + (Math.round(live.reduce((s, f) => s + fAcres(f.id), 0) * 100) / 100) + '</b></div>';
  const cos = ['AD', 'HX'].concat(Object.values(D.co).filter(c => !['AD', 'HX'].includes(c)));
  $('flist').innerHTML = cos.map(c => { const fs = D.allFarms.filter(f => D.co[f.company_id] === c); if(!fs.length) return '';
    return '<div class="grp">' + esc(D.coName[c] || c) + '</div><div class="list">' + fs.map(f => { const n = fTitles(f.id).length, a = fAcres(f.id), b = fBags(f.id);
      return '<div class="row' + (FOPEN === f.id ? ' sel' : '') + '" onclick="openFarm(\'' + f.id + '\')"><div class="t"><div class="n">' + esc(f.code)
        + (f.status !== 'ACTIVE' ? ' <span class="pill ' + (f.status === 'STOPPED' ? 'grey' : 'warn') + '" style="margin:0 0 0 4px">' + FSTATUS[f.status] + '</span>' : '') + '</div>'
        + '<div class="s">' + esc(f.location || 'Location not set') + (a ? ' · ' + a + ' ac' : '') + (n > 1 ? ' · ' + n + ' titles' : '') + '</div></div>'
        + '<div class="r">' + (b ? num(b) : '—') + '<small>bags</small></div><span class="chev">›</span></div>'; }).join('') + '</div>'; }).join('');
}
function backToFarms(){ FOPEN = null; history.replaceState(null, '', location.pathname); renderFarms(); show('v-farms'); }
function openFarm(id){
  const f = D.allFarms.find(x => x.id === id); if(!f) return; FOPEN = id; history.replaceState(null, '', '#farm=' + id);
  document.querySelectorAll('#flist .row').forEach(r => r.classList.toggle('sel', (r.getAttribute('onclick') || '').includes(id)));
  const E = CAN_EDIT;
  const it = (k, v, sub, fn) => '<div class="item' + (E && fn ? ' tap" onclick="' + fn : '') + '"><div class="k">' + k + '</div><div class="v">' + v + (sub ? '<small>' + sub + '</small>' : '') + '</div>' + (E && fn ? '<span class="chev">›</span>' : '') + '</div>';
  const ts = fTitles(id), bs = fBlocks(id);
  $('v-farm').querySelector('h1').textContent = f.code;
  $('fdet').innerHTML = '<div class="hero" style="cursor:default"><div><div class="n">' + esc(f.code) + '</div><div class="s">' + esc(D.coName[D.co[f.company_id]] || '') + '</div>'
      + '<span class="pill ' + (f.status === 'ACTIVE' ? 'on' : f.status === 'STOPPED' ? 'grey' : 'warn') + '">' + FSTATUS[f.status] + '</span></div></div>'
    + '<div class="grp">Farm</div>'
    + it('Name', esc(f.name), '', 'sheetFarmName()')
    + it('Location', esc(f.location || 'Not set'), '', 'sheetFarmLoc()')
    + it('Status', FSTATUS[f.status], f.status === 'STOPPED' ? 'Hidden from Salary and Workers' : '', 'sheetFarmStatus()')
    + '<div class="grp">Land titles</div>'
    + ts.map((t, i) => it(esc(t.title_no || 'Title ' + (i + 1)), t.acres + ' ac', '', "sheetTitle('" + t.id + "')")).join('')
    + (E ? '<div class="item tap add" onclick="sheetTitle()"><div class="k"></div><div class="v">+ Add title</div></div>' : '')
    + '<div class="item"><div class="k">Total</div><div class="v">' + fAcres(id) + ' ac</div></div>'
    + '<div class="grp">Blocks</div>'
    + bs.map(b => it(esc(b.code), esc(b.name), (b.bag_capacity != null ? num(b.bag_capacity) + ' bags' : 'Bags not set') + (b.block_type !== 'PRODUCTION' ? ' · ' + (b.block_type === 'TRIAL' ? 'Trial' : 'Control') : ''), "sheetBlock('" + b.id + "')")).join('')
    + (E ? '<div class="item tap add" onclick="sheetBlock()"><div class="k"></div><div class="v">+ Add block</div></div>' : '')
    + '<div class="item"><div class="k">Total</div><div class="v">' + num(fBags(id)) + ' bags</div></div><div style="height:24px"></div>';
  show('v-farm');
}
function sheetFarmName(){ const f = curF(); sheetText('Farm name', f.name, '', v => v ? db(sb.from('hub_farm').update({name:v}).eq('id', f.id)) : serr('Type a name.')); }
function sheetFarmLoc(){ const f = curF(); sheetText('Location', f.location, '', v => db(sb.from('hub_farm').update({location:v || null}).eq('id', f.id))); }
function sheetFarmStatus(){
  const f = curF();
  sheet('<h3>Status</h3>' + opts('st', [['ACTIVE', 'Active'], ['NOT_STARTED', 'Not started'], ['STOPPED', 'Stopped']], f.status, 'dark', 'g3')
    + '<p class="h" style="margin-top:8px">Stopped farms are hidden when picking a farm in Workers and Salary. Past records stay.</p><button class="save" id="s-save">Save</button>');
  $('s-save').onclick = () => saveWith($('s-save'), () => { const v = pick('st'); return db(sb.from('hub_farm').update({status:v, active:v !== 'STOPPED'}).eq('id', f.id)); });
}
function sheetTitle(tid){
  const f = curF(), t = tid ? D.titles.find(x => x.id === tid) : null;
  sheet('<h3>' + (t ? 'Land title' : 'Add land title') + '</h3><div class="lbl">Title no. (optional)</div><input class="inp" id="s-tno" value="' + esc(t ? t.title_no || '' : '') + '" placeholder="Geran / lot no.">'
    + '<div class="lbl">Acres</div><input class="inp" id="s-ac" inputmode="decimal" value="' + (t ? t.acres : '') + '">'
    + '<button class="save" id="s-save">Save</button>' + (t ? '<button class="cancel" style="color:var(--red)" id="s-rm">Remove title</button>' : ''));
  $('s-save').onclick = () => saveWith($('s-save'), () => { const a = parseFloat($('s-ac').value), n = $('s-tno').value.trim() || null;
    if(!(a > 0)) return serr('Type the acres.');
    return t ? db(sb.from('hub_farm_title').update({title_no:n, acres:a}).eq('id', t.id)) : db(sb.from('hub_farm_title').insert({farm_id:f.id, title_no:n, acres:a, active:true})); });
  if(t) $('s-rm').onclick = () => saveWith($('s-rm'), () => db(sb.from('hub_farm_title').update({active:false}).eq('id', t.id)), 'Title removed');
}
function nextBlockCode(f){ const n = D.blocks.filter(b => b.farm_id === f.id).map(b => parseInt(b.code.split('-').pop(), 10) || 0); return f.code + '-' + String(Math.max(0, ...n) + 1).padStart(2, '0'); }
function sheetBlock(bid){
  const f = curF(), b = bid ? D.blocks.find(x => x.id === bid) : null, code = b ? b.code : nextBlockCode(f), only = fBlocks(f.id).length <= 1;
  sheet('<h3>' + (b ? 'Block ' + esc(code) : 'Add block ' + esc(code)) + '</h3>'
    + '<div class="lbl">Name</div><input class="inp" id="s-bn" value="' + esc(b ? b.name : '') + '" placeholder="' + esc(f.code) + ' block ' + code.split('-').pop() + '">'
    + '<div class="lbl">Polybags</div><input class="inp" id="s-bg" inputmode="numeric" value="' + (b && b.bag_capacity != null ? b.bag_capacity : '') + '">'
    + '<div class="lbl">Type</div>' + opts('bt', [['PRODUCTION', 'Production'], ['TRIAL', 'Trial'], ['CONTROL', 'Control']], b ? b.block_type : 'PRODUCTION', 'dark', 'g3')
    + '<button class="save" id="s-save">Save</button>' + (b && !only ? '<button class="cancel" style="color:var(--red)" id="s-rm">Stop using this block</button>' : ''));
  $('s-save').onclick = () => saveWith($('s-save'), () => { const nm = $('s-bn').value.trim() || $('s-bn').placeholder, raw = $('s-bg').value.trim(), bg = raw === '' ? null : parseInt(raw.replace(/,/g, ''), 10);
    if(raw !== '' && !(bg >= 0)) return serr('Type the number of polybags.');
    const row = {name:nm, bag_capacity:bg, block_type:pick('bt')};
    return b ? db(sb.from('hub_farm_block').update(row).eq('id', b.id)) : db(sb.from('hub_farm_block').insert({farm_id:f.id, code, active:true, ...row})); });
  if(b && !only) $('s-rm').onclick = () => saveWith($('s-rm'), () => db(sb.from('hub_farm_block').update({active:false}).eq('id', b.id)), 'Block stopped');
}
boot();
</script>
</body>
