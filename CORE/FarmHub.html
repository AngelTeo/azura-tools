<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workers v20</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --layer:#2F5D3F;
  --c-ad:#0E6B4A; --c-hx:#B7791F; --c-both:#5C2DA0;
  --sur:#ffffff; --sur2:#f7f6f2; --bdr:#e0ddd6;
  --txt:#1a1a1a; --mut:#888888; --hint:#bbbbbb;
  --ok:#0F6E56; --warn:#854F0B; --danger:#A32D2D; --info:#236FAD;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Microsoft YaHei",sans-serif;
  background:var(--sur2);color:var(--txt);font-size:13px;line-height:1.4}

/* ══════ NAV (TOPBAR) ══════ */
.nav{background:var(--layer);border-bottom:.5px solid rgba(0,0,0,.2);
  display:flex;align-items:center;padding:0 16px;position:sticky;top:0;z-index:50;
  overflow-x:auto;gap:0;min-height:56px}
.nav-home{background:none;border:none;color:rgba(255,255,255,.75);font-size:18px;cursor:pointer;padding:0 12px 0 0;flex-shrink:0;min-height:44px;min-width:44px}
.nav-home:hover{color:#fff}
.nav-logo{font-size:13px;font-weight:600;padding:0 14px 0 0;
  border-right:.5px solid rgba(255,255,255,.2);margin-right:4px;white-space:nowrap;
  flex-shrink:0;color:#fff;display:flex;align-items:center;min-height:44px}
.ver{background:#F9CB42;color:var(--layer);border-radius:4px;padding:1px 6px;
  font-size:10px;font-weight:700;margin-left:6px}
.ntab{padding:0 14px;font-size:12px;color:rgba(255,255,255,.7);cursor:pointer;
  border:none;background:transparent;border-bottom:2.5px solid transparent;
  transition:all .15s;white-space:nowrap;flex-shrink:0;font-family:inherit;min-height:44px}
.ntab:hover{color:#fff}
.ntab.on{color:#fff;border-bottom-color:#fff;font-weight:600}
.nav-r{margin-left:auto;display:flex;gap:6px;align-items:center;padding-left:24px;flex-shrink:0}
.saved{font-size:10px;color:rgba(255,255,255,.7);white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:22px;
  background:rgba(255,255,255,.14);color:#fff;font-size:11px;border:.5px solid rgba(255,255,255,.3);cursor:pointer;font-family:inherit}
.sync i{width:8px;height:8px;border-radius:50%;background:#7CD4A8;display:inline-block}
.sync.bad i{background:#FF8A8A}.sync.busy i{background:#F9CB42}
.btn-nav{padding:0 12px;border-radius:6px;border:.5px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12);color:#fff;font-size:11px;cursor:pointer;
  font-family:inherit;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center}
.btn-nav:hover{opacity:.85}

/* ══════ PAGES ══════ */
.page{display:none;padding:16px;max-width:1200px;margin:0 auto}
.page.on{display:block}
h1.pt{font-size:18px;margin:4px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ══════ BUTTONS ══════ */
.btn{padding:0 14px;min-height:44px;border-radius:6px;border:.5px solid var(--bdr);
  background:var(--sur);color:var(--txt);font-size:12px;cursor:pointer;
  font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--sur2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-pri{background:var(--layer);color:#fff;border-color:var(--layer);font-weight:600}
.btn-pri:hover{opacity:.85;background:var(--layer)}
.btn-sm{min-height:36px;padding:0 10px;font-size:11px}

/* ══════ CARDS ══════ */
.card{background:var(--sur);border:.5px solid var(--bdr);border-radius:16px;padding:16px;margin-bottom:12px}
.card-title{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px}
.mg-line{font-size:12px;line-height:2}
.mg-val{background:var(--sur2);border-radius:4px;font-size:11px;padding:1px 6px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--sur);border:.5px solid var(--bdr);border-radius:12px;padding:10px 14px}
.stat small{display:block;font-size:11px;color:var(--mut)}.stat b{font-size:20px;font-variant-numeric:tabular-nums}

/* ══════ ALERT ══════ */
.alert{padding:10px 14px;border-radius:6px;font-size:12px;margin-bottom:12px;display:flex;align-items:flex-start;gap:8px;line-height:1.6}
.alert-warn{background:#FFF3CD;color:var(--warn);border-left:3px solid var(--warn)}
.alert-danger{background:#FCEBEB;color:var(--danger);border-left:3px solid var(--danger)}
.alert-info{background:#E8F0F7;color:var(--info);border-left:3px solid var(--info)}

/* ══════ TABLES ══════ */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data thead th{background:#2d2d2d;color:#fff;padding:9px 10px;text-align:left;
  font-size:10px;font-weight:600;letter-spacing:.05em;white-space:nowrap}
table.data tbody td{padding:7px 10px;border-bottom:.5px solid var(--bdr);height:36px;vertical-align:middle}
table.data tbody tr:nth-child(even){background:var(--sur2)}
table.data tbody tr.click{cursor:pointer}
table.data tbody tr.click:hover{background:#FFF9E6}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums}
table.data tfoot td{padding:8px 10px;font-weight:700;border-top:1px solid var(--txt)}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;white-space:nowrap}
.b-active{background:#E1F5EE;color:var(--ok)}
.b-pending{background:#FFF3CD;color:var(--warn)}
.b-archived{background:var(--sur2);color:var(--mut)}
.co{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;color:#fff;background:#777}
.co.AD{background:var(--c-ad)}.co.HX{background:var(--c-hx)}
.empty{text-align:center;padding:40px 20px;color:var(--mut);font-size:12px}
.code{font-family:ui-monospace,Consolas,monospace;font-weight:600;color:var(--layer);white-space:nowrap}

/* ══════ FORM ══════ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:11px;color:var(--mut)}
.fld>span b{color:var(--danger)}
.fld.wide{grid-column:1/-1}
input[type=text],input[type=number],select{
  width:100%;min-height:44px;padding:8px 10px;border:.5px solid var(--bdr);border-radius:6px;
  font-family:inherit;font-size:13px;background:var(--sur);color:var(--txt)}
input:disabled,select:disabled{background:var(--sur2);color:var(--mut)}
input:focus,select:focus{outline:2px solid rgba(47,93,63,.25);border-color:var(--layer)}
.hint{font-size:11px;color:var(--mut);line-height:1.5}
.row-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:12px;cursor:pointer}
.chk input{width:18px;height:18px}

/* ══════ ACCORDION ══════ */
.acc{border:.5px solid var(--bdr);border-radius:16px;overflow:hidden;background:var(--sur);margin-bottom:12px}
.acc-hdr{padding:16px;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:space-between;letter-spacing:.05em;color:var(--mut);min-height:44px}
.acc-body{display:none;padding:0 16px 16px}
.acc.open .acc-body{display:block}

/* ══════ MODAL ══════ */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 12px;overflow-y:auto}
.ov.on{display:flex}
.modal{background:var(--sur);border-radius:14px;width:560px;max-width:100%;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:.5px solid var(--bdr);font-weight:700}
.modal-b{padding:16px 18px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:.5px solid var(--bdr);flex-wrap:wrap}
.modal-f .left{margin-right:auto}
.x{background:none;border:none;font-size:18px;cursor:pointer;color:var(--mut);min-width:44px;min-height:44px}
.merr{color:var(--danger);font-size:12px;margin-top:10px;display:none}

/* ══════ TOAST ══════ */
.toast{position:fixed;bottom:20px;right:20px;background:var(--txt);color:#fff;padding:10px 16px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9999}
.toast.show{opacity:1}
#saveBanner{display:none}#saveBanner.on{display:flex}

#gate{max-width:380px;margin:60px auto;padding:0 16px}
@media (max-width:640px){
  .page{padding:12px}
  .grid{grid-template-columns:1fr}
  .toast{left:12px;right:12px;bottom:12px}
  table.data td,table.data th{white-space:nowrap}
}

.co.both{background:var(--c-both)}
/* ══════ WORKERS extras ══════ */
.toast.bad{background:var(--danger)}
.stats{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.cboxes{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cbox{background:var(--sur);border:.5px solid var(--bdr);border-radius:12px;overflow:hidden;flex:1 1 300px;max-width:460px}
.cbox.both{flex:0 1 160px}
.cb-h{display:flex;justify-content:center;align-items:baseline;gap:14px;padding:10px;font-weight:700;font-size:14px;border-bottom:.5px solid var(--bdr);cursor:pointer}
.cb-h b{font-size:20px;font-variant-numeric:tabular-nums}
.cbox.HX .cb-h{border-top:3px solid var(--c-hx)}.cbox.AD .cb-h{border-top:3px solid var(--c-ad)}.cbox.both .cb-h{border-top:3px solid var(--c-both)}
.cb-r{display:flex}
.cc{flex:1;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 12px;cursor:pointer;font-size:12px;font-weight:600}
.cc+.cc{border-left:.5px solid var(--bdr)}.cc b{font-size:16px;font-variant-numeric:tabular-nums}
.cc:hover,.cb-h:hover{background:#F0F6F2}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex:none;vertical-align:middle;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.hx{background:#FFF3D6;color:#7A4A00}.av.ad{background:#D8F3E8;color:#0E6B4A}.av.both{background:#EDE5FF;color:#5C2DA0}.av.stop{background:var(--sur2);color:var(--mut)}
.nm{display:flex;align-items:center;gap:10px}.nm .t small{display:block;color:var(--mut);font-size:11px;font-weight:400}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.hero .av{width:56px;height:56px;font-size:18px}.hero .av.cam{cursor:pointer}
.hero .n{font-size:17px;font-weight:700}.hero .s{font-size:12px;color:var(--mut);margin-top:2px}
.sec{font-size:10px;font-weight:700;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin:16px 0 2px}
.it{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 4px;border-bottom:.5px solid var(--bdr)}
.it .k{width:120px;color:var(--mut);font-size:12px;flex:none}.it .v{flex:1;min-width:0;font-weight:500}
.it .v small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.it.tap{cursor:pointer}.it.tap:hover{background:#FFF9E6}
.it .chg{color:var(--layer);font-size:11px;font-weight:600;flex:none}
.lbl{font-size:11px;color:var(--mut);margin:12px 0 6px}
p.h{font-size:12px;color:var(--mut);margin:0 0 8px}
.g2,.g3,.g4{display:grid;gap:8px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.opt{border:.5px solid var(--bdr);background:var(--sur);border-radius:6px;min-height:44px;padding:0 6px;font-size:13px;font-weight:600;color:var(--txt);cursor:pointer;font-family:inherit}
.opt.on{border-color:var(--layer);background:#E3EFE7;color:var(--layer);box-shadow:0 0 0 1.5px var(--layer) inset}
.opt.dark.on{background:var(--layer);color:#fff}
.opt.red.on{border-color:var(--danger);background:#FCEBEB;color:var(--danger);box-shadow:0 0 0 1.5px var(--danger) inset}
.opt:disabled{opacity:.4;cursor:default}
.inp{width:100%;margin-top:6px;min-height:44px;padding:8px 10px;border:.5px solid var(--bdr);border-radius:6px;font-family:inherit;font-size:13px;background:var(--sur)}
.save{width:100%;margin-top:16px;min-height:44px;border:0;border-radius:6px;background:var(--layer);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.save.red{background:var(--danger)}.save:disabled{opacity:.6}
.cancel{width:100%;margin-top:8px;min-height:44px;border:.5px solid var(--bdr);border-radius:6px;background:var(--sur);color:var(--txt);font-size:12px;cursor:pointer;font-family:inherit}
.btn-wide{min-height:40px;padding:0 12px;border-radius:6px;border:.5px solid var(--bdr);background:var(--sur);font-size:12px;cursor:pointer;font-family:inherit;width:100%;margin-top:8px}
.btn-wide.red{color:var(--danger);border-color:#f0b8b4}.btn-wide.link{border:0;background:none;color:var(--mut)}
.err{margin-top:10px;font-size:12px;color:var(--danger);display:none}
.pcard{border:.5px solid var(--bdr);border-radius:6px;padding:9px 12px;margin-top:6px;display:flex;align-items:center;gap:10px;cursor:pointer}
.pcard .v{flex:1}.pcard small{display:block;color:var(--mut);font-size:11px}
.hist{width:100%;border-collapse:collapse}.hist td{padding:7px 4px;border-bottom:.5px solid var(--bdr);font-size:12px;vertical-align:top}
.chev{color:var(--hint)}
</style>
</head>
<body>

<!-- ══════ GATE ══════ -->
<div id="gate" style="display:none">
  <div class="card">
    <div style="font-size:18px;font-weight:700;color:var(--layer);margin-bottom:4px">Workers <span class="ver">v20</span></div>
    <div class="hint" style="margin-bottom:14px">Azura Delta · Master Data</div>
    <div id="gateMsg"></div>
  </div>
</div>

<!-- ══════ APP ══════ -->
<div id="app" style="display:none">
  <nav class="nav">
    <button class="nav-home" title="Back to Home" onclick="location.href='../index.html'">←</button>
    <div class="nav-logo">👷 Workers <span class="ver">v20</span></div>
    <button class="ntab on" data-p="workers" onclick="go('workers')">Workers</button>
    <button class="ntab" data-p="manage" onclick="go('manage')">Settings</button>
    <div class="nav-r">
      <span class="saved" id="savedAt">Saved --:--</span>
      <button class="sync" id="syncBadge" onclick="go('manage')"><i></i><span id="syncTxt">Cloud</span></button>
      <button class="btn-nav" onclick="exportAll()">↓ Export</button>
      <button class="btn-nav" id="btnImp" onclick="$('impFile').click()">↑ Import</button>
      <input type="file" id="impFile" accept=".json" style="display:none" onchange="importFile(this)">
    </div>
  </nav>

  <!-- Workers -->
  <div class="page on" id="page-workers">
    <h1 class="pt">Workers <button class="btn btn-pri" id="fab" hidden onclick="sheetAdd()">+ New worker</button></h1>
    <div id="wStats"></div>
    <div class="row-inline" style="margin-bottom:10px">
      <input type="text" id="q" placeholder="Search name / position / farm" style="max-width:320px">
      <select id="fco" onchange="render()" style="max-width:160px"><option value="">All companies</option><option value="hx">HX</option><option value="ad">AD</option><option value="both">Both</option></select>
      <label class="chk"><input type="checkbox" id="fstop" onchange="render()"> Show stopped</label>
      <span class="hint" id="cnt"></span>
    </div>
    <div class="card" style="padding:0"><div class="tw"><table class="data">
      <thead><tr><th>No.</th><th>Name</th><th>Farm</th><th>Company</th><th class="num">Rate</th><th>Pay to</th><th>Joined</th><th>Food</th><th>Status</th></tr></thead>
      <tbody id="list"></tbody></table></div></div>
  </div>

  <!-- Settings -->
  <div class="page" id="page-manage"><div id="manageView"></div></div>
</div>

<!-- ══════ MODAL ══════ -->
<div class="ov" id="ov" onclick="if(event.target===this)backToList()">
  <div class="modal">
    <div class="modal-h"><span id="mTitle"></span><button class="x" onclick="backToList()">✕</button></div>
    <div class="modal-b" id="mBody"></div>
    <div class="modal-f" id="mFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const APP_VERSION = 20;
const SYS = 'Workers';
const SB_URL = 'https://dittqalvrjiamzdzrskd.supabase.co';
const SB_KEY = 'sb_publishable_OPS4DgPqKrwuv11bzy7ceA_VtzJ9x8t';
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY = new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Kuala_Lumpur'});
const THIS_MONTH = TODAY.slice(0,7);
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0,10); };
const nextMonth = mk => { let [y,m] = mk.split('-').map(Number); m++; if(m > 12){ m = 1; y++; } return y + '-' + String(m).padStart(2,'0'); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtM = mk => mk ? MON[+mk.slice(5,7)-1] + ' ' + mk.slice(0,4) : '';
const fmtD = d => d ? (+d.slice(8,10)) + ' ' + MON[+d.slice(5,7)-1] + ' ' + d.slice(0,4) : '';
const rm = n => 'RM ' + Number(n).toLocaleString('en', {minimumFractionDigits: Number(n) % 1 ? 2 : 0, maximumFractionDigits: 2});
const last4 = s => s ? '••' + String(s).slice(-4) : '';
const REASON = {run:'RUN', chase:'CHASE', resign:'RESIGN'};

const D = {workers:[], rates:{}, comps:{}, pay1:{}, pay2:{}, pass:{}, co:{}, coId:{}, locked:new Set()};
let CAN_EDIT = false, CAN_SALARY = false, CAN_SEE_SALARY = false, OPEN = null, ME = null, LOADED = false, lastErr = '', lastSaved = null;

function toast(t, bad){ const x = $('toast'); x.textContent = t; x.classList.toggle('bad', !!bad); x.classList.add('show'); clearTimeout(x._t); x._t = setTimeout(() => x.classList.remove('show'), bad ? 6000 : 2400); }
function nice(e){
  const m = (e && (e.message || String(e))) || '';
  if(/Failed to fetch|NetworkError/i.test(m)) return 'No connection. Nothing was saved. Please try again.';
  if(/row-level security|permission denied/i.test(m)) return 'You do not have permission to do this.';
  if(/hub_worker_check/i.test(m)) return 'Stop date cannot be before the join date.';
  if(/duplicate key/i.test(m)) return 'Already saved. Please refresh.';
  return m;
}
async function db(p){ const {data, error} = await p; if(error) throw error; return data; }
function gate(title, body, home){ $('app').style.display = 'none'; $('gate').style.display = 'block'; $('gateMsg').innerHTML = '<div class="alert alert-warn"><span>⚠</span><div><b>' + esc(title) + '</b><br>' + esc(body) + '</div></div>' + (home ? '<a class="btn btn-pri" href="../index.html" style="width:100%;justify-content:center;text-decoration:none">← Back to Home</a>' : ''); setSync('bad', 'Offline'); }
function setSync(st, txt){ const b = $('syncBadge'); if(!b) return; b.classList.remove('bad', 'busy'); if(st !== 'ok') b.classList.add(st); $('syncTxt').textContent = txt; }
function markSaved(){ lastSaved = new Date(); $('savedAt').textContent = 'Saved ' + String(lastSaved.getHours()).padStart(2, '0') + ':' + String(lastSaved.getMinutes()).padStart(2, '0'); setSync('ok', 'Cloud'); }

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return gate('Please sign in', 'Sign in from the Home page first.', true);
  const {data:me, error:e1} = await sb.from('hub_app_user').select('display_name,role,position,status').eq('id', session.user.id).maybeSingle();
  if(e1) return gate('Could not load your account', 'Please refresh the page.');
  if(!me || me.status !== 'ACTIVE') return gate('No access', 'This account cannot use the system.', true);
  const [{data:a1}, {data:a2}] = await Promise.all([sb.rpc('hub_can_access', {p_system:'FARMHUB'}), sb.rpc('hub_can_access', {p_system:'SALARY'})]);
  const a = (a1 && a1[0]) || {};
  if(!a.can_see) return gate('No access', 'Please ask the owner for access to Workers.', true);
  CAN_EDIT = !!a.can_edit; CAN_SALARY = !!((a2 && a2[0]) || {}).can_edit; CAN_SEE_SALARY = !!((a2 && a2[0]) || {}).can_see;
  ME = {...me, email:session.user.email};
  $('gate').style.display = 'none'; $('app').style.display = 'block';
  $('fab').hidden = !CAN_EDIT; $('btnImp').style.display = CAN_EDIT ? '' : 'none';
  await load();
  const m = location.hash.match(/w=([0-9a-f-]{36})/);

async function load(){
  const q = (t, cols, f) => { let x = sb.from(t).select(cols); return f ? f(x) : x; };
  const ord = x => x.is('voided_at', null).order('effective_from').order('created_at');
  const res = await Promise.all([
    q('hub_worker', 'id,worker_no,name,title,worker_type,join_date,stop_date,stop_reason,stop_note,phone,photo_path,shares_food,cost_co', x => x.is('voided_at', null).order('worker_no')),
    q('hub_worker_rate', 'id,worker_id,rate_type,rate,effective_from', ord),
    q('hub_worker_company', 'id,worker_id,company_id,effective_from', ord),
    q('hub_worker_payee', 'id,worker_id,beneficiary_name,account_no,effective_from,slot', ord),
    q('hub_worker_passport', 'id,worker_id,passport_no,effective_from', ord),
    q('hub_company', 'id,code'),
    q('hub_farm', 'id,code,company_id', x => x.eq('active', true).order('code')),
    q('hub_worker_farm', 'id,worker_id,farm_id,effective_from', ord),
  ]);
  const bad = res.find(r => r.error); if(bad){ LOADED = false; lastErr = bad.error.message; gate('Could not load data', 'Nothing was changed. Please refresh the page.'); throw bad.error; }
  LOADED = true; setSync('ok', 'Cloud');
  const [w, r, c, p, pp, co, fm, wf] = res.map(x => x.data);
  const grp = rows => { const m = {}; rows.forEach(x => (m[x.worker_id] ??= []).push(x)); return m; };
  D.workers = w; D.rates = grp(r); D.comps = grp(c); D.pay1 = grp(p.filter(x => (x.slot || 1) === 1)); D.pay2 = grp(p.filter(x => x.slot === 2)); D.pass = grp(pp);
  D.co = {}; D.coId = {}; co.forEach(x => { D.co[x.id] = x.code; D.coId[x.code] = x.id; });
  D.farms = fm; D.farm = {}; fm.forEach(f => D.farm[f.id] = f); D.wfarm = grp(wf);
  const lr = await sb.from('salary_run').select('month').eq('status', 'LOCKED');
  D.locked = new Set((lr.data || []).map(x => x.month));
  await loadPhotos();
  render();
  if($('page-manage').classList.contains('on')) renderManage();
}

function monthOpts(){ // This month / Next month — skip months whose salary is locked
  let a = THIS_MONTH; while(D.locked.has(a)) a = nextMonth(a); const b = nextMonth(a);
  return [[a, (a === THIS_MONTH ? 'This month' : fmtM(a)) + ' (' + MON[+a.slice(5,7)-1] + ')'], [b, 'Next month (' + MON[+b.slice(5,7)-1] + ')']];

function commonRates(type){ // the 4 most used rates of this type
  const n = {}; Object.values(D.rates).forEach(arr => { const r = arr.slice(-1)[0]; if(r && r.rate_type === type && Number.isInteger(+r.rate) && (type === 'MONTHLY' ? +r.rate >= 500 : +r.rate < 500)) n[r.rate] = (n[r.rate] || 0) + 1; });
  const top = Object.keys(n).sort((a, b) => n[b] - n[a]).slice(0, 4).map(Number).sort((a, b) => a - b);
  const def = type === 'MONTHLY' ? [1500, 1800, 1900, 2500] : [55, 60, 65, 70];
  return (top.length >= 2 ? top : def);
}

// Attendance outside the new working period → ask first
async function attendanceOk(w, join, stop){
  if(!CAN_SALARY) return true;
  const rows = [];

  if(stop){ const {data} = await sb.from('salary_attendance').select('work_date').eq('worker_id', w.id).neq('code', '').gt('work_date', stop); rows.push(...(data || [])); }
  if(!rows.length) return true;
  return confirm(w.name + ' has ' + rows.length + ' attendance day(s) outside this period (e.g. ' + rows[0].work_date + ').\nThese days will not be counted. Save anyway?');
}
// Food sharing: when join/stop date changes, add or remove this worker on purchases in the changed days.
// Only months that are not locked, and only purchases where the people were picked automatically.
async function adjustFood(w, oldJoin, newJoin, oldStop, newStop){
  if(!CAN_SALARY) return 0;
  const inS = (j, s, d) => (!j || j <= d) && (!s || s >= d);
  const {data, error} = await sb.from('salary_food').select('id,month,data').is('voided_at', null);
  if(error || !data) return 0;
  const upd = [];
  for(const r of data){
    const f = r.data || {}; if(!f.date || f.autoSel === false || D.locked.has(r.month)) continue;
    const was = inS(oldJoin, oldStop, f.date), now_ = inS(newJoin, newStop, f.date);
    if(was === now_) continue;
    const ids = (f.workerIds || []).filter(x => x !== w.id); if(now_ && w.shares_food !== false) ids.push(w.id);
    if(now_ && w.shares_food === false && !(f.workerIds || []).includes(w.id)) continue;
    upd.push({id:r.id, month:r.month, data:{...f, workerIds:ids}, voided_at:null});
  }
  if(upd.length) await db(sb.from('salary_food').upsert(upd, {onConflict:'id'}));
  return upd.length;
}

    try{

      const img = await new Promise((ok, bad) => { const x = new Image(); x.onload = () => ok(x); x.onerror = bad; x.src = URL.createObjectURL(f); });
      const k = 480 / Math.max(img.width, img.height), cw = Math.round(img.width * Math.min(1, k)), ch = Math.round(img.height * Math.min(1, k));
      const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch; cv.getContext('2d').drawImage(img, 0, 0, cw, ch);
      const blob = await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.82));
      const path = w.id + '/' + Date.now() + '.jpg';
      const {error} = await sb.storage.from('worker-photos').upload(path, blob, {contentType:'image/jpeg'}); if(error) throw error;
      await db(sb.from('hub_worker').update({photo_path:path}).eq('id', w.id));

const pad2 = n => String(n).padStart(2, '0');

let IMP = null;
function importFile(inp){
  const f = inp.files[0]; inp.value = ''; if(!f) return;
  if(!LOADED || !CAN_EDIT){ toast('Cannot import', true); return; }
  const rd = new FileReader();
  rd.onload = async () => {
    let j; try{ j = JSON.parse(rd.result); }catch(e){ toast('Wrong file format — nothing imported', true); return; }
    if(!j || !j.meta || j.meta.system !== SYS || !j.data){ toast('This is not a Workers backup file — nothing imported', true); return; }
    const res = await Promise.all(EXP.map(t => sb.from(t).select('id')));
    const bad = res.find(r => r.error); if(bad){ toast(nice(bad.error), true); return; }
    const plan = {}; let tot = 0;
    EXP.forEach((t, i) => { const have = new Set((res[i].data || []).map(x => x.id)), rows = Array.isArray(j.data[t]) ? j.data[t] : [];
      const todo = rows.filter(r => r.id && !have.has(r.id)); plan[t] = {nw:todo.length, same:rows.length - todo.length, todo}; tot += todo.length; });
    IMP = plan; OPEN = null;
    $('mTitle').textContent = '↑ Import preview';
    $('mBody').innerHTML = '<div class="hint" style="margin-bottom:8px">Backup time: ' + esc(j.meta.exportTime || '') + '. Only rows that are missing are added — nothing is changed or deleted.</div><div class="tw"><table class="data"><thead><tr><th>Table</th><th class="num">Add</th><th class="num">Already there</th></tr></thead><tbody>'
      + EXP.map(t => '<tr><td>' + t + '</td><td class="num">' + plan[t].nw + '</td><td class="num">' + plan[t].same + '</td></tr>').join('') + '</tbody></table></div>';
    $('mFoot').innerHTML = '<button class="btn" onclick="backToList()">Cancel</button><button class="btn btn-pri" ' + (tot ? '' : 'disabled') + ' onclick="runImport()">Import ' + tot + '</button>';
    $('ov').classList.add('on');
  };
  rd.readAsText(f);
}
async function runImport(){
  if(!IMP) return; backToList();
  for(const t of EXP){ const rows = IMP[t].todo; if(!rows.length) continue;
    const {error} = await sb.from(t).insert(rows);
    if(error){ toast('Import stopped at ' + t + ': ' + nice(error), true); lastErr = error.message; await load(); return; } }
  IMP = null; await load(); markSaved(); toast('✓ Imported');
}
boot();
</script>
</body>
