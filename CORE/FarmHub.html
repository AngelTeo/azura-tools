<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workers v13</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg:#f2f0eb;--bg2:#e8e5de;--white:#fff;--border:#d8d5ce;--hint:#c4c0b8;--text:#1a1916;--text2:#4a4740;--text3:#8a8680;
--acc:#1A56A0;--accl:#ddeaff;--grn:#0E6B4A;--grnl:#d8f3e8;--red:#A3291F;--redl:#fce8e6;--amb:#7A4A00;--ambl:#fff3d6;--pur:#5C2DA0;--purl:#ede5ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;min-height:100vh}
button,input,select{font-family:inherit}
.wrap{max-width:560px;margin:0 auto;padding-bottom:90px}
header{background:var(--text);color:#fff;padding:9px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header a,header .back{color:#fff;text-decoration:none;font-size:15px;background:none;border:0;cursor:pointer;white-space:nowrap}
header h1{font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .who{font-size:12px;color:#aaa;white-space:nowrap}
.search{margin:10px 14px 6px;display:block;width:calc(100% - 28px);padding:8px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap;color:var(--text2);cursor:pointer}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}
.count{font-size:12px;color:var(--text3);padding:0 16px 6px}
.list{background:#fff;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--bg2);cursor:pointer}
.row:last-child{border-bottom:0}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av.cam{position:relative}.av.cam::after{content:'📷';position:absolute;right:-4px;bottom:-4px;font-size:13px;background:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.av.hx{background:var(--ambl);color:var(--amb)}.av.ad{background:var(--grnl);color:var(--grn)}.av.both{background:var(--purl);color:var(--pur)}.av.stop{background:var(--bg2);color:var(--text3)}
.row .t{flex:1;min-width:0}.row .n{font-weight:600}.row .s{font-size:12px;color:var(--text3);margin-top:2px}
.chev{color:var(--hint);font-size:20px}
.empty{padding:30px 16px;text-align:center;color:var(--text3)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:18px;width:48px;height:48px;border-radius:50%;background:var(--acc);color:#fff;font-size:24px;border:0;box-shadow:0 6px 18px rgba(26,86,160,.35);cursor:pointer}
.hero{padding:12px 14px 10px;display:flex;align-items:center;gap:12px;cursor:pointer}
.hero .av{width:42px;height:42px;font-size:15px}
.hero .n{font-size:17px;font-weight:700}.hero .s{font-size:12px;color:var(--text3);margin-top:3px}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;margin-top:4px}
.pill.on{background:var(--grnl);color:var(--grn)}.pill.off{background:var(--redl);color:var(--red)}
.grp{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;padding:10px 14px 4px}
.item{display:flex;align-items:center;padding:9px 14px;background:#fff;border-bottom:1px solid var(--bg2);gap:10px}
.item.tap{cursor:pointer}
.item .k{width:84px;color:var(--text3);font-size:13px;flex:none}.item .v{flex:1;font-weight:500;min-width:0}
.item .v small{display:block;font-weight:400;color:var(--text3);font-size:11px;margin-top:1px}
.btn-wide{display:block;width:calc(100% - 28px);margin:12px 14px 0;padding:10px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:14px;font-weight:600;cursor:pointer}
.btn-wide.red{border-color:#f0b8b4;color:var(--red)}
.btn-wide.link{border:0;background:none;color:var(--text3);font-weight:500;font-size:13px;margin-top:6px}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:#fff;border-radius:18px 18px 0 0;padding:10px 16px 22px;z-index:21;display:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 12px}
.sheet h3{font-size:16px;margin-bottom:2px}.sheet p.h{font-size:12px;color:var(--text3);margin-bottom:6px}
.lbl{font-size:12px;color:var(--text3);margin:10px 0 6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer}
.opt.on{border-color:var(--acc);background:var(--accl);color:var(--acc)}
.opt.dark.on{border-color:var(--text);background:var(--text);color:#fff}
.opt.red.on{border-color:var(--red);background:var(--redl);color:var(--red)}
.opt:disabled{opacity:.4;cursor:default}
.inp{width:100%;margin-top:6px;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;background:#fff}
.save{width:100%;margin-top:14px;padding:11px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.save.red{background:var(--red)}
.cancel{width:100%;margin-top:8px;padding:10px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text2);font-size:14px;font-weight:600;cursor:pointer}
.save:disabled{opacity:.6}
.err{margin-top:10px;font-size:13px;color:var(--red);display:none}
.pcard{border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;margin-top:6px;display:flex;align-items:center;gap:10px;cursor:pointer}
.pcard .v{flex:1}.pcard small{display:block;color:var(--text3);font-size:12px}
.hist td{padding:7px 4px;border-bottom:1px solid var(--bg2);font-size:13px;vertical-align:top}
.hist{width:100%;border-collapse:collapse}
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:30;max-width:90vw}
#toast.bad{background:var(--red)}
#gate{padding:60px 20px;text-align:center;display:none}
#gate b{display:block;font-size:17px;margin-bottom:8px;color:var(--red)}
#gate a{display:inline-block;margin-top:16px;background:var(--acc);color:#fff;border-radius:10px;padding:10px 18px;text-decoration:none}
.view{display:none}.view.on{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div id="gate"></div>

  <div class="view" id="v-list">
    <header><a href="../index.html">← Home</a><h1>Workers</h1><span class="who" id="who"></span></header>
    <input class="search" id="q" placeholder="Search name" autocomplete="off">
    <div class="chips" id="fchips"></div>
    <div class="count" id="cnt"></div>
    <div class="list" id="list"></div>
    <button class="fab" id="fab" hidden onclick="sheetAdd()">+</button>
  </div>

  <div class="view" id="v-det">
    <header><button class="back" onclick="backToList()">← Workers</button><h1></h1></header>
    <div id="det"></div>
  </div>
</div>

<div class="dim" id="dim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>

<script>
const APP_VERSION = 13;
const SB_URL = 'https://dittqalvrjiamzdzrskd.supabase.co';
const SB_KEY = 'sb_publishable_OPS4DgPqKrwuv11bzy7ceA_VtzJ9x8t';
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY = new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Kuala_Lumpur'});
const THIS_MONTH = TODAY.slice(0,7);
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0,10); };
const nextMonth = mk => { let [y,m] = mk.split('-').map(Number); m++; if(m > 12){ m = 1; y++; } return y + '-' + String(m).padStart(2,'0'); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtM = mk => mk ? MON[+mk.slice(5,7)-1] + ' ' + mk.slice(0,4) : '';
const fmtD = d => d ? (+d.slice(8,10)) + ' ' + MON[+d.slice(5,7)-1] + ' ' + d.slice(0,4) : '';
const rm = n => 'RM ' + Number(n).toLocaleString('en', {minimumFractionDigits: Number(n) % 1 ? 2 : 0, maximumFractionDigits: 2});
const last4 = s => s ? '••' + String(s).slice(-4) : '';
const REASON = {run:'RUN', chase:'CHASE', resign:'RESIGN'};

const D = {workers:[], rates:{}, comps:{}, pay1:{}, pay2:{}, pass:{}, co:{}, coId:{}, locked:new Set()};
let CAN_EDIT = false, CAN_SALARY = false, FILTER = 'active', OPEN = null;

function toast(t, bad){ const x = $('toast'); x.textContent = t; x.className = bad ? 'bad' : ''; x.style.display = 'block'; clearTimeout(x._t); x._t = setTimeout(() => x.style.display = 'none', bad ? 6000 : 2200); }
function nice(e){
  const m = (e && (e.message || String(e))) || '';
  if(/Failed to fetch|NetworkError/i.test(m)) return 'No connection. Nothing was saved. Please try again.';
  if(/row-level security|permission denied/i.test(m)) return 'You do not have permission to do this.';
  if(/hub_worker_check/i.test(m)) return 'Stop date cannot be before the join date.';
  if(/duplicate key/i.test(m)) return 'Already saved. Please refresh.';
  return m;
}
async function db(p){ const {data, error} = await p; if(error) throw error; return data; }
function gate(title, body, home){ $('gate').style.display = 'block'; $('gate').innerHTML = '<b>' + esc(title) + '</b><div>' + esc(body) + '</div>' + (home ? '<a href="../index.html">Go to Home</a>' : ''); }

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return gate('Please sign in', 'Sign in from the Home page first.', true);
  const {data:me, error:e1} = await sb.from('hub_app_user').select('display_name,role,position,status').eq('id', session.user.id).maybeSingle();
  if(e1) return gate('Could not load your account', 'Please refresh the page.');
  if(!me || me.status !== 'ACTIVE') return gate('No access', 'This account cannot use the system.', true);
  const [{data:a1}, {data:a2}] = await Promise.all([sb.rpc('hub_can_access', {p_system:'FARMHUB'}), sb.rpc('hub_can_access', {p_system:'SALARY'})]);
  const a = (a1 && a1[0]) || {};
  if(!a.can_see) return gate('No access', 'Please ask the owner for access to Workers.', true);
  CAN_EDIT = !!a.can_edit; CAN_SALARY = !!((a2 && a2[0]) || {}).can_edit;
  $('who').textContent = me.display_name || '';
  $('fab').hidden = !CAN_EDIT;
  await load();
  const m = location.hash.match(/w=([0-9a-f-]{36})/);
  if(m && D.workers.some(w => w.id === m[1])) openWorker(m[1]); else show('v-list');
}

async function load(){
  const q = (t, cols, f) => { let x = sb.from(t).select(cols); return f ? f(x) : x; };
  const ord = x => x.is('voided_at', null).order('effective_from').order('created_at');
  const res = await Promise.all([
    q('hub_worker', 'id,worker_no,name,title,worker_type,join_date,stop_date,stop_reason,stop_note,phone,photo_path', x => x.is('voided_at', null).order('worker_no')),
    q('hub_worker_rate', 'id,worker_id,rate_type,rate,effective_from', ord),
    q('hub_worker_company', 'id,worker_id,company_id,effective_from', ord),
    q('hub_worker_payee', 'id,worker_id,beneficiary_name,account_no,effective_from,slot', ord),
    q('hub_worker_passport', 'id,worker_id,passport_no,effective_from', ord),
    q('hub_company', 'id,code'),
  ]);
  const bad = res.find(r => r.error); if(bad){ gate('Could not load data', 'Please refresh the page.'); throw bad.error; }
  const [w, r, c, p, pp, co] = res.map(x => x.data);
  const grp = rows => { const m = {}; rows.forEach(x => (m[x.worker_id] ??= []).push(x)); return m; };
  D.workers = w; D.rates = grp(r); D.comps = grp(c); D.pay1 = grp(p.filter(x => (x.slot || 1) === 1)); D.pay2 = grp(p.filter(x => x.slot === 2)); D.pass = grp(pp);
  D.co = {}; D.coId = {}; co.forEach(x => { D.co[x.id] = x.code; D.coId[x.code] = x.id; });
  const lr = await sb.from('salary_run').select('month').eq('status', 'LOCKED');
  D.locked = new Set((lr.data || []).map(x => x.month));
  await loadPhotos();
  render();
}

// current values
const latestM = (arr, mk) => (arr || []).filter(x => x.effective_from <= mk).slice(-1)[0] || (arr || [])[0] || null;
const latestD = (arr, d) => (arr || []).filter(x => x.effective_from <= d).slice(-1)[0] || null;
const isActive = w => !w.stop_date || w.stop_date >= TODAY;
function coOf(w){ const c = latestM(D.comps[w.id], THIS_MONTH); return !c ? '' : c.company_id ? (D.co[c.company_id] || '').toLowerCase() : 'both'; }
const coName = c => c === 'both' ? 'Both' : (c || '—').toUpperCase();
function rateOf(w){ return latestM(D.rates[w.id], THIS_MONTH); }
const rateTxt = r => r ? (r.rate_type === 'MONTHLY' ? 'Monthly ' : 'Daily ') + rm(r.rate) : 'No rate';
const PHOTO = {};   // photo_path -> signed url
async function loadPhotos(){
  const need = D.workers.map(w => w.photo_path).filter(x => x && !PHOTO[x]);
  if(!need.length) return;
  const {data} = await sb.storage.from('worker-photos').createSignedUrls(need, 60 * 60 * 6);
  (data || []).forEach(x => { if(x.signedUrl) PHOTO[x.path] = x.signedUrl; });
}
const avInner = w => w.photo_path && PHOTO[w.photo_path] ? '<img src="' + esc(PHOTO[w.photo_path]) + '" alt="">' : esc(initials(w.name));
const initials = n => (n || '?').split(/\s+/).map(x => x[0]).join('').slice(0, 2);

// ── list ──
function render(){
  const act = D.workers.filter(isActive), cnt = c => act.filter(w => coOf(w) === c).length;
  const F = [['active', 'Active ' + act.length], ['hx', 'HX ' + cnt('hx')], ['ad', 'AD ' + cnt('ad')], ['both', 'Both ' + cnt('both')], ['stopped', 'Stopped ' + (D.workers.length - act.length)]];
  $('fchips').innerHTML = F.map(([k, l]) => '<button class="chip' + (FILTER === k ? ' on' : '') + '" onclick="setFilter(\'' + k + '\')">' + l + '</button>').join('');
  const qs = $('q').value.trim().toLowerCase();
  const list = D.workers.filter(w => {
    if(FILTER === 'stopped' ? isActive(w) : !isActive(w)) return false;
    if(['hx','ad','both'].includes(FILTER) && coOf(w) !== FILTER) return false;
    if(qs && !(w.name || '').toLowerCase().includes(qs)) return false;
    return true;
  });
  $('cnt').textContent = list.length + ' workers';
  $('list').innerHTML = list.map(w => { const c = isActive(w) ? coOf(w) : 'stop';
    return '<div class="row" onclick="openWorker(\'' + w.id + '\')"><div class="av ' + (c || 'stop') + '">' + avInner(w) + '</div><div class="t"><div class="n">' + esc(w.name) + '</div><div class="s">'
      + (isActive(w) ? coName(coOf(w)) + ' · ' + rateTxt(rateOf(w)) : 'Stopped ' + fmtD(w.stop_date) + (w.stop_reason ? ' · ' + (REASON[w.stop_reason] || w.stop_reason) : '')) + '</div></div><span class="chev">›</span></div>'; }).join('')
    || '<div class="empty">No workers</div>';
}
function setFilter(k){ FILTER = k; render(); }
$('q').oninput = render;
function show(id){ document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id)); scrollTo(0, 0); }
function backToList(){ OPEN = null; history.replaceState(null, '', location.pathname); render(); show('v-list'); }

// ── worker page ──
async function openWorker(id){
  const w = D.workers.find(x => x.id === id); if(!w) return; OPEN = id;
  history.replaceState(null, '', '#w=' + id);
  const r = rateOf(w), cRow = latestM(D.comps[id], THIS_MONTH), p1 = latestD(D.pay1[id], TODAY) || (D.pay1[id] || [])[0], p2 = latestD(D.pay2[id], TODAY), pas = (D.pass[id] || []).slice(-1)[0];
  const act = isActive(w), c = act ? coOf(w) : 'stop', E = CAN_EDIT;
  const it = (k, v, sub, fn) => '<div class="item' + (E && fn ? ' tap" onclick="' + fn : '') + '"><div class="k">' + k + '</div><div class="v">' + v + (sub ? '<small>' + sub + '</small>' : '') + '</div>' + (E && fn ? '<span class="chev">›</span>' : '') + '</div>';
  $('det').innerHTML =
    '<div class="hero"><div class="av ' + (c || 'stop') + (E ? ' cam" onclick="pickPhoto()"' : '"') + '>' + avInner(w) + '</div><div' + (E ? ' onclick="sheetName()" style="cursor:pointer;flex:1"' : '') + '><div class="n">' + esc(w.name) + '</div><div class="s">#' + (w.worker_no ?? '') + (w.title ? ' · ' + esc(w.title) : '') + (w.worker_type === 'LOCAL' ? ' · Local' : '') + '</div>'
    + (act ? '<span class="pill on">Active</span>' : '<span class="pill off">Stopped ' + fmtD(w.stop_date) + (w.stop_reason ? ' · ' + (REASON[w.stop_reason] || '') : '') + '</span>') + '</div></div>'
    + '<div class="grp">Pay</div>'
    + it('Rate', r ? rateTxt(r) : 'Not set', r ? 'since ' + fmtM(r.effective_from) : '', 'sheetRate()')
    + it('Company', coName(coOf(w)), cRow ? 'since ' + fmtM(cRow.effective_from) : '', 'sheetCompany()')
    + it('Payee 1', p1 ? esc(p1.beneficiary_name) : 'Not set', p1 ? 'Account ' + last4(p1.account_no) : '', 'sheetPayeeEdit(1)')
    + it('Payee 2', p2 ? esc(p2.beneficiary_name) : 'Not set', p2 ? 'Account ' + last4(p2.account_no) : '', 'sheetPayeeEdit(2)')
    + '<div class="grp">Details</div>'
    + it('Joined', w.join_date ? fmtD(w.join_date) : 'Not set', '', 'sheetJoin()')
    + it('Phone', esc(w.phone || 'Not set'), '', 'sheetPhone()')
    + it('Passport', pas ? last4(pas.passport_no) : 'Not set', '', 'sheetPassport()')
    + (w.stop_note ? it('Stop note', esc(w.stop_note), '', '') : '')
    + '<div class="item tap" onclick="sheetHistory()"><div class="k">History</div><div class="v" style="color:var(--text3);font-weight:400">All changes</div><span class="chev">›</span></div>'
    + (E ? (act && !w.stop_date ? '<button class="btn-wide red" onclick="sheetStop()">Stop worker</button>'
             : '<button class="btn-wide" onclick="sheetStop()">Change stop date</button><button class="btn-wide" onclick="reactivate()">Reactivate</button>')
         + '<button class="btn-wide red" style="margin-bottom:24px" onclick="sheetDelete()">Delete worker</button>' : '');
  show('v-det');
}
async function sheetDelete(){
  const w = cur(); const {data:why, error} = await sb.rpc('hub_worker_records', {p_worker:w.id});
  if(error) return toast(nice(error), true);
  if(why){
    sheet('<h3>Cannot delete ' + esc(w.name) + '</h3><p class="h" style="font-size:14px;color:var(--text2)">This worker has ' + esc(why) + '. Deleting would break past salary records.</p>'
      + (w.stop_date ? '' : '<p class="h">If the worker has left, use Stop instead.</p><button class="save red" onclick="sheetStop()">Stop worker</button>'));
    return;
  }
  sheet('<h3>Delete ' + esc(w.name) + '?</h3><p class="h">Only for a worker added by mistake. The record is kept hidden with the reason.</p>'
    + '<div class="lbl">Reason</div>' + opts('why', [['Added by mistake', 'Added by mistake'], ['Duplicate', 'Duplicate']], 'Added by mistake', 'dark')
    + '<button class="save red" id="s-save">Delete worker</button>');
  $('s-save').onclick = async () => { $('s-save').disabled = true;
    try{ await db(sb.from('hub_worker').update({voided_at:now(), void_reason:pick('why')}).eq('id', w.id)); closeSheet(); await load(); backToList(); toast('Deleted ' + w.name); }
    catch(e){ serr(nice(e)); $('s-save').disabled = false; } };
}
const cur = () => D.workers.find(x => x.id === OPEN);

// ── bottom sheets ──
function sheet(html){ $('sheet').innerHTML = '<div class="grab"></div>' + html + '<div class="err" id="serr"></div><button class="cancel" onclick="closeSheet()">Cancel</button>'; $('dim').style.display = 'block'; $('sheet').style.display = 'block';
}
// one tap handler for every option group in the sheet (groups can be redrawn)
$('sheet').addEventListener('click', e => {
  const b = e.target.closest('button.opt'); if(!b || b.disabled) return; const g = b.closest('[data-g]'); if(!g) return;
  g.querySelectorAll('button.opt').forEach(x => x.classList.toggle('on', x === b));
  if(g.dataset.g === 'amt' && $('s-other')) $('s-other').value = '';
  if(g.dataset.on) window[g.dataset.on](b.dataset.v);
});
function closeSheet(){ $('dim').style.display = 'none'; $('sheet').style.display = 'none'; }
const pick = g => { const b = $('sheet').querySelector('[data-g="' + g + '"] button.opt.on'); return b ? b.dataset.v : null; };
const opts = (g, list, on, cls, cols) => '<div class="' + (cols || 'g' + list.length) + '" data-g="' + g + '">' + list.map(([v, l, dis]) => '<button class="opt ' + (cls || '') + (v === on ? ' on' : '') + '" data-v="' + esc(v) + '"' + (dis ? ' disabled' : '') + '>' + l + '</button>').join('') + '</div>';
function serr(t){ $('serr').textContent = t; $('serr').style.display = 'block'; return false; }
async function saveWith(btn, fn, msg){
  btn.disabled = true;
  try{ const r = await fn(); if(r === false){ btn.disabled = false; return; } closeSheet(); await load(); if(OPEN) openWorker(OPEN); toast(typeof r === 'string' ? r : (msg || 'Saved')); }
  catch(e){ serr(nice(e)); btn.disabled = false; }
}
const now = () => new Date().toISOString();
function monthOpts(){ // This month / Next month — skip months whose salary is locked
  let a = THIS_MONTH; while(D.locked.has(a)) a = nextMonth(a); const b = nextMonth(a);
  return [[a, (a === THIS_MONTH ? 'This month' : fmtM(a)) + ' (' + MON[+a.slice(5,7)-1] + ')'], [b, 'Next month (' + MON[+b.slice(5,7)-1] + ')']];
}
function commonRates(type){ // the 4 most used rates of this type
  const n = {}; Object.values(D.rates).forEach(arr => { const r = arr.slice(-1)[0]; if(r && r.rate_type === type && Number.isInteger(+r.rate) && (type === 'MONTHLY' ? +r.rate >= 500 : +r.rate < 500)) n[r.rate] = (n[r.rate] || 0) + 1; });
  const top = Object.keys(n).sort((a, b) => n[b] - n[a]).slice(0, 4).map(Number).sort((a, b) => a - b);
  const def = type === 'MONTHLY' ? [1500, 1800, 1900, 2500] : [55, 60, 65, 70];
  return (top.length >= 2 ? top : def);
}
function amtHtml(type, sel){ return opts('amt', commonRates(type).map(v => [String(v), String(v)]), sel != null ? String(sel) : null, '', 'g4') + '<input class="inp" id="s-other" inputmode="decimal" placeholder="Other amount" oninput="clearAmt()">'; }
function clearAmt(){ $('sheet').querySelectorAll('[data-g="amt"] .opt').forEach(x => x.classList.remove('on')); }
function amtVal(){ const o = ($('s-other') || {}).value; if(o && o.trim()) return parseFloat(o); const p = pick('amt'); return p == null ? NaN : parseFloat(p); }
function onRateType(t){ const box = $('amtbox'); if(box) box.innerHTML = amtHtml(t, null); }

function sheetRate(){
  const w = cur(), r = rateOf(w), t = r ? r.rate_type : 'DAILY', mo = monthOpts();
  sheet('<h3>Change rate</h3><p class="h">Now: ' + rateTxt(r) + '</p>'
    + opts('type', [['DAILY', 'Daily'], ['MONTHLY', 'Monthly']], t, 'dark').replace('data-g="type"', 'data-g="type" data-on="onRateType"')

function sheetCompany(){

function sheetPayee(){

async function removePayee2(){

function dayPicker(g, val){
  const y = addDays(TODAY, -1), on = val === TODAY ? TODAY : val === y ? y : null;
  return opts(g, [[TODAY, 'Today'], [y, 'Yesterday']], on, 'dark').replace('data-g="' + g + '"', 'data-g="' + g + '" data-on="dayPicked"') + '<input class="inp" type="date" id="s-date" value="' + esc(val || '') + '" oninput="clearDay()">';

function sheetJoin(){

    const n = await adjustFood(w, w.join_date, d, w.stop_date, w.stop_date);

function sheetStop(){
  const w = cur();
  sheet('<h3>' + (w.stop_date ? 'Change stop date' : 'Stop worker') + '</h3>'
    + '<div class="lbl">Last working day</div>' + dayPicker('day', w.stop_date || TODAY)
    + '<div class="lbl">Reason</div>' + opts('reason', [['run', 'RUN'], ['chase', 'CHASE'], ['resign', 'RESIGN']], w.stop_reason || 'run', 'red')
    + (CAN_SALARY ? '<div class="lbl">Final payment</div>' + opts('pay', [['cash', 'Cash'], ['transfer', 'Transfer'], ['unpaid', 'Unpaid']], 'cash') : '')
    + '<div class="lbl">Note (optional)</div><input class="inp" id="s-note" value="' + esc(w.stop_note || '') + '">'
    + '<button class="save red" id="s-save">' + (w.stop_date ? 'Save' : 'Stop worker') + '</button>');
  $('s-save').onclick = () => saveWith($('s-save'), async () => {
    const d = $('s-date').value; if(!d) return serr('Pick the last working day.');
    if(w.join_date && d < w.join_date) return serr('Stop date cannot be before the join date (' + fmtD(w.join_date) + ').');
    if(!(await attendanceOk(w, w.join_date, d))) return false;
    await db(sb.from('hub_worker').update({stop_date:d, stop_reason:pick('reason'), stop_note:$('s-note').value.trim() || null}).eq('id', w.id));
    await adjustFood(w, w.join_date, w.join_date, w.stop_date, d);
    if(CAN_SALARY && pick('pay')) await db(sb.from('salary_pay_method').upsert({worker_id:w.id, month:d.slice(0,7), method:pick('pay')}, {onConflict:'worker_id,month'}));
  }, 'Stopped');

  catch(e){ toast(nice(e), true); }

async function voidWorker(){
  const w = cur(); const r = prompt('Remove ' + w.name + '? Only for a worker added by mistake.\nReason:'); if(!r || !r.trim()) return;
  try{ await db(sb.from('hub_worker').update({voided_at:now(), void_reason:r.trim()}).eq('id', w.id)); await load(); backToList(); toast('Removed'); }
  catch(e){ toast(nice(e), true); }

function sheetAdd(){
  const hx = 'hx';
  sheet('<h3>Add worker</h3><input class="inp" id="s-name" placeholder="Name" autocapitalize="characters">'
    + '<div class="lbl">Company</div>' + opts('co', [['hx', 'HX'], ['ad', 'AD'], ['both', 'Both']], hx)
    + '<div class="lbl">Rate</div>' + opts('type', [['DAILY', 'Daily'], ['MONTHLY', 'Monthly']], 'DAILY', 'dark').replace('data-g="type"', 'data-g="type" data-on="onRateType"')
    + '<div id="amtbox" style="margin-top:8px">' + amtHtml('DAILY', null) + '</div>'
    + '<div class="lbl">Joined</div>' + dayPicker('day', TODAY)
    + '<button class="save" id="s-save">Add worker</button>');
  $('s-save').onclick = () => saveWith($('s-save'), async () => {
    const name = $('s-name').value.trim().toUpperCase(), rate = amtVal(), join = $('s-date').value, c = pick('co');
    if(!name) return serr('Type the name.'); if(!(rate >= 0)) return serr('Tap a rate or type one.'); if(!join) return serr('Pick the join date.');
    if(D.workers.some(x => x.name === name) && !confirm(name + ' already exists. Add another?')) return false;
    const top = await db(sb.from('hub_worker').select('worker_no').not('worker_no', 'is', null).order('worker_no', {ascending:false}).limit(1));
    const id = crypto.randomUUID(), no = ((top[0] || {}).worker_no || 0) + 1, mk = join.slice(0, 7);
    await db(sb.from('hub_worker').insert({id, worker_no:no, name, worker_type:'FOREIGN', join_date:join}));
    await db(sb.from('hub_worker_rate').insert({worker_id:id, rate_type:pick('type'), rate, effective_from:mk}));
    await db(sb.from('hub_worker_company').insert({worker_id:id, company_id: c === 'both' ? null : D.coId[c.toUpperCase()], effective_from:mk}));

async function sheetHistory(){
  const w = cur();
  const [lg, rt, cp, py] = await Promise.all([
    sb.from('hub_worker_log').select('changed_at,before_data,after_data').eq('worker_id', w.id).order('changed_at', {ascending:false}),
    sb.from('hub_worker_rate').select('effective_from,rate_type,rate,voided_at').eq('worker_id', w.id).order('effective_from'),
    sb.from('hub_worker_company').select('effective_from,company_id,voided_at').eq('worker_id', w.id).order('effective_from'),
    sb.from('hub_worker_payee').select('slot,effective_from,beneficiary_name,account_no,voided_at').eq('worker_id', w.id).order('effective_from'),
  ]);
  const F = {name:'Name', title:'Position', phone:'Phone', join_date:'Joined', stop_date:'Stopped', stop_reason:'Reason', stop_note:'Note', worker_type:'Type'};
  const rows = [];
  (lg.data || []).forEach(x => { const b = x.before_data || {}, a = x.after_data || {};
    const ch = Object.keys(F).filter(k => (b[k] ?? null) !== (a[k] ?? null)).map(k => F[k] + ': ' + esc(b[k] ?? '—') + ' → ' + esc(a[k] ?? '—'));
    rows.push([x.changed_at.slice(0, 10), x.before_data ? (ch.join('<br>') || '—') : 'Added']); });
  (rt.data || []).forEach(x => rows.push([x.effective_from, 'Rate ' + rateTxt(x) + (x.voided_at ? ' (cancelled)' : '')]));
  (cp.data || []).forEach(x => rows.push([x.effective_from, 'Company ' + coName(x.company_id ? (D.co[x.company_id] || '').toLowerCase() : 'both') + (x.voided_at ? ' (cancelled)' : '')]));
  (py.data || []).forEach(x => rows.push([x.effective_from, (x.slot === 2 ? '2nd payee ' : 'Payee ') + esc(x.beneficiary_name) + ' ' + last4(x.account_no) + (x.voided_at ? ' (removed)' : '')]));
  rows.sort((a, b) => a[0] < b[0] ? 1 : -1);
  sheet('<h3>History · ' + esc(w.name) + '</h3><table class="hist">' + (rows.map(r => '<tr><td style="white-space:nowrap;color:var(--text3)">' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('') || '<tr><td>No changes yet</td></tr>') + '</table>');
}
// Attendance outside the new working period → ask first
async function attendanceOk(w, join, stop){
  if(!CAN_SALARY) return true;
  const rows = [];
  if(join){ const {data} = await sb.from('salary_attendance').select('work_date').eq('worker_id', w.id).neq('code', '').lt('work_date', join); rows.push(...(data || [])); }
  if(stop){ const {data} = await sb.from('salary_attendance').select('work_date').eq('worker_id', w.id).neq('code', '').gt('work_date', stop); rows.push(...(data || [])); }
  if(!rows.length) return true;
  return confirm(w.name + ' has ' + rows.length + ' attendance day(s) outside this period (e.g. ' + rows[0].work_date + ').\nThese days will not be counted. Save anyway?');
}
// Food sharing: when join/stop date changes, add or remove this worker on purchases in the changed days.
// Only months that are not locked, and only purchases where the people were picked automatically.
async function adjustFood(w, oldJoin, newJoin, oldStop, newStop){
  if(!CAN_SALARY) return 0;
  const inS = (j, s, d) => (!j || j <= d) && (!s || s >= d);
  const {data, error} = await sb.from('salary_food').select('id,month,data').is('voided_at', null);
  if(error || !data) return 0;
  const upd = [];
  for(const r of data){
    const f = r.data || {}; if(!f.date || f.autoSel === false || D.locked.has(r.month)) continue;
    const was = inS(oldJoin, oldStop, f.date), now_ = inS(newJoin, newStop, f.date);
    if(was === now_) continue;
    const ids = (f.workerIds || []).filter(x => x !== w.id); if(now_) ids.push(w.id);
    upd.push({id:r.id, month:r.month, data:{...f, workerIds:ids}, voided_at:null});
  }
  if(upd.length) await db(sb.from('salary_food').upsert(upd, {onConflict:'id'}));
  return upd.length;
}
// Photo: camera or gallery → shrink to 480px → save
function pickPhoto(){
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
  i.onchange = async () => { const f = i.files && i.files[0]; if(!f) return; const w = cur();
    try{
      toast('Saving photo…');
      const img = await new Promise((ok, bad) => { const x = new Image(); x.onload = () => ok(x); x.onerror = bad; x.src = URL.createObjectURL(f); });
      const k = 480 / Math.max(img.width, img.height), cw = Math.round(img.width * Math.min(1, k)), ch = Math.round(img.height * Math.min(1, k));
      const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch; cv.getContext('2d').drawImage(img, 0, 0, cw, ch);
      const blob = await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.82));
      const path = w.id + '/' + Date.now() + '.jpg';
      const {error} = await sb.storage.from('worker-photos').upload(path, blob, {contentType:'image/jpeg'}); if(error) throw error;
      await db(sb.from('hub_worker').update({photo_path:path}).eq('id', w.id));
      await load(); openWorker(w.id); toast('Photo saved');
    }catch(e){ toast(nice(e), true); }
  };
  i.click();
}
